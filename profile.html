<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有所味 Poogle｜個人空間</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        :root {
            --poogle-cream: #FCF6E8;
            --poogle-yellow: #FFF57E;
            --poogle-blue: #72D0FF;
            --poogle-pink: #FF85D0;
            --poogle-green: #3CE6B0;
            --poogle-gray: #D6D6D6;
            --poogle-navy: #1E2270;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--poogle-cream);
            color: #18181B;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .poogle-ellipse-btn {
            border: 2px solid #1E2270;
            border-radius: 50%;
            transition: transform 0.16s ease, background-color 0.16s ease;
        }
        .poogle-ellipse-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .poogle-pill-btn {
            border: 1.8px solid #1E2270;
            border-radius: 9999px;
            transition: all 0.16s ease;
        }
        .poogle-pill-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .poogle-card {
            border: 2px solid #1E2270;
        }
        /* Custom scrollbar matching map.html */
        .poogle-scroll::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        .poogle-scroll::-webkit-scrollbar-track {
            background: #FCF6E8;
            border-radius: 9999px;
        }
        .poogle-scroll::-webkit-scrollbar-thumb {
            background: #72D0FF;
            border: 1.5px solid #1E2270;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="min-h-screen w-full bg-[#FCF6E8] select-none relative pb-16">

    <!-- =================================================================== -->
    <!-- TOP HEADER: LOGO, LOGOUT & HOME BUTTON                              -->
    <!-- =================================================================== -->
    <header class="w-full max-w-[1440px] mx-auto pt-7 px-8 sm:px-14 flex items-center justify-between">
        <div class="flex items-center gap-5 sm:gap-8">
            <a href="./index.html" id="profileLogoLink" class="group inline-block focus:outline-none" title="回到有所味主頁">
                <img src="./img/logo.png" alt="有所味 Logo"
                     class="w-[130px] sm:w-[165px] h-auto object-contain transition-transform duration-200 group-hover:scale-105"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 260 95%22><text x=%2210%22 y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%2372D0FF%22 stroke=%22%231E2270%22 stroke-width=%223%22>有所味</text></svg>';" />
            </a>
            <button id="headerLogoutBtn" type="button"
                    class="poogle-pill-btn px-4 py-1.5 bg-white hover:bg-[#FF85D0] text-xs sm:text-sm font-extrabold text-black flex items-center gap-1.5 focus:outline-none mt-1">
                <i class="fa-solid fa-right-from-bracket text-[#1E2270]"></i>
                <span>登出</span>
            </button>
        </div>

        <a href="./index.html" id="profileHomeBtn"
           class="poogle-ellipse-btn w-[108px] h-[54px] sm:w-[126px] sm:h-[64px] bg-[#72D0FF] hover:bg-[#5bc6ff] text-black text-base sm:text-[18px] font-bold flex items-center justify-center no-underline shrink-0">
            主頁
        </a>
    </header>

    <!-- =================================================================== -->
    <!-- MAIN CONTENT CONTAINER                                              -->
    <!-- =================================================================== -->
    <main class="w-full max-w-[1180px] mx-auto px-6 sm:px-12 mt-6 sm:mt-8">

        <!-- 1. TOP PROFILE & MERIT POINTS SECTION -->
        <section class="flex flex-col lg:flex-row items-center lg:items-center justify-center gap-10 lg:gap-14 relative">

            <!-- Left Column: Circular Toilet Avatar & Google Account Info (Read-Only) -->
            <div class="flex flex-col items-center shrink-0 w-[260px]">
                <!-- Avatar Circle (No shadow; shows white photo icon on hover during edit mode) -->
                <div id="profileAvatarBtn"
                     class="w-[168px] h-[168px] sm:w-[184px] sm:h-[184px] rounded-full border-2 border-[#1E2270] overflow-hidden bg-[#FCF6E8] relative group transition-transform">
                    <div id="profileAvatarSvgContainer" class="w-full h-full">
                        <!-- Dynamically rendered PFP image -->
                    </div>
                    <!-- Edit Mode Hover Overlay with White Photo Icon -->
                    <div id="avatarEditHoverOverlay"
                         class="hidden absolute inset-0 bg-black/45 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col items-center justify-center text-white cursor-pointer">
                        <i class="fa-regular fa-image text-white text-4xl"></i>
                    </div>
                </div>

                <!-- Read-Only Google Account Name & Email (No shadow) -->
                <div class="mt-4 text-center space-y-1.5 w-full">
                    <div id="displayUserNameText" class="text-2xl sm:text-[26px] font-extrabold text-black tracking-wide truncate px-2">
                        載入中...
                    </div>
                    <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-white border-[1.5px] border-[#1E2270] max-w-full">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-3.5 h-3.5 shrink-0" />
                        <span id="displayUserEmailText" class="text-xs sm:text-[13px] font-bold text-neutral-700 truncate">
                            google@gmail.com
                        </span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Yellow Merit Points Card, Edit Profile Button & Tilted Poogle Collectible Card -->
            <div class="relative flex flex-col items-start w-full max-w-[660px]">
                <div class="relative w-full flex items-center">
                    <!-- Yellow Merit Points Box (No shadow) -->
                    <div class="poogle-card w-full sm:w-[460px] min-h-[162px] sm:min-h-[176px] rounded-[24px] bg-[#FFF57E] px-7 sm:px-10 py-6 flex flex-col justify-center relative overflow-hidden">
                        <div class="flex flex-wrap items-center gap-2 mb-2.5">
                            <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-white border-[1.5px] border-[#1E2270] text-[11px] font-bold text-[#1E2270] w-fit">
                                <i class="fa-solid fa-wand-magic-sparkles text-[#FF85D0]"></i>
                                <span>每評鑑 1 間公廁自動 +1 點</span>
                            </div>
                            <button id="openTestAdminModalBtn" type="button"
                                    class="poogle-pill-btn inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-[#FF85D0]/45 hover:bg-[#FF85D0] text-[11px] font-bold text-[#1E2270] focus:outline-none"
                                    title="測試階段快速歸零或調整點數與回報次數">
                                <i class="fa-solid fa-sliders"></i>
                                <span>測試歸零/調整</span>
                            </button>
                        </div>
                        <div class="text-2xl sm:text-[32px] font-extrabold text-black tracking-wide leading-tight flex items-baseline gap-2">
                            <span>公德點數 :</span>
                            <span id="meritPointsCount" class="text-[#1E2270] font-black">0</span>
                        </div>
                        <div class="text-sm sm:text-[16px] font-bold text-neutral-800 mt-2 tracking-wide flex items-center gap-2">
                            <span>總回報次數 : <span id="totalReportsCount" class="text-black font-extrabold">0</span> 次</span>
                        </div>
                    </div>

                    <!-- Overlapping Tilted Collectible Polaroid Card on the Right (No shadow) -->
                    <div class="hidden sm:flex flex-col justify-between w-[220px] md:w-[245px] h-[250px] md:h-[275px] bg-white rounded-[20px] border-2 border-[#1E2270] p-4 absolute right-1 md:right-3 -top-8 pointer-events-none"
                         style="transform: rotate(-10deg);">
                        <div class="w-full h-[165px] md:h-[185px] rounded-[12px] bg-[#FCF6E8] border-[1.5px] border-[#1E2270] flex flex-col items-center justify-center relative overflow-hidden">
                            <div class="w-16 h-16 rounded-full bg-[#3CE6B0] border-2 border-[#1E2270] flex items-center justify-center text-2xl text-[#1E2270]">
                                <i class="fa-solid fa-restroom"></i>
                            </div>
                            <span class="mt-2.5 text-xs font-extrabold text-[#1E2270] tracking-wider">公廁探險榮譽證</span>
                            <span class="px-2.5 py-0.5 mt-1 rounded-full bg-[#FF85D0] border border-[#1E2270] text-[10px] font-bold text-black">POOGLE PASS</span>
                        </div>
                        <div class="flex items-center justify-between px-1 pt-2">
                            <span class="text-[11px] font-extrabold text-neutral-600">有所味實地認證</span>
                            <span class="w-2.5 h-2.5 rounded-full bg-[#3CE6B0] border border-[#1E2270]"></span>
                        </div>
                    </div>
                </div>

                <!-- Edit Profile Controls Row (Below Yellow Box, No shadow, Normal font weight) -->
                <div class="mt-4 w-full sm:w-[460px] flex items-center justify-center">
                    <button id="startEditProfileBtn" type="button"
                            class="poogle-pill-btn w-full max-w-[300px] py-2 bg-[#72D0FF] hover:bg-[#5bc6ff] text-black font-normal text-xs sm:text-sm flex items-center justify-center gap-2 focus:outline-none">
                        <i class="fa-regular fa-pen-to-square"></i>
                        <span>編輯個人檔案</span>
                    </button>

                    <div id="editingActionBtns" class="hidden flex items-center justify-center gap-4 w-full">
                        <button id="finishEditProfileBtn" type="button"
                                class="poogle-pill-btn px-7 py-2 bg-[#72D0FF] hover:bg-[#5bc6ff] text-black font-normal text-xs sm:text-sm focus:outline-none">
                            完成編輯
                        </button>
                        <button id="cancelEditProfileBtn" type="button"
                                class="poogle-pill-btn px-7 py-2 bg-transparent text-black font-normal text-xs sm:text-sm focus:outline-none">
                            放棄編輯
                        </button>
                    </div>
                </div>
            </div>

        </section>

        <!-- 2. BOTTOM SECTION: REDEMPTION SHOP & HISTORY RECORDS -->
        <section class="mt-14 sm:mt-20 grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-8 items-stretch">

            <!-- Left Box: 兌換商店 (No shadow) -->
            <div id="shopCardBox" class="poogle-card relative bg-white rounded-[28px] h-[400px] sm:h-[430px] pt-12 pb-6 px-6 sm:px-9 flex flex-col transition-colors duration-200">
                <!-- Tilted Corner Label (No shadow) -->
                <div id="shopCornerTag" class="absolute -top-5 -left-3 sm:-left-5 w-[148px] sm:w-[162px] h-[52px] sm:h-[56px] bg-[#FFF57E] border-2 border-[#1E2270] rounded-2xl flex items-center justify-center gap-1.5 z-10 transition-colors duration-200"
                     style="transform: rotate(-16deg);">
                    <i class="fa-solid fa-store text-[#1E2270] text-xs"></i>
                    <span class="text-xs sm:text-[15px] font-extrabold text-black tracking-wider">兌換商店</span>
                </div>

                <!-- Scrollable Shop Grid -->
                <div id="shopContentContainer" class="w-full h-full overflow-y-auto poogle-scroll pt-2 pr-1">
                    <div id="shopItemsGrid" class="grid grid-cols-2 gap-x-6 gap-y-7 justify-items-center pb-2">
                        <!-- Dynamically rendered shop items -->
                    </div>
                </div>
            </div>

            <!-- Right Box: 歷史紀錄 (No shadow) -->
            <div id="historyCardBox" class="poogle-card relative bg-white rounded-[28px] h-[400px] sm:h-[430px] pt-12 pb-6 px-6 sm:px-9 flex flex-col transition-colors duration-200">
                <!-- Tilted Corner Label (No shadow) -->
                <div id="historyCornerTag" class="absolute -top-5 -left-3 sm:-left-5 w-[148px] sm:w-[162px] h-[52px] sm:h-[56px] bg-[#72D0FF] border-2 border-[#1E2270] rounded-2xl flex items-center justify-center gap-1.5 z-10 transition-colors duration-200"
                     style="transform: rotate(-16deg);">
                    <i class="fa-solid fa-clock-rotate-left text-[#1E2270] text-xs"></i>
                    <span class="text-xs sm:text-[15px] font-extrabold text-black tracking-wider">歷史紀錄</span>
                </div>

                <!-- Table Header for Daily Points Breakdown -->
                <div id="historyTableHeader" class="flex items-center justify-between px-3 pb-2.5 mb-2 border-b-2 border-[#1E2270]/15 text-[11px] sm:text-xs font-extrabold text-neutral-600 shrink-0">
                    <span>日期</span>
                    <div class="flex items-center gap-3 sm:gap-5">
                        <span class="w-12 text-center">獲得</span>
                        <span class="w-12 text-center">扣除</span>
                        <span class="w-16 text-right">當日總計</span>
                    </div>
                </div>

                <!-- Scrollable History List -->
                <div id="historyContentContainer" class="w-full flex-1 overflow-y-auto poogle-scroll pt-1 pr-1 space-y-3">
                    <div class="w-full h-full flex items-center justify-center text-neutral-400 text-sm sm:text-base font-bold">
                        目前沒有歷史紀錄
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- =================================================================== -->
    <!-- MODAL: CHOOSE AVATAR ("你的頭貼")                                   -->
    <!-- =================================================================== -->
    <div id="chooseAvatarModal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[28px] max-w-lg w-full border-2 border-[#1E2270] p-6 sm:p-8 relative text-center space-y-6">
            <button id="closeChooseAvatarModalBtn" type="button"
                    class="poogle-pill-btn absolute top-5 right-5 w-8 h-8 rounded-full bg-white text-black flex items-center justify-center focus:outline-none"
                    aria-label="關閉">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div>
                <h3 class="text-xl sm:text-2xl font-normal text-black tracking-wide">你的頭貼</h3>
            </div>

            <div id="avatarOptionsGrid" class="grid grid-cols-3 gap-4 sm:gap-6 pt-1">
                <!-- Populated dynamically with the 3 free avatars -->
            </div>

            <div class="pt-2 flex items-center justify-center gap-3">
                <button id="confirmAvatarSelectBtn" type="button"
                        class="poogle-pill-btn px-8 py-2.5 bg-[#3CE6B0] hover:bg-[#2fd49f] text-black font-normal text-xs sm:text-sm focus:outline-none">
                    套用頭貼
                </button>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- MODAL: CONFIRM DISCARD EDIT ("確定放棄？")                          -->
    <!-- =================================================================== -->
    <div id="discardEditModal" class="hidden fixed inset-0 z-50 bg-black/35 backdrop-blur-[1px] flex items-center justify-center p-4">
        <div class="bg-white rounded-[24px] sm:rounded-[30px] max-w-[386px] w-full px-6 py-8 sm:px-9 sm:py-10 shadow-2xl flex flex-col items-center justify-center text-center">
            <div class="space-y-1.5 text-black text-sm sm:text-[17px] font-normal tracking-wide leading-relaxed">
                <p>確定放棄?</p>
                <p>您的操作將<span class="underline underline-offset-4 decoration-2">不會</span>被儲存</p>
            </div>
            <div class="flex flex-row items-center justify-center gap-4 sm:gap-8 mt-7 sm:mt-9 w-full">
                <button id="confirmDiscardEditBtn" type="button"
                        class="w-[120px] sm:w-[136px] h-[36px] sm:h-[42px] rounded-full bg-transparent border-[1.5px] border-[#1E2270] text-black text-xs sm:text-[15px] font-normal flex items-center justify-center transition-all duration-150 hover:-translate-y-0.5 hover:shadow-[0_4px_0_#1E2270] focus:outline-none">
                    放棄更改
                </button>
                <button id="continueEditProfileBtn" type="button"
                        class="w-[120px] sm:w-[136px] h-[36px] sm:h-[42px] rounded-full bg-[#80FF72] hover:bg-[#6ef560] border-[1.5px] border-[#1E2270] text-black text-xs sm:text-[15px] font-normal flex items-center justify-center transition-all duration-150 hover:-translate-y-0.5 hover:shadow-[0_4px_0_#1E2270] focus:outline-none">
                    繼續編輯
                </button>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- MODAL: REQUIRE GOOGLE LOGIN POPUP (IF ACCESSED LOGGED OUT)          -->
    <!-- =================================================================== -->
    <div id="requireLoginModal" class="hidden fixed inset-0 z-50 bg-black/55 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[28px] max-w-sm w-full border-2 border-[#1E2270] p-6 text-center space-y-4">
            <div class="w-14 h-14 rounded-full bg-[#72D0FF] border-2 border-[#1E2270] mx-auto flex items-center justify-center text-xl text-[#1E2270]">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h3 class="text-lg font-extrabold text-black">需要登入 Google 帳號</h3>
            <p class="text-xs sm:text-sm text-neutral-700 leading-relaxed">
                「個人空間」需要登入 Google 帳號才能使用，請先完成登入！
            </p>
            <div class="flex flex-col gap-2.5 pt-1">
                <button id="profileGoogleLoginBtn" type="button"
                        class="poogle-pill-btn w-full py-2.5 bg-white hover:bg-neutral-50 font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2.5">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-4 h-4" />
                    <span>使用 Google 帳號登入</span>
                </button>
                <button id="profilePreviewGuestBtn" type="button"
                        class="poogle-pill-btn w-full py-2 rounded-full bg-[#FFF57E] hover:bg-[#f7eb5e] text-black font-extrabold text-xs sm:text-sm">
                    預覽測試個人空間（免登入體驗）
                </button>
                <a href="./index.html"
                   class="poogle-pill-btn w-full py-2 rounded-full bg-[#D6D6D6] text-black font-bold text-xs sm:text-sm no-underline">
                    返回主頁
                </a>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- MODAL: CONFIRM SHOP REDEMPTION                                      -->
    <!-- =================================================================== -->
    <div id="redeemConfirmModal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[28px] max-w-sm w-full border-2 border-[#1E2270] p-6 text-center space-y-4">
            <div class="w-14 h-14 rounded-full bg-[#FFF57E] border-2 border-[#1E2270] mx-auto flex items-center justify-center text-xl text-[#1E2270]">
                <i class="fa-solid fa-gift"></i>
            </div>
            <h3 id="redeemModalTitle" class="text-lg font-extrabold text-black">確認兌換獎勵？</h3>
            <p id="redeemModalDesc" class="text-xs sm:text-sm text-neutral-700 leading-relaxed"></p>
            <div class="flex items-center justify-center gap-3 pt-2">
                <button id="cancelRedeemBtn" type="button"
                        class="poogle-pill-btn flex-1 py-2.5 bg-[#D6D6D6] hover:bg-[#c4c4c4] text-black font-extrabold text-xs sm:text-sm">
                    取消
                </button>
                <button id="confirmRedeemBtn" type="button"
                        class="poogle-pill-btn flex-1 py-2.5 bg-[#3CE6B0] hover:bg-[#2fd49f] text-black font-extrabold text-xs sm:text-sm">
                    確認兌換
                </button>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- MODAL: TEST STAGE RESET / ADJUST POINTS & REPORTS                   -->
    <!-- =================================================================== -->
    <div id="testAdminModal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[28px] max-w-md w-full border-2 border-[#1E2270] p-6 sm:p-7 relative space-y-4">
            <button id="closeTestAdminModalBtn" type="button"
                    class="poogle-pill-btn absolute top-5 right-5 w-8 h-8 rounded-full bg-white text-black flex items-center justify-center focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-full bg-[#FF85D0] border-2 border-[#1E2270] flex items-center justify-center text-[#1E2270] text-base shrink-0">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div>
                    <h3 class="text-base sm:text-lg font-extrabold text-black">測試用：點數與回報數後台同步控制</h3>
                    <p class="text-[11px] text-neutral-600">此處修改會直接同步寫入 Firebase 的 <code>user_profiles</code> 集合</p>
                </div>
            </div>

            <div class="p-4 rounded-2xl bg-white border-[1.5px] border-[#1E2270] space-y-3">
                <div class="flex items-center justify-between gap-3">
                    <label for="testInputMeritPoints" class="text-xs sm:text-sm font-extrabold text-black">設定公德點數：</label>
                    <input id="testInputMeritPoints" type="number" min="0" max="9999" value="0"
                           class="w-28 px-3 py-1.5 rounded-xl bg-[#FCF6E8] border-[1.5px] border-[#1E2270] text-sm font-black text-center focus:outline-none" />
                </div>
                <div class="flex items-center justify-between gap-3">
                    <label for="testInputTotalReports" class="text-xs sm:text-sm font-extrabold text-black">設定總回報次數：</label>
                    <input id="testInputTotalReports" type="number" min="0" max="9999" value="0"
                           class="w-28 px-3 py-1.5 rounded-xl bg-[#FCF6E8] border-[1.5px] border-[#1E2270] text-sm font-black text-center focus:outline-none" />
                </div>
                <div class="pt-1 flex items-center gap-2">
                    <button id="applyCustomCountsBtn" type="button"
                            class="poogle-pill-btn w-full py-2 bg-[#72D0FF] hover:bg-[#5bc6ff] text-black font-extrabold text-xs sm:text-sm">
                        套用自訂數值（同步至後台）
                    </button>
                </div>
            </div>

            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');

        function reconcileAndSyncProfileCounts() {
            const rawEvalCount = profileState.evaluations.length;
            const rawSpentPoints = profileState.redemptions.reduce((sum, r) => sum + (Number(r.pointsUsed) || 0), 0);
            const rawNetPoints = Math.max(0, rawEvalCount - rawSpentPoints);

            const docData = profileState.profileDoc;
            let finalPoints = rawNetPoints;
            let finalReports = rawEvalCount;

            if (profileState.evalLoaded && profileState.redeemLoaded && profileState.profileLoaded) {
                const hasBackendNumbers = docData
                    && typeof docData.meritPoints === 'number'
                    && typeof docData.totalReports === 'number';

                if (!hasBackendNumbers) {
                    finalPoints = rawNetPoints;
                    finalReports = rawEvalCount;
                    if (db && profileState.uid) {
                        db.collection('user_profiles').doc(profileState.uid).set({
                            userId: profileState.uid,
                            displayName: profileState.displayName || 'Google 用戶',
                            email: profileState.email || '',
                            avatarType: normalizeLoggedInAvatarType(profileState.avatarType),
                            meritPoints: finalPoints,
                            totalReports: finalReports,
                            _rawEvalCount: rawEvalCount,
                            _rawSpentPoints: rawSpentPoints,
                            updatedAt: new Date().toISOString()
                        }, { merge: true }).catch(() => {});
                    }
                } else {
                    const savedRawEval = typeof docData._rawEvalCount === 'number' ? docData._rawEvalCount : rawEvalCount;
                    const savedRawSpent = typeof docData._rawSpentPoints === 'number' ? docData._rawSpentPoints : rawSpentPoints;
                    const deltaEval = rawEvalCount - savedRawEval;
                    const deltaSpent = rawSpentPoints - savedRawSpent;

                    if (deltaEval !== 0 || deltaSpent !== 0) {
                        finalReports = Math.max(0, Number(docData.totalReports) + deltaEval);
                        finalPoints = Math.max(0, Number(docData.meritPoints) + deltaEval - deltaSpent);
                        if (db && profileState.uid) {
                            db.collection('user_profiles').doc(profileState.uid).set({
                                userId: profileState.uid,
                                displayName: profileState.displayName || 'Google 用戶',
                                email: profileState.email || '',
                                meritPoints: finalPoints,
                                totalReports: finalReports,
                                _rawEvalCount: rawEvalCount,
                                _rawSpentPoints: rawSpentPoints,
                                updatedAt: new Date().toISOString()
                            }, { merge: true }).catch(() => {});
                        }
                    } else {
                        finalPoints = Math.max(0, Number(docData.meritPoints) || 0);
                        finalReports = Math.max(0, Number(docData.totalReports) || 0);
                    }
                }
            } else if (docData && typeof docData.meritPoints === 'number' && typeof docData.totalReports === 'number') {
                finalPoints = Math.max(0, Number(docData.meritPoints) || 0);
                finalReports = Math.max(0, Number(docData.totalReports) || 0);
            }

            profileState.currentPoints = finalPoints;
            profileState.totalReports = finalReports;
        }

        function recalculateAndRenderPointsAndHistory() {
            reconcileAndSyncProfileCounts();

            const currentPoints = profileState.currentPoints;
            const totalReports = profileState.totalReports;

            document.getElementById('meritPointsCount').textContent = String(currentPoints);
            document.getElementById('totalReportsCount').textContent = String(totalReports);

            renderShopItems();

            const historyContainer = document.getElementById('historyContentContainer');
            if (!historyContainer) return;

            const resetAtIso = profileState.profileDoc?.resetHistoryAt || null;
            const visibleEvals = resetAtIso
                ? profileState.evaluations.filter(ev => !ev.createdAt || ev.createdAt > resetAtIso)
                : profileState.evaluations;
            const visibleRedeems = resetAtIso
                ? profileState.redemptions.filter(rd => !rd.createdAt || rd.createdAt > resetAtIso)
                : profileState.redemptions;

            if ((visibleEvals.length === 0 && visibleRedeems.length === 0 && currentPoints === 0 && totalReports === 0)
                || (currentPoints === 0 && totalReports === 0 && profileState.profileDoc && typeof profileState.profileDoc.meritPoints === 'number')) {
                historyContainer.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center text-neutral-400 text-sm sm:text-base font-bold py-16">
                        目前沒有歷史紀錄
                    </div>
                `;
                return;
            }

            const dailyMap = new Map();
            const ensureDay = (dateKey) => {
                if (!dailyMap.has(dateKey)) {
                    dailyMap.set(dateKey, { dateKey, added: 0, deducted: 0, totalAtEndOfDay: 0 });
                }
                return dailyMap.get(dateKey);
            };

            visibleEvals.forEach((ev) => {
                const dateKey = toLocalDateKey(ev.createdAt);
                const dayRecord = ensureDay(dateKey);
                dayRecord.added += 1;
            });

            visibleRedeems.forEach((rd) => {
                const dateKey = toLocalDateKey(rd.createdAt);
                const dayRecord = ensureDay(dateKey);
                dayRecord.deducted += (Number(rd.pointsUsed) || 0);
            });

            // 若後台有手動調整公德點數，將差額自動反映於當日紀錄，確保歷史紀錄總計與上方公德點數 100% 一致
            const rawVisibleAdded = visibleEvals.length;
            const rawVisibleDeducted = visibleRedeems.reduce((s, r) => s + (Number(r.pointsUsed) || 0), 0);
            const rawVisibleNet = Math.max(0, rawVisibleAdded - rawVisibleDeducted);
            const manualDiff = currentPoints - rawVisibleNet;

            if (manualDiff !== 0) {
                const todayKey = toLocalDateKey(new Date().toISOString());
                const todayRecord = ensureDay(todayKey);
                if (manualDiff > 0) {
                    todayRecord.added += manualDiff;
                } else {
                    todayRecord.deducted += Math.abs(manualDiff);
                }
            }

            if (dailyMap.size === 0) {
                historyContainer.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center text-neutral-400 text-sm sm:text-base font-bold py-16">
                        目前沒有歷史紀錄
                    </div>
                `;
                return;
            }

            const sortedAsc = Array.from(dailyMap.values()).sort((a, b) => a.dateKey.localeCompare(b.dateKey));
            let runningTotal = 0;
            sortedAsc.forEach((day) => {
                runningTotal = Math.max(0, runningTotal + day.added - day.deducted);
                day.totalAtEndOfDay = runningTotal;
            });

            const sortedDesc = sortedAsc.reverse();
            const isLocked = profileState.isEditing;

            historyContainer.innerHTML = sortedDesc.map((day, index) => {
                const isLatest = index === 0;
                const rowBg = isLocked ? 'bg-[#D6D6D6]/70 opacity-60 cursor-default' : 'bg-white hover:bg-[#FCF6E8]/60';
                const pillBg = isLocked ? 'bg-[#CFCFD4] text-neutral-600' : (isLatest ? 'bg-[#72D0FF] text-black' : 'bg-[#FCF6E8] hover:bg-[#72D0FF] text-black');
                const addedColor = isLocked ? 'text-neutral-500' : 'text-emerald-600';
                const deductedColor = isLocked ? 'text-neutral-500' : (day.deducted > 0 ? 'text-rose-600' : 'text-neutral-400');
                const totalColor = isLocked ? 'text-neutral-600' : 'text-[#1E2270]';
                return `
                    <div class="flex items-center justify-between px-3 py-2.5 rounded-2xl border-[1.5px] border-[#1E2270] ${rowBg} transition">
                        <span class="px-3.5 py-1 rounded-full ${pillBg} border border-[#1E2270] text-xs sm:text-sm font-extrabold tracking-wide transition-colors">
                            ${escapeHtml(day.dateKey)}
                        </span>
                        <div class="flex items-center gap-3 sm:gap-5 text-xs sm:text-sm font-extrabold">
                            <span class="w-12 text-center ${addedColor}">+${day.added}</span>
                            <span class="w-12 text-center ${deductedColor}">-${day.deducted}</span>
                            <span class="w-16 text-right ${totalColor}">共 ${day.totalAtEndOfDay} 點</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function subscribeUserCloudData(uid) {
            if (!db || !uid) return;

            if (profileState.profileUnsubscribe) profileState.profileUnsubscribe();
            if (profileState.evalUnsubscribe) profileState.evalUnsubscribe();
            if (profileState.redeemUnsubscribe) profileState.redeemUnsubscribe();

            profileState.evalLoaded = false;
            profileState.redeemLoaded = false;
            profileState.profileLoaded = false;

            // 即時監聽 user_profiles/{uid}：支援從 Firebase 後台直接修改 meritPoints 與 totalReports 即時生效
            profileState.profileUnsubscribe = db.collection('user_profiles').doc(uid)
                .onSnapshot((doc) => {
                    profileState.profileLoaded = true;
                    if (doc.exists) {
                        const data = doc.data() || {};
                        profileState.profileDoc = data;
                        if (data.avatarType && !profileState.isEditing) {
                            const normalizedCloud = normalizeLoggedInAvatarType(data.avatarType);
                            profileState.avatarType = normalizedCloud;
                            profileState.savedAvatarType = normalizedCloud;
                            renderProfileAvatar();
                            try {
                                localStorage.setItem(`poogle_avatar_${uid}`, normalizedCloud);
                                localStorage.setItem('poogle_latest_avatar', normalizedCloud);
                            } catch (e) {}
                            if (normalizedCloud !== data.avatarType) {
                                db.collection('user_profiles').doc(uid).set({ avatarType: normalizedCloud }, { merge: true }).catch(() => {});
                            }
                        }
                    } else {
                        profileState.profileDoc = null;
                    }
                    recalculateAndRenderPointsAndHistory();
                }, (err) => {
                    console.warn('User profile listener error:', err);
                });

            profileState.evalUnsubscribe = db.collection('evaluations')
                .where('userId', '==', uid)
                .onSnapshot((snapshot) => {
                    profileState.evalLoaded = true;
                    const evals = [];
                    snapshot.forEach((doc) => {
                        evals.push({ id: doc.id, ...doc.data() });
                    });
                    profileState.evaluations = evals;
                    recalculateAndRenderPointsAndHistory();
                }, (err) => {
                    console.warn('Evaluations listener error:', err);
                });

            profileState.redeemUnsubscribe = db.collection('redemptions')
                .where('userId', '==', uid)
                .onSnapshot((snapshot) => {
                    profileState.redeemLoaded = true;
                    const redeems = [];
                    snapshot.forEach((doc) => {
                        redeems.push({ id: doc.id, ...doc.data() });
                    });
                    profileState.redemptions = redeems;
                    recalculateAndRenderPointsAndHistory();
                }, (err) => {
                    console.warn('Redemptions listener error:', err);
                });
        }

        function applyGoogleUser(user) {
            if (!user) return;
            profileState.uid = user.uid;
            profileState.displayName = user.displayName || 'Google 用戶';
            profileState.email = user.email || '';

            let savedAvatar = DEFAULT_LOGGED_IN_PFP;
            try {
                const rawSaved = localStorage.getItem(`poogle_avatar_${user.uid}`) || user.avatarType || DEFAULT_LOGGED_IN_PFP;
                savedAvatar = normalizeLoggedInAvatarType(rawSaved);
                localStorage.setItem(`poogle_avatar_${user.uid}`, savedAvatar);
                localStorage.setItem('poogle_latest_avatar', savedAvatar);
            } catch (e) {}
            profileState.avatarType = savedAvatar;
            profileState.savedAvatarType = savedAvatar;

            renderProfileAvatar();
            renderGoogleAccountInfo();
            subscribeUserCloudData(user.uid);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProfileAvatar();
            renderShopItems();
            recalculateAndRenderPointsAndHistory();

            let cachedUser = null;
            try {
                cachedUser = JSON.parse(localStorage.getItem('poogle_auth_user') || 'null');
            } catch (e) {}

            if (cachedUser && cachedUser.uid) {
                applyGoogleUser(cachedUser);
            }

            if (auth) {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        document.getElementById('requireLoginModal').classList.add('hidden');
                        let savedAvatar = DEFAULT_LOGGED_IN_PFP;
                        try {
                            const rawSaved = localStorage.getItem(`poogle_avatar_${user.uid}`) || DEFAULT_LOGGED_IN_PFP;
                            savedAvatar = normalizeLoggedInAvatarType(rawSaved);
                        } catch (e) {}
                        const cleanUser = {
                            uid: user.uid,
                            displayName: user.displayName || 'Google 用戶',
                            email: user.email || '',
                            photoURL: user.photoURL || '',
                            avatarType: savedAvatar
                        };
                        try {
                            localStorage.setItem('poogle_auth_user', JSON.stringify(cleanUser));
                        } catch (e) {}
                        applyGoogleUser(cleanUser);
                    } else if (!cachedUser || !cachedUser.uid) {
                        document.getElementById('requireLoginModal').classList.remove('hidden');
                    }
                });
            } else if (!cachedUser || !cachedUser.uid) {
                document.getElementById('requireLoginModal').classList.remove('hidden');
            }

            // 編輯個人檔案模式與頭貼選擇器互動
            const chooseAvatarModal = document.getElementById('chooseAvatarModal');
            const discardEditModal = document.getElementById('discardEditModal');

            document.getElementById('startEditProfileBtn').addEventListener('click', () => {
                profileState.savedAvatarType = profileState.avatarType;
                setEditProfileMode(true);
            });

            document.getElementById('profileAvatarBtn').addEventListener('click', () => {
                if (!profileState.isEditing) return;
                profileState.tempModalAvatarType = profileState.avatarType;
                renderAvatarModalOptions();
                chooseAvatarModal.classList.remove('hidden');
            });

            document.getElementById('closeChooseAvatarModalBtn').addEventListener('click', () => {
                chooseAvatarModal.classList.add('hidden');
            });

            document.getElementById('confirmAvatarSelectBtn').addEventListener('click', () => {
                profileState.avatarType = normalizeLoggedInAvatarType(profileState.tempModalAvatarType);
                renderProfileAvatar();
                chooseAvatarModal.classList.add('hidden');
            });

            document.getElementById('finishEditProfileBtn').addEventListener('click', async () => {
                const btn = document.getElementById('finishEditProfileBtn');
                btn.disabled = true;
                btn.textContent = '儲存中...';
                try {
                    profileState.savedAvatarType = normalizeLoggedInAvatarType(profileState.avatarType);
                    await persistSelectedAvatar(profileState.savedAvatarType);
                    setEditProfileMode(false);
                    showProfileToast('✅ 已儲存您的個人頭貼設定！', '#3CE6B0');
                } finally {
                    btn.disabled = false;
                    btn.textContent = '完成編輯';
                }
            });

            document.getElementById('cancelEditProfileBtn').addEventListener('click', () => {
                profileState.pendingRedirectHome = false;
                discardEditModal.classList.remove('hidden');
            });

            // 編輯狀態下點擊「主頁」或左上角「Logo」時，同樣跳出是否放棄編輯的確認彈窗
            const interceptHomeNavigationInEditMode = (e) => {
                if (profileState.isEditing) {
                    e.preventDefault();
                    profileState.pendingRedirectHome = true;
                    discardEditModal.classList.remove('hidden');
                }
            };
            document.getElementById('profileHomeBtn').addEventListener('click', interceptHomeNavigationInEditMode);
            document.getElementById('profileLogoLink').addEventListener('click', interceptHomeNavigationInEditMode);

            document.getElementById('continueEditProfileBtn').addEventListener('click', () => {
                profileState.pendingRedirectHome = false;
                discardEditModal.classList.add('hidden');
            });

            document.getElementById('confirmDiscardEditBtn').addEventListener('click', () => {
                const shouldGoHome = profileState.pendingRedirectHome;
                profileState.pendingRedirectHome = false;
                profileState.avatarType = profileState.savedAvatarType;
                renderProfileAvatar();
                discardEditModal.classList.add('hidden');
                setEditProfileMode(false);
                if (shouldGoHome) {
                    window.location.href = './index.html';
                }
            });

            discardEditModal.addEventListener('click', (e) => {
                if (e.target === discardEditModal) {
                    profileState.pendingRedirectHome = false;
                    discardEditModal.classList.add('hidden');
                }
            });

            // 未登入時彈窗中的 Google 登入按鈕
            document.getElementById('profileGoogleLoginBtn').addEventListener('click', async () => {
                if (!auth) {
                    showProfileToast('目前環境無法連線至認證服務，可先點擊「預覽測試個人空間」', '#FF85D0');
                    return;
                }
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                try {
                    await auth.signInWithPopup(provider);
                    document.getElementById('requireLoginModal').classList.add('hidden');
                } catch (err) {
                    console.warn('Google login error:', err);
                    showProfileToast('Google 登入視窗在預覽環境受限，請於 localhost 開啟或點擊「預覽測試個人空間」', '#FF85D0');
                }
            });

            // 預覽測試模式按鈕（方便在預覽視窗或尚未設定白名單時直接測試換頭貼與商店）
            document.getElementById('profilePreviewGuestBtn').addEventListener('click', () => {
                document.getElementById('requireLoginModal').classList.add('hidden');
                const demoUser = {
                    uid: 'preview_demo_user',
                    displayName: '有所味探險家',
                    email: 'poogle.explorer@gmail.com',
                    avatarType: normalizeLoggedInAvatarType(profileState.avatarType)
                };
                try {
                    localStorage.setItem('poogle_auth_user', JSON.stringify(demoUser));
                } catch (e) {}
                applyGoogleUser(demoUser);
            });

            // 頂部登出按鈕
            document.getElementById('headerLogoutBtn').addEventListener('click', () => {
                try { localStorage.removeItem('poogle_auth_user'); } catch (e) {}
                if (auth) {
                    auth.signOut().finally(() => {
                        window.location.href = './index.html';
                    });
                } else {
                    window.location.href = './index.html';
                }
            });

            // 兌換商店確認彈窗按鈕
            const redeemModal = document.getElementById('redeemConfirmModal');
            document.getElementById('cancelRedeemBtn').addEventListener('click', () => {
                profileState.pendingRedeemItem = null;
                redeemModal.classList.add('hidden');
            });

            document.getElementById('confirmRedeemBtn').addEventListener('click', async () => {
                const item = profileState.pendingRedeemItem;
                if (!item || !profileState.uid) {
                    redeemModal.classList.add('hidden');
                    return;
                }
                if (profileState.currentPoints < item.cost) {
                    redeemModal.classList.add('hidden');
                    showProfileToast('公德點數不足！', '#FF85D0');
                    return;
                }

                const confirmBtn = document.getElementById('confirmRedeemBtn');
                confirmBtn.disabled = true;
                confirmBtn.textContent = '兌換中...';

                try {
                    if (item.type === 'background') {
                        profileState.unlockedBgIds.add(item.id);
                        try {
                            localStorage.setItem('poogle_selected_card_bg', item.id);
                            localStorage.setItem(`poogle_unlocked_bgs_${profileState.uid}`, JSON.stringify(Array.from(profileState.unlockedBgIds)));
                            localStorage.setItem('poogle_unlocked_bgs_latest', JSON.stringify(Array.from(profileState.unlockedBgIds)));
                        } catch (e) {}
                    }

                    if (db) {
                        await db.collection('redemptions').add({
                            userId: profileState.uid,
                            itemId: item.id,
                            itemType: item.type || 'item',
                            itemName: item.name,
                            pointsUsed: item.cost,
                            createdAt: new Date().toISOString(),
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        if (item.type === 'background') {
                            await db.collection('user_profiles').doc(profileState.uid).set({
                                unlockedBackgrounds: Array.from(profileState.unlockedBgIds),
                                updatedAt: new Date().toISOString()
                            }, { merge: true });
                        }
                    } else {
                        profileState.redemptions.push({
                            id: `local_${Date.now()}`,
                            userId: profileState.uid,
                            itemId: item.id,
                            itemType: item.type || 'item',
                            itemName: item.name,
                            pointsUsed: item.cost,
                            createdAt: new Date().toISOString()
                        });
                        recalculateAndRenderPointsAndHistory();
                    }

                    const msg = item.type === 'background'
                        ? `🎉 成功解鎖「${item.name}」（-${item.cost} 點）！已自動設為您的評鑑背景`
                        : `🎉 成功兌換「${item.name}」（-${item.cost} 點）！`;
                    showProfileToast(msg, '#3CE6B0');
                } catch (err) {
                    console.warn('Redeem error:', err);
                    showProfileToast('兌換失敗，請稍後再試', '#FF85D0');
                } finally {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '確認兌換';
                    profileState.pendingRedeemItem = null;
                    redeemModal.classList.add('hidden');
                }
            });

            // 測試階段：快速歸零與自訂點數/回報次數彈窗邏輯
            const testAdminModal = document.getElementById('testAdminModal');
            const inputMerit = document.getElementById('testInputMeritPoints');
            const inputReports = document.getElementById('testInputTotalReports');

            document.getElementById('openTestAdminModalBtn').addEventListener('click', () => {
                inputMerit.value = profileState.currentPoints;
                inputReports.value = profileState.totalReports;
                testAdminModal.classList.remove('hidden');
            });

            document.getElementById('closeTestAdminModalBtn').addEventListener('click', () => {
                testAdminModal.classList.add('hidden');
            });

            testAdminModal.addEventListener('click', (e) => {
                if (e.target === testAdminModal) testAdminModal.classList.add('hidden');
            });

            async function updateBackendCounts(newPoints, newReports, resetHistory = false) {
                const cleanPoints = Math.max(0, parseInt(newPoints, 10) || 0);
                const cleanReports = Math.max(0, parseInt(newReports, 10) || 0);
                const rawEvalCount = profileState.evaluations.length;
                const rawSpentPoints = profileState.redemptions.reduce((sum, r) => sum + (Number(r.pointsUsed) || 0), 0);

                const payload = {
                    userId: profileState.uid || 'preview_demo_user',
                    displayName: profileState.displayName || 'Google 用戶',
                    email: profileState.email || '',
                    avatarType: normalizeLoggedInAvatarType(profileState.avatarType),
                    meritPoints: cleanPoints,
                    totalReports: cleanReports,
                    _rawEvalCount: rawEvalCount,
                    _rawSpentPoints: rawSpentPoints,
                    updatedAt: new Date().toISOString()
                };
                if (resetHistory) {
                    payload.resetHistoryAt = new Date().toISOString();
                }

                profileState.profileDoc = { ...(profileState.profileDoc || {}), ...payload };
                recalculateAndRenderPointsAndHistory();

                if (db && profileState.uid) {
                    await db.collection('user_profiles').doc(profileState.uid).set(payload, { merge: true });
                }
            }

            document.getElementById('applyCustomCountsBtn').addEventListener('click', async () => {
                const btn = document.getElementById('applyCustomCountsBtn');
                btn.disabled = true;
                btn.textContent = '同步中...';
                try {
                    await updateBackendCounts(inputMerit.value, inputReports.value, false);
                    testAdminModal.classList.add('hidden');
                    showProfileToast(`✅ 已同步更新：公德點數 ${profileState.currentPoints} 點、總回報 ${profileState.totalReports} 次`, '#3CE6B0');
                } catch (err) {
                    showProfileToast('更新失敗，請稍後再試', '#FF85D0');
                } finally {
                    btn.disabled = false;
                    btn.textContent = '套用自訂數值（同步至後台）';
                }
            });

            document.getElementById('quickZeroCountsOnlyBtn').addEventListener('click', async () => {
                const btn = document.getElementById('quickZeroCountsOnlyBtn');
                btn.disabled = true;
                try {
                    await updateBackendCounts(0, 0, true);
                    testAdminModal.classList.add('hidden');
                    showProfileToast('✅ 已將公德點數與總回報次數歸 0！', '#3CE6B0');
                } finally {
                    btn.disabled = false;
                }
            });

            document.getElementById('quickZeroAndDeleteHistoryBtn').addEventListener('click', async () => {
                const btn = document.getElementById('quickZeroAndDeleteHistoryBtn');
                btn.disabled = true;
                btn.textContent = '清空雲端紀錄中...';
                try {
                    const defaultBgs = ['bg_classic', 'bg_ocean_bubble', 'bg_peach_blossom'];
                    profileState.unlockedBgIds = new Set(defaultBgs);
                    try {
                        if (profileState.uid) {
                            localStorage.setItem(`poogle_unlocked_bgs_${profileState.uid}`, JSON.stringify(defaultBgs));
                        }
                        localStorage.setItem('poogle_unlocked_bgs_latest', JSON.stringify(defaultBgs));
                        localStorage.setItem('poogle_selected_card_bg', 'bg_classic');
                    } catch (e) {}

                    if (db && profileState.uid) {
                        const evalSnap = await db.collection('evaluations').where('userId', '==', profileState.uid).get();
                        const redeemSnap = await db.collection('redemptions').where('userId', '==', profileState.uid).get();
                        const batch = db.batch();
                        evalSnap.forEach((d) => batch.delete(d.ref));
                        redeemSnap.forEach((d) => batch.delete(d.ref));
                        await batch.commit();

                        await db.collection('user_profiles').doc(profileState.uid).set({
                            userId: profileState.uid,
                            displayName: profileState.displayName || 'Google 用戶',
                            email: profileState.email || '',
                            meritPoints: 0,
                            totalReports: 0,
                            unlockedBackgrounds: defaultBgs,
                            _rawEvalCount: 0,
                            _rawSpentPoints: 0,
                            resetHistoryAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    } else {
                        profileState.evaluations = [];
                        profileState.redemptions = [];
                        await updateBackendCounts(0, 0, true);
                    }
                    testAdminModal.classList.add('hidden');
                    showProfileToast('🧹 已完整歸 0 並重置購買背景、測試評論與兌換紀錄！', '#3CE6B0');
                } catch (err) {
                    console.warn('Reset all error:', err);
                    showProfileToast('清空失敗，請稍後再試', '#FF85D0');
                } finally {
                    btn.disabled = false;
                    btn.textContent = '完整歸 0（同時清空此帳號的歷史紀錄與測試評論）';
                }
            });
        });
    </script>
