    <script>
        // 攔截預覽環境中本機圖檔或跨網域腳本產生的空白錯誤事件
        window.addEventListener('error', function(e) {
            if (e && e.target && e.target !== window) {
                if (typeof e.target.onerror === 'function') {
                    try { e.target.onerror.call(e.target, e); } catch (err) {}
                }
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
        }, true);
    </script>

    <link rel="preload" as="image" href="./img/hardware/mirror_dirty.png">

    <!-- Google Fonts 圓體備援 + jf open 粉圓體 (jf-openhuninn) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        :root {
            --poogle-mint-bg: #45E5AC;
            --poogle-cream: #FFF9EC;
            --poogle-yellow: #F3EF84;
            --poogle-blue: #46E0FF;
            --poogle-pink: #FF99D3;
            --poogle-red: #F26559;
            --poogle-ink: #2A348C;
            --cursor-default: url('./img/mouse.png') 0 0, auto;
            --cursor-hover: url('./img/hover.png') 0 0, pointer;
        }

        @font-face {
            font-family: 'jf-openhuninn';
            src: local('jf-openhuninn-2.1'),
                 local('jf-openhuninn-2.0'),
                 local('jf-openhuninn-1.1'),
                 local('jf-openhuninn'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-web-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }

        html, body, svg {
            font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
            cursor: var(--cursor-default) !important;
        }

        body {
            background-color: var(--poogle-cream);
            color: var(--poogle-ink);
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        a, button, [role="button"], .tp-menu-item, .tp-menu-item * {
            outline: none !important;
            cursor: var(--cursor-hover) !important;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ========================================================= */
        /* 手機版右上角下拉式衛生紙捲筒選單展開／收合動畫               */
        /* ========================================================= */
        @keyframes tpDropdownUnroll {
            0% { opacity: 0; transform: scaleY(0.18); }
            70% { opacity: 1; transform: scaleY(1.03); }
            100% { opacity: 1; transform: scaleY(1); }
        }
        @keyframes tpDropdownRollUp {
            0% { opacity: 1; transform: scaleY(1); }
            30% { opacity: 1; transform: scaleY(1.02); }
            100% { opacity: 0; transform: scaleY(0.12); }
        }
        #tpRollDropdownMenu {
            transform-origin: top center;
        }
        #tpRollDropdownMenu.is-open {
            display: block;
            animation: tpDropdownUnroll 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #tpRollDropdownMenu.is-closing {
            display: block;
            pointer-events: none;
            animation: tpDropdownRollUp 0.26s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @media (min-width: 768px) {
            #tpRollDropdownMenu,
            #tpRollDropdownMenu.is-open,
            #tpRollDropdownMenu.is-closing {
                display: none !important;
            }
        }
        .tp-menu-item {
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .tp-menu-item:hover {
            transform: translateX(3px);
        }
        .tp-menu-item:hover text {
            fill: #F26559;
        }

        /* ========================================================= */
        /* 標題遊戲機 Pop 登場、雲朵與文字依序彈出、過場對焦動畫樣式     */
        /* ========================================================= */
        #boardFinalSceneSvg {
            opacity: 0.45;
            filter: blur(11px);
            -webkit-filter: blur(11px);
            will-change: filter, opacity;
        }

        @keyframes consoleStageAppear {
            0% {
                opacity: 0;
                transform: scale(0.88) translateY(18px);
            }
            70% {
                opacity: 1;
                transform: scale(1.02) translateY(-3px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes cloudElasticPop {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            64% {
                opacity: 1;
                transform: scale(1.13);
            }
            84% {
                opacity: 1;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes charElasticPop {
            0% {
                opacity: 0;
                transform: scale(0) translateY(10px);
            }
            66% {
                opacity: 1;
                transform: scale(1.26) translateY(-3px);
            }
            85% {
                opacity: 1;
                transform: scale(0.95) translateY(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0px);
            }
        }

        @keyframes startArcadePop {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            60% {
                opacity: 1;
                transform: scale(1.3);
            }
            80% {
                opacity: 1;
                transform: scale(0.94);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes birdCatchBounce {
            0% { transform: translateY(0px); }
            45% { transform: translateY(4px); }
            78% { transform: translateY(-1.5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes liveDotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        #leftFighterPortraitFallback,
        #rightFighterPortraitFallback,
        #leftFighterStageFallback,
        #rightFighterStageFallback,
        #rightDoorPeekMonsterFallback {
            display: none !important;
        }

        #consoleEntranceMover {
            opacity: 0;
            transform-origin: 720px 390px;
        }
        #consoleEntranceMover.is-ready {
            animation: consoleStageAppear 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .pop-hidden {
            opacity: 0;
            transform: scale(0);
        }

        #cloudPopTarget.is-popped {
            animation: cloudElasticPop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .title-char-pop.is-popped {
            animation: charElasticPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #startPopTarget.is-popped {
            animation: startArcadePop 0.44s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #pinkBirdCatchBounceGroup.is-caught {
            animation: birdCatchBounce 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        #liveStatusDot {
            animation: liveDotPulse 1.8s ease-in-out infinite;
        }
        /* 左上角 Logo 貼紙白框＋深藍細線濾鏡與轉場後淡入動畫（同 index.html） */
        /* 轉場後左上角 Logo 淡入動畫（已移除白邊濾鏡） */
        @keyframes reportHeaderFadeIn {
            0% {
                transform: translateY(-16px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #boardStageTopBar.is-fading-in {
            animation: reportHeaderFadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* ========================================================= */
        /* 左右廁門 Hover 立體厚度微開、雙對話框彈出與 3 倍小怪探頭動畫 */
        /* ========================================================= */
        #boardFinalSceneSvg:not(.is-interactive) .board-interactive-door {
            pointer-events: none;
        }
        #boardFinalSceneSvg.is-interactive .board-interactive-door,
        #boardFinalSceneSvg.is-interactive .board-interactive-door * {
            cursor: var(--cursor-hover) !important;
        }

        /* 門內淡藍色底層與小怪容器（關門完全閉合後隱藏，開門瞬間顯示） */
        .door-interior-bg,
        .door-peek-monster-wrap {
            opacity: 0;
            transition: opacity 0.04s linear 0.28s;
        }
        .board-interactive-door.is-hovered .door-interior-bg,
        .board-interactive-door.is-hovered .door-peek-monster-wrap {
            opacity: 1;
            transition: opacity 0.01s linear 0s;
        }

        /* 左門對話框 1：圓角方框對話框（先彈出，微微向左上傾斜） */
        #leftDoorSpeechBubble1 {
            opacity: 0;
            transform: translate(-18px, 6px) rotate(-18deg) scale(0);
            transition:
                transform 0.22s cubic-bezier(0.4, 0, 0.2, 1) 0.03s,
                opacity 0.16s ease 0.05s;
            pointer-events: none;
            will-change: transform, opacity;
        }
        #doorMessageBoardGroup.is-hovered #leftDoorSpeechBubble1 {
            opacity: 1;
            transform: translate(0px, 0px) rotate(-9deg) scale(1);
            transition:
                transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s,
                opacity 0.14s ease 0.04s;
        }

        /* 左門對話框 2：還原至門把下方位置（稍稍延遲 0.18s 彈出） */
        #leftDoorSpeechBubble2 {
            opacity: 0;
            transform: translate(-20px, -4px) rotate(16deg) scale(0);
            transition:
                transform 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s,
                opacity 0.15s ease 0.02s;
            pointer-events: none;
            will-change: transform, opacity;
        }
        #doorMessageBoardGroup.is-hovered #leftDoorSpeechBubble2 {
            opacity: 1;
            transform: translate(0px, 0px) rotate(7deg) scale(1);
            transition:
                transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.18s,
                opacity 0.14s ease 0.17s;
        }

        /* 右門小怪移動層 */
        #rightDoorPeekMonsterMover {
            will-change: transform;
            pointer-events: none;
        }

        /* ========================================================= */
        /* 粉紅小鳥：待機打電動微動、點擊掉機生氣與中門用力關上震動     */
        /* ========================================================= */
        #boardFinalSceneSvg:not(.is-interactive) #pinkBirdCharacterGroup {
            pointer-events: none;
        }
        #boardFinalSceneSvg.is-interactive #pinkBirdCharacterGroup:not(.is-busy),
        #boardFinalSceneSvg.is-interactive #pinkBirdCharacterGroup:not(.is-busy) * {
            cursor: var(--cursor-hover) !important;
        }

        @keyframes birdConsoleGamingJiggle {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            25%      { transform: translate(-0.7px, -1.6px) rotate(-1.6deg); }
            50%      { transform: translate(0.5px, 0.8px) rotate(0.9deg); }
            75%      { transform: translate(0.8px, -1.4px) rotate(1.7deg); }
        }
        @keyframes birdLeftHandTap {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            50%      { transform: translate(1.6px, -2.5px) rotate(-4.5deg); }
        }
        @keyframes birdRightHandTap {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            50%      { transform: translate(-1.6px, -2.6px) rotate(4.8deg); }
        }

        #pinkBirdCharacterGroup.is-gaming #birdConsoleMotionGroup {
            animation: birdConsoleGamingJiggle 0.44s ease-in-out infinite;
        }
        #pinkBirdCharacterGroup.is-gaming #birdLeftHandGaming {
            animation: birdLeftHandTap 0.25s ease-in-out infinite;
        }
        #pinkBirdCharacterGroup.is-gaming #birdRightHandGaming {
            animation: birdRightHandTap 0.21s ease-in-out -0.1s infinite;
        }

        /* 點擊後小鳥生氣表情、雙手張開與氣到發抖動畫 */
        @keyframes birdAngryHopTremble {
            0%   { transform: translate(0px, 0px); }
            18%  { transform: translate(0px, -9px); }
            34%  { transform: translate(-3px, 0px); }
            48%  { transform: translate(3px, -1px); }
            62%  { transform: translate(-2.5px, 0px); }
            76%  { transform: translate(2.5px, 0px); }
            90%  { transform: translate(-1.5px, 0px); }
            100% { transform: translate(0px, 0px); }
        }
        @keyframes angerVeinPop {
            0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
            65%  { opacity: 1; transform: scale(1.25) rotate(6deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        #birdAngryBrows,
        #birdAngryMouth,
        #birdAngerMark {
            opacity: 0;
            pointer-events: none;
        }

        #pinkBirdCharacterGroup.is-angry #pinkBirdCatchBounceGroup {
            animation: birdAngryHopTremble 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        #pinkBirdCharacterGroup.is-angry #birdAngryBrows,
        #pinkBirdCharacterGroup.is-angry #birdAngryMouth {
            opacity: 1;
        }
        #pinkBirdCharacterGroup.is-angry #birdNormalSmile {
            opacity: 0;
        }
        #pinkBirdCharacterGroup.is-angry #birdAngerMark {
            animation: angerVeinPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s forwards;
        }
        #pinkBirdCharacterGroup.is-angry #birdLeftHandGaming {
            transform: translate(-9px, -5px) rotate(-15deg);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #pinkBirdCharacterGroup.is-angry #birdRightHandGaming {
            transform: translate(9px, -5px) rotate(15deg);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 中門用力甩上時的撞擊震動特效 */
        @keyframes middleDoorSlamImpact {
            0%   { transform: translateX(0px); }
            25%  { transform: translateX(3.5px); }
            50%  { transform: translateX(-2.5px); }
            75%  { transform: translateX(1.5px); }
            100% { transform: translateX(0px); }
        }
        #middleDoorSlamShakeGroup.is-slam-shaking {
            animation: middleDoorSlamImpact 0.24s ease-out both;
        }
        /* ========================================================= */
        /* 小怪板（24hr 即時散步小怪、貼紙白邊外框與輕微搖擺步伐動畫） */
        /* ========================================================= */
        @keyframes monsterBoardFadeIn {
            0% { opacity: 0; transform: scale(0.985); }
            100% { opacity: 1; transform: scale(1); }
        }
        #monsterBoardView.is-entering {
            animation: monsterBoardFadeIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes mkWalkerPopIn {
            0% { opacity: 0; transform: scale(0.55); }
            70% { opacity: 1; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes mkStrollWaddle {
            0%, 100% { transform: translateY(0px) rotate(-1.8deg); }
            25%      { transform: translateY(-3.5px) rotate(0deg); }
            50%      { transform: translateY(0px) rotate(1.8deg); }
            75%      { transform: translateY(-3.5px) rotate(0deg); }
        }
        @keyframes mkIdleBreathe {
            0%, 100% { transform: translateY(0px) scale(1); }
            50%      { transform: translateY(-2px) scale(1.018); }
        }

        .mk-walker-node {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
            pointer-events: none;
            user-select: none;
        }
        .mk-walker-inner {
            animation: mkWalkerPopIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .mk-walker-bob.is-walking {
            animation: mkStrollWaddle 1.55s ease-in-out infinite;
            transform-origin: 50% 85%;
        }
        .mk-walker-bob.is-pausing {
            animation: mkIdleBreathe 2.5s ease-in-out infinite;
            transform-origin: 50% 85%;
        }
        .mk-sticker-img {
            filter: url(#monsterStickerFilter);
            -webkit-filter: url(#monsterStickerFilter);
            transition: width 0.35s ease, height 0.35s ease;
        }
    </style>
</head>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 初始化左上角有所味 Logo（自動載入 ./img/logo.png 並支援向量備援）
            function initLogoImagesWithFallback() {
                const symbolEl = document.getElementById('youSuoWeiLogoVector');
                const applyUrlToAllLogos = (url) => {
                    document.querySelectorAll('.poogle-logo-img').forEach((el) => {
                        if (el.tagName && el.tagName.toLowerCase() === 'img') {
                            el.src = url;
                        } else {
                            el.setAttribute('href', url);
                        }
                    });
                };
                if (symbolEl) {
                    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 560 190">${symbolEl.innerHTML}</svg>`;
                    applyUrlToAllLogos(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgStr)}`);
                }
                const isSandbox = (
                    window.location.protocol === 'about:' ||
                    window.location.protocol === 'blob:' ||
                    window.location.protocol === 'data:' ||
                    (window.location.hostname || '').includes('usercontent.goog') ||
                    (window.location.hostname || '').includes('googleusercontent.com')
                );
                if (isSandbox) return;
                const logoCandidates = ['./img/logo.png', './img/logo.PNG', 'img/logo.png', 'img/logo.PNG'];
                let idx = 0;
                const tryNext = () => {
                    if (idx >= logoCandidates.length) return;
                    const testUrl = logoCandidates[idx++];
                    const probe = new Image();
                    probe.onload = () => applyUrlToAllLogos(testUrl);
                    probe.onerror = () => tryNext();
                    probe.src = testUrl;
                };
                tryNext();
            }
            initLogoImagesWithFallback();
            // ===============================================================
            // 1. 手機版右上角漢堡選單開合控制（維持全站一致導覽體驗）
            // ===============================================================
            const topHamburgerBtn = document.getElementById('topHamburgerBtn');
            const tpRollDropdownMenu = document.getElementById('tpRollDropdownMenu');
            let tpDropdownCloseTimer = null;

            const closeTpDropdownMenu = () => {
                if (!tpRollDropdownMenu) return;
                if (tpDropdownCloseTimer) {
                    clearTimeout(tpDropdownCloseTimer);
                    tpDropdownCloseTimer = null;
                }
                topHamburgerBtn?.setAttribute('aria-expanded', 'false');
                if (!tpRollDropdownMenu.classList.contains('is-open')) {
                    tpRollDropdownMenu.classList.add('hidden');
                    return;
                }
                tpRollDropdownMenu.classList.remove('is-open');
                void tpRollDropdownMenu.offsetWidth;
                tpRollDropdownMenu.classList.add('is-closing');
                tpDropdownCloseTimer = setTimeout(() => {
                    tpRollDropdownMenu.classList.remove('is-closing');
                    tpRollDropdownMenu.classList.add('hidden');
                    tpDropdownCloseTimer = null;
                }, 260);
            };

            const openTpDropdownMenu = () => {
                if (!tpRollDropdownMenu) return;
                if (tpDropdownCloseTimer) {
                    clearTimeout(tpDropdownCloseTimer);
                    tpDropdownCloseTimer = null;
                }
                tpRollDropdownMenu.classList.remove('hidden', 'is-closing');
                void tpRollDropdownMenu.offsetWidth;
                tpRollDropdownMenu.classList.add('is-open');
                topHamburgerBtn?.setAttribute('aria-expanded', 'true');
            };

            topHamburgerBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = tpRollDropdownMenu?.classList.contains('is-open') && !tpRollDropdownMenu?.classList.contains('is-closing');
                if (isOpen) closeTpDropdownMenu();
                else openTpDropdownMenu();
            });

            document.addEventListener('pointerdown', (e) => {
                if (!tpRollDropdownMenu || !tpRollDropdownMenu.classList.contains('is-open')) return;
                if (tpRollDropdownMenu.contains(e.target) || topHamburgerBtn?.contains(e.target)) return;
                closeTpDropdownMenu();
            }, true);

            // ===============================================================
            // 2. 自動載入本機小怪圖片（口水鏡 mirror_dirty / 貪吃台 sink_trash）
            // ===============================================================
            const isPreviewSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').includes('usercontent.goog') ||
                (window.location.hostname || '').includes('googleusercontent.com')
            );

            // 預載並完成點陣圖解碼 (decode) 後寫入 SVG，確保畫面出現瞬間即為完整清晰 PNG
            function preloadFighterPng(candidates, stageImgId, portraitImgId) {
                if (isPreviewSandbox) return Promise.resolve();

                return new Promise((resolve) => {
                    let idx = 0;
                    const tryNext = () => {
                        if (idx >= candidates.length) {
                            resolve();
                            return;
                        }
                        const url = candidates[idx++];
                        const probe = new Image();
                        probe.decoding = 'async';
                        probe.onload = () => {
                            const applyToSvg = () => {
                                const stageImg = document.getElementById(stageImgId);
                                const portraitImg = document.getElementById(portraitImgId);

                                if (stageImg) {
                                    stageImg.setAttribute('href', url);
                                    stageImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
                                    stageImg.classList.remove('hidden');
                                }
                                if (portraitImg) {
                                    portraitImg.setAttribute('href', url);
                                    portraitImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
                                    portraitImg.classList.remove('hidden');
                                }
                                resolve();
                            };

                            if (typeof probe.decode === 'function') {
                                probe.decode().catch(() => {}).finally(applyToSvg);
                            } else {
                                applyToSvg();
                            }
                        };
                        probe.onerror = tryNext;
                        probe.src = url;
                    };
                    tryNext();
                });
            }

            // ===============================================================
            // 3. 開場過場動畫時間軸（等待小怪 PNG 預載解碼完成後才正式登場）
            // ===============================================================
            const boardFinalSceneSvg = document.getElementById('boardFinalSceneSvg');
            const consoleTitleStage = document.getElementById('consoleTitleStage');
            const consoleEntranceMover = document.getElementById('consoleEntranceMover');
            const cloudPopTarget = document.getElementById('cloudPopTarget');
            const startPopTarget = document.getElementById('startPopTarget');

            const consoleFrontFace = document.getElementById('consoleFrontFace');
            const consoleBackFace = document.getElementById('consoleBackFace');
            const console3dSideRim = document.getElementById('console3dSideRim');
            const backShellTopFold = document.getElementById('backShellTopFold');
            const backShellBottomFold = document.getElementById('backShellBottomFold');

            const birdCatchHandsOverlay = document.getElementById('birdCatchHandsOverlay');
            const birdLeftHandCatch = document.getElementById('birdLeftHandCatch');
            const birdRightHandCatch = document.getElementById('birdRightHandCatch');
            const birdHeldConsoleStatic = document.getElementById('birdHeldConsoleStatic');
            const birdHandsStatic = document.getElementById('birdHandsStatic');
            const pinkBirdCatchBounceGroup = document.getElementById('pinkBirdCatchBounceGroup');

            function startConsoleIntroSequence() {
                // 等待一個繪製幀確保 SVG 材質已貼上，再讓遊戲機彈出登場
                requestAnimationFrame(() => {
                    consoleEntranceMover?.classList.add('is-ready');

                    // 步驟 1：遊戲機登場後，雲朵先 Pop 出來 (520ms)
                    setTimeout(() => {
                        cloudPopTarget?.classList.add('is-popped');
                    }, 520);

                    // 步驟 2：「公、廁、現、況、板」五個字依序 Pop 出現 (960ms ~ 1600ms)
                    const charTimings = [960, 1120, 1280, 1440, 1600];
                    charTimings.forEach((delayMs, idx) => {
                        setTimeout(() => {
                            document.getElementById(`titleChar_${idx}`)?.classList.add('is-popped');
                        }, delayMs);
                    });

                    // 步驟 3：下螢幕出現 START 文字 (2020ms)
                    setTimeout(() => {
                        startPopTarget?.classList.add('is-popped');
                    }, 2020);

                    // 步驟 4：遊戲機轉向（180° 翻面露背）並縮小到粉紅小鳥手中 (2720ms 啟動)
                    setTimeout(() => {
                        startConsoleFlipAndShrinkToBird();
                    }, 2720);
                });
            }

            // 同步預載兩隻對戰小怪 PNG（附 800ms 安全逾時保底，防止缺檔卡住畫面）
            Promise.race([
                Promise.all([
                    preloadFighterPng(
                        ['./img/hardware/mirror_dirty.png', './img/hardware/mirror_dirty.PNG', 'img/hardware/mirror_dirty.png'],
                        'leftFighterStageImg', 'leftFighterPortraitImg'
                    ),
                    preloadFighterPng(
                        ['./img/hardware/sink_trash.png', './img/hardware/sink_trash.PNG', 'img/hardware/sink_trash.png'],
                        'rightFighterStageImg', 'rightFighterPortraitImg'
                    )
                ]),
                new Promise((res) => setTimeout(res, 800))
            ]).then(startConsoleIntroSequence);

            function startConsoleFlipAndShrinkToBird() {
                const durationMs = 1260;
                const startTime = performance.now();

                // 大小比例常數：大遊戲機寬 746.9px ➔ 小鳥手中 Nintenpoo 寬 68.6px
                const BACK_TO_FRONT_RATIO = 746.9 / 68.6; // 10.8878
                const END_SCALE = 1 / BACK_TO_FRONT_RATIO; // 0.09185

                // 起點（畫面正中央）與終點（粉紅小鳥雙手中心）
                const startX = 720.0, startY = 390.0;
                const endX = 748.35, endY = 546.0;

                console3dSideRim?.classList.remove('hidden');

                function step(now) {
                    const rawT = Math.min(1, (now - startTime) / durationMs);

                    // 平滑位移與縮放曲線
                    const easeMove = rawT < 0.5
                        ? 4 * rawT * rawT * rawT
                        : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

                    // 轉向角度 theta：0 -> PI (約在 rawT=0.44 機身仍大時翻過 90°，清楚展現轉向過程)
                    const flipProgress = Math.pow(rawT, 0.86);
                    const theta = Math.PI * (0.5 - 0.5 * Math.cos(Math.PI * flipProgress));
                    const cosVal = Math.cos(theta);
                    const sinVal = Math.sin(theta);

                    // 微幅拋物線躍起後落入小鳥手中
                    const arcLiftY = -24 * Math.sin(Math.pow(rawT, 0.85) * Math.PI);
                    const curX = startX + (endX - startX) * easeMove;
                    const curY = startY + (endY - startY) * easeMove + arcLiftY;

                    // 整體尺寸由 1.0 平滑縮小至 END_SCALE
                    const scaleEase = Math.pow(easeMove, 1.08);
                    const curScale = 1 + (END_SCALE - 1) * scaleEase;

                    // 3D 翻轉動態微傾角與機殼側邊厚度偏移
                    const tiltDeg = -5.5 * sinVal;
                    const skewDeg = 4.2 * sinVal;
                    const halfThick = 14 * curScale;

                    if (theta <= Math.PI / 2) {
                        // 0° ~ 90°：正面雙螢幕朝向觀眾並逐漸側轉
                        consoleFrontFace?.classList.remove('hidden');
                        consoleBackFace?.classList.add('hidden');

                        const faceScaleX = Math.max(0.025, cosVal) * curScale;
                        const frontX = curX + halfThick * sinVal;
                        const rimX = curX - halfThick * sinVal;

                        consoleFrontFace?.setAttribute(
                            'transform',
                            `translate(${frontX.toFixed(2)}, ${curY.toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) skewY(${skewDeg.toFixed(2)}) scale(${faceScaleX.toFixed(4)}, ${curScale.toFixed(4)})`
                        );
                        console3dSideRim?.setAttribute(
                            'transform',
                            `translate(${rimX.toFixed(2)}, ${curY.toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) skewY(${skewDeg.toFixed(2)}) scale(${faceScaleX.toFixed(4)}, ${curScale.toFixed(4)})`
                        );
                    } else {
                        // 90° ~ 180°：翻過側面露出白色 Nintenpoo 機背並縮小飛入小鳥手中
                        consoleFrontFace?.classList.add('hidden');
                        consoleBackFace?.classList.remove('hidden');

                        const uBack = (theta - Math.PI / 2) / (Math.PI / 2);
                        const foldEase = 1 - Math.pow(1 - uBack, 2);

                        const backScale = BACK_TO_FRONT_RATIO * curScale;
                        const absCos = Math.max(0.025, Math.abs(cosVal));
                        const backX = curX - halfThick * sinVal;
                        const rimX = curX + halfThick * sinVal;

                        // 下半機身由展開平面微折為小鳥手持遊玩視角
                        const topFoldY = 1.0729 + (1 - 1.0729) * foldEase;
                        const botFoldY = 1.7881 + (1 - 1.7881) * foldEase;

                        consoleBackFace?.setAttribute(
                            'transform',
                            `translate(${backX.toFixed(2)}, ${curY.toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) skewY(${skewDeg.toFixed(2)}) scale(${(backScale * absCos).toFixed(4)}, ${backScale.toFixed(4)})`
                        );
                        backShellTopFold?.setAttribute('transform', `scale(1, ${topFoldY.toFixed(4)})`);
                        backShellBottomFold?.setAttribute('transform', `scale(1, ${botFoldY.toFixed(4)})`);

                        const rimScaleX = absCos * curScale;
                        const rimScaleY = curScale * (0.72 + 0.28 * (1 - foldEase));
                        console3dSideRim?.setAttribute(
                            'transform',
                            `translate(${rimX.toFixed(2)}, ${curY.toFixed(2)}) rotate(${tiltDeg.toFixed(2)}) skewY(${skewDeg.toFixed(2)}) scale(${rimScaleX.toFixed(4)}, ${rimScaleY.toFixed(4)})`
                        );
                    }

                    // 背景公廁現況板同步由模糊 (blur 11px, opacity 0.45) 對焦至完全清晰
                    if (boardFinalSceneSvg) {
                        const unblurProgress = Math.min(1, Math.max(0, (rawT - 0.08) / 0.78));
                        const blurEase = 1 - Math.pow(1 - unblurProgress, 2);
                        const blurPx = 11 * (1 - blurEase);
                        const bgOpacity = 0.45 + 0.55 * blurEase;
                        boardFinalSceneSvg.style.filter = blurPx > 0.08 ? `blur(${blurPx.toFixed(2)}px)` : 'none';
                        boardFinalSceneSvg.style.webkitFilter = blurPx > 0.08 ? `blur(${blurPx.toFixed(2)}px)` : 'none';
                        boardFinalSceneSvg.style.opacity = bgOpacity.toFixed(3);
                    }

                    // 最後階段 (rawT >= 0.72)：粉紅小鳥雙手由兩側合攏握住遊戲機
                    if (rawT >= 0.72 && birdCatchHandsOverlay) {
                        const catchP = Math.min(1, (rawT - 0.72) / 0.28);
                        const catchEase = 1 - Math.pow(1 - catchP, 2.4);
                        const spreadPx = 12 * (1 - catchEase);
                        birdCatchHandsOverlay.setAttribute('opacity', Math.min(1, catchP * 1.6).toFixed(3));
                        birdLeftHandCatch?.setAttribute('transform', `translate(${(-spreadPx).toFixed(2)}, 0)`);
                        birdRightHandCatch?.setAttribute('transform', `translate(${spreadPx.toFixed(2)}, 0)`);
                    }

                    if (rawT < 1) {
                        requestAnimationFrame(step);
                    } else {
                        // 完美抵達：無縫切換為場景內靜態 Nintenpoo 機身與小鳥雙手，並觸發小鳥接住微彈跳
                        if (boardFinalSceneSvg) {
                            boardFinalSceneSvg.style.filter = 'none';
                            boardFinalSceneSvg.style.webkitFilter = 'none';
                            boardFinalSceneSvg.style.opacity = '1';
                        }
                       birdHeldConsoleStatic?.setAttribute('opacity', '1');
                        birdHandsStatic?.setAttribute('opacity', '1');
                        consoleTitleStage?.classList.add('hidden');
                        pinkBirdCatchBounceGroup?.classList.add('is-caught');

                        const boardStageTopBar = document.getElementById('boardStageTopBar');
                        if (boardStageTopBar) {
                            boardStageTopBar.classList.remove('hidden', 'is-fading-in');
                            void boardStageTopBar.offsetWidth;
                            boardStageTopBar.classList.add('is-fading-in');
                        }

                        // 過場完成後啟用左右廁門 Hover 互動
                        enableBoardDoorInteractions();
                    }
                }

                requestAnimationFrame(step);
            }

            // ===============================================================
            // 4. 預載全系列小怪圖檔 ＋ 立體厚度門縫動畫與 3 倍小怪探頭控制
            // ===============================================================
            const MONSTER_FOLDER_CONFIG = {
                consumable: [
                    "pad_yes.png", "pad_no.png", "paper_no.png", "paper_yes.png",
                    "sanitizer_no.png", "sanitizer_yes.png", "soap_no.png", "soap_yes.png"
                ],
                hardware: [
                    "dryer_broke.png", "dryer_strong.png", "mirror_dirty.png", "sink_clean.png",
                    "sink_trash.png", "tools_tidy.png", "trash_too_much.png", "walls_ceiling_tidy.png"
                ],
                stall: [

                ],

            const preloadedPeekMonsters = [];

            if (!isPreviewSandbox) {
                Object.entries(MONSTER_FOLDER_CONFIG).forEach(([folder, files]) => {
                    files.forEach((file) => {
                        const base = file.replace(/\.png$/i, '');
                        const candidates = [
                            `./img/${folder}/${file}`,
                            `./img/${folder}/${base}.PNG`,
                            `img/${folder}/${file}`
                        ];
                        let idx = 0;
                        const probeNext = () => {
                            if (idx >= candidates.length) return;
                            const testUrl = candidates[idx++];
                            const img = new Image();
                            img.decoding = 'async';
                            img.onload = () => {
                                preloadedPeekMonsters.push({ url: testUrl, img });
                            };
                            img.onerror = probeNext;
                            img.src = testUrl;
                        };
                        probeNext();
                    });
                });
            }

            // 計算帶外開微透視與圓角的立體門板 SVG 路徑
            function buildPerspectiveDoorPath(x0, width, yTopL, yBotL, yTopR, yBotR, r = 23.3) {
                const x1 = x0 + width;
                const dyTop = yTopR - yTopL;
                const lenTop = Math.hypot(width, dyTop);
                const uxTop = width / lenTop, uyTop = dyTop / lenTop;

                const dyBot = yBotL - yBotR;
                const lenBot = Math.hypot(-width, dyBot);
                const uxBot = -width / lenBot, uyBot = dyBot / lenBot;

                const k = 0.55228475 * r;

                const tlSx = x0, tlSy = yTopL + r;
                const tlC1x = x0, tlC1y = yTopL + r - k;
                const tlC2x = x0 + uxTop * (r - k), tlC2y = yTopL + uyTop * (r - k);
                const tlEx = x0 + uxTop * r, tlEy = yTopL + uyTop * r;

                const trSx = x1 - uxTop * r, trSy = yTopR - uyTop * r;
                const trC1x = x1 - uxTop * (r - k), trC1y = yTopR - uyTop * (r - k);
                const trC2x = x1, trC2y = yTopR + r - k;
                const trEx = x1, trEy = yTopR + r;

                const brSx = x1, brSy = yBotR - r;
                const brC1x = x1, brC1y = yBotR - r + k;
                const brC2x = x1 + uxBot * (r - k), brC2y = yBotR + uyBot * (r - k);
                const brEx = x1 + uxBot * r, brEy = yBotR + uyBot * r;

                const blSx = x0 - uxBot * r, blSy = yBotL - uyBot * r;
                const blC1x = x0 - uxBot * (r - k), blC1y = yBotL - uyBot * (r - k);
                const blC2x = x0, blC2y = yBotL - r + k;
                const blEx = x0, blEy = yBotL - r;

                return `M ${tlSx.toFixed(2)},${tlSy.toFixed(2)} ` +
                       `C ${tlC1x.toFixed(2)},${tlC1y.toFixed(2)} ${tlC2x.toFixed(2)},${tlC2y.toFixed(2)} ${tlEx.toFixed(2)},${tlEy.toFixed(2)} ` +
                       `L ${trSx.toFixed(2)},${trSy.toFixed(2)} ` +
                       `C ${trC1x.toFixed(2)},${trC1y.toFixed(2)} ${trC2x.toFixed(2)},${trC2y.toFixed(2)} ${trEx.toFixed(2)},${trEy.toFixed(2)} ` +
                       `L ${brSx.toFixed(2)},${brSy.toFixed(2)} ` +
                       `C ${brC1x.toFixed(2)},${brC1y.toFixed(2)} ${brC2x.toFixed(2)},${brC2y.toFixed(2)} ${brEx.toFixed(2)},${brEy.toFixed(2)} ` +
                       `L ${blSx.toFixed(2)},${blSy.toFixed(2)} ` +
                       `C ${blC1x.toFixed(2)},${blC1y.toFixed(2)} ${blC2x.toFixed(2)},${blC2y.toFixed(2)} ${blEx.toFixed(2)},${blEy.toFixed(2)} Z`;
            }

            // 建立單扇門的 3D 立體厚度開闔動畫控制器
            function create3dThickDoorAnimator(cfg) {
                const state = { p: 0, rafId: null, fromP: 0, toP: 0, startTime: 0, duration: 300 };

                function renderAt(p) {
                    const frontW = 330 - 52 * p;              // 正面寬度 330 -> 278
                    const thickW = frontW + 15.5 * p;         // 加上 15.5px 立體門板側邊厚度
                    const flareFront = 7.5 * p;               // 外開微透視上下斜角
                    const flareBack = 4.0 * p;                // 厚度背面斜角自然向門框收斂

                    cfg.frontPath?.setAttribute(
                        'd',
                        buildPerspectiveDoorPath(cfg.x0, frontW, 101.3, 741.1, 101.3 - flareFront, 741.1 + flareFront)
                    );
                    cfg.thicknessPath?.setAttribute(
                        'd',
                        buildPerspectiveDoorPath(cfg.x0, thickW, 101.3, 741.1, 101.3 - flareBack, 741.1 + flareBack)
                    );

                    if (p <= 0.001) {
                        cfg.emblemGroup?.removeAttribute('transform');
                        cfg.knobGroup?.removeAttribute('transform');
                        cfg.knobSideRim?.removeAttribute('transform');
                    } else {
                        const embDx = -26 * p;
                        const embSx = 1 - 0.08 * p;
                        const embSy = 1 + 0.011 * p;
                        const embSkew = -1.25 * p;
                        cfg.emblemGroup?.setAttribute(
                            'transform',
                            `translate(${(cfg.emblemCx + embDx).toFixed(2)}, 265) skewY(${embSkew.toFixed(2)}) scale(${embSx.toFixed(4)}, ${embSy.toFixed(4)}) translate(${-cfg.emblemCx}, -265)`
                        );

                        const knobDx = -45.2 * p;
                        const knobSx = 1 - 0.08 * p;
                        const knobSy = 1 + 0.018 * p;
                        cfg.knobGroup?.setAttribute(
                            'transform',
                            `translate(${(cfg.knobCx + knobDx).toFixed(2)}, 452) scale(${knobSx.toFixed(4)}, ${knobSy.toFixed(4)}) translate(${-cfg.knobCx}, -452)`
                        );
                        cfg.knobSideRim?.setAttribute('transform', `translate(${(5.2 * p).toFixed(2)}, 0)`);
                    }
                }

                function animateTo(target, durationMs) {
                    if (state.rafId) cancelAnimationFrame(state.rafId);
                    state.fromP = state.p;
                    state.toP = target;
                    state.duration = durationMs;
                    state.startTime = performance.now();

                    const isOpening = target > state.fromP;
                    function tick(now) {
                        const t = Math.min(1, (now - state.startTime) / state.duration);
                        const eased = isOpening
                            ? 1 - Math.pow(1 - t, 3)
                            : (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
                        state.p = state.fromP + (state.toP - state.fromP) * eased;
                        renderAt(state.p);

                        if (t < 1) {
                            state.rafId = requestAnimationFrame(tick);
                        } else {
                            state.p = state.toP;
                            renderAt(state.p);
                            state.rafId = null;
                        }
                    }
                    state.rafId = requestAnimationFrame(tick);
                }

                return {
                    open: () => animateTo(1, 320),
                    close: () => animateTo(0, 270)
                };
            }

            const leftDoorAnimator = create3dThickDoorAnimator({
                x0: 164.7,
                emblemCx: 329.7,
                knobCx: 451.7,
                frontPath: document.getElementById('leftDoorFrontPath'),
                thicknessPath: document.getElementById('leftDoorThicknessPath'),
                emblemGroup: document.getElementById('leftDoorEmblemGroup'),
                knobGroup: document.getElementById('leftDoorKnobGroup'),
                knobSideRim: document.getElementById('leftKnobSideRim')
            });

            const rightDoorAnimator = create3dThickDoorAnimator({
                x0: 963.7,
                emblemCx: 1128.7,
                knobCx: 1250.7,
                frontPath: document.getElementById('rightDoorFrontPath'),
                thicknessPath: document.getElementById('rightDoorThicknessPath'),
                emblemGroup: document.getElementById('rightDoorEmblemGroup'),
                knobGroup: document.getElementById('rightDoorKnobGroup'),
                knobSideRim: document.getElementById('rightKnobSideRim')
            });

            const doorMessageBoardGroup = document.getElementById('doorMessageBoardGroup');
            const doorMonsterStatusGroup = document.getElementById('doorMonsterStatusGroup');
            const rightDoorPeekMonsterMover = document.getElementById('rightDoorPeekMonsterMover');
            const rightDoorPeekMonsterImg = document.getElementById('rightDoorPeekMonsterImg');
            const rightDoorPeekMonsterFallback = document.getElementById('rightDoorPeekMonsterFallback');

            let isBoardInteractive = false;
            let isRightDoorFullyClosed = true;
            let rightDoorCloseTimer = null;
            let currentPeekY = 585;

            function pickRandomMonsterUrl() {
                if (preloadedPeekMonsters.length === 0) return null;
                if (preloadedPeekMonsters.length === 1) return preloadedPeekMonsters[0].url;
                const pool = preloadedPeekMonsters.filter(m => m.url !== lastPickedMonsterUrl);
                const chosen = pool[Math.floor(Math.random() * pool.length)];
                lastPickedMonsterUrl = chosen.url;
                return chosen.url;
            }

            function openLeftDoor() {
                if (!isBoardInteractive) return;
                doorMessageBoardGroup?.classList.add('is-hovered');
                leftDoorAnimator.open();
            }

            function closeLeftDoor() {
                doorMessageBoardGroup?.classList.remove('is-hovered');
                leftDoorAnimator.close();
            }

            function openRightDoorWithMonsterPeek() {
                if (!isBoardInteractive) return;

                if (rightDoorCloseTimer) {
                    clearTimeout(rightDoorCloseTimer);
                    rightDoorCloseTimer = null;
                }

                // 門完全閉合後再次 Hover 時，隨機換一隻不重複的小怪並微調探頭高度
                if (isRightDoorFullyClosed && rightDoorPeekMonsterMover) {
                    const nextUrl = pickRandomMonsterUrl();
                    if (nextUrl && rightDoorPeekMonsterImg) {
                        rightDoorPeekMonsterImg.setAttribute('href', nextUrl);
                        rightDoorPeekMonsterImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', nextUrl);
                        rightDoorPeekMonsterImg.classList.remove('hidden');
                        rightDoorPeekMonsterFallback?.classList.add('hidden');
                    }

                    currentPeekY = Math.round(445 + Math.random() * 205);
                    rightDoorPeekMonsterMover.style.transition = 'none';
                    rightDoorPeekMonsterMover.setAttribute('transform', `translate(1125, ${currentPeekY}) rotate(0)`);
                    rightDoorPeekMonsterMover.style.transform = `translate(1125px, ${currentPeekY}px) rotate(0deg)`;
                    void rightDoorPeekMonsterMover.getBoundingClientRect();
                }

                isRightDoorFullyClosed = false;
                doorMonsterStatusGroup?.classList.add('is-hovered');
                rightDoorAnimator.open();

                // 240x240 小怪歪頭探出門縫並延伸至右側 #FFF9EC 米色背景之上
                if (rightDoorPeekMonsterMover) {
                    rightDoorPeekMonsterMover.style.transition = 'transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s';
                    rightDoorPeekMonsterMover.style.transform = `translate(1198px, ${currentPeekY}px) rotate(28deg)`;
                }
            }

            function closeRightDoorAndRetractMonster() {
                doorMonsterStatusGroup?.classList.remove('is-hovered');
                rightDoorAnimator.close();

                if (rightDoorPeekMonsterMover) {
                    rightDoorPeekMonsterMover.style.transition = 'transform 0.24s cubic-bezier(0.4, 0, 0.2, 1) 0s';

                if (rightDoorCloseTimer) clearTimeout(rightDoorCloseTimer);

            doorMessageBoardGroup?.addEventListener('mouseenter', openLeftDoor);
            doorMessageBoardGroup?.addEventListener('mouseleave', closeLeftDoor);

            doorMonsterStatusGroup?.addEventListener('mouseenter', openRightDoorWithMonsterPeek);
            doorMonsterStatusGroup?.addEventListener('mouseleave', closeRightDoorAndRetractMonster);

            // ===============================================================
            // 5. 粉紅小鳥待機打電動 ＋ 點擊掉遊戲機、生氣關門與緩緩開門復原
            // ===============================================================
            const pinkBirdCharacterGroup = document.getElementById('pinkBirdCharacterGroup');
            const birdConsoleMotionGroup = document.getElementById('birdConsoleMotionGroup');
            const middleDoorSlamShakeGroup = document.getElementById('middleDoorSlamShakeGroup');
            const middleDoorFrontPath = document.getElementById('middleDoorFrontPath');
            const middleDoorThicknessPath = document.getElementById('middleDoorThicknessPath');
            const middleDoorSideHandle = document.getElementById('middleDoorSideHandle');
            const middleDoorFrontEmblem = document.getElementById('middleDoorFrontEmblem');
            const middleDoorFrontKnob = document.getElementById('middleDoorFrontKnob');
            const middleDoorFrontHinges = document.getElementById('middleDoorFrontHinges');

            let isBirdSequencePlaying = false;

            // 渲染中門在任意開闔進度 c (0 = 完全敞開, 1 = 完全關上) 的 3D 幾何狀態
            function renderMiddleDoorProgress(c) {
                if (c <= 0.001) {
                    const openD = 'M595.2,741.1h-23c-4.4,0-8-3.6-8-8V109.3c0-4.4,3.6-8,8-8h23c4.4,0,8,3.6,8,8v623.8C603.2,737.5,599.6,741.1,595.2,741.1z';
                    middleDoorFrontPath?.setAttribute('d', openD);
                    middleDoorThicknessPath?.setAttribute('d', openD);
                    middleDoorSideHandle?.setAttribute('opacity', '1');
                    middleDoorSideHandle?.removeAttribute('transform');
                    middleDoorFrontEmblem?.setAttribute('opacity', '0');
                    middleDoorFrontKnob?.setAttribute('opacity', '0');
                    middleDoorFrontHinges?.setAttribute('opacity', '0');
                    return;
                }

                const x0 = 564.2;
                const phi = (1 - c) * (Math.PI / 2);
                const cosP = Math.cos(phi);
                const sinArc = Math.sin(Math.PI * c);

                const frontW = 39.0 + (349.0 - 39.0) * cosP;
                const thickW = frontW + 18.0 * sinArc;
                const rCorner = 8.0 + (23.3 - 8.0) * cosP;
                const flareFront = 14.0 * sinArc;
                const flareBack = 7.5 * sinArc;

                middleDoorFrontPath?.setAttribute(
                    'd',
                    buildPerspectiveDoorPath(x0, frontW, 101.3, 741.1, 101.3 - flareFront, 741.1 + flareFront, rCorner)
                );
                middleDoorThicknessPath?.setAttribute(
                    'd',
                    buildPerspectiveDoorPath(x0, thickW, 101.3, 741.1, 101.3 - flareBack, 741.1 + flareBack, rCorner)
                );

                // 側面門把隨轉動收合，正面圓章與門把隨轉動展開
                const sideHandleVis = Math.max(0, 1 - c * 4.2);
                middleDoorSideHandle?.setAttribute('opacity', sideHandleVis.toFixed(3));
                middleDoorSideHandle?.setAttribute('transform', `translate(${(c * 14).toFixed(2)}, 0)`);

                const frontVis = Math.min(1, Math.max(0, (cosP - 0.16) / 0.2));
                const spanRatio = frontW / 349.0;
                const scaleX = Math.max(0.05, cosP);

                const embX = x0 + (738.7 - x0) * spanRatio;
                middleDoorFrontEmblem?.setAttribute('opacity', frontVis.toFixed(3));
                middleDoorFrontEmblem?.setAttribute(
                    'transform',
                    `translate(${embX.toFixed(2)}, 236.8) scale(${scaleX.toFixed(4)}, 1) translate(-738.7, -236.8)`
                );

                const knobX = x0 + (870.2 - x0) * spanRatio;
                middleDoorFrontKnob?.setAttribute('opacity', frontVis.toFixed(3));
                middleDoorFrontKnob?.setAttribute(
                    'transform',
                    `translate(${knobX.toFixed(2)}, 452) scale(${scaleX.toFixed(4)}, 1) translate(-870.2, -452)`
                );

                const hingeVis = Math.min(1, Math.max(0, (c - 0.25) / 0.35));
                middleDoorFrontHinges?.setAttribute('opacity', hingeVis.toFixed(3));
            }

            function animateMiddleDoor(fromC, toC, durationMs, easingFn, onDone) {
                const startTime = performance.now();
                function step(now) {
                    const t = Math.min(1, (now - startTime) / durationMs);
                    const eased = easingFn(t);
                    renderMiddleDoorProgress(fromC + (toC - fromC) * eased);
                    if (t < 1) {
                        requestAnimationFrame(step);
                    } else {

            // 相容 ISO 字串、毫秒時間戳與 Firestore Timestamp 物件
            function toEpochMs(val) {
                if (!val) return 0;
                if (typeof val === 'number') return val;
                if (typeof val.toMillis === 'function') return val.toMillis();
                if (typeof val.toDate === 'function') return val.toDate().getTime();
                if (typeof val === 'object' && typeof val.seconds === 'number') return val.seconds * 1000;
                const parsed = Date.parse(String(val));

            function calcDistMeters(lat1, lon1, lat2, lon2) {
                if (lat1 === null || lon1 === null || !Number.isFinite(lat2) || !Number.isFinite(lon2)) return Infinity;
                const R = 6371000, toRad = Math.PI / 180;
                const dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
            }
