                    let lat = latIdx >= 0 ? parseFloat(cols[latIdx]) : NaN;
                    let lng = lngIdx >= 0 ? parseFloat(cols[lngIdx]) : NaN;
                    if (Number.isFinite(lat) && Number.isFinite(lng) && lat > 90 && lng >= 10 && lng <= 40) {
                        const tmp = lat; lat = lng; lng = tmp;
                    }
                    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
                    records.push({
                        idx: i,
                        key: `${number}_${i}`,
                        number,
                        name,
                        address,
                        county,
                        areacode,
                        lat,
                        lng,
                        type2: type2Idx >= 0 ? (cols[type2Idx] || '') : '',
                        type: typeIdx >= 0 ? (cols[typeIdx] || '公廁') : '公廁',
                        distance: Infinity
                    });
                }
                return records;
            }

            // 確保所有在 evaluations 有評鑑／留言紀錄的公廁都存在於清單中（即使不在 CSV 也能顯示）
            function syncEvaluatedToiletsIntoDataset() {
                if (mbState.allToilets.length === 0) return;
                const existingNames = new Set(mbState.allToilets.map(t => String(t.name || '').trim()));
                let addedAny = false;

                mbState.reviewsByToiletName.forEach((revs, tName) => {
                    if (!tName || existingNames.has(tName)) return;
                    const sample = revs[revs.length - 1] || {};
                    const lat = Number(sample.lat);
                    const lng = Number(sample.lng);
                    const address = String(sample.address || '');
                    const county = resolveBoardCounty(sample.county || '', address);
                    const town = extractBoardTown(address, county, '');
                    const newIdx = mbState.allToilets.length + 1;

                    mbState.allToilets.push({
                        idx: newIdx,
                        key: `EVAL_${newIdx}_${tName}`,
                        number: `E-${newIdx}`,
                        name: tName,
                        address,
                        county,
                        town,
                        lat: Number.isFinite(lat) ? lat : NaN,
                        lng: Number.isFinite(lng) ? lng : NaN,
                        normalizedType: normalizeBoardToiletType(sample.type || '', '', tName),
                        type: sample.type || '公廁',
                        distance: Infinity
                    });
                    existingNames.add(tName);
                    if (county) {
                        if (!mbState.countyToTowns.has(county)) mbState.countyToTowns.set(county, new Set());
                        if (town) mbState.countyToTowns.get(county).add(town);
                    }
                    addedAny = true;
                });

                if (addedAny) {
                    populateBoardPopupFilters();
                }
            }

            async function ensureBoardToiletsDataset() {
                let records = await loadToiletsFromMapIDB();
                if (!Array.isArray(records) || records.length === 0) {
                    if (!isPreviewSandbox) {
                        const candidates = ['./全國公廁建檔資料.csv', '全國公廁建檔資料.csv', encodeURI('./全國公廁建檔資料.csv'), './toilets.csv'];
                        for (const url of candidates) {
                            try {
                                const res = await fetch(url);
                                if (!res.ok) continue;
                                const buf = await res.arrayBuffer();
                                let decoded = '';
                                try { decoded = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
                                catch (e) { decoded = new TextDecoder('big5').decode(buf); }
                                const parsed = parseBoardCsvText(decoded);
                                if (parsed.length > 0) {
                                    records = parsed;
                                    break;
                                }
                            } catch (e) {}
                        }
                    }
                }
                if (!Array.isArray(records) || records.length === 0) {
                    records = BOARD_SANDBOX_TOILETS.map(item => ({ ...item }));
                }

                mbState.countyToTowns.clear();
                records.forEach((t, i) => {
                    if (!t.idx) t.idx = i + 1;
                    if (!t.key) t.key = `${t.number || 'T'}_${t.idx}`;
                    t.name = String(t.name || '').trim();
                    t.county = resolveBoardCounty(t.county, t.address);
                    t.normalizedType = normalizeBoardToiletType(t.type, t.type2, t.name);
                    if (!t.town) t.town = extractBoardTown(t.address, t.county, t.areacode || '');
                    if (t.county) {
                        if (!mbState.countyToTowns.has(t.county)) mbState.countyToTowns.set(t.county, new Set());
                        if (t.town) mbState.countyToTowns.get(t.county).add(t.town);
                    }
                });

                mbState.allToilets = records;
                syncEvaluatedToiletsIntoDataset();
                populateBoardPopupFilters();
                recomputeDistancesAndPickNearestIfNeeded();
            }

            // 讀取剛在回報系統評鑑過的公廁名稱與目前座標
            function readCachedLocatedToiletInfo() {
                try {
                    const cachedLoc = JSON.parse(sessionStorage.getItem('poogle_located_toilet') || localStorage.getItem('poogle_located_toilet') || 'null');
                    if (cachedLoc) {
                        if (cachedLoc.name) {
                            mbState.lastLocatedToiletName = String(cachedLoc.name).trim();
                        }
                        if (mbState.userLat === null) {
                            if (Number.isFinite(Number(cachedLoc.userLat)) && Number.isFinite(Number(cachedLoc.userLng))) {
                                mbState.userLat = Number(cachedLoc.userLat);
                                mbState.userLng = Number(cachedLoc.userLng);
                            } else if (Number.isFinite(Number(cachedLoc.lat)) && Number.isFinite(Number(cachedLoc.lng))) {
                                mbState.userLat = Number(cachedLoc.lat);
                                mbState.userLng = Number(cachedLoc.lng);
                            }
                        }
                    }
                } catch (e) {}
            }

            function initBoardUserLocation() {
                readCachedLocatedToiletInfo();

                if (!navigator.geolocation) {
                    if (mbState.userLat === null && isPreviewSandbox) {
                        mbState.userLat = 24.9852;
                        mbState.userLng = 121.3418;
                    }
                    recomputeDistancesAndPickNearestIfNeeded();
                    return;
                }

                const onPos = (pos) => {
                    mbState.userLat = pos.coords.latitude;
                    mbState.userLng = pos.coords.longitude;
                    recomputeDistancesAndPickNearestIfNeeded();
                };

                navigator.geolocation.getCurrentPosition(
                    onPos,
                    () => {
                        navigator.geolocation.getCurrentPosition(
                            onPos,
                            () => recomputeDistancesAndPickNearestIfNeeded(),
                            { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
                        );
                    },
                    { enableHighAccuracy: true, timeout: 4500, maximumAge: 30000 }
                );
            }

            // 智慧決定預設最近公廁：同座標／35m 內多間公廁時，優先挑剛評鑑過或有最新留言的那一間
            function recomputeDistancesAndPickNearestIfNeeded() {
                if (mbState.allToilets.length === 0) return;
                readCachedLocatedToiletInfo();

                let minD = Infinity;
                for (let i = 0; i < mbState.allToilets.length; i++) {
                    const t = mbState.allToilets[i];
                    t.distance = (mbState.userLat !== null && mbState.userLng !== null)
                        ? calcDistMeters(mbState.userLat, mbState.userLng, t.lat, t.lng)
                        : Infinity;
                    if (t.distance < minD) {
                        minD = t.distance;
                    }
                }

                if (!mbState.userManuallyPicked) {
                    let chosenDefault = null;

                    if (Number.isFinite(minD)) {
                        // 找出同地點（與最近距離相差 35m 以內）的所有公廁（例如同公園的男廁、女廁、無障礙）
                        const nearbyTieGroup = mbState.allToilets.filter(t => Number.isFinite(t.distance) && (t.distance - minD) <= 35);

                        // 1. 若剛在回報系統定位評鑑過其中一間，優先顯示該間
                        if (mbState.lastLocatedToiletName) {
                            chosenDefault = nearbyTieGroup.find(t => t.name === mbState.lastLocatedToiletName) || null;
                        }

                        // 2. 否則在同地點公廁中，優先顯示有最新文字留言或評鑑的一間
                        if (!chosenDefault) {
                            let bestScore = -1;
                            nearbyTieGroup.forEach((t) => {
                                const st = getBoardToiletStats(t.name);
                                if (st && st.count > 0) {
                                    const weight = (st.commentCount > 0 ? 1e13 : 0) + (st.latestTimeMs || 1);
                                    if (weight > bestScore) {
                                        bestScore = weight;
                                        chosenDefault = t;
                                    }
                                }
                            });
                        }

                        // 3. 若同地點都還沒有留言，選距離最近的第一間
                        if (!chosenDefault) {
                            chosenDefault = nearbyTieGroup.sort((a, b) => a.distance - b.distance)[0] || mbState.allToilets[0];
                        }
                    } else {
                        // 未開啟定位權限時：優先顯示剛定位評鑑過的公廁，或全站最新有留言的公廁
                        if (mbState.lastLocatedToiletName) {
                            chosenDefault = mbState.allToilets.find(t => t.name === mbState.lastLocatedToiletName) || null;
                        }
                        if (!chosenDefault) {
                            let latestMs = -1;
                            mbState.allToilets.forEach((t) => {
                                const st = getBoardToiletStats(t.name);
                                if (st && st.commentCount > 0 && st.latestTimeMs > latestMs) {
                                    latestMs = st.latestTimeMs;
                                    chosenDefault = t;
                                }
                            });
                        }
                        if (!chosenDefault) chosenDefault = mbState.allToilets[0];
                    }

                    if (chosenDefault) {
                        const prevKey = mbState.selectedToilet?.key;
                        mbState.selectedToilet = chosenDefault;
                        if (mbState.isOpen && prevKey !== chosenDefault.key) {
                            renderCurrentToiletHeaderAndStars();
                            resetAndPlayChatCommentsForSelectedToilet();
                        }
                    }
                }

                if (mbState.dropdownOpen) {
                    renderBoardToiletDropdownItems();
                }
            }

            // 完整保留雲端每一筆評鑑文件並合併本機最新留言（避免欄位覆蓋或同 evalId 互相吃掉）
            // 與 map.html / admin.html 完全同步：雲端載入後以雲端為準，自動剔除並清理已被管理員刪除的本機舊快取
            function rebuildBoardReviewIndex() {
                const mergedById = new Map();
                const cloudIds = new Set();

                mbState.cloudEvaluations.forEach((ev, idx) => {
                    if (!ev) return;
                    const docKey = ev._docId || ev.id || ev.evalId || `cloud_${idx}`;
                    mergedById.set(docKey, ev);
                    if (ev._docId) cloudIds.add(String(ev._docId));
                    if (ev.id) cloudIds.add(String(ev.id));
                    if (ev.evalId) cloudIds.add(String(ev.evalId));
                });

                try {
                    const rawLocal = localStorage.getItem('poogle_local_evaluations_v2');
                    const localList = rawLocal ? JSON.parse(rawLocal) : [];
                    if (Array.isArray(localList)) {
                        const validLocalToKeep = [];
                        let needCleanStorage = false;

                        localList.forEach((item, idx) => {
                            if (!item) return;
                            const id = String(item.evalId || item.id || '');

                            if (mbState.hasLoadedCloudOnce) {
                                // 雲端已連線：若此筆曾同步過 (cloudSynced !== false) 卻已不在雲端，代表已被管理員刪除，直接剔除並清理快取
                                if (item.cloudSynced !== false) {
                                    if (id && cloudIds.has(id)) {
                                        validLocalToKeep.push(item);
                                    } else {
                                        needCleanStorage = true;
                                    }
                                    return;
                                }
                            }

                            // 僅在「尚未連上雲端前」或「離線尚未上傳 (cloudSynced === false)」時納入，與 map.html 邏輯完全一致
                            validLocalToKeep.push(item);
                            if (id && !cloudIds.has(id)) {
                                const uniqueLocalKey = `local_${idx}_${id}`;
                                mergedById.set(uniqueLocalKey, { ...item, _docId: uniqueLocalKey });
                            }
                        });

                        if (needCleanStorage) {
                            localStorage.setItem('poogle_local_evaluations_v2', JSON.stringify(validLocalToKeep));
                        }
                    }
                } catch (e) {}

                mbState.reviewsByToiletName.clear();
                mergedById.forEach((rev) => {
                    const tName = String(rev.name || rev.toiletName || '').trim();
                    if (!tName) return;
                    if (!mbState.reviewsByToiletName.has(tName)) {
                        mbState.reviewsByToiletName.set(tName, []);
                    }
                    mbState.reviewsByToiletName.get(tName).push(rev);
                });

                // 依時間由舊到新排序
                mbState.reviewsByToiletName.forEach((arr) => {
                    arr.sort((a, b) => getRecordTimeMs(a) - getRecordTimeMs(b));
                });

                // 移除先前動態補入、但評鑑已被管理員全數刪除的臨時公廁項目
                if (mbState.hasLoadedCloudOnce && mbState.allToilets.length > 0) {
                    mbState.allToilets = mbState.allToilets.filter(t => {
                        if (String(t.key || '').startsWith('EVAL_')) {
                            return mbState.reviewsByToiletName.has(t.name);
                        }
                        return true;
                    });
                }

                syncEvaluatedToiletsIntoDataset();
            }

            function formatChatTimeHHMM(rawTime) {
                const ms = toEpochMs(rawTime);
                if (!ms) return '';
                const d = new Date(ms);
                if (Number.isNaN(d.getTime())) return '';
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
            }

            function getBoardToiletStats(toiletName) {
                const cleanName = String(toiletName || '').trim();
                if (!cleanName) return null;
                const list = mbState.reviewsByToiletName.get(cleanName);
                if (!list || list.length === 0) return null;

                let sumClean = 0, sumLight = 0, sumEquip = 0, sumSpace = 0, sumOverall = 0;
                let latestTimeMs = 0;
                const textComments = [];

                list.forEach((r, idx) => {
                    const rt = r.ratings || {};
                    const fb = Number(r.stars ?? 3);
                    const cl = Number(rt.cleanliness ?? fb);
                    const li = Number(rt.lighting ?? fb);
                    const eq = Number(rt.equipment ?? rt.smell ?? fb);
                    const sp = Number(rt.space ?? fb);
                    const ov = Number.isFinite(Number(r.stars)) ? Number(r.stars) : ((cl + li + eq + sp) / 4);

                    sumClean += cl;
                    sumLight += li;
                    sumEquip += eq;
                    sumSpace += sp;
                    sumOverall += ov;

                    const tMs = getRecordTimeMs(r);
                    if (tMs > latestTimeMs) latestTimeMs = tMs;

                    const msg = String(r.comment ?? r.commentText ?? r.content ?? '').trim();
                    if (msg.length > 0) {
                        const uniqueDocKey = r._docId || r.id || r.evalId || `${cleanName}_${idx}`;
                        textComments.push({
                            id: `${uniqueDocKey}__${msg}`,
                            text: msg,
                            timestamp: formatChatTimeHHMM(r.updatedAt || r.createdAt || r.timestamp)
                        });
                    }
                });

                const count = list.length;
                return {
                    count,
                    commentCount: textComments.length,
                    latestTimeMs,
                    avgOverall: sumOverall / count,
                    avgCleanliness: (sumClean / count).toFixed(1),
                    avgLighting: (sumLight / count).toFixed(1),
                    avgEquipment: (sumEquip / count).toFixed(1),
                    avgSpace: (sumSpace / count).toFixed(1),
                    textComments
                };
            }

            // 比對目前畫面氣泡與最新資料：若有留言被管理員刪除或修改，立即重繪清空；若是新增留言則由下方推入
            function syncChatStreamWithCurrentStats() {
                if (!mbState.isOpen || !mbState.selectedToilet) return;
                const tName = mbState.selectedToilet.name || '';
                const stats = getBoardToiletStats(tName);
                const latestComments = stats?.textComments || [];
                const latestIdSet = new Set(latestComments.map(c => c.id));

                const hasRemovedOrEdited =
                    mbState.activeChatNodes.some(node => !latestIdSet.has(node.id)) ||
                    Array.from(mbState.renderedCommentIds).some(id => !latestIdSet.has(id));

                if (hasRemovedOrEdited || (latestComments.length === 0 && mbState.activeChatNodes.length > 0)) {
                    resetAndPlayChatCommentsForSelectedToilet();
                } else {
                    appendIncomingRealtimeComments();
                }
            }

            function attachFirestoreEvaluationsListener() {
                if (!boardDb) return;
                if (mbState.unsubscribeEvaluations) {
                    try { mbState.unsubscribeEvaluations(); } catch (e) {}
                    mbState.unsubscribeEvaluations = null;
                }

                try {
                    mbState.unsubscribeEvaluations = boardDb.collection('evaluations').onSnapshot(
                        (snap) => {
                            const wasLoadedBefore = mbState.hasLoadedCloudOnce;
                            const cloudList = [];
                            snap.forEach((doc) => {
                                const d = doc.data() || {};
                                cloudList.push({
                                    ...d,
                                    _docId: doc.id,
                                    id: doc.id,
                                    evalId: d.evalId || doc.id
                                });
                            });
                            mbState.cloudEvaluations = cloudList;
                            mbState.hasLoadedCloudOnce = true;

                            const prevSelectedKey = mbState.selectedToilet?.key;
                            rebuildBoardReviewIndex();
                            recomputeDistancesAndPickNearestIfNeeded();

                            if (mbState.isOpen && mbState.selectedToilet) {
                                renderCurrentToiletHeaderAndStars();
                                if (!wasLoadedBefore || prevSelectedKey !== mbState.selectedToilet.key) {
                                    resetAndPlayChatCommentsForSelectedToilet();
                                } else {
                                    syncChatStreamWithCurrentStats();
                                }
                            }
                            if (mbState.dropdownOpen) {
                                renderBoardToiletDropdownItems();
                            }
                        },
                        () => {
                            boardDb.collection('evaluations').get().then((snap) => {
                                const cloudList = [];
                                snap.forEach((doc) => {
                                    const d = doc.data() || {};
                                    cloudList.push({
                                        ...d,
                                        _docId: doc.id,
                                        id: doc.id,
                                        evalId: d.evalId || doc.id
                                    });
                                });
                                mbState.cloudEvaluations = cloudList;
                                mbState.hasLoadedCloudOnce = true;
                                rebuildBoardReviewIndex();
                                recomputeDistancesAndPickNearestIfNeeded();
                                if (mbState.isOpen && mbState.selectedToilet) {
                                    renderCurrentToiletHeaderAndStars();
                                    resetAndPlayChatCommentsForSelectedToilet();
                                }
                            }).catch(() => {});
                        }
                    );
                } catch (e) {}
            }

            function startBoardRealtimeReviews() {
                rebuildBoardReviewIndex();
                attachFirestoreEvaluationsListener();

                if (boardAuth && typeof boardAuth.onAuthStateChanged === 'function') {
                    boardAuth.onAuthStateChanged(() => {
                        attachFirestoreEvaluationsListener();
                    });
                }

                const refreshLocalAndRender = () => {
                    rebuildBoardReviewIndex();
                    recomputeDistancesAndPickNearestIfNeeded();
                    if (mbState.isOpen && mbState.selectedToilet) {
                        renderCurrentToiletHeaderAndStars();
                        syncChatStreamWithCurrentStats();
                    }
                    if (mbState.dropdownOpen) {
                        renderBoardToiletDropdownItems();
                    }
                };
                window.addEventListener('storage', refreshLocalAndRender);
                window.addEventListener('pageshow', refreshLocalAndRender);
                window.addEventListener('focus', refreshLocalAndRender);
            }

            // ===============================================================
            // 聊天室氣泡一體成形繪製 ＋ 左右時間對齊 ＋ 多則留言往上覆蓋淡出
            // ===============================================================
            const mbChatStreamStage = document.getElementById('mbChatStreamStage');

            function clearChatStaggerTimers() {
                mbState.staggerTimers.forEach(id => clearTimeout(id));
                mbState.staggerTimers = [];
            }

            // 單一閉合 SVG <path> 一體成形繪製「膠囊＋底部三角形尾巴」，接縫處零雜線
            function updateChatCapsuleSvgPath(capsuleEl, side) {
                if (!capsuleEl) return;
                const pathEl = capsuleEl.querySelector('.board-bubble-unified-path');
                if (!pathEl) return;

                const W = Math.max(120, capsuleEl.offsetWidth || 420);
                const H = Math.max(44, capsuleEl.offsetHeight || 64);
                const R = Math.min(33, H / 2);
                const tailW = 20;
                const tailH = 17;

                let bottomSegment = '';
                if (side === 'left') {
                    const tLeft = Math.max(R + 8, 42);
                    bottomSegment = `L ${(tLeft + tailW).toFixed(2)},${H.toFixed(2)} L ${tLeft.toFixed(2)},${(H + tailH).toFixed(2)} L ${tLeft.toFixed(2)},${H.toFixed(2)} L ${R.toFixed(2)},${H.toFixed(2)}`;
                } else {
                    const tRight = W - Math.max(R + 8, 42);
                    const tLeftOfTail = Math.max(R + 4, tRight - tailW);
                    bottomSegment = `L ${tRight.toFixed(2)},${H.toFixed(2)} L ${tRight.toFixed(2)},${(H + tailH).toFixed(2)} L ${tLeftOfTail.toFixed(2)},${H.toFixed(2)} L ${R.toFixed(2)},${H.toFixed(2)}`;
                }

                const d = `M ${R.toFixed(2)},0 ` +
                          `L ${(W - R).toFixed(2)},0 ` +
                          `A ${R.toFixed(2)},${R.toFixed(2)} 0 0,1 ${W.toFixed(2)},${R.toFixed(2)} ` +
                          `L ${W.toFixed(2)},${(H - R).toFixed(2)} ` +
                          `A ${R.toFixed(2)},${R.toFixed(2)} 0 0,1 ${(W - R).toFixed(2)},${H.toFixed(2)} ` +
                          `${bottomSegment} ` +
                          `A ${R.toFixed(2)},${R.toFixed(2)} 0 0,1 0,${(H - R).toFixed(2)} ` +
                          `L 0,${R.toFixed(2)} ` +
                          `A ${R.toFixed(2)},${R.toFixed(2)} 0 0,1 ${R.toFixed(2)},0 Z`;

                pathEl.setAttribute('d', d);
            }

            const chatCapsuleResizeObserver = (typeof ResizeObserver !== 'undefined')
                ? new ResizeObserver((entries) => {
                    entries.forEach((entry) => {
                        const el = entry.target;
                        const side = el.getAttribute('data-bubble-side') || 'left';
                        updateChatCapsuleSvgPath(el, side);
                    });
                })
                : null;

            function buildChatBubbleElement(commentObj, side) {
                const row = document.createElement('div');
                // 直接寫入絕對定位與左右錨點 class，確保多則留言固定由底部往上推移、絕不跑位或被頂部裁切
                const posClasses = (side === 'left')
                    ? 'left-3 sm:left-[6%] lg:left-[10.5%] justify-start'
                    : 'right-3 sm:right-[6%] lg:right-[10.5%] justify-end';

                row.className = `board-chat-row absolute bottom-[30px] sm:bottom-[44px] flex items-end ${posClasses}`;
                row.style.transition = 'transform 0.76s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.76s ease';
                row.style.willChange = 'transform, opacity';
                row.dataset.commentId = commentObj.id;

                const safeText = escapeHtmlBoard(commentObj.text);
                const safeTime = escapeHtmlBoard(commentObj.timestamp || '');

                const capsuleHtml = `
                    <div data-bubble-side="${side}"
                         class="board-chat-capsule relative min-h-[54px] sm:min-h-[64px] w-[240px] sm:w-[410px] lg:w-[468px] px-6 sm:px-9 py-3 sm:py-3.5 flex items-center justify-center text-center shrink-0">
                        <svg class="absolute inset-0 w-full h-full overflow-visible pointer-events-none" aria-hidden="true">
                            <path class="board-bubble-unified-path"
                                  fill="#FFFFFF" stroke="#273491" stroke-width="2"
                                  stroke-linejoin="round" stroke-linecap="round" />
                        </svg>
                        <span class="relative z-10 text-[#273491] text-[13.5px] sm:text-[17.5px] font-extrabold tracking-[0.12em] leading-relaxed break-words">
                            ${safeText}
                        </span>
                    </div>
                `;

                    : '';

                row.innerHTML = (side === 'left')

            function layoutActiveChatBubbles() {
                const stageH = mbChatStreamStage?.clientHeight || 440;
                // 依目前聊天區實際高度動態計算最大上升範圍，確保多則留言全部留在可見畫面內往上堆疊淡出
                const maxTravel = Math.max(175, Math.min(340, stageH - 115));

                const stepRatios = [0.00, 0.25, 0.48, 0.70, 0.86, 0.98, 1.08];
                const opacities  = [1.00, 0.96, 0.74, 0.46, 0.24, 0.10, 0.00];
                const scales     = [1.00, 0.995, 0.985, 0.97, 0.95, 0.93, 0.91];

                const total = mbState.activeChatNodes.length;
                mbState.activeChatNodes.forEach((entry, idx) => {
                    const age = (total - 1) - idx;
                    const stepIdx = Math.min(age, stepRatios.length - 1);
                    const dy = -stepRatios[stepIdx] * maxTravel;
                    const op = opacities[stepIdx];
                    const sc = scales[stepIdx];

                    entry.el.style.zIndex = String(Math.max(1, 70 - age * 10));
                    entry.el.style.opacity = String(op);
                    entry.el.style.transform = `translate3d(0, ${dy.toFixed(1)}px, 0) scale(${sc})`;
                    if (age >= 6) entry.el.style.pointerEvents = 'none';
                });

                while (mbState.activeChatNodes.length > 8) {
                    const oldest = mbState.activeChatNodes.shift();
                    if (oldest && oldest.el) {
                        const cap = oldest.el.querySelector('.board-chat-capsule');
                        if (cap && chatCapsuleResizeObserver) chatCapsuleResizeObserver.unobserve(cap);
                        setTimeout(() => oldest.el.remove(), 800);
                    }
                }
            }

            function pushSingleCommentIntoChat(commentObj, animateEntrance = true, explicitSide = null) {
                if (!mbChatStreamStage || !commentObj) return;
                if (mbState.renderedCommentIds.has(commentObj.id)) return;
                mbState.renderedCommentIds.add(commentObj.id);

                mbChatStreamStage.querySelector('.mb-empty-chat-hint')?.remove();

                // 若為場上第 1 個對話框，強制一律出現在左邊
                let side = explicitSide;
                if (!side) {
                    side = (mbState.activeChatNodes.length === 0) ? 'left' : mbState.nextChatSide;
                }
                mbState.nextChatSide = (side === 'left') ? 'right' : 'left';

                const el = buildChatBubbleElement(commentObj, side);
                if (animateEntrance) {
                    el.style.transition = 'none';
                    el.style.opacity = '0';
                    el.style.transform = 'translate3d(0, 34px, 0) scale(0.94)';
                }

                mbChatStreamStage.appendChild(el);

                const capsuleEl = el.querySelector('.board-chat-capsule');
                if (capsuleEl) {
                    updateChatCapsuleSvgPath(capsuleEl, side);
                    if (chatCapsuleResizeObserver) chatCapsuleResizeObserver.observe(capsuleEl);
                }

                mbState.activeChatNodes.push({ id: commentObj.id, side, el });

                if (animateEntrance) {
                    void el.getBoundingClientRect();
                    el.style.transition = 'transform 0.76s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.76s ease';
                    requestAnimationFrame(() => {
                        layoutActiveChatBubbles();
                    });
                } else {
                    layoutActiveChatBubbles();
                }
            }

            function resetAndPlayChatCommentsForSelectedToilet() {
                clearChatStaggerTimers();
                mbState.renderedCommentIds.clear();
                mbState.activeChatNodes = [];
                mbState.nextChatSide = 'left';
                if (!mbChatStreamStage) return;
                mbChatStreamStage.innerHTML = '';

                const tName = mbState.selectedToilet?.name || '';
                const stats = getBoardToiletStats(tName);
                const comments = stats?.textComments || [];

                if (comments.length === 0) {
                    mbChatStreamStage.innerHTML = `
                        <div class="mb-empty-chat-hint w-full h-full flex items-center justify-center px-6 pb-10">
                            <div class="bg-white/85 border-[2px] border-[#273491]/55 rounded-full px-8 py-4 text-[#273491]/75 text-sm sm:text-base font-extrabold tracking-[0.14em] text-center">
                                目前這間公廁還沒有文字留言～
                            </div>
                        </div>
                    `;
                    return;
                }

                // 取出最近 6 則留言，預先綁定第 1 則必為 left、第 2 則為 right 依序交錯
                const recentSlice = comments.slice(-6).map((c, idx) => ({
                    ...c,
                    _fixedSide: (idx % 2 === 0) ? 'left' : 'right'
                }));

                const immediateCount = Math.max(0, recentSlice.length - 3);
                for (let i = 0; i < immediateCount; i++) {
                    pushSingleCommentIntoChat(recentSlice[i], false, recentSlice[i]._fixedSide);
                }

                const animatedOnes = recentSlice.slice(immediateCount);
                animatedOnes.forEach((cObj, idx) => {
                    const tid = setTimeout(() => {
                        pushSingleCommentIntoChat(cObj, true, cObj._fixedSide);
                    }, 100 + idx * 480);
                    mbState.staggerTimers.push(tid);
                });
            }

            function appendIncomingRealtimeComments() {
                // 若初始進場動畫尚在排隊播放中，避免中途插隊打亂順序
                if (mbState.staggerTimers.length > 0 && mbState.activeChatNodes.length === 0) return;

                const tName = mbState.selectedToilet?.name || '';
                const stats = getBoardToiletStats(tName);
                const comments = stats?.textComments || [];
                const unseen = comments.filter(c => !mbState.renderedCommentIds.has(c.id));
                unseen.forEach((cObj, idx) => {
                    const tid = setTimeout(() => {
                        pushSingleCommentIntoChat(cObj, true, null);
                    }, idx * 460);
                    mbState.staggerTimers.push(tid);

            const starFillAnimMap = new Map();
            function animateSingleStarFill(rectId, rawScore) {
                const rectEl = document.getElementById(rectId);
                if (!rectEl) return;

                const prevRaf = starFillAnimMap.get(rectId);
                if (prevRaf) cancelAnimationFrame(prevRaf);

                const Y_BOT = 44.2;
                const Y_TOP = 8.85;
                const MAX_H = Y_BOT - Y_TOP; // 35.35

                const numScore = Number(rawScore);
                const targetRatio = Number.isFinite(numScore)
                    ? Math.min(1, Math.max(0, numScore / 5))
                    : 0;

                const currentH = parseFloat(rectEl.getAttribute('height') || '0');
                const startRatio = Math.min(1, Math.max(0, currentH / MAX_H));
                const startTime = performance.now();
                const durationMs = 460;

                function step(now) {
                    const t = Math.min(1, (now - startTime) / durationMs);
                    const eased = 1 - Math.pow(1 - t, 3);
                    const curRatio = startRatio + (targetRatio - startRatio) * eased;

                    if (curRatio <= 0.002) {
                        rectEl.setAttribute('y', Y_BOT.toFixed(2));
                        rectEl.setAttribute('height', '0');
                    } else if (curRatio >= 0.998) {
                        rectEl.setAttribute('y', '6.5');
                        rectEl.setAttribute('height', '41');
                    } else {
                        const h = curRatio * MAX_H;
                        const y = Y_BOT - h;
                        rectEl.setAttribute('y', y.toFixed(2));
                        rectEl.setAttribute('height', (h + 1.8).toFixed(2));
                    }

                    if (t < 1) {
                        starFillAnimMap.set(rectId, requestAnimationFrame(step));
                    } else {
                        starFillAnimMap.delete(rectId);
                    }
                }
                starFillAnimMap.set(rectId, requestAnimationFrame(step));
            }

            function getFilteredAndSortedBoardToilets() {
                const kw = mbState.keyword.trim().toLowerCase();
                const list = [];

                for (let i = 0; i < mbState.allToilets.length; i++) {
                    const t = mbState.allToilets[i];
                    if (mbState.countyFilter && t.county !== mbState.countyFilter) continue;
                    if (mbState.townFilter && t.town !== mbState.townFilter) continue;

                    const stats = getBoardToiletStats(t.name);
                    if (mbState.typeFilter) {
                        if (mbState.typeFilter === '已有網友評鑑') {
                            if (!stats || stats.count === 0) continue;
                        } else if ((t.normalizedType || t.type) !== mbState.typeFilter) {
                            continue;
                        }
                    }

                    if (kw) {
                        const hay = `${t.name || ''} ${t.address || ''} ${t.county || ''} ${t.town || ''}`.toLowerCase();
                        if (!hay.includes(kw)) continue;
                    }
                    list.push(t);
                }

                list.sort((a, b) => {
                    if (mbState.sortBy === 'dist_desc') {
                        const da = Number.isFinite(a.distance) ? a.distance : -1;
                        const db = Number.isFinite(b.distance) ? b.distance : -1;
                        if (da !== db) return db - da;
                    } else if (mbState.sortBy === 'rating_desc') {
                        const sa = getBoardToiletStats(a.name)?.avgOverall ?? -1;
                        const sb = getBoardToiletStats(b.name)?.avgOverall ?? -1;
                        if (sa !== sb) return sb - sa;
                    } else if (mbState.sortBy === 'comments_desc') {
                        const ca = getBoardToiletStats(a.name)?.commentCount ?? 0;
                        const cb = getBoardToiletStats(b.name)?.commentCount ?? 0;
                        if (ca !== cb) return cb - ca;
                    } else {
                        const da = Number.isFinite(a.distance) ? a.distance : Infinity;
                        const db = Number.isFinite(b.distance) ? b.distance : Infinity;
                        if (Math.abs(da - db) > 5) return da - db;
                        // 距離相同（同地點多間公廁）時，有留言／有評鑑的排前面
                        const ca = getBoardToiletStats(a.name)?.commentCount ?? 0;
                        const cb = getBoardToiletStats(b.name)?.commentCount ?? 0;
                        if (ca !== cb) return cb - ca;
                    }
                    return (a.idx || 0) - (b.idx || 0);
                });

                return list;
            }

            // ===============================================================
            // 7. 小怪板：24 小時內小怪即時統計、15 人 1.5x 縮放與防碰撞散步系統
            // ===============================================================
            // 👾 小怪目錄設定區（目前顯示「狀況名稱」，之後可在此直接換成「角色名」）

                tools_tidy:          { folder: 'hardware',   name: '掃具整齊' },

                stinky:              { folder: 'urinal',     name: '臭臭的' },
                urinal_sensor_broke: { folder: 'urinal',     name: '小便斗感應不良' }
            };

            const MONSTER_24H_WINDOW_MS = 24 * 60 * 60 * 1000;
            const MONSTER_MAX_SCALE_PEOPLE = 15; // 15 人回報達到最大 1.5 倍
            const MONSTER_MAX_SCALE = 1.5;

            const monsterBoardView = document.getElementById('monsterBoardView');
            const mkStrollStage = document.getElementById('mkStrollStage');

            const mkState = {
                isOpen: false,
                walkers: [],
                rafId: null,
                lastFrameTime: 0,
                lastDataCheckMs: 0,
                lastTimeRefreshMs: 0,
                lastDataSig: '',
                lastToiletKey: '',
                obstacles: []
            };

            // 1 人 = 1.0 倍，線性放大至 15 人 = 1.5 倍（超過 15 人維持 1.5 倍上限）
            function calcMonsterScale(reportCount) {
                const n = Math.max(1, Number(reportCount) || 1);
                if (n >= MONSTER_MAX_SCALE_PEOPLE) return MONSTER_MAX_SCALE;
                return 1 + (MONSTER_MAX_SCALE - 1) * ((n - 1) / (MONSTER_MAX_SCALE_PEOPLE - 1));
            }

            function getBaseMonsterSizePx(totalCount) {
                const vw = window.innerWidth || 1440;
                const rawBase = vw < 640 ? 92 : (vw < 1024 ? 120 : 146);
                const crowdFactor = totalCount > 8 ? Math.max(0.72, Math.sqrt(8 / totalCount)) : 1;
                return Math.round(rawBase * crowdFactor);
            }

            function extractMonsterIdsFromEval(rev) {
                if (!rev) return [];
                const result = [];
                const seen = new Set();
                const pushClean = (raw) => {
                    if (!raw) return;
                    const rawStr = typeof raw === 'string' ? raw : (raw.id || raw.monsterId || raw.key || '');
                    const cleanId = String(rawStr).split('/').pop().replace(/\.(png|svg|webp|jpg)$/i, '').trim();
                    if (cleanId && BOARD_MONSTER_INFO[cleanId] && !seen.has(cleanId)) {
                        seen.add(cleanId);
                        result.push(cleanId);
                    }
                };
                if (Array.isArray(rev.monsters)) rev.monsters.forEach(pushClean);
                if (Array.isArray(rev.monsterIds)) rev.monsterIds.forEach(pushClean);
                return result;
            }

            // 彙整目前公廁在過去 24 小時內出現的所有小怪、回報人數與最近出現時間
            function getActive24hMonstersForToilet(toiletName) {
                const cleanName = String(toiletName || '').trim();
                if (!cleanName) return [];
                const list = mbState.reviewsByToiletName.get(cleanName) || [];
                const nowMs = Date.now();
                const mapById = new Map();

                list.forEach((r) => {
                    const tMs = getRecordTimeMs(r);
                    if (!tMs) return;
                    const ageMs = nowMs - tMs;
                    // 僅納入過去 24 小時內的回報（容許 5 分鐘跨裝置時鐘微差）
                    if (ageMs > MONSTER_24H_WINDOW_MS || ageMs < -300000) return;

                    const mIds = extractMonsterIdsFromEval(r);
                    mIds.forEach((mId) => {
                        const prev = mapById.get(mId);
                        if (!prev) {
                            mapById.set(mId, {
                                id: mId,
                                folder: BOARD_MONSTER_INFO[mId].folder,
                                name: BOARD_MONSTER_INFO[mId].name,
                                count: 1,
                                latestTimeMs: tMs
                            });
                        } else {
                            prev.count += 1;
                            if (tMs > prev.latestTimeMs) prev.latestTimeMs = tMs;
                        }
                    });
                });

                return Array.from(mapById.values()).sort((a, b) => b.count - a.count);
            }

            function formatMonsterRelativeTime(latestTimeMs, nowMs = Date.now()) {
                const diffMins = Math.max(1, Math.floor(Math.max(0, nowMs - latestTimeMs) / 60000));
                if (diffMins < 60) {
                    return { label: `${diffMins}分鐘前`, isRecentMinutes: true };
                }
                const diffHours = Math.min(23, Math.floor(diffMins / 60));
                return { label: `${diffHours}小時前`, isRecentMinutes: false };
            }

            function renderMonsterBoardHeaderAndStars() {
                const titleEl = document.getElementById('mkCurrentToiletTitle');
                const cleanEl = document.getElementById('mkScoreClean');
                const lightEl = document.getElementById('mkScoreLight');
                const equipEl = document.getElementById('mkScoreEquip');
                const spaceEl = document.getElementById('mkScoreSpace');

                if (!mbState.selectedToilet) {
                    if (titleEl) titleEl.textContent = '定位最近公廁中...';
                    animateSingleStarFill('mkStarFill_clean', 0);
                    animateSingleStarFill('mkStarFill_light', 0);
                    animateSingleStarFill('mkStarFill_equip', 0);
                    animateSingleStarFill('mkStarFill_space', 0);
                    return;
                }

                if (titleEl) titleEl.textContent = mbState.selectedToilet.name;
                const stats = getBoardToiletStats(mbState.selectedToilet.name);

                if (stats) {
                    if (cleanEl) cleanEl.textContent = stats.avgCleanliness;
                    if (lightEl) lightEl.textContent = stats.avgLighting;
                    if (equipEl) equipEl.textContent = stats.avgEquipment;
                    if (spaceEl) spaceEl.textContent = stats.avgSpace;

                    animateSingleStarFill('mkStarFill_clean', stats.avgCleanliness);
                    animateSingleStarFill('mkStarFill_light', stats.avgLighting);
                    animateSingleStarFill('mkStarFill_equip', stats.avgEquipment);
                    animateSingleStarFill('mkStarFill_space', stats.avgSpace);
                } else {
                    if (cleanEl) cleanEl.textContent = '--';
                    if (lightEl) lightEl.textContent = '--';
                    if (equipEl) equipEl.textContent = '--';
                    if (spaceEl) spaceEl.textContent = '--';

                    animateSingleStarFill('mkStarFill_clean', 0);
                    animateSingleStarFill('mkStarFill_light', 0);
                    animateSingleStarFill('mkStarFill_equip', 0);
                    animateSingleStarFill('mkStarFill_space', 0);
                }
            }

            // 量測上方按鈕、標題星等與 LIVE 區塊邊界，讓小怪散步時自然繞開不遮擋介面
            function updateMonsterStageObstacles() {
                if (!mkStrollStage) return;
                const stageRect = mkStrollStage.getBoundingClientRect();
                if (stageRect.width <= 0 || stageRect.height <= 0) return;

                const obs = [];
                ['mkTopLeftBtnsBox', 'mkTopCenterHeaderBox', 'mkTopRightLiveBox'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    if (r.width > 0 && r.height > 0) {
                        obs.push({
                            x0: r.left - stageRect.left - 10,
                            y0: r.top - stageRect.top - 8,
                            x1: r.right - stageRect.left + 10,
                            y1: r.bottom - stageRect.top + 12
                        });
                    }
                });
                mkState.obstacles = obs;
            }

            function getMonsterFallbackSvgUri() {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="64" r="44" fill="#FF99D3" stroke="#273491" stroke-width="4"/><ellipse cx="47" cy="58" rx="7" ry="9" fill="#FFFFFF" stroke="#273491" stroke-width="3"/><ellipse cx="73" cy="58" rx="7" ry="9" fill="#FFFFFF" stroke="#273491" stroke-width="3"/><circle cx="48" cy="59" r="4" fill="#273491"/><circle cx="72" cy="59" r="4" fill="#273491"/><path d="M 48,78 Q 60,86 72,78" fill="none" stroke="#273491" stroke-width="3.5" stroke-linecap="round"/></svg>`;
                return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
            }

            function probeAndSetMonsterImg(imgEl, folder, id) {
                const fallback = getMonsterFallbackSvgUri();
                imgEl.src = fallback;
                if (isPreviewSandbox) return;

                const candidates = [
                    `./img/${folder}/${id}.png`,
                    `./img/${folder}/${id}.PNG`,
                    `img/${folder}/${id}.png`
                ];
                let idx = 0;
                const tryNext = () => {
                    if (idx >= candidates.length) return;
                    const url = candidates[idx++];
                    const probe = new Image();
                    probe.onload = () => { imgEl.src = url; };
                    probe.onerror = tryNext;
                    probe.src = url;
                };
                tryNext();
            }

            function pickRandomStrollVelocity() {
                const angle = Math.random() * Math.PI * 2;
                const speed = 18 + Math.random() * 11; // 每秒 18~29px 悠哉散步速度
                return {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed * 0.78
                };
            }

            function findBestNonOverlappingSpot(rx, ry, existingWalkers) {
                const W = mkStrollStage?.clientWidth || 1280;
                const H = mkStrollStage?.clientHeight || 680;
                const minX = rx + 18, maxX = Math.max(minX + 10, W - rx - 18);
                const minY = ry + 14, maxY = Math.max(minY + 10, H - ry - 18);

                let bestPt = { x: W * 0.5, y: H * 0.65 };
                let bestClearance = -1e9;

                for (let attempt = 0; attempt < 85; attempt++) {
                    const tx = minX + Math.random() * (maxX - minX);
                    const ty = minY + Math.random() * (maxY - minY);

                    let hitUi = false;
                    for (let k = 0; k < mkState.obstacles.length; k++) {
                        const ob = mkState.obstacles[k];
                        if (tx > ob.x0 - rx && tx < ob.x1 + rx && ty > ob.y0 - ry && ty < ob.y1 + ry) {
                            hitUi = true;
                            break;
                        }
                    }
                    if (hitUi && attempt < 70) continue;

                    let minNormDist = 999;
                    for (let i = 0; i < existingWalkers.length; i++) {
                        const other = existingWalkers[i];
                        const nx = (tx - other.x) / (rx + other.rx + 10);
                        const ny = (ty - other.y) / (ry + other.ry + 8);
                        const d = Math.hypot(nx, ny);
                        if (d < minNormDist) minNormDist = d;
                    }

                    const score = (hitUi ? -5 : 0) + minNormDist;
                    if (score > bestClearance) {
                        bestClearance = score;
                        bestPt = { x: tx, y: ty };
                    }
                }
                return bestPt;
            }

            function createMonsterWalkerDom(mItem, imgPx) {
                const el = document.createElement('div');
                el.className = 'mk-walker-node';
                el.dataset.monsterId = mItem.id;

                const relTime = formatMonsterRelativeTime(mItem.latestTimeMs);
                const timeColorClass = relTime.isRecentMinutes ? 'text-[#F26559]' : 'text-[#273491]';

                el.innerHTML = `
                    <div class="mk-walker-inner flex flex-col items-center">
                        <div class="mb-1.5 flex flex-col items-center text-center whitespace-nowrap">
                            <span class="mk-walker-name text-[#273491] text-[16px] sm:text-[21px] font-black tracking-[0.1em] leading-snug">
                                ${escapeHtmlBoard(mItem.name)}
                            </span>
                            <span class="mk-walker-time ${timeColorClass} text-[11.5px] sm:text-[14px] font-extrabold tracking-[0.08em] leading-tight mt-0.5">
                                ${escapeHtmlBoard(relTime.label)}
                            </span>
                        </div>
                        <div class="mk-walker-bob is-walking flex items-center justify-center">
                            <img alt="${escapeHtmlBoard(mItem.name)}"
                                 style="width:${imgPx}px; height:${imgPx}px;"
                                 class="mk-sticker-img object-contain block select-none" />
                        </div>
                    </div>
                `;

                const imgEl = el.querySelector('img');
                if (imgEl) probeAndSetMonsterImg(imgEl, mItem.folder, mItem.id);
                return el;
            }

            function computeWalkerRadii(imgPx, nameStr) {
                const labelHalfW = Math.max(46, String(nameStr || '').length * 11.5);
                const rx = Math.max(imgPx * 0.48, labelHalfW) + 8;
                const ry = (imgPx + 48) * 0.50 + 6;
                return { rx, ry };
            }

            // 同步場上散步小怪（切換公廁時重排；同一公廁有即時新增／人數增加／刪除時原地平滑更新大小與數量）
            function syncMonsterBoardWalkers(forceFullReset = false) {
                if (!mkStrollStage) return;
                updateMonsterStageObstacles();

                const tName = mbState.selectedToilet?.name || '';
                const activeList = getActive24hMonstersForToilet(tName);

                if (forceFullReset) {
                    mkState.walkers.forEach(w => w.el.remove());
                    mkState.walkers = [];
                }

                if (activeList.length === 0) {
                    mkState.walkers.forEach(w => w.el.remove());
                    mkState.walkers = [];
                    if (!mkStrollStage.querySelector('.mk-empty-hint')) {
                        mkStrollStage.innerHTML = `
                            <div class="mk-empty-hint w-full h-full flex items-center justify-center px-6 pt-28">
                                <div class="bg-white/85 border-[2px] border-[#273491]/55 rounded-full px-8 py-4 text-[#273491]/75 text-sm sm:text-base font-extrabold tracking-[0.14em] text-center">
                                    過去 24 小時內這間公廁還沒有出現小怪～
                                </div>
                            </div>
                        `;
                    }
                    return;
                }

                mkStrollStage.querySelector('.mk-empty-hint')?.remove();

                const basePx = getBaseMonsterSizePx(activeList.length);
                const activeIdMap = new Map(activeList.map(m => [m.id, m]));

                // 1. 移除已過期或被管理員刪除的小怪
                mkState.walkers = mkState.walkers.filter((w) => {
                    if (!activeIdMap.has(w.id)) {
                        w.el.remove();
                        return false;
                    }
                    return true;
                });

                const existingById = new Map(mkState.walkers.map(w => [w.id, w]));

                // 2. 更新既有小怪的大小與時間，或新增剛出現的小怪
                activeList.forEach((mItem) => {
                    const scale = calcMonsterScale(mItem.count);
                    const imgPx = Math.round(basePx * scale);
                    const { rx, ry } = computeWalkerRadii(imgPx, mItem.name);

                    const existing = existingById.get(mItem.id);
                    if (existing) {
                        existing.count = mItem.count;
                        existing.latestTimeMs = mItem.latestTimeMs;
                        existing.imgPx = imgPx;
                        existing.rx = rx;
                        existing.ry = ry;

                        const imgEl = existing.el.querySelector('.mk-sticker-img');
                        if (imgEl) {
                            imgEl.style.width = `${imgPx}px`;
                            imgEl.style.height = `${imgPx}px`;
                        }
                        refreshSingleWalkerTimeText(existing);
                    } else {
                        const el = createMonsterWalkerDom(mItem, imgPx);
                        mkStrollStage.appendChild(el);

                        const spot = findBestNonOverlappingSpot(rx, ry, mkState.walkers);
                        const vel = pickRandomStrollVelocity();
                        const walker = {
                            id: mItem.id,
                            name: mItem.name,
                            count: mItem.count,
                            latestTimeMs: mItem.latestTimeMs,
                            el,
                            bobEl: el.querySelector('.mk-walker-bob'),
                            timeEl: el.querySelector('.mk-walker-time'),
                            x: spot.x,
                            y: spot.y,
                            vx: vel.vx,
                            vy: vel.vy,
                            targetVx: vel.vx,
                            targetVy: vel.vy,
                            isPaused: false,
                            phaseTimerMs: 2200 + Math.random() * 3800,
                            imgPx,
                            rx,
                            ry
                        };
                        el.style.transform = `translate3d(${(walker.x - rx).toFixed(1)}px, ${(walker.y - ry).toFixed(1)}px, 0)`;
                        mkState.walkers.push(walker);
                    }
                });
            }

            function refreshSingleWalkerTimeText(walker, nowMs = Date.now()) {
                if (!walker || !walker.timeEl) return;
                const rel = formatMonsterRelativeTime(walker.latestTimeMs, nowMs);
                walker.timeEl.textContent = rel.label;
                walker.timeEl.classList.toggle('text-[#F26559]', rel.isRecentMinutes);
                walker.timeEl.classList.toggle('text-[#273491]', !rel.isRecentMinutes);
            }

            function computeCurrentMonsterDataSignature() {
                const tKey = mbState.selectedToilet?.key || '';
                const tName = mbState.selectedToilet?.name || '';
                const revs = mbState.reviewsByToiletName.get(tName) || [];
                const revSig = revs.map(r => {
                    const mLen = (Array.isArray(r.monsters) ? r.monsters.length : 0) + (Array.isArray(r.monsterIds) ? r.monsterIds.length : 0);
                    return `${r._docId || r.id || ''}_${r.updatedAt || r.createdAt || ''}_${r.stars || ''}_${mLen}`;
                }).join('|');
                return `${tKey}::${revs.length}::${revSig}`;
            }

            // 60fps 悠哉散步與柔和防碰撞轉向引擎
            function tickMonsterStrollLoop(now) {
                if (!mkState.isOpen) {
                    mkState.rafId = null;
                    return;
                }

                const dt = Math.min(0.05, Math.max(0.001, (now - (mkState.lastFrameTime || now)) / 1000));
                mkState.lastFrameTime = now;

                // 即時偵測公廁切換或 Firebase 新增／刪除評鑑
                if (now - mkState.lastDataCheckMs > 280) {
                    mkState.lastDataCheckMs = now;
                    const sig = computeCurrentMonsterDataSignature();
                    if (sig !== mkState.lastDataSig) {
                        const curKey = mbState.selectedToilet?.key || '';
                        const toiletChanged = (curKey !== mkState.lastToiletKey);
                        mkState.lastToiletKey = curKey;
                        mkState.lastDataSig = sig;
                        renderMonsterBoardHeaderAndStars();
                        syncMonsterBoardWalkers(toiletChanged);
                    }
                }

                // 每 20 秒自動刷新相對時間文字（「1分鐘前」->「2分鐘前」）並淘汰超過 24 小時的小怪
                if (now - mkState.lastTimeRefreshMs > 20000) {
                    mkState.lastTimeRefreshMs = now;
                    mkState.walkers.forEach(w => refreshSingleWalkerTimeText(w, Date.now()));
                    syncMonsterBoardWalkers(false);
                }

                const W = mkStrollStage?.clientWidth || 1280;
                const H = mkStrollStage?.clientHeight || 680;
                const walkers = mkState.walkers;
                const n = walkers.length;

                // 1. 散步／停頓節奏切換
                for (let i = 0; i < n; i++) {
                    const w = walkers[i];
                    w.phaseTimerMs -= dt * 1000;
                    if (w.phaseTimerMs <= 0) {
                        if (!w.isPaused && Math.random() < 0.35) {
                            w.isPaused = true;
                            w.targetVx = 0;
                            w.targetVy = 0;
                            w.phaseTimerMs = 1300 + Math.random() * 1500;
                            w.bobEl?.classList.remove('is-walking');
                            w.bobEl?.classList.add('is-pausing');
                        } else {
                            w.isPaused = false;
                            const vel = pickRandomStrollVelocity();
                            w.targetVx = vel.vx;
                            w.targetVy = vel.vy;
                            w.phaseTimerMs = 3400 + Math.random() * 3400;
                            w.bobEl?.classList.remove('is-pausing');
                            w.bobEl?.classList.add('is-walking');
                        }
                    }
                }

                // 2. 小怪彼此之間的柔和防重疊排斥力與轉向避讓
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        const a = walkers[i];
                        const b = walkers[j];
                        const sumRx = a.rx + b.rx + 8;
                        const sumRy = a.ry + b.ry + 6;
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;

                        const nx = dx / sumRx;
                        const ny = dy / sumRy;
                        const normDist = Math.hypot(nx, ny);

                        if (normDist < 1.08) {
                            const safeDist = Math.max(0.01, normDist);
                            const ux = nx / safeDist;
                            const uy = ny / safeDist;
                            const overlap = 1.08 - safeDist;
                            const pushStrength = overlap * 68;

                            a.vx -= ux * pushStrength * dt * 2.4;
                            a.vy -= uy * pushStrength * dt * 2.4;
                            b.vx += ux * pushStrength * dt * 2.4;
                            b.vy += uy * pushStrength * dt * 2.4;

                            // 順勢將散步目標方向微調錯開，避免面對面互頂
                            if (!a.isPaused) {
                                a.targetVx -= ux * 16 * dt * 3;
                                a.targetVy -= uy * 14 * dt * 3;
                            }
                            if (!b.isPaused) {
                                b.targetVx += ux * 16 * dt * 3;
                                b.targetVy += uy * 14 * dt * 3;
                            }

                            // 若距離過近直接微幅推開防止視覺重疊
                            if (normDist < 0.94) {
                                const directSep = (0.94 - normDist) * 0.35;
                                a.x -= ux * sumRx * directSep * 0.5;
                                a.y -= uy * sumRy * directSep * 0.5;
                                b.x += ux * sumRx * directSep * 0.5;
                                b.y += uy * sumRy * directSep * 0.5;
                            }
                        }
                    }
                }

                // 3. 邊界與上方標題／按鈕避讓 ＋ 更新位置與前後景深
                for (let i = 0; i < n; i++) {
                    const w = walkers[i];

                    // 平滑趨近目標散步速度
                    const blend = Math.min(1, dt * 2.8);
                    w.vx += (w.targetVx - w.vx) * blend;
                    w.vy += (w.targetVy - w.vy) * blend;

                    // 避開上方 UI 區塊（按鈕、標題星等、LIVE）
                    for (let k = 0; k < mkState.obstacles.length; k++) {
                        const ob = mkState.obstacles[k];
                        const ex0 = ob.x0 - w.rx, ex1 = ob.x1 + w.rx;
                        const ey0 = ob.y0 - w.ry, ey1 = ob.y1 + w.ry;
                        if (w.x > ex0 && w.x < ex1 && w.y > ey0 && w.y < ey1) {
                            const dLeft  = (ob.x0 > 60) ? (w.x - ex0) : 9999;
                            const dRight = (ob.x1 < W - 60) ? (ex1 - w.x) : 9999;
                            const dDown  = ey1 - w.y;
                            const minExit = Math.min(dLeft, dRight, dDown);

                            if (minExit === dDown) {
                                w.y += Math.min(dDown, 95 * dt);
                                if (w.vy < 12) w.vy = 16;
                                if (w.targetVy < 8) w.targetVy = Math.abs(w.targetVy) + 12;
                            } else if (minExit === dLeft) {
                                w.x -= Math.min(dLeft, 95 * dt);
                                w.vx = -Math.abs(w.vx) - 10;
                                w.targetVx = -Math.abs(w.targetVx) - 12;
                            } else {
                                w.x += Math.min(dRight, 95 * dt);
                                w.vx = Math.abs(w.vx) + 10;
                                w.targetVx = Math.abs(w.targetVx) + 12;
                            }
                        }
                    }

                    w.x += w.vx * dt;
                    w.y += w.vy * dt;

                    // 畫面四周邊界柔和折返
                    const minX = w.rx + 14, maxX = Math.max(minX, W - w.rx - 14);
                    const minY = w.ry + 12, maxY = Math.max(minY, H - w.ry - 14);

                    if (w.x < minX) {
                        w.x = minX;
                        w.vx = Math.abs(w.vx) * 0.8 + 8;
                        w.targetVx = Math.abs(w.targetVx) + 10;
                    } else if (w.x > maxX) {
                        w.x = maxX;
                        w.vx = -Math.abs(w.vx) * 0.8 - 8;
                        w.targetVx = -Math.abs(w.targetVx) - 10;
                    }

                    if (w.y < minY) {
                        w.y = minY;
                        w.vy = Math.abs(w.vy) * 0.8 + 8;
                        w.targetVy = Math.abs(w.targetVy) + 10;
                    } else if (w.y > maxY) {
                        w.y = maxY;
                        w.vy = -Math.abs(w.vy) * 0.8 - 8;
                        w.targetVy = -Math.abs(w.targetVy) - 10;
                    }

                    // 限制最高速度維持「悠哉散步」感
                    const spd = Math.hypot(w.vx, w.vy);
                    if (spd > 38) {
                        w.vx = (w.vx / spd) * 38;
                        w.vy = (w.vy / spd) * 38;
                    }

                    const drawX = w.x - w.el.offsetWidth * 0.5;
                    const drawY = w.y - w.el.offsetHeight * 0.5;
                    w.el.style.zIndex = String(Math.max(1, Math.round(w.y + w.ry * 0.5)));
                    w.el.style.transform = `translate3d(${drawX.toFixed(1)}px, ${drawY.toFixed(1)}px, 0)`;
                }

                mkState.rafId = requestAnimationFrame(tickMonsterStrollLoop);
            }

            // 進入右門「小怪板」與返回三扇門主畫面
            function enterRightDoorMonsterBoard() {
                if (!isBoardInteractive || mkState.isOpen) return;
                mkState.isOpen = true;
                mbState.isOpen = false;

                rebuildBoardReviewIndex();
                recomputeDistancesAndPickNearestIfNeeded();

                boardStageTopBarEl?.classList.add('hidden');
                boardStageTopBarEl?.classList.remove('is-fading-in');
                stopBirdGameLoop();
                closeRightDoorAndRetractMonster();

                messageBoardView?.classList.add('hidden');
                boardFinalSceneSvg?.classList.add('hidden');

                if (monsterBoardView) {
                    monsterBoardView.classList.remove('hidden', 'is-entering');
                    void monsterBoardView.offsetWidth;
                    monsterBoardView.classList.add('is-entering');
                }

                mkState.lastToiletKey = mbState.selectedToilet?.key || '';
                mkState.lastDataSig = computeCurrentMonsterDataSignature();
                mkState.lastDataCheckMs = performance.now();
                mkState.lastTimeRefreshMs = performance.now();
                mkState.lastFrameTime = performance.now();

                renderMonsterBoardHeaderAndStars();
                requestAnimationFrame(() => {
                    syncMonsterBoardWalkers(true);
                    if (mkState.rafId) cancelAnimationFrame(mkState.rafId);
                    mkState.rafId = requestAnimationFrame(tickMonsterStrollLoop);
                });
            }

            function exitMonsterBoardToThreeDoors() {
                if (!mkState.isOpen) return;
                mkState.isOpen = false;
                if (mkState.rafId) {
                    cancelAnimationFrame(mkState.rafId);
                    mkState.rafId = null;
                }
                closeChangeToiletModal();

                monsterBoardView?.classList.add('hidden');
                boardFinalSceneSvg?.classList.remove('hidden');

                if (boardStageTopBarEl) {
                    boardStageTopBarEl.classList.remove('hidden', 'is-fading-in');
                    void boardStageTopBarEl.offsetWidth;
                    boardStageTopBarEl.classList.add('is-fading-in');
                }
                if (!isBirdSequencePlaying) {
                    startBirdGameLoop(false);
                }
            }

            // 綁定右門點擊進入小怪板、左上變更公廁與返回按鈕
            doorMonsterStatusGroup?.addEventListener('click', (e) => {
                e.stopPropagation();
                enterRightDoorMonsterBoard();
            });

            document.getElementById('openChangeToiletFromMonsterBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                openChangeToiletModal();
            });

            document.getElementById('backFromMonsterBoardBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                exitMonsterBoardToThreeDoors();
            });

            // 在小怪板內點擊導覽列「公廁現況版」同樣可直接返回三扇門畫面
            document.querySelectorAll('a[href="./board.html"]').forEach((linkEl) => {
                linkEl.addEventListener('click', (e) => {
                    if (mkState.isOpen) {
                        e.preventDefault();
                        closeTpDropdownMenu();
                        exitMonsterBoardToThreeDoors();
                    }
                });
            });

            // 視窗尺寸變動時更新 UI 避讓範圍與小怪基準比例
            window.addEventListener('resize', () => {
                if (mkState.isOpen) {
                    updateMonsterStageObstacles();
                    syncMonsterBoardWalkers(false);
                }
            });
        });
    </script>
