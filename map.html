    <script>
        window.addEventListener('error', function(e) {
            if (e && e.target && e.target !== window) {
                if (typeof e.target.onerror === 'function') {
                    try { e.target.onerror.call(e.target, e); } catch (err) {}
                }
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            if (e && (!e.error || e.message === 'Script error.' || (e.message && e.message.indexOf('ResizeObserver') !== -1))) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            var isSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').indexOf('usercontent.goog') !== -1 ||
                (window.location.hostname || '').indexOf('googleusercontent.com') !== -1
            );
            if (e && (!e.reason || !e.reason.message || isSandbox)) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>

    <style>
        :root {
            --pm-cyan-bg: #80E4FF;
            --pm-cyan-bar: #80E4FF;
            --pm-pink: #FF99D3;
            --pm-yellow: #F3EF84;
            --pm-cream: #FFF9EC;
            --pm-navy: #2A348C;
            --pm-coral: #F26559;
        }
        * {
            box-sizing: border-box;
        }
        button, a, input, select, textarea, svg, g, rect, path, circle, ellipse, polygon, use, image,
        [role="button"], [tabindex],
        .leaflet-interactive, .leaflet-marker-icon, .leaflet-container a {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible,
        a:focus, a:focus-visible,
        input:focus, input:focus-visible,
        select:focus, select:focus-visible,
        textarea:focus, textarea:focus-visible,
        .leaflet-interactive:focus, .leaflet-marker-icon:focus, .leaflet-container :focus {
            outline: none !important;
        }
        .hidden:not(.md\:block):not(.md\:flex) {
            display: none !important;
        }
        @media (max-width: 767px) {
            .hidden.md\:block,
            .hidden.md\:flex {
                display: none !important;
            }
        }
        @font-face {
            font-family: 'jf-openhuninn';
            src: local('jf-openhuninn-2.1'),
                 local('jf-openhuninn-2.0'),
                 local('jf-openhuninn-1.1'),
                 local('jf-openhuninn'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-web-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }
        body, .leaflet-container, svg text {
            font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
        }
        body {
            background-color: var(--pm-cyan-bg);
            color: var(--pm-navy);
            overflow-x: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            min-height: 300px;
            z-index: 10;
            background-color: #E8F4F8;
            border-radius: inherit;
        }
        .leaflet-container img.leaflet-tile {
            max-width: none !important;
            max-height: none !important;
        }
        /* 隱藏原生列表捲軸，改用右側專屬黃色膠囊捲軸 */
        .no-native-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .no-native-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* 彈窗內部細捲軸 */
        .pm-modal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .pm-modal-scroll::-webkit-scrollbar-track {
            background: #FFF9EC;
            border-radius: 9999px;
        }
        .pm-modal-scroll::-webkit-scrollbar-thumb {
            background: #80E4FF;
            border: 1.5px solid #2A348C;
            border-radius: 9999px;
        }
        .pm-flat-btn {
            transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), filter 0.15s ease, background-color 0.15s ease;
        }
        .pm-flat-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            filter: brightness(1.03);
        }
        .pm-flat-btn:active:not(:disabled) {
            transform: translateY(0px) scale(0.97);
        }
        .poopgle-loc-bob {
            animation: poopBounceGentle 2.2s ease-in-out infinite;
        }
        .poopgle-user-marker {
            background: transparent !important;
            border: none !important;
        }
        @keyframes poopBounceGentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3.5px); }
        }
        /* 右上角「返回主頁」橢圓按鈕：與公廁回報頁面完全一致 */
        .poogle-return-home-ellipse {
            border: 2px solid #2A348C;
            border-radius: 50%;
            background-color: #F3EF84;
            color: #2A348C;
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }
        .poogle-return-home-ellipse:hover {
            background-color: #FFF9EC;
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 0 #2A348C;
        }
  /* 手機版：圓角長方形白色外框 + 清晰完整的長方形地圖；電腦版：維持橫向蹲式馬桶造型 */
        @media (max-width: 767px) {
            .squat-toilet-shell {
                width: min(90vw, 396px) !important;
                height: auto !important;
                margin-left: auto;
                margin-right: auto;
                padding-top: 28px !important;
                padding-bottom: 24px !important;
                padding-left: 20px !important;
                padding-right: 20px !important;
                border-radius: 56px !important;
            }
            .squat-toilet-map-well {
                width: 100%;
                height: 360px !important;
                flex-shrink: 0 !important;
                border-radius: 0px !important;
                border-width: 0px !important;
            }
        }
        @media (min-width: 768px) {
            .squat-toilet-shell {
                --shell-h: max(480px, min(82vh, 50vw, 720px));
                --shell-pad: calc(var(--shell-h) * 0.055);
                --right-r: calc(var(--shell-h) * 0.268);
                min-height: 480px;
                height: var(--shell-h) !important;
                padding-top: var(--shell-pad) !important;
                padding-bottom: var(--shell-pad) !important;
                padding-right: var(--shell-pad) !important;
                /* 列表往右推開避開左側圓弧白框，右側 flex-1 地圖會自動縮小對應寬度 */
                padding-left: calc(var(--shell-h) * 0.335) !important;
                border-top-left-radius: calc(var(--shell-h) * 0.5) !important;
                border-bottom-left-radius: calc(var(--shell-h) * 0.5) !important;
                border-top-right-radius: var(--right-r) !important;
                border-bottom-right-radius: var(--right-r) !important;
            }
            .squat-toilet-map-well {
                min-width: 0;
                border-top-left-radius: 0px !important;
                border-bottom-left-radius: 0px !important;
                border-top-right-radius: calc(var(--right-r) - var(--shell-pad)) !important;
                border-bottom-right-radius: calc(var(--right-r) - var(--shell-pad)) !important;
            }
        }
        /* 地圖定位點正上方的新版公廁資訊卡 Leaflet Popup 樣式 */
        .poopgle-map-popup .leaflet-popup-content-wrapper {
            background: transparent;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }
        .poopgle-map-popup .leaflet-popup-content {
            margin: 0 !important;
            width: 296px !important;
        }
        .poopgle-map-popup .leaflet-popup-tip-container {
            display: none;
        }
        .poopgle-map-popup,
        .poopgle-map-popup .leaflet-popup-content-wrapper,
        .poopgle-map-popup .leaflet-popup-content {
            pointer-events: none !important;
        }
        .poopgle-map-popup .poopgle-popup-card,
        .poopgle-map-popup .leaflet-popup-content > div > div:first-child {
            pointer-events: auto !important;
        }
        .poopgle-restroom-pin {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 9999px !important;
            background: rgba(0, 0, 0, 0.001) !important;
            border: none !important;
            pointer-events: auto !important;
        }
        .poopgle-restroom-pin * {
            pointer-events: none !important;
        }
        .poopgle-user-marker,
        .poopgle-user-marker * {
            pointer-events: none !important;
        }
        /* 上移右下角縮放按鈕與版權列，避開蹲式馬桶圓角裁切 */
        .squat-toilet-map-well .leaflet-bottom.leaflet-right .leaflet-control-zoom {
            margin-bottom: 24px !important;
            margin-right: 10px !important;
            border: 2px solid #2A348C !important;
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(42, 52, 140, 0.18) !important;
        }
        .squat-toilet-map-well .leaflet-bottom.leaflet-right .leaflet-control-zoom a {
            color: #2A348C !important;
            font-weight: 900 !important;
        }
        @media (min-width: 768px) {
            .squat-toilet-map-well .leaflet-bottom.leaflet-right .leaflet-control-zoom {
                margin-bottom: 116px !important;
                margin-right: 20px !important;
            }
            .squat-toilet-map-well .leaflet-bottom.leaflet-right .leaflet-control-attribution {
                margin-right: 158px !important;
                border-top-left-radius: 8px;
            }
        }
        /* 手機版右上角下拉式衛生紙捲筒選單展開與收合動畫 */
        @keyframes mapTpDropdownUnroll {
            0% { opacity: 0; transform: scaleY(0.18); }
            70% { opacity: 1; transform: scaleY(1.03); }
            100% { opacity: 1; transform: scaleY(1); }
        }
        @keyframes mapTpDropdownRollUp {
            0% { opacity: 1; transform: scaleY(1); }
            30% { opacity: 1; transform: scaleY(1.02); }
            100% { opacity: 0; transform: scaleY(0.12); }
        }
        #mapTpRollDropdownMenu {
            transform-origin: top center;
        }
        #mapTpRollDropdownMenu.is-open {
            display: block !important;
            animation: mapTpDropdownUnroll 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #mapTpRollDropdownMenu.is-closing {
            display: block !important;
            pointer-events: none;
            animation: mapTpDropdownRollUp 0.26s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @media (min-width: 768px) {
            #mapTpRollDropdownMenu,
            #mapTpRollDropdownMenu.is-open,
            #mapTpRollDropdownMenu.is-closing {
                display: none !important;
            }
        }
        .map-tp-menu-item {
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .map-tp-menu-item:hover {
            transform: translateX(3px);
        }
        .map-tp-menu-item:hover text {
            fill: #F26559;
        }
        /* ========================================================= */
        /* 自訂游標設定 (Default: img/mouse / Hover: img/hover)       */
        /* ========================================================= */
        :root {
            --cursor-default: url('./img/mouse.png') 0 0, auto;
            --cursor-hover: url('./img/hover.png') 0 0, pointer;
        }
        html, body, svg, #map, .leaflet-container, .leaflet-grab {
            cursor: var(--cursor-default) !important;
        }
        a, button, select, [role="button"],
        .cursor-pointer, .cursor-grab, .cursor-grabbing,
        [style*="cursor:pointer"], [style*="cursor: pointer"],
        .pm-flat-btn, .pm-flat-btn *,
        .map-tp-menu-item, .map-tp-menu-item *,
        .toilet-list-card, .toilet-list-card *,
        .poopgle-restroom-pin, .poopgle-restroom-pin *,
        .leaflet-interactive, .leaflet-marker-icon, .leaflet-control-zoom a {
            cursor: var(--cursor-hover) !important;
        }

    </style>
</head>

        function renderCyanBackgroundHalftoneDots() {
            const svgEl = document.getElementById('poopgleHalftoneSvg');
            const group = document.getElementById('poopgleHalftoneDotsGroup');
            if (!svgEl || !group) return;

            const vw = Math.max(window.innerWidth || 1440, 320);
            const vh = Math.max(window.innerHeight || 820, 480);
            svgEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

            const spacingX = 44;
            const spacingY = 38;
            const cols = Math.ceil(vw / spacingX) + 1;
            const rows = Math.ceil(vh / spacingY) + 1;
            const svgNs = 'http://www.w3.org/2000/svg';
            const frag = document.createDocumentFragment();

            for (let r = 0; r < rows; r++) {
                const ratioY = rows > 1 ? r / (rows - 1) : 0.5;
                const radius = 2.0 + ratioY * 4.2;
                const offsetX = (r % 2 === 1) ? spacingX * 0.5 : 0;
                const cy = r * spacingY + 14;
                for (let c = 0; c < cols; c++) {
                    const cx = c * spacingX + offsetX;
                    const circle = document.createElementNS(svgNs, 'circle');
                    circle.setAttribute('cx', cx.toFixed(1));
                    circle.setAttribute('cy', cy.toFixed(1));
                    circle.setAttribute('r', radius.toFixed(2));
                    frag.appendChild(circle);
                }
            }
            group.innerHTML = '';
            group.appendChild(frag);
        }

        function getFallbackPfpUri(bgHex = '#2A348C', fgHex = '#FF99D3') {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104"><circle cx="52" cy="52" r="52" fill="${bgHex}"/><path d="M 52,25 C 47.5,33.5 39,36.5 35.5,41 C 30.5,46 28.5,51.5 29,57.5 C 18,62.5 11.5,74.5 11.5,91.5 L 92.5,91.5 C 92.5,74.5 86,62.5 75,57.5 C 75.5,51.5 73.5,46 68.5,41 C 65,36.5 56.5,33.5 52,25 Z" fill="${fgHex}"/></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;

        const mapLocalImgCache = new Map();
        function upgradeMapLocalImages() {
            if (IS_STRICT_SANDBOX) return;
            document.querySelectorAll('img[data-local-src]').forEach((imgEl) => {
                const rawSrc = imgEl.getAttribute('data-local-src');
                if (!rawSrc || imgEl.dataset.probed === rawSrc) return;
                imgEl.dataset.probed = rawSrc;
                if (mapLocalImgCache.has(rawSrc)) {
                    const cached = mapLocalImgCache.get(rawSrc);
                    if (cached) imgEl.src = cached;
                    return;
                }
                const probe = new Image();
                probe.onload = () => {
                    mapLocalImgCache.set(rawSrc, rawSrc);
                    imgEl.src = rawSrc;
                };
                probe.onerror = () => {
                    mapLocalImgCache.set(rawSrc, null);
                };
                probe.src = rawSrc;
            });
        }

        function extractMonsterIdsFromReview(review) {
            if (!review) return [];
            const ids = [];
            const seen = new Set();
            if (Array.isArray(review.monsters)) {
                review.monsters.forEach((m) => {
                    const id = typeof m === 'string' ? m : m?.id;
                    if (id && MAP_MONSTER_CATALOG[id] && !seen.has(id)) {
                        seen.add(id);
                        ids.push(id);
                    }
                });
            }
            if (Array.isArray(review.monsterIds)) {
                review.monsterIds.forEach((id) => {
                    if (id && MAP_MONSTER_CATALOG[id] && !seen.has(id)) {
                        seen.add(id);
                        ids.push(id);
                    }
                });
            }
            return ids;
        }

        function rebuildReviewIndex() {
            const mergedById = new Map();

            state.cloudEvaluations.forEach((ev) => {
                const id = ev.evalId || ev.id;
                if (id) mergedById.set(id, ev);
            });

            try {
                const rawLocal = localStorage.getItem('poogle_local_evaluations_v2');
                const localList = rawLocal ? JSON.parse(rawLocal) : [];
                if (Array.isArray(localList)) {
                    localList.forEach((item) => {
                        if (!item) return;
                        const id = item.evalId || item.id;
                        if (!id || mergedById.has(id)) return;
                        if (!state.hasLoadedCloudOnce || item.cloudSynced === false) {
                            mergedById.set(id, item);
                        }
                    });
                }
            } catch (e) {}

            state.reviewsByToiletName.clear();
            state.userReviewCountsByUid.clear();

            mergedById.forEach((rev) => {
                const tName = String(rev.name || '').trim();
                if (!tName) return;
                if (!state.reviewsByToiletName.has(tName)) {
                    state.reviewsByToiletName.set(tName, []);
                }
                state.reviewsByToiletName.get(tName).push(rev);

                if (rev.userId) {
                    state.userReviewCountsByUid.set(rev.userId, (state.userReviewCountsByUid.get(rev.userId) || 0) + 1);
                }
            });

            state.reviewsByToiletName.forEach((arr) => {
                arr.sort((a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));
            });
        }

        function getToiletReviewStats(toiletName) {
            const cleanName = String(toiletName || '').trim();
            if (!cleanName) return null;
            const list = state.reviewsByToiletName.get(cleanName);
            if (!list || list.length === 0) return null;

            let sumClean = 0, sumLight = 0, sumEquip = 0, sumSpace = 0, sumOverall = 0;
            const monsterPeopleCount = new Map();

            list.forEach((r) => {
                const rt = r.ratings || {};
                const fallbackStar = Number(r.stars ?? 3);
                const cl = Number(rt.cleanliness ?? fallbackStar);
                const li = Number(rt.lighting ?? fallbackStar);
                const eq = Number(rt.equipment ?? rt.smell ?? fallbackStar);
                const sp = Number(rt.space ?? fallbackStar);
                const ov = Number.isFinite(Number(r.stars)) ? Number(r.stars) : ((cl + li + eq + sp) / 4);

                sumClean += cl;
                sumLight += li;
                sumEquip += eq;
                sumSpace += sp;
                sumOverall += ov;

                const uniqueMonsterIdsInThisReview = extractMonsterIdsFromReview(r);
                uniqueMonsterIdsInThisReview.forEach((mId) => {
                    monsterPeopleCount.set(mId, (monsterPeopleCount.get(mId) || 0) + 1);
                });
            });

            const count = list.length;
            const frequentMonsters = [];
            monsterPeopleCount.forEach((peopleCount, mId) => {
                if (peopleCount >= MONSTER_MIN_PEOPLE_THRESHOLD && MAP_MONSTER_CATALOG[mId]) {
                    frequentMonsters.push({
                        ...MAP_MONSTER_CATALOG[mId],
                        count: peopleCount
                    });
                }
            });
            frequentMonsters.sort((a, b) => b.count - a.count);

            return {
                count,
                avgOverall: (sumOverall / count).toFixed(1),
                avgCleanliness: (sumClean / count).toFixed(1),
                avgLighting: (sumLight / count).toFixed(1),
                avgEquipment: (sumEquip / count).toFixed(1),
                avgSpace: (sumSpace / count).toFixed(1),
                frequentMonsters,
                reviews: list
            };
        }

                    const cloudList = [];

                        cloudList.push({ id: doc.id, evalId: doc.data()?.evalId || doc.id, ...doc.data() });

                    state.cloudEvaluations = cloudList;
                    state.hasLoadedCloudOnce = true;
                    rebuildReviewIndex();

        function openDatabase() {
            return new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (!settled) { settled = true; reject(new Error('IDB timeout')); }
                }, 1500);
                try {
                    if (typeof indexedDB === 'undefined') {
                        clearTimeout(timer); settled = true; reject(new Error('No IDB')); return;
                    }
                    const req = indexedDB.open(IDB_NAME, 1);
                    req.onupgradeneeded = (e) => {
                        const idb = e.target.result;
                        if (!idb.objectStoreNames.contains(IDB_STORE_DATA)) idb.createObjectStore(IDB_STORE_DATA);
                    };
                    req.onsuccess = () => {
                        clearTimeout(timer);
                        if (!settled) { settled = true; resolve(req.result); }
                    };
                    req.onerror = () => {
                        clearTimeout(timer);
                        if (!settled) { settled = true; reject(req.error || new Error('IDB error')); }
                    };
                    req.onblocked = () => {
                        clearTimeout(timer);
                        if (!settled) { settled = true; reject(new Error('IDB blocked')); }
                    };
                } catch (err) {
                    clearTimeout(timer);
                    if (!settled) { settled = true; reject(err); }
                }
            });
        }

        async function saveDatasetToIDB(records, fileName) {
            try {
                const idb = await openDatabase();
                return new Promise((resolve) => {
                    let done = false;
                    const finish = (val) => { if (!done) { done = true; resolve(val); } };
                    const timer = setTimeout(() => finish(false), 3000);
                    try {
                        const tx = idb.transaction(IDB_STORE_DATA, 'readwrite');
                        tx.objectStore(IDB_STORE_DATA).put({ records, fileName, savedAt: new Date().toISOString() }, 'main_csv_dataset');
                        tx.oncomplete = () => { clearTimeout(timer); finish(true); };
                        tx.onerror = () => { clearTimeout(timer); finish(false); };
                        tx.onabort = () => { clearTimeout(timer); finish(false); };
                    } catch (e) {
                        clearTimeout(timer);
                        finish(false);
                    }
                });
            } catch (err) { return false; }
        }

        async function loadDatasetFromIDB() {
            try {
                const idb = await openDatabase();
                return new Promise((resolve) => {
                    let done = false;
                    const finish = (val) => { if (!done) { done = true; resolve(val); } };
                    const timer = setTimeout(() => finish(null), 1800);
                    try {
                        const tx = idb.transaction(IDB_STORE_DATA, 'readonly');
                        const req = tx.objectStore(IDB_STORE_DATA).get('main_csv_dataset');
                        req.onsuccess = () => { clearTimeout(timer); finish(req.result || null); };
                        req.onerror = () => { clearTimeout(timer); finish(null); };
                        tx.onabort = () => { clearTimeout(timer); finish(null); };
                    } catch (e) {
                        clearTimeout(timer);
                        finish(null);
                    }
                });
            } catch (err) { return null; }
        }

        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            if (lat1 === null || lon1 === null || !Number.isFinite(lat2) || !Number.isFinite(lon2)) return Infinity;
            const R = 6371000;
            const toRad = Math.PI / 180;
            const dLat = (lat2 - lat1) * toRad;
            const dLon = (lon2 - lon1) * toRad;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function resolveCountyName(rawCounty, address) {

            if (COUNTY_CODE_MAP[clean]) return COUNTY_CODE_MAP[clean];
            if (clean && !/^\d+$/.test(clean)) return clean;
            if (address) {

                if (m) return m[1];
            }
            return clean || '其他縣市';
        }

        function extractTownFromAddress(address, countyName, rawAreacode) {
            if (rawAreacode && !/^\d+$/.test(rawAreacode)) return rawAreacode;
            if (!address) return '';
            let rest = address.trim();
            if (countyName && rest.startsWith(countyName)) rest = rest.slice(countyName.length);
            else rest = rest.replace(/^\d{3,5}/, '').replace(/^(臺北市|台北市|新北市|桃園市|臺中市|台中市|臺南市|台南市|高雄市|基隆市|新竹市|嘉義市|新竹縣|苗栗縣|彰化縣|南投縣|雲林縣|嘉義縣|屏東縣|宜蘭縣|花蓮縣|臺東縣|台東縣|澎湖縣|金門縣|連江縣)/, '');
            const match = rest.match(/^(.{1,4}?(?:區|鎮|鄉|市))/);
            return match ? match[1] : '';
        }

        function decodeCsvArrayBuffer(buffer) {
            try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
            catch (e) {
                try { return new TextDecoder('big5').decode(buffer); }
                catch (e2) { return new TextDecoder('utf-8').decode(buffer); }
            }
        }

        function parseCSVRows(text) {
            const rows = [];
            let currentRow = [], currentVal = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { currentVal += '"'; i++; }
                        else inQuotes = false;
                    } else currentVal += c;
                } else {
                    if (c === '"') inQuotes = true;
                    else if (c === ',') { currentRow.push(currentVal.trim()); currentVal = ''; }
                    else if (c === '\r' || c === '\n') {
                        if (c === '\r' && i + 1 < text.length && text[i + 1] === '\n') i++;
                        currentRow.push(currentVal.trim()); currentVal = '';
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) rows.push(currentRow);
                        currentRow = [];
                    } else currentVal += c;
                }
            }
            if (currentVal !== '' || currentRow.length > 0) {
                currentRow.push(currentVal.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) rows.push(currentRow);
            }
            return rows;
        }

        function parseCSV(text) {
            const rows = parseCSVRows(text.replace(/^\uFEFF/, ''));
            if (rows.length < 2) return [];
            const headers = rows[0].map(h => h.replace(/^["']|["']$/g, '').trim().toLowerCase());
            const findCol = (exact, partial) => {
                let idx = headers.findIndex(h => exact.includes(h));
                return idx >= 0 ? idx : headers.findIndex(h => partial.some(n => h.includes(n)));
            };

            const cIdx = findCol(['county', '縣市名稱', '縣市', '縣市代碼'], ['county', '縣市']);
            const aIdx = findCol(['areacode', '鄉鎮市名稱', '鄉鎮市區', '鄉鎮代碼'], ['areacode', '鄉鎮']);
            const numIdx = findCol(['number', '建檔編號', '公廁編號'], ['number', '編號']);
            const nameIdx = findCol(['name', '建檔名稱', '公廁名稱'], ['name', '名稱']);
            const addrIdx = findCol(['address', '地址'], ['address', '地址']);
            const latIdx = findCol(['latitude', 'lat', '緯度'], ['lat', '緯度']);
            const lngIdx = findCol(['longitude', 'lng', 'lon', '經度'], ['lon', 'lng', '經度']);
            const gradeIdx = findCol(['grade', '等級', '評鑑等級'], ['grade', '等級']);
            const type2Idx = findCol(['type2', '公廁類別', '場所類別'], ['type2', '類別']);
            const typeIdx = findCol(['type', '公廁類型'], ['type', '類型']);
            const execIdx = findCol(['exec', 'administration', '管理單位', '主管機關'], ['exec', 'administration', '管理', '機關']);

            const records = [];
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                if (!cols.some(cell => cell !== '')) continue;
                const address = (addrIdx >= 0 && cols[addrIdx]) ? cols[addrIdx] : '';
                const county = resolveCountyName((cIdx >= 0 && cols[cIdx]) ? cols[cIdx] : '', address);
                const areacode = (aIdx >= 0 && cols[aIdx]) ? cols[aIdx] : '';
                const number = (numIdx >= 0 && cols[numIdx]) ? cols[numIdx] : `T-${i}`;
                const name = (nameIdx >= 0 && cols[nameIdx]) ? cols[nameIdx] : (address || `公廁 #${number}`);

                let lat = latIdx >= 0 ? parseFloat(cols[latIdx]) : NaN;
                let lng = lngIdx >= 0 ? parseFloat(cols[lngIdx]) : NaN;
                if (Number.isFinite(lat) && Number.isFinite(lng) && lat > 90 && lng >= 10 && lng <= 40) {
                    const tmp = lat; lat = lng; lng = tmp;
                }
                if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat === 0 || lng === 0 || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
                    const fb = COUNTY_DEFAULT_COORDS[county] || [24.9785, 121.3268];
                    lat = fb[0]; lng = fb[1];
                }

                records.push({
                    idx: i,
                    key: `${number}_${i}`,
                    number,
                    name,
                    address,
                    county,
                    areacode,
                    lat,
                    lng,
                    grade: gradeIdx >= 0 ? (cols[gradeIdx] || '特優級') : '特優級',
                    type2: type2Idx >= 0 ? (cols[type2Idx] || '') : '',
                    type: typeIdx >= 0 ? (cols[typeIdx] || '公廁') : '公廁',
                    exec: execIdx >= 0 ? (cols[execIdx] || '') : '',
                    distance: Infinity
                });
            }
            return records;
        }

        const CANDIDATE_CSV_FILES = Array.from(new Set([
            encodeURI('./全國公廁建檔資料.csv'),
            './全國公廁建檔資料.csv',
            '全國公廁建檔資料.csv',
            './toilets.csv',
            'toilets.csv'
        ]));

        async function autoFetchSameFolderCSV() {
            if (IS_STRICT_SANDBOX) return false;
            for (const filePath of CANDIDATE_CSV_FILES) {
                try {
                    const res = await fetch(filePath);
                    if (!res.ok) continue;
                    const buffer = await res.arrayBuffer();
                    const records = parseCSV(decodeCsvArrayBuffer(buffer));
                    if (records && records.length > 0) {
                        state.allToilets = records;
                        state.datasetLoadFinished = true;
                        buildIndexesAndDropdowns(state.allToilets);
                        refreshDistancesAndRender();
                        saveDatasetToIDB(records, '全國公廁建檔資料.csv').catch(() => {});
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        const ALLOWED_TOILET_TYPES = [
            '男廁所', '女廁所', '性別友善廁所', '無障礙廁所', '親子友善廁所', '混合廁所', '已有網友評鑑'
        ];

        function normalizeToiletType(rawType, rawType2, rawName) {
            const combined = `${rawType || ''} ${rawType2 || ''} ${rawName || ''}`;
            if (combined.includes('性別友善')) return '性別友善廁所';
            if (combined.includes('無障礙')) return '無障礙廁所';
            if (combined.includes('親子')) return '親子友善廁所';
            if (combined.includes('混合') || combined.includes('男女')) return '混合廁所';
            if (combined.includes('女廁') || combined.includes('女公廁')) return '女廁所';
            if (combined.includes('男廁') || combined.includes('男公廁')) return '男廁所';
            const cleaned = String(rawType || '').trim().replace(/公廁$/, '廁所');
            if (cleaned) return cleaned;
            return '混合廁所';
        }

        function buildIndexesAndDropdowns(records) {
            state.countyToTowns.clear();
            for (let i = 0; i < records.length; i++) {
                const t = records[i];
                t.normalizedType = normalizeToiletType(t.type, t.type2, t.name);
                if (!t.town) t.town = extractTownFromAddress(t.address, t.county, t.areacode || '');
                if (t.county) {
                    if (!state.countyToTowns.has(t.county)) state.countyToTowns.set(t.county, new Set());
                    if (t.town) state.countyToTowns.get(t.county).add(t.town);
                }
            }
            populateFilterSelectors();
        }

        function populateFilterSelectors() {
            const countySelect = document.getElementById('countyFilterSelect');
            const typeSelect = document.getElementById('typeFilterSelect');
            const counties = Array.from(state.countyToTowns.keys()).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            countySelect.innerHTML = `<option value="">全部縣市</option>` + counties.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

        function updateTownDropdown() {

                towns = Array.from(state.countyToTowns.get(selectedCounty)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));

        // ===================================================================
        // 6. 地圖初始化、06066-06.svg 目前位置標記與紅色公廁圖示
        // ===================================================================
        function probeTileServerOffDom(testUrl, timeoutMs = 2200) {
            return new Promise((resolve) => {
                let settled = false;
                const finish = (ok) => {
                    if (!settled) {
                        settled = true;
                        resolve(ok);
                    }
                };
                const timer = setTimeout(() => finish(false), timeoutMs);
                const img = new Image();
                img.onload = () => { clearTimeout(timer); finish(true); };
                img.onerror = () => { clearTimeout(timer); finish(false); };
                img.src = testUrl;
            });
        }

        function createFallbackCanvasGridLayer() {
            const OfflineGrid = L.GridLayer.extend({
                createTile: function(coords) {
                    const tile = document.createElement('canvas');
                    const sz = this.getTileSize();
                    tile.width = sz.x;
                    tile.height = sz.y;
                    const ctx = tile.getContext('2d');
                    ctx.fillStyle = '#EEF6F9';
                    ctx.fillRect(0, 0, sz.x, sz.y);
                    ctx.strokeStyle = '#D4E6EE';
                    ctx.lineWidth = 1;
                    for (let x = 0; x <= sz.x; x += 64) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, sz.y); ctx.stroke();
                    }
                    for (let y = 0; y <= sz.y; y += 64) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(sz.x, y); ctx.stroke();
                    }
                    return tile;
                }
            });
            return new OfflineGrid({ maxZoom: 19, attribution: 'Poopgle Map' });
        }

        async function attachVerifiedBaseTileLayer(mapInstance) {
            if (!mapInstance || typeof L === 'undefined') return;

            // 正式網站與本機環境優先使用原生 OpenStreetMap；預覽沙盒則避開阻擋來源，避免觸發 DOM 圖片報錯
            if (!IS_STRICT_SANDBOX) {
                const osmOk = await probeTileServerOffDom('https://tile.openstreetmap.org/14/13714/7021.png');
                if (osmOk) {
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap | Poopgle Map'
                    }).addTo(mapInstance);
                    return;
                }
            }

            const voyagerOk = await probeTileServerOffDom('https://a.basemaps.cartocdn.com/rastertiles/voyager/14/13714/7021.png');
            if (voyagerOk) {
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
                    subdomains: 'abcd',
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap | Poopgle Map'
                }).addTo(mapInstance);
                return;
            }

            createFallbackCanvasGridLayer().addTo(mapInstance);
        }

        function initMap() {
            if (typeof L === 'undefined') return;
            try {
                state.map = L.map('map', {
                    center: [24.9765, 121.3420],
                    zoom: 14,
                    preferCanvas: true,
                    zoomControl: false
                });
                L.control.zoom({ position: 'bottomright' }).addTo(state.map);

                attachVerifiedBaseTileLayer(state.map);

                state.markerLayerGroup = L.layerGroup().addTo(state.map);
                state.map.on('moveend', renderMapMarkersInViewport);
                state.map.on('popupclose', () => {
                    if (state.isUpdatingPopupInternally) return;
                    state.selectedToiletKey = null;
                    renderMapMarkersInViewport();
                    renderToiletList();
                });

                if (!IS_STRICT_SANDBOX) {
                    const locCandidates = ['./img/06066-06.svg', './06066-06.svg'];
                    let idx = 0;
                    const probeNext = () => {
                        if (idx >= locCandidates.length) return;
                        const url = locCandidates[idx++];
                        const img = new Image();
                        img.onload = () => {
                            state.customLocationAssetUrl = url;
                            updateUserMapLayer();
                        };
                        img.onerror = () => probeNext();
                        img.src = url;
                    };
                    probeNext();
                }

                const mapEl = document.getElementById('map');
                if (mapEl && typeof ResizeObserver !== 'undefined') {
                    const ro = new ResizeObserver(() => {
                        if (state.map) state.map.invalidateSize();
                    });
                    ro.observe(mapEl);
                }
                setTimeout(() => { if (state.map) state.map.invalidateSize(); }, 250);
            } catch (err) {
                console.warn('Map init warning:', err);
            }
        }

        function updateUserMapLayer() {
            if (state.userLat === null || state.userLng === null || !state.map || typeof L === 'undefined') return;
            const latLng = [state.userLat, state.userLng];

            const innerVisualHtml = state.customLocationAssetUrl
                ? `<img src="${state.customLocationAssetUrl}" alt="所在位置" class="w-11 h-11 object-contain poopgle-loc-bob" />`
                : `<svg viewBox="0 0 80 68" class="w-11 h-10 overflow-visible poopgle-loc-bob"><use href="#poopgleCurrentLocSymbol" /></svg>`;

            const userIcon = L.divIcon({
                className: 'poopgle-user-marker',
                html: `
                    <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;pointer-events:none;">
                        ${innerVisualHtml}
                    </div>
                `,
                iconSize: [48, 48],
                iconAnchor: [24, 24]
            });

            if (!state.userMarker) {
                state.userMarker = L.marker(latLng, {
                    icon: userIcon,
                    interactive: false,
                    keyboard: false,
                    zIndexOffset: 50
                }).addTo(state.map);
            } else {
                state.userMarker.setIcon(userIcon);
                state.userMarker.setLatLng(latLng);
            }

            if (!state.userCircle100m) {
                state.userCircle100m = L.circle(latLng, {
                    radius: 100,
                    interactive: false,
                    color: '#2A348C',
                    weight: 1.8,
                    dashArray: '5, 6',
                    fillColor: '#FF99D3',
                    fillOpacity: 0.10
                }).addTo(state.map);
            } else {
                state.userCircle100m.setLatLng(latLng);
            }
        }

        function renderMapMarkersInViewport() {
            if (!state.map || !state.markerLayerGroup || typeof L === 'undefined') return;
            state.markerLayerGroup.clearLayers();
            if (state.allToilets.length === 0) return;

            const bounds = state.map.getBounds();
            const south = bounds.getSouth(), north = bounds.getNorth(), west = bounds.getWest(), east = bounds.getEast();
            const sourceList = state.filteredToilets.length > 0 || state.searchQuery || state.countyFilter || state.townFilter || state.typeFilter || state.onlyFavorites || state.radiusFilter !== '0'
                ? state.filteredToilets
                : state.allToilets;

            const inView = [];
            for (let i = 0; i < sourceList.length; i++) {
                const t = sourceList[i];
                if (t.lat >= south && t.lat <= north && t.lng >= west && t.lng <= east) {
                    inView.push(t);
                    if (inView.length >= 450) break;
                }
            }
            if (state.selectedToiletKey && !inView.some(item => item.key === state.selectedToiletKey)) {
                const selectedItem = state.allToilets.find(item => item.key === state.selectedToiletKey);
                if (selectedItem) inView.push(selectedItem);
            }

            inView.forEach((t) => {
                const isSelected = t.key === state.selectedToiletKey;
                const visualSize = isSelected ? 38 : 32;
                const hitSize = visualSize + 6; // 完整覆蓋整個圓圈與邊框緩衝

                // 女廁粉色 (#FF99D3)、男廁藍色 (#80E4FF)、其他黃色 (#F3EF84)
                const toiletType = t.normalizedType || normalizeToiletType(t.type, t.type2, t.name);
                let pinBgColor = '#F3EF84';
                if (toiletType === '女廁所') {
                    pinBgColor = '#FF99D3';
                } else if (toiletType === '男廁所') {
                    pinBgColor = '#80E4FF';
                }

                const ringStyle = isSelected
                    ? 'border:3px solid #FFFFFF;box-shadow:0 0 0 2.5px #2A348C, 0 4px 10px rgba(0,0,0,0.28);'
                    : 'border:2px solid #2A348C;box-shadow:0 2px 5px rgba(42,52,140,0.25);';

                const icon = L.divIcon({
                    className: 'poopgle-restroom-pin',
                    html: `
                        <div style="width:${visualSize}px;height:${visualSize}px;border-radius:9999px;background:${pinBgColor};${ringStyle}display:flex;align-items:center;justify-content:center;pointer-events:none;flex-shrink:0;">
                            <svg viewBox="0 0 24 24" width="${visualSize * 0.62}" height="${visualSize * 0.62}" fill="#2A348C" style="pointer-events:none;">
                                <circle cx="7.5" cy="5.5" r="2" />
                                <path d="M 5,9 L 10,9 L 10,14.5 L 8.8,14.5 L 8.8,20 L 6.2,20 L 6.2,14.5 L 5,14.5 Z" />
                                <rect x="11.5" y="4.5" width="1.2" height="15.5" rx="0.6" />
                                <circle cx="16.8" cy="5.5" r="2" />
                                <path d="M 15,9 L 18.6,9 L 20.4,15 L 18.3,15 L 18.3,20 L 15.3,20 L 15.3,15 L 13.2,15 Z" />
                            </svg>
                        </div>
                    `,
                    iconSize: [hitSize, hitSize],
                    iconAnchor: [hitSize / 2, hitSize / 2]
                });

                const marker = L.marker([t.lat, t.lng], {
                    icon,
                    zIndexOffset: isSelected ? 1000 : 200
                });

                let lastPinActivateTs = 0;
                const activatePin = (ev) => {
                    if (ev) {
                        if (typeof ev.stopPropagation === 'function') ev.stopPropagation();
                        if (ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
                    }
                    const now = Date.now();
                    if (now - lastPinActivateTs < 250) return;
                    lastPinActivateTs = now;
                    openToiletPopupOnMarker(t);
                };

                const attachPinDomEvents = () => {
                    const el = marker.getElement();
                    if (!el || el._poopglePinBound) return;
                    el._poopglePinBound = true;

                    let downX = null;
                    let downY = null;

                    // 記錄按下的起點座標（不攔截事件，讓地圖拖曳狀態正常重置）
                    el.addEventListener('mousedown', (ev) => {
                        downX = ev.clientX;
                        downY = ev.clientY;
                    }, { passive: true });

                    el.addEventListener('touchstart', (ev) => {
                        if (ev.touches && ev.touches.length === 1) {
                            downX = ev.touches[0].clientX;
                            downY = ev.touches[0].clientY;
                        } else {
                            downX = null;
                            downY = null;
                        }
                    }, { passive: true });

                    // 直接在整個圓形容器上觸發點擊（容許 14px 內微幅手震，拖曳超過 14px 則視為移動地圖）
                    el.addEventListener('click', (ev) => {
                        if (downX !== null && downY !== null) {
                            const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY);
                            downX = null;
                            downY = null;
                            if (moved > 14) return;
                        }
                        ev.stopPropagation();
                        activatePin(ev);
                    });

                    el.addEventListener('touchend', (ev) => {
                        if (downX === null || downY === null || !ev.changedTouches || ev.changedTouches.length !== 1) return;
                        const moved = Math.hypot(ev.changedTouches[0].clientX - downX, ev.changedTouches[0].clientY - downY);
                        downX = null;
                        downY = null;
                        if (moved <= 14) {
                            if (ev.cancelable) ev.preventDefault();
                            ev.stopPropagation();
                            activatePin(ev);
                        }
                    }, { passive: false });
                };

                marker.on('click', activatePin);
                marker.on('add', attachPinDomEvents);
                state.markerLayerGroup.addLayer(marker);
                attachPinDomEvents();
            });
        }

        // ===================================================================
        // 7. GPS 定位與距離篩選渲染
        // ===================================================================
        let geoWatchId = null;
        let isWaitingInitialGeo = true;
        let geoFallbackTimer = null;

        function hasSharedToiletUrlParam() {
            try {
                return Boolean((new URLSearchParams(window.location.search).get('toilet') || '').trim());
            } catch (e) {
                return false;
            }
        }

        function setUserPosition(lat, lng, panMap = true) {
            isWaitingInitialGeo = false;
            if (geoFallbackTimer) {
                clearTimeout(geoFallbackTimer);
                geoFallbackTimer = null;
            }
            state.userLat = lat;
            state.userLng = lng;
            updateUserMapLayer();

            if (state._pendingFocusNearest) {
                state._pendingFocusNearest = false;
                window.locateNearestToilet();
                return;
            }

            const allowPan = panMap && (!hasSharedToiletUrlParam() || state._manualLocateTriggered);
            if (allowPan && state.map) {
                state.map.setView([lat, lng], 16);
            }
            refreshDistancesAndRender();
            if (state.selectedToiletKey) {
                const sel = state.allToilets.find(t => t.key === state.selectedToiletKey);
                if (sel) refreshOpenToiletPopup(sel);
            }
        }

        function triggerUserGeolocation(isManualClick = false) {
            if (isManualClick) state._manualLocateTriggered = true;
            if (geoFallbackTimer) {
                clearTimeout(geoFallbackTimer);
                geoFallbackTimer = null;
            }

            if (!navigator.geolocation) {
                isWaitingInitialGeo = false;
                state._pendingFocusNearest = false;
                if ((IS_IN_IFRAME || IS_STRICT_SANDBOX) && state.userLat === null) {
                    setUserPosition(24.9852, 121.3418, false);
                } else {
                    if (isManualClick) showToast('您的瀏覽器不支援 GPS 定位功能', 'error');
                    refreshDistancesAndRender();
                }
                return;
            }

            if (isManualClick) {
                showToast('正在定位您的當前位置...', 'info');
            } else if (state.userLat === null && state.allToilets.length === 0) {
                isWaitingInitialGeo = true;
                renderToiletList();
            }

            // 保底機制：超過 3 秒沒收到定位結果（例如未按允許、或 LINE/IG 擋定位），自動先解鎖顯示公廁列表
            geoFallbackTimer = setTimeout(() => {
                geoFallbackTimer = null;
                if (isWaitingInitialGeo) {
                    isWaitingInitialGeo = false;
                    refreshDistancesAndRender();
                }
                if (isManualClick && state.userLat === null) {
                    state._pendingFocusNearest = false;
                    showToast('定位逾時，請確認位置權限或改用 Safari / Chrome 開啟', 'error');
                }
            }, isManualClick ? 8500 : 3000);

            if (geoWatchId !== null) {
                navigator.geolocation.clearWatch(geoWatchId);
                geoWatchId = null;
            }

            let hasCenteredOnce = false;
            const handlePos = (pos) => {
                const { latitude, longitude } = pos.coords;
                if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
                isWaitingInitialGeo = false;
                if (geoFallbackTimer) {
                    clearTimeout(geoFallbackTimer);
                    geoFallbackTimer = null;
                }
                if (hasCenteredOnce && state.userLat !== null && state.userLng !== null) {
                    const movedMeters = calculateDistanceMeters(state.userLat, state.userLng, latitude, longitude);
                    if (movedMeters < 10) return;
                }
                const shouldPan = !hasCenteredOnce && (isManualClick || !hasSharedToiletUrlParam());
                hasCenteredOnce = true;
                setUserPosition(latitude, longitude, shouldPan);
            };

            const handleFinalGeoError = () => {
                isWaitingInitialGeo = false;
                if (geoFallbackTimer) {
                    clearTimeout(geoFallbackTimer);
                    geoFallbackTimer = null;
                }
                state._pendingFocusNearest = false;
                if ((IS_IN_IFRAME || IS_STRICT_SANDBOX) && state.userLat === null) {
                    setUserPosition(24.9852, 121.3418, false);
                } else {
                    if (isManualClick) showToast('無法取得定位訊號，請確認瀏覽器位置權限已開啟', 'error');
                    refreshDistancesAndRender();
                }
            };

            // 先嘗試高精準定位，若桌機逾時失敗則立即改用一般網路定位備援
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    handlePos(pos);
                    if (isManualClick) showToast('已定位至您的當前位置！', 'success');
                },
                () => {
                    navigator.geolocation.getCurrentPosition(
                        (pos2) => {
                            handlePos(pos2);
                            if (isManualClick) showToast('已定位至您的當前位置！', 'success');
                        },
                        handleFinalGeoError,
                        { enableHighAccuracy: false, timeout: 4500, maximumAge: 60000 }
                    );
                },
                { enableHighAccuracy: true, timeout: 3500, maximumAge: 30000 }
            );

            geoWatchId = navigator.geolocation.watchPosition(handlePos, () => {}, {
                enableHighAccuracy: false,
                timeout: 15000,
                maximumAge: 10000
            });
        }

        function refreshDistancesAndRender() {
            const q = state.searchQuery.trim().toLowerCase();
            const results = [];

            for (let i = 0; i < state.allToilets.length; i++) {
                const t = state.allToilets[i];
                t.distance = (state.userLat !== null && state.userLng !== null)
                    ? calculateDistanceMeters(state.userLat, state.userLng, t.lat, t.lng)
                    : Infinity;

                if (state.onlyFavorites && !state.savedToiletKeys.has(getToiletFavoriteId(t))) continue;
                if (state.countyFilter && t.county !== state.countyFilter) continue;
                if (state.townFilter && t.town !== state.townFilter) continue;

                const stats = getToiletReviewStats(t.name);
                if (state.typeFilter) {
                    if (state.typeFilter === '已有網友評鑑') {
                        if (!stats || stats.count === 0) continue;
                    } else if ((t.normalizedType || t.type) !== state.typeFilter) {
                        continue;
                    }
                }

                if (q) {
                    const hay = `${t.name || ''} ${t.address || ''} ${t.normalizedType || ''}`.toLowerCase();
                    if (!hay.includes(q)) continue;
                }

                if (state.radiusFilter !== '0') {
                    if (state.userLat === null || state.userLng === null) continue;
                    if (state.radiusFilter === '100' && t.distance > 100) continue;
                    if (state.radiusFilter === '500' && t.distance > 500) continue;
                    if (state.radiusFilter === '1000plus' && t.distance < 1000) continue;
                }

                results.push(t);
            }

            results.sort((a, b) => {
                if (state.userLat !== null && state.userLng !== null) {
                    const distA = Number.isFinite(a.distance) ? a.distance : Infinity;
                    const distB = Number.isFinite(b.distance) ? b.distance : Infinity;
                    if (distA !== distB) return distA - distB;
                }
                return a.idx - b.idx;
            });

            state.filteredToilets = results;
            state.renderedLimit = 60;

            const badgeEl = document.getElementById('datasetCountBadge');
            if (badgeEl) {
                badgeEl.textContent = (!isWaitingInitialGeo && results.length > 0) ? `${results.length.toLocaleString()} 間` : '';
            }

            renderToiletList();
            renderMapMarkersInViewport();
            tryFocusSharedToiletFromUrl();
        }

        // ===================================================================
        // 8. 渲染左側公廁列表與同步自訂黃色捲軸
        // ===================================================================
        function syncCustomListScrollbar() {
            const container = document.getElementById('toiletListContainer');
            const track = document.getElementById('listScrollTrack');
            const thumb = document.getElementById('listScrollThumb');
            if (!container || !track || !thumb) return;

            const maxScroll = container.scrollHeight - container.clientHeight;
            const trackH = track.clientHeight;
            const thumbH = Math.max(28, Math.min(trackH * 0.42, trackH));
            thumb.style.height = `${thumbH}px`;

            if (maxScroll <= 1) {
                thumb.style.transform = `translateY(0px)`;
                return;
            }
            const ratio = Math.min(1, Math.max(0, container.scrollTop / maxScroll));
            const maxThumbTop = Math.max(0, trackH - thumbH);
            thumb.style.transform = `translateY(${(ratio * maxThumbTop).toFixed(1)}px)`;
        }

        function renderToiletList() {
            const container = document.getElementById('toiletListContainer');
            if (!container) return;

            // 1. 全國公廁 CSV 尚未下載完畢時，持續顯示載入畫面（避免先按拒絕定位就誤閃「找不到公廁」）
            if (state.allToilets.length === 0 && !state.datasetLoadFinished) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-5 text-[#2A348C] font-bold text-xs space-y-2">
                        <i class="fa-solid fa-spinner fa-spin text-lg"></i>
                        <span>正在載入全國公廁資料...</span>
                    </div>`;
                setTimeout(syncCustomListScrollbar, 20);
                return;
            }

            // 2. 若手機網路瞬斷導致 CSV 下載失敗，提供一鍵重新載入按鈕
            if (state.allToilets.length === 0 && state.datasetLoadFinished) {
                container.innerHTML = `
                    <div class="bg-[#FFF9EC] rounded-2xl p-5 text-center text-[#2A348C] space-y-2.5">
                        <div class="font-black text-sm">公廁資料載入未完成</div>
                        <p class="text-xs font-bold opacity-75">可能因行動網路不穩導致中斷，請點擊下方重新載入</p>
                        <button type="button" onclick="window.location.reload()" class="pm-flat-btn px-4 py-1.5 rounded-full bg-[#F3EF84] border-2 border-[#2A348C] text-xs font-black">重新載入</button>
                    </div>`;
                setTimeout(syncCustomListScrollbar, 20);
                return;
            }

            // 3. 資料已就緒、等待初始定位排序中（最多等 3 秒即自動顯示）
            if (state.userLat === null && isWaitingInitialGeo) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-5 text-[#2A348C] font-bold text-xs space-y-2">
                        <i class="fa-solid fa-spinner fa-spin text-lg"></i>
                        <span>正在定位並載入附近公廁...</span>
                    </div>`;
                setTimeout(syncCustomListScrollbar, 20);
                return;
            }

            if (state.filteredToilets.length === 0) {
                if (state.onlyFavorites && state.savedToiletKeys.size === 0) {
                    container.innerHTML = `
                        <div class="bg-[#FFF9EC] rounded-2xl p-5 text-center text-[#2A348C] space-y-1.5">
                            <div class="font-black text-sm">尚未加入常用公廁</div>
                            <p class="text-xs font-bold opacity-75">點擊地圖上任一公廁的「存到常用」即可收藏於此處！</p>
                        </div>`;
                } else if (state.radiusFilter !== '0' && state.userLat === null) {
                    container.innerHTML = `
                        <div class="bg-[#FFF9EC] rounded-2xl p-5 text-center text-[#2A348C] space-y-2">
                            <div class="font-black text-sm">尚未取得目前位置</div>
                            <p class="text-xs font-bold opacity-75">請點擊地圖左下角「定位最近公廁」，或切回下方「All」瀏覽全部公廁</p>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div class="bg-[#FFF9EC] rounded-2xl p-5 text-center text-[#2A348C] space-y-1.5">
                            <div class="font-black text-sm">找不到符合條件的公廁</div>
                            <p class="text-xs font-bold opacity-70">請嘗試調整搜尋關鍵字、區域或距離範圍</p>
                        </div>`;
                }
                setTimeout(syncCustomListScrollbar, 20);
                return;
            }

            const isLoggedIn = Boolean(getCurrentUserUid());
            const visibleItems = state.filteredToilets.slice(0, state.renderedLimit);
            container.innerHTML = visibleItems.map((t) => {
                const displayType = t.normalizedType || normalizeToiletType(t.type, t.type2, t.name);
                const stats = getToiletReviewStats(t.name);
                const isSelected = t.key === state.selectedToiletKey;
                const isSavedFav = isLoggedIn && state.savedToiletKeys.has(getToiletFavoriteId(t));
                const gmapNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(t.lat + ',' + t.lng)}`;
                const ratingTag = stats ? ` · ${stats.avgOverall}★(${stats.count})` : '';
                const distTag = Number.isFinite(t.distance)
                    ? (t.distance < 1000 ? ` · ${Math.round(t.distance)}m` : ` · ${(t.distance / 1000).toFixed(1)}km`)
                    : '';

                const favStarBadgeHtml = isSavedFav
                    ? `<svg viewBox="0 0 28 28" class="w-5 h-5 absolute -top-1 -right-1 pointer-events-none drop-shadow-sm" style="transform: rotate(10deg);">
                           <path d="M 14,1.8 L 17.6,9.2 L 25.8,10.4 L 19.9,16.1 L 21.3,24.2 L 14,20.4 L 6.7,24.2 L 8.1,16.1 L 2.2,10.4 L 10.4,9.2 Z"
                                 fill="#FF5C97" />
                       </svg>`
                    : '';

                const rightButtonsHtml = isLoggedIn
                    ? `<div class="grid grid-cols-2 gap-2 shrink-0 items-center justify-items-center">
                           <button type="button" data-action="reviews" data-key="${escapeHtml(t.key)}"
                                   class="pm-flat-btn w-[38px] h-[38px] rounded-full bg-[#FF99D3] flex items-center justify-center focus:outline-none"
                                   title="查看評論">
                               <svg viewBox="0 0 36 36" class="w-6 h-6 pointer-events-none">
                                   <ellipse cx="14" cy="15.5" rx="8.5" ry="7" fill="#80E4FF" />
                                   <polygon points="8.5,19.5 6,24.5 12.5,21.5" fill="#80E4FF" />
                                   <ellipse cx="22.5" cy="19.5" rx="7.8" ry="6.4" fill="#FFF9EC" />
                                   <polygon points="27,23.5 30,27.5 23.5,25" fill="#FFF9EC" />
                               </svg>
                           </button>

                           <button type="button" data-action="save" data-key="${escapeHtml(t.key)}"
                                   class="pm-flat-btn w-[38px] h-[38px] rounded-full bg-[#F3EF84] border-2 ${isSavedFav ? 'border-[#FF99D3]' : 'border-transparent'} flex items-center justify-center overflow-hidden focus:outline-none"
                                   title="${isSavedFav ? '從常用移除' : '存到常用'}">
                               <svg viewBox="0 0 44 42" class="w-7 h-7 pointer-events-none block">
                                   <use href="#poopgleSaveSpiritSymbol" />
                               </svg>
                           </button>
