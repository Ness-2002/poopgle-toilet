                           <a href="${gmapNavUrl}" target="_blank" rel="noopener noreferrer" data-action="nav"
                              class="pm-flat-btn w-[38px] h-[38px] rounded-full bg-[#FF99D3] flex items-center justify-center no-underline"
                              title="開啟 Google Maps 導航">
                               <svg viewBox="0 0 36 36" class="w-7 h-7 pointer-events-none">
                                   <polygon points="18,4.5 31.5,18 18,31.5 4.5,18" fill="#80E4FF" />
                                   <path d="M 13.5,22 L 13.5,16.5 Q 13.5,14.5 15.5,14.5 L 19.5,14.5 L 19.5,11.5 L 24.5,16.2 L 19.5,21 L 19.5,18 L 16.8,18 L 16.8,22 Z" fill="#FFF9EC" />
                               </svg>
                           </a>
                       </div>`
                    : `<div class="flex flex-col gap-2 shrink-0 items-center justify-center">
                           <button type="button" data-action="reviews" data-key="${escapeHtml(t.key)}"
                                   class="pm-flat-btn w-[38px] h-[38px] rounded-full bg-[#FF99D3] flex items-center justify-center focus:outline-none"
                                   title="查看評論">
                               <svg viewBox="0 0 36 36" class="w-6 h-6 pointer-events-none">
                                   <ellipse cx="14" cy="15.5" rx="8.5" ry="7" fill="#80E4FF" />
                                   <polygon points="8.5,19.5 6,24.5 12.5,21.5" fill="#80E4FF" />
                                   <ellipse cx="22.5" cy="19.5" rx="7.8" ry="6.4" fill="#FFF9EC" />
                                   <polygon points="27,23.5 30,27.5 23.5,25" fill="#FFF9EC" />
                               </svg>
                           </button>

                           <a href="${gmapNavUrl}" target="_blank" rel="noopener noreferrer" data-action="nav"
                              class="pm-flat-btn w-[38px] h-[38px] rounded-full bg-[#FF99D3] flex items-center justify-center no-underline"
                              title="開啟 Google Maps 導航">
                               <svg viewBox="0 0 36 36" class="w-7 h-7 pointer-events-none">
                                   <polygon points="18,4.5 31.5,18 18,31.5 4.5,18" fill="#80E4FF" />
                                   <path d="M 13.5,22 L 13.5,16.5 Q 13.5,14.5 15.5,14.5 L 19.5,14.5 L 19.5,11.5 L 24.5,16.2 L 19.5,21 L 19.5,18 L 16.8,18 L 16.8,22 Z" fill="#FFF9EC" />
                               </svg>
                           </a>
                       </div>`;

                return `
                  <div data-card-key="${escapeHtml(t.key)}"
                       class="toilet-list-card relative bg-[#FFF9EC] rounded-[18px] border-2 ${isSelected ? 'border-[#2A348C] shadow-sm' : 'border-transparent'} px-4 py-3 cursor-pointer transition-all hover:brightness-[1.01] flex items-center justify-between gap-2.5">
                      ${favStarBadgeHtml}
                      <div class="min-w-0 flex-1 pr-1">
                          <h4 class="text-[#2A348C] text-[15.5px] font-black tracking-wide leading-snug break-words">
                              ${escapeHtml(t.name)}
                          </h4>
                          <div class="text-[#F26559] text-[12px] font-extrabold mt-1 tracking-wide">
                              ★ ${escapeHtml(displayType)}${escapeHtml(ratingTag)}${escapeHtml(distTag)}
                          </div>
                          <div class="flex items-start gap-1.5 text-[#2A348C] text-[12px] font-bold mt-1 leading-snug">
                              <i class="fa-solid fa-location-dot text-[12px] mt-0.5 shrink-0"></i>
                              <span class="break-words">${escapeHtml(t.address || '無詳細地址')}</span>
                          </div>
                      </div>

                      ${rightButtonsHtml}
                  </div>
              `;
            }).join('');

            if (!container._hasDelegatedClick) {
                container._hasDelegatedClick = true;
                container.addEventListener('click', (e) => {
                    const cardEl = e.target.closest('.toilet-list-card');
                    if (!cardEl || !container.contains(cardEl)) return;

                    const key = cardEl.getAttribute('data-card-key');
                    const toilet = state.allToilets.find(item => item.key === key);
                    if (!toilet) return;

                    const actionBtn = e.target.closest('[data-action]');
                    if (actionBtn) {
                        const act = actionBtn.getAttribute('data-action');
                        if (act === 'reviews') {
                            e.stopPropagation();
                            window.openToiletReviewsModal(key);
                            return;
                        }
                        if (act === 'save') {
                            e.stopPropagation();
                            toggleSaveToiletFavorite(toilet);
                            return;
                        }
                        if (act === 'nav') {
                            e.stopPropagation();
                            return;
                        }
                    }

                    window.focusToiletOnMap(key);
                });
            }

            setTimeout(syncCustomListScrollbar, 20);
        }

        window.focusToiletOnMap = function(toiletKey) {
            const toilet = state.allToilets.find(t => t.key === toiletKey);
            if (!toilet || !state.map) return;

            if (state.activeToiletPopup && state.map.hasLayer(state.activeToiletPopup)) {
                state.isUpdatingPopupInternally = true;
                state.map.closePopup(state.activeToiletPopup);
                state.isUpdatingPopupInternally = false;
            }

            state.map.invalidateSize();
            const targetZoom = Math.max(state.map.getZoom(), 17);

            if (isMobileMapViewport()) {
                state.map.setView([toilet.lat, toilet.lng], targetZoom, { animate: false });
                openToiletPopupOnMarker(toilet);
                document.querySelector('.squat-toilet-map-well')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                const mapSize = state.map.getSize();
                const verticalOffset = Math.min(135, Math.round((mapSize.y || 480) * 0.27));
                const pt = state.map.project([toilet.lat, toilet.lng], targetZoom);
                pt.y -= verticalOffset;
                const offsetCenter = state.map.unproject(pt, targetZoom);
                state.map.setView(offsetCenter, targetZoom, { animate: false });
                openToiletPopupOnMarker(toilet);
            }
        };

        window.locateNearestToilet = function() {
            // 1. 若已有選取的公廁，先取消選取並關閉對話框／手機版資訊卡
            if (state.map && state.activeToiletPopup) {
                state.isUpdatingPopupInternally = true;
                state.map.closePopup(state.activeToiletPopup);
                state.isUpdatingPopupInternally = false;
            }
            hideMobileInlineDetailPanel();
            state.selectedToiletKey = null;
            renderMapMarkersInViewport();
            updateSelectedCardHighlight();

            const listContainer = document.getElementById('toiletListContainer');
            if (listContainer) listContainer.scrollTop = 0;

            // 2. 若尚未取得目前座標，先啟動定位，完成後自動跳轉最近公廁
            if (state.userLat === null || state.userLng === null) {
                state._pendingFocusNearest = true;
                triggerUserGeolocation(true);
                return;
            }

            // 3. 重新計算距離並找出最近的公廁
            refreshDistancesAndRender();

            let nearest = null;
            if (state.filteredToilets.length > 0 && state.radiusFilter !== '1000plus' && !state.countyFilter && !state.townFilter) {
                nearest = state.filteredToilets[0];
            } else if (state.allToilets.length > 0) {
                let minDist = Infinity;
                for (let i = 0; i < state.allToilets.length; i++) {
                    const t = state.allToilets[i];
                    const d = calculateDistanceMeters(state.userLat, state.userLng, t.lat, t.lng);
                    t.distance = d;
                    if (d < minDist) {
                        minDist = d;
                        nearest = t;
                    }
                }
            }

            if (!nearest) {
                showToast('目前找不到可定位的公廁資料', 'error');
                return;
            }

            // 4. 定點至該最近公廁並顯示對話框
            window.focusToiletOnMap(nearest.key);
            const distLabel = Number.isFinite(nearest.distance)
                ? (nearest.distance < 1000 ? `（距離約 ${Math.round(nearest.distance)}m）` : `（距離約 ${(nearest.distance / 1000).toFixed(1)}km）`)
                : '';
            showToast(`已定位最近公廁：${nearest.name}${distLabel}`, 'success');
        };

        function tryFocusSharedToiletFromUrl() {
            if (state._sharedToiletDone) return;
            let rawParam = '';
            try {
                rawParam = (new URLSearchParams(window.location.search).get('toilet') || '').trim();
            } catch (e) {}
            if (!rawParam || !state.map || !state.allToilets || state.allToilets.length === 0) return;

            if (window._sharedFocusTimer) clearTimeout(window._sharedFocusTimer);
            window._sharedFocusTimer = setTimeout(() => {
                if (state._sharedToiletDone || !state.map) return;

                let decoded = rawParam;
                try { decoded = decodeURIComponent(rawParam); } catch (e) {}
                const numPrefix = decoded.replace(/_\d+$/, '');

                const target = state.allToilets.find(t => t.key === decoded)
                    || state.allToilets.find(t => String(t.number) === numPrefix)
                    || state.allToilets.find(t => t.name === decoded);

                if (!target) return;

                state._sharedToiletDone = true;
                state.map.invalidateSize();

                const targetZoom = 17;
                if (isMobileMapViewport()) {
                    state.map.setView([target.lat, target.lng], targetZoom, { animate: false });
                } else {
                    const mapSize = state.map.getSize();
                    const verticalOffset = Math.min(135, Math.round((mapSize.y || 480) * 0.27));
                    const pt = state.map.project([target.lat, target.lng], targetZoom);
                    pt.y -= verticalOffset;
                    const offsetCenter = state.map.unproject(pt, targetZoom);
                    state.map.setView(offsetCenter, targetZoom, { animate: false });
                }
                openToiletPopupOnMarker(target);
            }, 350);
        }

        // ===================================================================
        // 9. DOM 事件綁定與啟動流程
        // ===================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            renderCyanBackgroundHalftoneDots();
            window.addEventListener('resize', renderCyanBackgroundHalftoneDots);

            initMapTopLeftLogoAndSpiritAssets();
            loadSavedFavoriteKeys();
            if (auth) {
                auth.onAuthStateChanged((user) => {
                    if (user && user.uid) {
                        try {
                            const cached = JSON.parse(localStorage.getItem('poogle_auth_user') || 'null');
                            if (!cached || cached.uid !== user.uid) {
                                localStorage.setItem('poogle_auth_user', JSON.stringify({
                                    uid: user.uid,
                                    displayName: user.displayName || '探險家',
                                    email: user.email || '',
                                    photoURL: user.photoURL || ''
                                }));
                            }
                        } catch (e) {}
                    }
                    updateFavoriteFilterUi();
                    refreshDistancesAndRender();
                    if (state.selectedToiletKey) {
                        const sel = state.allToilets.find(t => t.key === state.selectedToiletKey);
                        if (sel) refreshOpenToiletPopup(sel);
                    }
                });
            }
            initMap();
            startRealtimeCloudReviewsListener();

             const searchInput = document.getElementById('searchInput');
            const mobileSearchInput = document.getElementById('mobileSearchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            const handleSearchChange = (val) => {
                state.searchQuery = val;
                if (searchInput && searchInput.value !== val) searchInput.value = val;
                if (mobileSearchInput && mobileSearchInput.value !== val) mobileSearchInput.value = val;
                clearSearchBtn?.classList.toggle('hidden', !state.searchQuery);
                refreshDistancesAndRender();
            };

            searchInput?.addEventListener('input', (e) => handleSearchChange(e.target.value));
            mobileSearchInput?.addEventListener('input', (e) => handleSearchChange(e.target.value));
            clearSearchBtn?.addEventListener('click', () => handleSearchChange(''));

            // 綁定手機版右下角「返回公廁列表」粉色按鈕
            document.getElementById('mobileBackToListBtn')?.addEventListener('click', (e) => {
                window.closeActiveToiletPopup(e);
            });

            document.getElementById('countyFilterSelect').addEventListener('change', (e) => {
                state.countyFilter = e.target.value;
                document.getElementById('countyBtnLabel').textContent = state.countyFilter || '縣市';
                document.getElementById('countyFilterBox').className = `pm-flat-btn relative h-[32px] md:h-[38px] lg:h-[42px] ${state.countyFilter ? 'bg-[#F3EF84]' : 'bg-[#FF99D3]'} flex items-center justify-center px-1 cursor-pointer`;
                updateTownDropdown();
                refreshDistancesAndRender();
                if (state.countyFilter && state.filteredToilets.length > 0 && state.map) {
                    state.map.setView([state.filteredToilets[0].lat, state.filteredToilets[0].lng], 13);
                }
            });

            document.getElementById('townFilterSelect').addEventListener('change', (e) => {
                state.townFilter = e.target.value;
                document.getElementById('townBtnLabel').textContent = state.townFilter || '鄉鎮';
                document.getElementById('townFilterBox').className = `pm-flat-btn relative h-[32px] md:h-[38px] lg:h-[42px] ${state.townFilter ? 'bg-[#F3EF84]' : 'bg-[#FF99D3]'} flex items-center justify-center px-1 cursor-pointer`;
                refreshDistancesAndRender();
                if (state.townFilter && state.filteredToilets.length > 0 && state.map) {
                    state.map.setView([state.filteredToilets[0].lat, state.filteredToilets[0].lng], 15);
                }
            });

            document.getElementById('typeFilterSelect').addEventListener('change', (e) => {
                state.typeFilter = e.target.value;
                const labelEl = document.getElementById('typeBtnLabel');
                const unifiedLabel = state.typeFilter || '類型';
                labelEl.textContent = unifiedLabel;
                if (!state.typeFilter) {
                    labelEl.className = 'text-[#2A348C] text-[13px] md:text-[14px] lg:text-[15px] font-black md:font-semibold tracking-widest truncate pointer-events-none';
                } else if (unifiedLabel.length >= 6) {
                    labelEl.className = 'text-[#2A348C] text-[10px] lg:text-[11px] font-black md:font-semibold tracking-tighter truncate pointer-events-none';
                } else if (unifiedLabel.length >= 4) {
                    labelEl.className = 'text-[#2A348C] text-[11px] lg:text-[12px] font-black md:font-semibold tracking-tight truncate pointer-events-none';
                } else {
                    labelEl.className = 'text-[#2A348C] text-[12px] md:text-[13px] lg:text-[14px] font-black md:font-semibold tracking-wide truncate pointer-events-none';
                }
                document.getElementById('typeFilterBox').className = `pm-flat-btn relative h-[32px] md:h-[38px] lg:h-[42px] ${state.typeFilter ? 'bg-[#F3EF84]' : 'bg-[#FF99D3]'} flex items-center justify-center px-1 cursor-pointer`;
                refreshDistancesAndRender();
            });

            document.getElementById('favoriteFilterBtn').addEventListener('click', () => {
                state.onlyFavorites = !state.onlyFavorites;
                updateFavoriteFilterUi();
                refreshDistancesAndRender();
                showToast(state.onlyFavorites ? '已切換為顯示「常用公廁」' : '已切換為顯示全部公廁', 'info');
            });

            document.querySelectorAll('.radius-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const rad = btn.getAttribute('data-radius');
                    state.radiusFilter = rad;
                    document.querySelectorAll('.radius-btn').forEach((b) => {
                        const isAct = b.getAttribute('data-radius') === rad;
                        b.className = `radius-btn pm-flat-btn h-[32px] md:h-[36px] lg:h-[40px] ${isAct ? 'bg-[#F3EF84]' : 'bg-[#FF99D3]'} text-[#2A348C] text-xs lg:text-sm font-black tracking-wide flex items-center justify-center focus:outline-none`;
                    });
                    if (rad !== '0' && state.userLat === null) {
                        triggerUserGeolocation(true);
                    }
                    refreshDistancesAndRender();
                });
            });

            const listContainer = document.getElementById('toiletListContainer');
            const scrollTrack = document.getElementById('listScrollTrack');
            const scrollThumb = document.getElementById('listScrollThumb');

            listContainer.addEventListener('scroll', () => {
                syncCustomListScrollbar();
                if (listContainer.scrollTop + listContainer.clientHeight >= listContainer.scrollHeight - 80) {
                    if (state.renderedLimit < state.filteredToilets.length) {
                        state.renderedLimit += 60;
                        renderToiletList();
                    }
                }
            });

            document.getElementById('listScrollUpBtn').addEventListener('click', () => {
                listContainer.scrollBy({ top: -160, behavior: 'smooth' });
            });
            document.getElementById('listScrollDownBtn').addEventListener('click', () => {
                listContainer.scrollBy({ top: 160, behavior: 'smooth' });
            });

            let isDraggingThumb = false;
            let dragStartY = 0;
            let dragStartScrollTop = 0;

            scrollThumb.addEventListener('pointerdown', (e) => {
                isDraggingThumb = true;
                dragStartY = e.clientY;
                dragStartScrollTop = listContainer.scrollTop;
                scrollThumb.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });
            window.addEventListener('pointermove', (e) => {
                if (!isDraggingThumb) return;
                const trackH = scrollTrack.clientHeight;
                const thumbH = scrollThumb.clientHeight;
                const maxThumbMove = Math.max(1, trackH - thumbH);
                const maxScroll = Math.max(1, listContainer.scrollHeight - listContainer.clientHeight);
                const dy = e.clientY - dragStartY;
                listContainer.scrollTop = dragStartScrollTop + (dy / maxThumbMove) * maxScroll;
            });
            window.addEventListener('pointerup', () => {
                isDraggingThumb = false;
            });
            scrollTrack.addEventListener('click', (e) => {
                if (e.target === scrollThumb) return;
                const rect = scrollTrack.getBoundingClientRect();
                const clickRatio = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
                listContainer.scrollTop = clickRatio * (listContainer.scrollHeight - listContainer.clientHeight);
            });

            document.getElementById('btnLocateCurrentPos').addEventListener('click', () => {
                window.locateNearestToilet();
            });
            document.getElementById('btnPanToCurrentPos').addEventListener('click', () => {
                if (state.userLat !== null && state.userLng !== null && state.map) {
                    state.map.setView([state.userLat, state.userLng], 17);
                    showToast('已移動至您的目前位置', 'info');
                } else {
                    triggerUserGeolocation(true);
                }
            });

            document.getElementById('closeReviewsModalBtn').addEventListener('click', () => {
                document.getElementById('toiletReviewsModal').classList.add('hidden');
            });
            document.getElementById('toiletReviewsModal').addEventListener('click', (e) => {
                if (e.target.id === 'toiletReviewsModal') document.getElementById('toiletReviewsModal').classList.add('hidden');
            });

            const reportModal = document.getElementById('reportCommentModal');
            const closeReportModal = () => {
                state.pendingReportTarget = null;
                reportModal.classList.add('hidden');
            };
            document.getElementById('closeReportModalBtn').addEventListener('click', closeReportModal);
            document.getElementById('cancelReportBtn').addEventListener('click', closeReportModal);
            reportModal.addEventListener('click', (e) => {
                if (e.target === reportModal) closeReportModal();
            });

            document.getElementById('submitReportBtn').addEventListener('click', async () => {
                if (!state.pendingReportTarget) return;
                const submitBtn = document.getElementById('submitReportBtn');
                const reason = document.getElementById('reportReasonSelect').value;
                const note = document.getElementById('reportNoteInput').value.trim();

                submitBtn.disabled = true;
                submitBtn.textContent = '送出中...';
                try {
                    if (db) {
                        await db.collection('comment_reports').add({
                            evalId: state.pendingReportTarget.evalId,
                            toiletName: state.pendingReportTarget.toiletName,
                            reportedAuthor: state.pendingReportTarget.authorName,
                            reportedComment: state.pendingReportTarget.commentText,
                            reason,
                            note,
                            status: 'pending',
                            reportedAt: new Date().toISOString(),
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    closeReportModal();
                    showToast('已收到您的檢舉！將交由管理員人工審核。', 'success');
                } catch (err) {
                    showToast('檢舉送出失敗，請稍後再試', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '送出檢舉';
                }
            });

            // 手機版右上角漢堡選單與衛生紙捲筒下拉互動
            const mapMobileHamburgerBtn = document.getElementById('mapMobileHamburgerBtn');
            const mapTpRollDropdownMenu = document.getElementById('mapTpRollDropdownMenu');
            const mapUnderConstructionModal = document.getElementById('mapUnderConstructionModal');
            let mapTpDropdownCloseTimer = null;

            const closeMapTpDropdownMenu = (immediate = false) => {
                if (!mapTpRollDropdownMenu) return;
                if (mapTpDropdownCloseTimer) {
                    clearTimeout(mapTpDropdownCloseTimer);
                    mapTpDropdownCloseTimer = null;
                }
                mapMobileHamburgerBtn?.setAttribute('aria-expanded', 'false');
                if (immediate || (!mapTpRollDropdownMenu.classList.contains('is-open') && !mapTpRollDropdownMenu.classList.contains('is-closing'))) {
                    mapTpRollDropdownMenu.classList.remove('is-open', 'is-closing');
                    mapTpRollDropdownMenu.classList.add('hidden');
                    return;
                }
                mapTpRollDropdownMenu.classList.remove('is-open');
                void mapTpRollDropdownMenu.offsetWidth;
                mapTpRollDropdownMenu.classList.add('is-closing');
                mapTpDropdownCloseTimer = setTimeout(() => {
                    mapTpRollDropdownMenu.classList.remove('is-closing');
                    mapTpRollDropdownMenu.classList.add('hidden');
                    mapTpDropdownCloseTimer = null;
                }, 260);
            };

            const openMapTpDropdownMenu = () => {
                if (!mapTpRollDropdownMenu) return;
                if (mapTpDropdownCloseTimer) {
                    clearTimeout(mapTpDropdownCloseTimer);
                    mapTpDropdownCloseTimer = null;
                }
                mapTpRollDropdownMenu.classList.remove('hidden', 'is-closing');
                void mapTpRollDropdownMenu.offsetWidth;
                mapTpRollDropdownMenu.classList.add('is-open');
                mapMobileHamburgerBtn?.setAttribute('aria-expanded', 'true');
            };

            mapMobileHamburgerBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = mapTpRollDropdownMenu?.classList.contains('is-open') && !mapTpRollDropdownMenu?.classList.contains('is-closing');
                if (isOpen) closeMapTpDropdownMenu(false);
                else openMapTpDropdownMenu();
            });

            document.getElementById('closeMapUnderConstructionBtn')?.addEventListener('click', () => {
                mapUnderConstructionModal?.classList.add('hidden');
            });
            mapUnderConstructionModal?.addEventListener('click', (e) => {
                if (e.target === mapUnderConstructionModal) mapUnderConstructionModal.classList.add('hidden');
            });

            document.getElementById('mapTpMenuHomeBtn')?.addEventListener('click', () => {
                window.location.href = './index.html';
            });
            document.getElementById('mapTpMenuReportSystemBtn')?.addEventListener('click', () => {
                window.location.href = './index.html?openReport=1';
            });
            document.getElementById('mapTpMenuMapBtn')?.addEventListener('click', () => {
                closeMapTpDropdownMenu(false);
            });
            document.getElementById('mapTpMenuStatusBoardBtn')?.addEventListener('click', () => {
                window.location.href = './board.html';
            });
            document.getElementById('mapTpMenuMonsterDexBtn')?.addEventListener('click', () => {
                window.location.href = './handbook.html';
            });
            document.getElementById('mapTpMenuPersonalSpaceBtn')?.addEventListener('click', () => {
                const uid = getCurrentUserUid();
                window.location.href = uid ? './profile.html' : './index.html';
            });

            document.addEventListener('pointerdown', (e) => {
                if (!mapTpRollDropdownMenu || !mapTpRollDropdownMenu.classList.contains('is-open')) return;
                if (mapTpRollDropdownMenu.contains(e.target)) return;
                if (mapMobileHamburgerBtn && mapMobileHamburgerBtn.contains(e.target)) return;
                closeMapTpDropdownMenu(false);
            }, true);


            window.addEventListener('resize', () => {
                if (!isMobileMapViewport()) hideMobileInlineDetailPanel();
            });

            // 1. 啟動 GPS 定位（與資料讀取同步進行，不互相卡住）
            triggerUserGeolocation(false);

            // 2. 優先讀取 IndexedDB 快取公廁資料
            const cached = await loadDatasetFromIDB();
            if (cached && cached.records && cached.records.length > 0) {
                state.allToilets = cached.records;
                state.datasetLoadFinished = true;
                buildIndexesAndDropdowns(state.allToilets);
                refreshDistancesAndRender();
            }

            // 3. 自動讀取同資料夾 ./全國公廁建檔資料.csv (預覽視窗若無本機 CSV 則載入示範公廁展示完整介面)
            const autoLoaded = await autoFetchSameFolderCSV();
            state.datasetLoadFinished = true;
            if (!autoLoaded && state.allToilets.length === 0) {
                if (IS_IN_IFRAME || IS_STRICT_SANDBOX) {
                    state.allToilets = SANDBOX_DEMO_TOILETS.map(item => ({ ...item }));
                    buildIndexesAndDropdowns(state.allToilets);
                    refreshDistancesAndRender();
                } else {
                    renderToiletList();
                }
            }

            // 4. 若網址帶有 ?toilet= 參數，載入完畢後自動定點該公廁
            tryFocusSharedToiletFromUrl();
        });
    </script>
</body>
</html>
