<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有所味 Poopgle｜公廁實地評鑑系統</title>
    <link rel="preload" as="image" href="./img/logo.png">
    <script>
        window.addEventListener('error', function(e) {
            if (e && e.target && e.target !== window) {
                if (typeof e.target.onerror === 'function') {
                    try { e.target.onerror.call(e.target, e); } catch (err) {}
                }
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            if (e && (!e.error || e.message === 'Script error.' || (e.message && e.message.indexOf('ResizeObserver') !== -1))) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            var isSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').indexOf('usercontent.goog') !== -1 ||
                (window.location.hostname || '').indexOf('googleusercontent.com') !== -1
            );
            if (e && (!e.reason || !e.reason.message || isSandbox)) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts 圓體備援 + jf open 粉圓體 (jf-openhuninn) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        :root {
            --poogle-cream: #FFF9EC;
            --poogle-yellow: #F3EF84;
            --poogle-blue: #80E4FF;
            --poogle-pink: #FF99D3;
            --poogle-green: #45E5AC;
            --poogle-ink: #2A348C;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        button, a, input, select, textarea, svg, g, rect, path, circle, ellipse, polygon, use, image,
        [role="button"], [tabindex] {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible,
        a:focus, a:focus-visible,
        input:focus, input:focus-visible,
        textarea:focus, textarea:focus-visible,
        [role="button"]:focus, [role="button"]:focus-visible,
        [tabindex]:focus, [tabindex]:focus-visible,
        svg *:focus, svg *:focus-visible {
            outline: none !important;
        }
        /* 避免覆蓋 Tailwind 的 md:block / md:flex 響應式顯示類別 */
        .hidden:not(.md\:block):not(.md\:flex) {
            display: none !important;
        }
        @media (max-width: 767px) {
            .hidden.md\:block,
            .hidden.md\:flex {
                display: none !important;
            }
        }
        @font-face {
            font-family: 'jf-openhuninn';
            src: local('jf-openhuninn-2.1'),
                 local('jf-openhuninn-2.0'),
                 local('jf-openhuninn-1.1'),
                 local('jf-openhuninn'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-web-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }
        body, svg text {
            font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
        }
        body {
                margin: 0;
                padding: 0;
                font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
                background-color: var(--poogle-cream);
                color: var(--poogle-ink);
                width: 100vw;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
            }
            @media (min-width: 768px) {
                body {
                    height: 100vh;
                    overflow: hidden;
                }
            }
            /* 隱藏導覽列在小螢幕橫向滑動時的捲軸 */
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        /* 外層感應區保持固定不變形，徹底避免滑鼠靠近邊緣時因縮放造成 hover 震動 Bug */
        .star-interactive,
        .svg-action-btn,
        .logo-link-group {
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .star-visual-inner,
        .svg-action-inner,
        .logo-visual-inner {
            pointer-events: none;
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), filter 0.16s ease;
            transform-box: fill-box;
            transform-origin: center;
            will-change: transform;
        }
        .star-interactive:hover .star-visual-inner {
            transform: scale(1.12);
        }
        .star-interactive:active .star-visual-inner {
            transform: scale(0.94);
        }
        .svg-action-btn:hover .svg-action-inner {
            transform: translateY(-2px);
            filter: drop-shadow(0 3px 0 rgba(42, 52, 140, 0.22));
        }
        .svg-action-btn:active .svg-action-inner {
            transform: translateY(0px) scale(0.98);
        }
        /* 完成／更新回報 與 完成畫面三顆按鈕：移除 hover 位移與陰影，改為底色變淡 */
        :is(
            #finishRatingBtn,
            #mobileFinishRatingBtn,
            #inlineDownloadCardBtn,
            #inlineReturnHomeBtn,
            #inlineEditRatingBtn,
            #mobileInlineDownloadCardBtn,
            #mobileInlineReturnHomeBtn,
            #mobileInlineEditRatingBtn,
            #downloadToiletCardBtn,
            #resultReturnHomeBtn,
            #resultEditReportBtn
        ):hover .svg-action-inner {
            transform: none !important;
            filter: none !important;
        }

        :is(
            #finishRatingBtn,
            #mobileFinishRatingBtn,
            #inlineDownloadCardBtn,
            #inlineReturnHomeBtn,
            #inlineEditRatingBtn,
            #mobileInlineDownloadCardBtn,
            #mobileInlineReturnHomeBtn,
            #mobileInlineEditRatingBtn,
            #downloadToiletCardBtn,
            #resultReturnHomeBtn,
            #resultEditReportBtn
        ) .svg-action-inner :is(rect, ellipse) {
            transition: fill 0.18s ease, fill-opacity 0.18s ease;
        }

        /* 亮黃底按鈕 (完成 / 更新回報、返回主頁)：#F3EF84 -> #FAF8BE */
        :is(#finishRatingBtn, #mobileFinishRatingBtn, #inlineReturnHomeBtn, #mobileInlineReturnHomeBtn, #resultReturnHomeBtn) .svg-action-inner [fill="#F3EF84"] {
            fill: #F3EF84;
        }
        :is(#finishRatingBtn, #mobileFinishRatingBtn, #inlineReturnHomeBtn, #mobileInlineReturnHomeBtn, #resultReturnHomeBtn):hover .svg-action-inner [fill="#F3EF84"] {
            fill: #FAF8BE;
        }

        /* 天藍底按鈕 (下載圖卡)：#80E4FF -> #A3EEFF */
        :is(#inlineDownloadCardBtn, #mobileInlineDownloadCardBtn, #downloadToiletCardBtn) .svg-action-inner [fill="#80E4FF"] {
            fill: #80E4FF;
        }
        :is(#inlineDownloadCardBtn, #mobileInlineDownloadCardBtn, #downloadToiletCardBtn):hover .svg-action-inner [fill="#80E4FF"] {
            fill: #A3EEFF;
        }

        /* 米白底按鈕 (小便斗模式電腦版下載圖卡)：#FFF9EC 柔和淡化 */
        #inlineDownloadCardBtn .svg-action-inner [fill="#FFF9EC"] {
            fill: #FFF9EC;
            fill-opacity: 1;
        }
        #inlineDownloadCardBtn:hover .svg-action-inner [fill="#FFF9EC"] {
            fill: #FFFFFF;
            fill-opacity: 0.72;
        }

        /* 珊瑚紅底按鈕 (編輯評鑑)：#F26559 -> #FF948C */
        :is(#inlineEditRatingBtn, #mobileInlineEditRatingBtn, #resultEditReportBtn) .svg-action-inner [fill="#F26559"] {
            fill: #F26559;
        }
        :is(#inlineEditRatingBtn, #mobileInlineEditRatingBtn, #resultEditReportBtn):hover .svg-action-inner [fill="#F26559"] {
            fill: #FF948C;
        }
        .logo-link-group:hover .logo-visual-inner {
            transform: scale(1.04);
        }
        .shoe-option-btn {
            cursor: pointer;
            outline: none !important;
        }
        .shoe-option-visual {
            pointer-events: none;
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
            transform-box: fill-box;
            transform-origin: center;
        }
        .shoe-option-btn:hover .shoe-option-visual {
            transform: translateY(-1.5px) scale(1.08);
        }
        .shoe-option-btn:active .shoe-option-visual {
            transform: scale(0.95);
        }

        /* ========================================================= */
        /* 電腦版完成回報轉場動畫：按鈕下沉、文字淡出、主視覺左移、完成區浮現 */
        /* ========================================================= */
        .sink-on-complete {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            transition:
                transform 0.52s cubic-bezier(0.22, 1, 0.36, 1) 0.18s,
                opacity 0.36s ease 0.18s;
            will-change: transform, opacity;
        }
        #ratingMainStage.is-completed .sink-on-complete {
            transform: translate3d(0, 250px, 0);
            opacity: 0;
            pointer-events: none !important;
            transition:
                transform 0.54s cubic-bezier(0.45, -0.1, 0.78, 0.65),
                opacity 0.42s ease 0.08s;
        }
        #ratingMainStage.is-completed .sink-delay-1 { transition-delay: 0.03s, 0.10s; }
        #ratingMainStage.is-completed .sink-delay-2 { transition-delay: 0.06s, 0.13s; }
        #ratingMainStage.is-completed .sink-delay-3 { transition-delay: 0.09s, 0.16s; }
        #ratingMainStage.is-completed .sink-delay-4 { transition-delay: 0.12s, 0.19s; }

        .fade-on-complete {
            opacity: 1;
            transition: opacity 0.34s ease 0.28s;
            will-change: opacity;
        }
        #ratingMainStage.is-completed .fade-on-complete {
            opacity: 0;
            pointer-events: none !important;
            transition: opacity 0.34s ease 0s;
        }

        .shift-left-on-complete {
            transform: translate3d(0, 0, 0);
            transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;
            will-change: transform;
        }
        #ratingMainStage.is-completed .shift-left-on-complete {
            transform: translate3d(-280px, 0, 0);
            transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.14s;
        }

        #ratingMainStage.is-completed #stallLeaveCommentBtn,
        #ratingMainStage.is-completed #urinalLeaveCommentBtn,
        #ratingMainStage.is-completed #mobileStallLeaveCommentBtn,
        #ratingMainStage.is-completed #mobileUrinalLeaveCommentBtn,
        #ratingMainStage.is-completed #placedMonstersLayer,
        #ratingMainStage.is-completed #placedMonstersLayer *,
        #ratingMainStage.is-completed #mobilePlacedMonstersLayer,
        #ratingMainStage.is-completed #mobilePlacedMonstersLayer * {
            pointer-events: none !important;
            cursor: var(--cursor-default) !important;
        }

        .appear-on-complete {
            opacity: 0;
            transform: translate3d(0, 32px, 0);
            pointer-events: none;
            transition:
                opacity 0.24s ease 0s,
                transform 0.28s ease 0s;
            will-change: transform, opacity;
        }
        #ratingMainStage.is-completed .appear-on-complete {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
            transition:
                opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1) 0.38s,
                transform 0.52s cubic-bezier(0.22, 1, 0.36, 1) 0.38s;
        }

        /* ========================================================= */

        /* 手機版完成回報轉場動畫：功能文字向左右散開、圖卡與完成區保留 */

        /* ========================================================= */

        .mobile-scatter-left,

        .mobile-scatter-right {

            transform: translate3d(0, 0, 0);

            opacity: 1;

            transition:

                transform 0.54s cubic-bezier(0.22, 1, 0.36, 1) 0.16s,

                opacity 0.36s ease 0.16s;

            will-change: transform, opacity;

        }

        #ratingMainStage.is-completed .mobile-scatter-left {

            transform: translate3d(-280px, 0, 0);

            opacity: 0;

            pointer-events: none !important;

            transition:

                transform 0.56s cubic-bezier(0.45, -0.08, 0.78, 0.65),

                opacity 0.40s ease 0.06s;

        }

        #ratingMainStage.is-completed .mobile-scatter-right {

            transform: translate3d(280px, 0, 0);

            opacity: 0;

            pointer-events: none !important;

            transition:

                transform 0.56s cubic-bezier(0.45, -0.08, 0.78, 0.65),

                opacity 0.40s ease 0.06s;

        }

        #ratingMainStage.is-completed .mobile-scatter-delay-1 { transition-delay: 0.04s, 0.10s; }

        #ratingMainStage.is-completed .mobile-scatter-delay-2 { transition-delay: 0.08s, 0.14s; }

        #ratingMainStage.is-completed .mobile-scatter-delay-3 { transition-delay: 0.12s, 0.18s; }



        .mobile-shift-up-on-complete {

            transform: translate3d(0, 0, 0);

            transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;

            will-change: transform;

        }

        /* 手機版完成回報時：強制收合畫面高度並隱藏底部多餘捲軸空白 */
        @media (max-width: 767px) {
            #ratingMainStage.is-completed {
                min-height: 0 !important;
                height: auto !important;
                overflow: hidden !important;
            }
        }

        #ratingMainStage.is-completed .mobile-shift-up-on-complete {
            transform: translate3d(0, -124px, 0);
            transition: transform 0.68s cubic-bezier(0.22, 1, 0.36, 1) 0.14s;
        }


        /* ========================================================= */
        /* 手機版底部小怪橫向抽屜選單 (1:1 還原 手機ui-28.jpg)         */
        /* ========================================================= */
        @keyframes mobileDrawerSlideUp {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0%);
                opacity: 1;
            }
        }
        #mobileMonsterBottomDrawer:not(.hidden) {
            animation: mobileDrawerSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .mobile-drawer-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 6px;
            border-radius: 14px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.16s ease, background-color 0.16s ease, opacity 0.18s ease;
        }
        .mobile-drawer-card:hover {
            background-color: #FFF9EC;
            transform: scale(1.04);
        }
        .mobile-drawer-card:active {
            transform: scale(0.95);
        }
        .mobile-drawer-card.is-placed {
            opacity: 0.38;
            cursor: not-allowed;
        }
        .mobile-drawer-card.is-placed:hover,
        .mobile-drawer-card.is-placed:active {
            background-color: transparent;
            transform: none;
        }

        /* 彈窗自訂捲軸 */
        .poogle-modal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .poogle-modal-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .poogle-modal-scroll::-webkit-scrollbar-thumb {
            background: #2A348C;
            border-radius: 9999px;
        }

        /* ========================================================= */
        /* 手機版右上角下拉式衛生紙捲筒選單展開與收合動畫             */
        /* ========================================================= */
        @keyframes ratingTpDropdownUnroll {
            0% {
                opacity: 0;
                transform: scaleY(0.18);
            }
            70% {
                opacity: 1;
                transform: scaleY(1.03);
            }
            100% {
                opacity: 1;
                transform: scaleY(1);
            }
        }
        @keyframes ratingTpDropdownRollUp {
            0% {
                opacity: 1;
                transform: scaleY(1);
            }
            30% {
                opacity: 1;
                transform: scaleY(1.02);
            }
            100% {
                opacity: 0;
                transform: scaleY(0.12);
            }
        }
        #ratingTpRollDropdownMenu {
            transform-origin: top center;
        }
        #ratingTpRollDropdownMenu.is-open {
            display: block !important;
            animation: ratingTpDropdownUnroll 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #ratingTpRollDropdownMenu.is-closing {
            display: block !important;
            pointer-events: none;
            animation: ratingTpDropdownRollUp 0.26s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @media (min-width: 768px) {
            #ratingTpRollDropdownMenu,
            #ratingTpRollDropdownMenu.is-open,
            #ratingTpRollDropdownMenu.is-closing {
                display: none !important;
            }
        }
        .rating-tp-menu-item {
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .rating-tp-menu-item:hover {
            transform: translateX(3px);
        }
        .rating-tp-menu-item:hover text {
            fill: #F26559;
        }

        /* ========================================================= */
        /* 進入公廁中 Loading 畫面與頂部跑馬燈樣式                      */
        /* ========================================================= */
        @keyframes loadingPoopgleMarquee {
            0% { transform: translate3d(0%, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        @keyframes loadingPoopgleColorCycle {
            0%, 100% { color: #FF99D3; }
            25%      { color: #F26559; }
            50%      { color: #F3EF84; }
            75%      { color: #80E4FF; }
        }
        #poogleLoadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: #45E5AC; /* 改為與主頁相同的薄荷綠 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        #loadingStageContentGroup {
            transform-origin: 720px 390px;
            transform: scale(0.6667); /* 電腦版縮小 1/3 倍 */
        }
        @media (max-width: 767px) {
            #loadingStageContentGroup {
                transform: scale(2);
            }
        }

        #poogleLoadingOverlay.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-marquee-bar {
            width: 100%;
            height: 18px;
            background-color: #2A348C;
            overflow: hidden;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
        }
        .loading-marquee-track {
            display: flex;
            width: max-content;
            align-items: center;
            animation:
                loadingPoopgleMarquee 22s linear infinite,
                loadingPoopgleColorCycle 7.5s linear infinite;
        }
        .loading-marquee-item {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.14em;
            margin: 0 28px;
            line-height: 1;
        }
/* ========================================================= */
        /* 自訂游標設定 (Default: img/mouse / Hover: img/hover)       */
        /* ========================================================= */
        :root {
            --cursor-default: url('./img/mouse.png') 0 0, auto;
            --cursor-hover: url('./img/hover.png') 0 0, pointer;
        }
        html, body, svg {
            cursor: var(--cursor-default) !important;
        }
        a, button, select, [role="button"],
        .cursor-pointer, .cursor-grab, .cursor-grabbing,
        [style*="cursor: pointer"], [style*="cursor: grab"], [style*="cursor: nwse-resize"],
        .star-interactive, .star-interactive *,
        .svg-action-btn, .svg-action-btn *,
        .logo-link-group, .logo-link-group *,
        .shoe-option-btn, .shoe-option-btn *,
        .mobile-drawer-card:not(.is-placed), .mobile-drawer-card:not(.is-placed) *,
        .monster-menu-card:not(.is-placed), .monster-menu-card:not(.is-placed) *,
        .rating-tp-menu-item, .rating-tp-menu-item *,
        #placedMonstersLayer g, #placedMonstersLayer g *,
        #mobilePlacedMonstersLayer g, #mobilePlacedMonstersLayer g * {
            cursor: var(--cursor-hover) !important;
        }
        /* 已放置的小怪或完成評鑑鎖定狀態維持預設游標 */
        .monster-menu-card.is-placed,
        .mobile-drawer-card.is-placed {
            cursor: var(--cursor-default) !important;
        }
        /* ========================================================= */
        /* 小便斗中央小雞：點一下短暫微微放大並切換大眼張嘴表情        */
        /* ========================================================= */
        .urinal-chick-interactive {
            pointer-events: auto !important;
            cursor: var(--cursor-hover, pointer) !important;
            transform-origin: 724px 760px;
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        .urinal-chick-interactive * {
            pointer-events: auto !important;
            cursor: var(--cursor-hover, pointer) !important;
        }
        .urinal-chick-interactive .chick-face-active {
            display: none;
        }
        .urinal-chick-interactive.is-chick-active {
            transform: scale(1.08);
        }
        .urinal-chick-interactive.is-chick-active .chick-face-normal {
            display: none;
        }
        .urinal-chick-interactive.is-chick-active .chick-face-active {
            display: inline;
        }
        #ratingMainStage.is-completed .urinal-chick-interactive,
        #ratingMainStage.is-completed .urinal-chick-interactive * {
            pointer-events: none !important;
            cursor: var(--cursor-default, default) !important;
        }
    </style>
</head>
<body>
    <!-- =================================================================== -->
    <!-- 0. 進入公廁中 LOADING 畫面                                          -->
    <!-- =================================================================== -->
    <div id="poogleLoadingOverlay">
        <!-- 頂部 POOPGLE 跑馬燈 -->
        <div class="loading-marquee-bar">
            <div class="loading-marquee-track">
                <div style="display:flex; align-items:center; flex-shrink:0;">

                const fallback = fallbackFn(safeKey);
                shoeResolvedUrlCache.set(safeKey, fallback);
                return Promise.resolve(fallback);
            }
            return new Promise((resolve) => {
                const candidates = [
                    `./img/shoes/${encodeURIComponent(safeKey)}.png`,
                    `./img/shoes/${encodeURIComponent(safeKey)}.PNG`,
                    `img/shoes/${encodeURIComponent(safeKey)}.png`,
                    `img/shoes/${encodeURIComponent(safeKey)}.PNG`
                ];
                let idx = 0;
                const tryNext = () => {
                    if (idx >= candidates.length) {
                        const fallback = fallbackFn(safeKey);
                        shoeResolvedUrlCache.set(safeKey, fallback);
                        resolve(fallback);
                        return;
                    }
                    const testUrl = candidates[idx++];
                    const probe = new Image();
                    probe.onload = () => {
                        shoeResolvedUrlCache.set(safeKey, testUrl);
                        resolve(testUrl);
                    };
                    probe.onerror = () => tryNext();
                    probe.src = testUrl;
                };
                tryNext();
            });

        // 僅在「已登入帳號」且 userId 完全一致時才視為同一人；未登入時永遠不合併、不檢查重複
        function isSameReporterRecord(record, activeUid) {
            if (!record || !activeUid) return false;
            return Boolean(record.userId && record.userId === activeUid);
        }

        function findLocalExistingEvaluationForToilet(toiletName) {
            const cleanName = String(toiletName || '').trim();
            if (!cleanName || cleanName === '公廁名') return null;
            const activeUser = getActiveAuthUser();
            const activeUid = activeUser?.uid || null;
            if (!activeUid) return null;

            try {
                const rawLocal = localStorage.getItem('poogle_local_evaluations_v2');
                const list = rawLocal ? JSON.parse(rawLocal) : [];
                if (Array.isArray(list)) {
                    const matches = list.filter(r =>
                        String(r?.name || '').trim() === cleanName &&
                        isSameReporterRecord(r, activeUid)
                    );
                    if (matches.length > 0) {
                        matches.sort((a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));
                        return matches[0];
                    }
                }
            } catch (e) {}
            return null;
        }

        function purgeLocalEvaluationForToilet(toiletName) {
            const cleanName = String(toiletName || '').trim();
            if (!cleanName) return;
            const activeUser = getActiveAuthUser();

            if (!activeUid) return;

            try {
                const rawLocal = localStorage.getItem('poogle_local_evaluations_v2');
                if (!rawLocal) return;
                const list = JSON.parse(rawLocal);
                if (!Array.isArray(list)) return;
                const nextList = list.filter((item) => {
                    if (!item) return false;
                    if (String(item.name || '').trim() === cleanName && isSameReporterRecord(item, activeUid)) {
                        return false;

                });

            } catch (e) {}
        }

        async function findExistingUserEvaluation(toiletName) {
            const cleanName = String(toiletName || '').trim();
            if (!cleanName || cleanName === '公廁名') return null;

            const activeUser = getActiveAuthUser();
            const activeUid = activeUser?.uid || null;
            // 未登入時不抓取任何既有紀錄，讓不同使用者在同個裝置皆可獨立回報
            if (!activeUid) return null;

            const localMatch = findLocalExistingEvaluationForToilet(cleanName);
            if (!db) return localMatch;

            try {
                const snap = await db.collection('evaluations').where('name', '==', cleanName).get();
                const cloudMatches = [];
                snap.forEach((doc) => {
                    const d = { id: doc.id, evalId: doc.data()?.evalId || doc.id, ...doc.data() };
                    if (isSameReporterRecord(d, activeUid)) {
                        cloudMatches.push(d);
                    }
                });
                if (cloudMatches.length > 0) {
                    cloudMatches.sort((a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));
                    return cloudMatches[0];
                }
                if (localMatch && localMatch.cloudSynced !== false) {
                    purgeLocalEvaluationForToilet(cleanName);
                    return null;
                }
                return localMatch;
            } catch (e) {
                return localMatch;
            }
        }

        async function syncAllUserEvaluationsMap() {
            const resultMap = new Map();
            const activeUser = getActiveAuthUser();
            const activeUid = activeUser?.uid || null;

            // 未登入時不在切換公廁清單顯示「(已評鑑)」標籤
            if (!activeUid) {
                syncedUserEvaluationsByName = resultMap;
                return resultMap;
            }

            const putLatest = (rec) => {
                const tName = String(rec?.name || '').trim();
                if (!tName) return;
                const prev = resultMap.get(tName);
                if (!prev || String(rec.updatedAt || rec.createdAt || '') >= String(prev.updatedAt || prev.createdAt || '')) {
                    resultMap.set(tName, rec);
                }
            };

            let cloudOk = false;
            const cloudIds = new Set();

            if (db) {
                try {
                    const snap = await db.collection('evaluations').where('userId', '==', activeUid).get();
                    cloudOk = true;
                    snap.forEach((doc) => {
                        const d = doc.data() || {};
                        const id = d.evalId || doc.id;
                        cloudIds.add(id);
                        putLatest({ id: doc.id, evalId: id, ...d });
                    });
                } catch (e) {
                    cloudOk = false;
                }
            }

            try {
                const rawLocal = localStorage.getItem('poogle_local_evaluations_v2');
                const localList = rawLocal ? JSON.parse(rawLocal) : [];
                if (Array.isArray(localList)) {
                    let changed = false;
                    const kept = [];
                    localList.forEach((item) => {
                        if (!item) return;
                        const mine = isSameReporterRecord(item, activeUid);
                        if (!mine) {
                            kept.push(item);
                            return;
                        }
                        const id = item.evalId || item.id;
                        if (cloudOk && item.cloudSynced !== false && id && !cloudIds.has(id)) {
                            changed = true;
                            return;
                        }
                        kept.push(item);
                        if (!id || !cloudIds.has(id)) putLatest(item);
                    });
                    if (changed) {
                        localStorage.setItem('poogle_local_evaluations_v2', JSON.stringify(kept));
                    }
                }
            } catch (e) {}

            syncedUserEvaluationsByName = resultMap;
            return resultMap;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

        // 紀錄手機版公廁名稱因換行所增加的高度，供下方圖示與畫布同步順移

        // 自動將手機版標題區 (#mobileHeaderGroup) 以下的所有圖層包進同一個位移群組
        function ensureMobileBelowHeaderWrapper() {
            const mobileSvg = document.getElementById('mobileRatingMainSvg');
            const headerGroup = document.getElementById('mobileHeaderGroup');
            if (!mobileSvg || !headerGroup) return null;

            let wrapper = document.getElementById('mobileBelowHeaderShiftGroup');
            if (!wrapper) {
                const svgNs = 'http://www.w3.org/2000/svg';
                wrapper = document.createElementNS(svgNs, 'g');
                wrapper.setAttribute('id', 'mobileBelowHeaderShiftGroup');

                const nodesToMove = [];
                let nextNode = headerGroup.nextElementSibling;
                while (nextNode) {
                    nodesToMove.push(nextNode);
                    nextNode = nextNode.nextElementSibling;
                }
                nodesToMove.forEach((node) => wrapper.appendChild(node));
                mobileSvg.appendChild(wrapper);
            }
            return wrapper;
        }

        // 依右側安全寬度將過長的公廁名稱切分為多行
        function splitMobileTitleIntoLines(text, fontSize, letterSpacing, maxWidth) {
            const chars = Array.from(String(text || '').trim());
            if (chars.length === 0) return ['公廁名'];

            const lines = [];
            let currentLine = '';
            let currentWidth = 0;

            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i];
                const isHalfWidth = /^[\x00-\xff]$/.test(ch);
                const charW = (isHalfWidth ? fontSize * 0.58 : fontSize) + letterSpacing;

                if (currentLine && (currentWidth + charW > maxWidth)) {
                    lines.push(currentLine);
                    currentLine = ch;
                    currentWidth = charW;
                } else {
                    currentLine += ch;
                    currentWidth += charW;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;
        }

            // 2. 手機版名稱安全距離換行 + 下方圖示維持相同間距順移
            if (mobileNameEl && toiletName) {

                if (!mobileNameEl.dataset.baseY) {

                if (mobileManagerEl && !mobileManagerEl.dataset.baseY) {

                }
                if (mobileAddressEl && !mobileAddressEl.dataset.baseY) {
                    mobileAddressEl.dataset.baseY = mobileAddressEl.getAttribute('y') || '131';
                }

                const baseNameY = parseFloat(mobileNameEl.dataset.baseY);
                const baseManagerY = mobileManagerEl ? parseFloat(mobileManagerEl.dataset.baseY) : 105;
                const baseAddressY = mobileAddressEl ? parseFloat(mobileAddressEl.dataset.baseY) : 131;

                // 👇 手機版標題最大寬度（數值越小，離右方漢堡選單的安全距離越大；268 約每行 8 個中文字）
                const MOBILE_NAME_MAX_WIDTH = 268;
                const charLen = Array.from(toiletName).length;
                const fontSize = charLen > 7 ? 30 : 34;
                const letterSpacing = 1.5;

                mobileNameEl.setAttribute('font-size', String(fontSize));
                const lines = splitMobileTitleIntoLines(toiletName, fontSize, letterSpacing, MOBILE_NAME_MAX_WIDTH);

                mobileNameEl.innerHTML = '';
                lines.forEach((lineStr, idx) => {
                    const tspan = document.createElementNS(svgNs, 'tspan');
                    tspan.setAttribute('x', baseNameX);
                    tspan.setAttribute('dy', idx === 0 ? '0' : String(lineHeight));

                // 計算多出來的行高，將管理單位、地址與下方所有圖示同步往下推，維持原本間距
                mobileTitleExtraHeight = Math.max(0, (lines.length - 1) * lineHeight);

                if (mobileManagerEl) {
                    mobileManagerEl.setAttribute('y', String(baseManagerY + mobileTitleExtraHeight));
                }
                if (mobileAddressEl) {
                    mobileAddressEl.setAttribute('y', String(baseAddressY + mobileTitleExtraHeight));
                }

                const shiftWrapper = ensureMobileBelowHeaderWrapper();
                if (shiftWrapper) {
                    shiftWrapper.setAttribute('transform', `translate(0, ${mobileTitleExtraHeight})`);

                const mobileSvg = document.getElementById('mobileRatingMainSvg');

                    if (bgRect) {

            }
            if (mobileAddressEl) {

        function calcGeoDistanceMeters(lat1, lon1, lat2, lon2) {
            if (!Number.isFinite(lat1) || !Number.isFinite(lon1) || !Number.isFinite(lat2) || !Number.isFinite(lon2)) return Infinity;
            const R = 6371000;
            const toRad = Math.PI / 180;
            const dLat = (lat2 - lat1) * toRad;
            const dLon = (lon2 - lon1) * toRad;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function parseCSVRowsFull(text) {
            const rows = [];
            let currentRow = [], currentVal = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { currentVal += '"'; i++; }
                        else inQuotes = false;
                    } else currentVal += c;
                } else {
                    if (c === '"') inQuotes = true;
                    else if (c === ',') { currentRow.push(currentVal.trim()); currentVal = ''; }
                    else if (c === '\r' || c === '\n') {
                        if (c === '\r' && i + 1 < text.length && text[i + 1] === '\n') i++;
                        currentRow.push(currentVal.trim()); currentVal = '';
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) rows.push(currentRow);
                        currentRow = [];
                    } else currentVal += c;
                }
            }
            if (currentVal !== '' || currentRow.length > 0) {
                currentRow.push(currentVal.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) rows.push(currentRow);
            }
            return rows;
        }

        async function loadToiletsFromCacheOrCsv() {
            if (Array.isArray(cachedFullToiletsList) && cachedFullToiletsList.length > 0) {
                return cachedFullToiletsList;
            }

            if (IS_RATING_PREVIEW_SANDBOX) {
                return [];
            }

            const fromIdb = await new Promise((resolve) => {
                let settled = false;
                const done = (v) => { if (!settled) { settled = true; resolve(v); } };
                const t = setTimeout(() => done(null), 1200);
                try {
                    const req = indexedDB.open(MAP_IDB_NAME, 1);
                    req.onsuccess = () => {
                        try {
                            const idb = req.result;
                            if (!idb.objectStoreNames.contains(MAP_IDB_STORE)) { clearTimeout(t); done(null); return; }
                            const tx = idb.transaction(MAP_IDB_STORE, 'readonly');
                            const getReq = tx.objectStore(MAP_IDB_STORE).get('main_csv_dataset');
                            getReq.onsuccess = () => { clearTimeout(t); done(getReq.result?.records || null); };
                            getReq.onerror = () => { clearTimeout(t); done(null); };
                        } catch (e) { clearTimeout(t); done(null); }
                    };
                    req.onerror = () => { clearTimeout(t); done(null); };
                } catch (e) { clearTimeout(t); done(null); }
            });

            if (Array.isArray(fromIdb) && fromIdb.length > 0) {
                cachedFullToiletsList = fromIdb;
                return cachedFullToiletsList;
            }

            const csvCandidates = ['./全國公廁建檔資料.csv', '全國公廁建檔資料.csv', encodeURI('./全國公廁建檔資料.csv'), './toilets.csv'];
            for (const url of csvCandidates) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const buf = await res.arrayBuffer();
                    let text = '';
                    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
                    catch (e) { text = new TextDecoder('big5').decode(buf); }
                    const rows = parseCSVRowsFull(text.replace(/^\uFEFF/, ''));
                    if (rows.length < 2) continue;
                    const headers = rows[0].map(h => h.replace(/^["']|["']$/g, '').trim().toLowerCase());
                    const findCol = (exact, partial) => {
                        const idx = headers.findIndex(h => exact.includes(h));
                        return idx >= 0 ? idx : headers.findIndex(h => partial.some(p => h.includes(p)));
                    };
                    const nameIdx = findCol(['name', '建檔名稱', '公廁名稱'], ['name', '名稱']);
                    const addrIdx = findCol(['address', '地址'], ['address', '地址']);
                    const execIdx = findCol(['exec', 'administration', '管理單位', '主管機關'], ['exec', 'administration', '管理', '機關']);
                    const latIdx = findCol(['latitude', 'lat', '緯度'], ['lat', '緯度']);
                    const lngIdx = findCol(['longitude', 'lng', 'lon', '經度'], ['lon', 'lng', '經度']);
                    const parsed = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols.some(c => c !== '')) continue;
                        const address = (addrIdx >= 0 && cols[addrIdx]) ? cols[addrIdx] : '';
                        const name = (nameIdx >= 0 && cols[nameIdx]) ? cols[nameIdx] : (address || `公廁 #${i}`);
                        const exec = (execIdx >= 0 && cols[execIdx]) ? cols[execIdx] : '環境管理單位';
                        let lat = latIdx >= 0 ? parseFloat(cols[latIdx]) : NaN;
                        let lng = lngIdx >= 0 ? parseFloat(cols[lngIdx]) : NaN;
                        if (Number.isFinite(lat) && Number.isFinite(lng) && lat > 90 && lng >= 10 && lng <= 40) {
                            const tmp = lat; lat = lng; lng = tmp;
                        }
                        if (Number.isFinite(lat) && Number.isFinite(lng)) {
                            parsed.push({ name, address, exec, lat, lng });
                        }
                    }
                    if (parsed.length > 0) {
                        cachedFullToiletsList = parsed;
                        return cachedFullToiletsList;
                    }
                } catch (e) {}
            }
            return [];
        }

        async function prepareNearbyToiletsList() {
            const allRecords = await loadToiletsFromCacheOrCsv();

            if ((!Number.isFinite(Number(currentSelectedToilet.lat)) || !Number.isFinite(Number(currentSelectedToilet.lng)))
                && Array.isArray(allRecords) && allRecords.length > 0) {
                const matchedRecord = allRecords.find(r =>
                    r.name === currentSelectedToilet.name &&
                    (!currentSelectedToilet.address || currentSelectedToilet.address === '000000' || r.address === currentSelectedToilet.address)
                ) || allRecords.find(r => r.name === currentSelectedToilet.name);

                if (matchedRecord && Number.isFinite(Number(matchedRecord.lat)) && Number.isFinite(Number(matchedRecord.lng))) {
                    currentSelectedToilet.lat = Number(matchedRecord.lat);
                    currentSelectedToilet.lng = Number(matchedRecord.lng);
                }
            }

            let refLat = Number.isFinite(Number(currentSelectedToilet.userLat))
                ? Number(currentSelectedToilet.userLat)
                : Number(currentSelectedToilet.lat);
            let refLng = Number.isFinite(Number(currentSelectedToilet.userLng))
                ? Number(currentSelectedToilet.userLng)
                : Number(currentSelectedToilet.lng);

            const within100mList = [];
            if (Array.isArray(allRecords) && allRecords.length > 0 && Number.isFinite(refLat) && Number.isFinite(refLng)) {
                for (let i = 0; i < allRecords.length; i++) {
                    const t = allRecords[i];
                    const dist = calcGeoDistanceMeters(refLat, refLng, Number(t.lat), Number(t.lng));
                    if (Number.isFinite(dist) && dist <= 100.0) {
                        within100mList.push({ ...t, distance: dist });
                    }
                }
                within100mList.sort((a, b) => a.distance - b.distance);
            }

            const seen = new Set();
            const finalPool = [];
            const addUnique = (item) => {
                const key = `${item.name || ''}__${item.address || ''}`;
                if (!item.name || seen.has(key)) return;
                seen.add(key);
                finalPool.push(item);
            };

            if (currentSelectedToilet && currentSelectedToilet.name && currentSelectedToilet.name !== '公廁名') {
                addUnique({ ...currentSelectedToilet, distance: 0 });
            }
            within100mList.forEach(addUnique);

            if (finalPool.length === 0) {
                addUnique({ name: '公廁一', exec: '000000', address: '000000000000', distance: 0 });
                addUnique({ name: '公廁二', exec: '000000', address: '000000000000', distance: 15 });
            }

            nearby100mToiletsPool = finalPool;
        }

        const monsterResolvedUrlCache = new Map();

        function getMonsterFallbackDataUri(monsterId) {
            const rawSvg = MONSTER_FALLBACK_SVGS[monsterId] || MONSTER_FALLBACK_SVGS.air_clean;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(rawSvg)}`;
        }

        function findMonsterCatalogInfo(monsterId) {
            for (const catKey of Object.keys(MONSTER_CATALOG_BY_CATEGORY)) {
                const cat = MONSTER_CATALOG_BY_CATEGORY[catKey];
                const found = [...(cat.xian || []), ...(cat.yao || [])].find(item => item.id === monsterId);
                if (found) return found;
            }
            return null;
        }
        function resolveMonsterImageUrl(monsterItem) {
            const key = `${monsterItem.folder}_${monsterItem.id}`;
            if (monsterResolvedUrlCache.has(key)) {
                return Promise.resolve(monsterResolvedUrlCache.get(key));
            }
            if (IS_RATING_PREVIEW_SANDBOX) {
                const fallbackUri = getMonsterFallbackDataUri(monsterItem.id);
                monsterResolvedUrlCache.set(key, fallbackUri);
                return Promise.resolve(fallbackUri);
            }
            return new Promise((resolve) => {
                const candidates = [
                    `./img/${monsterItem.folder}/${encodeURIComponent(monsterItem.id)}.png`,
                    `./img/${monsterItem.folder}/${encodeURIComponent(monsterItem.id)}.PNG`,
                    `img/${monsterItem.folder}/${encodeURIComponent(monsterItem.id)}.png`
                ];
                let idx = 0;
                const tryNext = () => {
                    if (idx >= candidates.length) {
                        const fallbackUri = getMonsterFallbackDataUri(monsterItem.id);
                        monsterResolvedUrlCache.set(key, fallbackUri);
                        resolve(fallbackUri);
                        return;
                    }
                    const testUrl = candidates[idx++];
                    const probe = new Image();
                    probe.onload = () => {
                        monsterResolvedUrlCache.set(key, testUrl);
                        resolve(testUrl);
                    };
                    probe.onerror = () => tryNext();
                    probe.src = testUrl;
                };
                tryNext();
            });
        }
        // 直接取得小怪 PNG 路徑（優先使用快取或本機 PNG，不再預設塞入備援向量圖）
        function getImmediateMonsterImageUrl(monsterItem) {
            const key = `${monsterItem.folder}_${monsterItem.id}`;
            if (monsterResolvedUrlCache.has(key)) {
                return monsterResolvedUrlCache.get(key);
            }
            if (IS_RATING_PREVIEW_SANDBOX) {
                return getMonsterFallbackDataUri(monsterItem.id);
            }
            return `./img/${monsterItem.folder}/${encodeURIComponent(monsterItem.id)}.png`;
        }

        // 在進場 Loading 期間預先載入並解碼所有分類的小怪 PNG
        function preloadAllMonsterImages() {
            const allItems = [];
            Object.values(MONSTER_CATALOG_BY_CATEGORY).forEach((cat) => {
                if (Array.isArray(cat.xian)) allItems.push(...cat.xian);
                if (Array.isArray(cat.yao)) allItems.push(...cat.yao);
            });
            return Promise.allSettled(
                allItems.map((item) =>
                    resolveMonsterImageUrl(item).then((url) => {
                        if (!url || url.startsWith('data:')) return url;
                        const img = new Image();
                        img.src = url;
                        return typeof img.decode === 'function' ? img.decode().catch(() => {}) : Promise.resolve();
                    })
                )
            );
        }

        function getCategoryBeakCenterY(category) {
            if (category === 'urinal' || category === 'stall') return 320;
            if (category === 'consumable') return 466;
            if (category === 'hardware') return 612;
            return 320;
        }

        function updateStallMenuBeakPosition() {
            if (!stallMonsterMenuBubblePathEl) return;
            const beakCenterY = getCategoryBeakCenterY(currentMonsterCategory);
            const topJoinY = Math.max(228, beakCenterY - 34);
            const bottomJoinY = Math.min(724, beakCenterY + 34);
            stallMonsterMenuBubblePathEl.setAttribute(
                'd',
                `M 918,206
                 L 1218,206
                 Q 1236,206 1236,224
                 L 1236,${topJoinY}
                 L 1300,${beakCenterY - 4}
                 Q 1308,${beakCenterY} 1300,${beakCenterY + 4}
                 L 1236,${bottomJoinY}
                 L 1236,728
                 Q 1236,746 1218,746
                 L 918,746
                 Q 900,746 900,728
                 L 900,224
                 Q 900,206 918,206 Z`
            );
        }

        function syncCustomScrollbarThumb() {
            if (!stallMonsterScrollViewportEl || !stallScrollThumbEl) return;
            const trackTop =280;
            const trackHeight = 444;
            const thumbHeight = 118;
            const maxThumbTravel = trackHeight - thumbHeight;

            const maxScroll = Math.max(1, stallMonsterScrollViewportEl.scrollHeight - stallMonsterScrollViewportEl.clientHeight);
            const progress = Math.min(1, Math.max(0, stallMonsterScrollViewportEl.scrollTop / maxScroll));
            const thumbY = trackTop + progress * maxThumbTravel;
            stallScrollThumbEl.setAttribute('y', thumbY.toFixed(1));
        }

        function syncMobileDrawerScrollbarThumb() {
            if (!mobileMonsterScrollViewportEl || !mobileMonsterScrollTrackEl || !mobileMonsterScrollThumbEl) return;
            const maxScrollLeft = mobileMonsterScrollViewportEl.scrollWidth - mobileMonsterScrollViewportEl.clientWidth;
            const trackW = mobileMonsterScrollTrackEl.clientWidth || 300;
            const thumbW = Math.max(42, trackW * 0.28);
            mobileMonsterScrollThumbEl.style.width = `${thumbW}px`;

            if (maxScrollLeft <= 1) {
                mobileMonsterScrollThumbEl.style.transform = 'translateX(0px)';
                return;
            }
            const progress = Math.min(1, Math.max(0, mobileMonsterScrollViewportEl.scrollLeft / maxScrollLeft));
            const maxX = Math.max(0, trackW - thumbW);
            mobileMonsterScrollThumbEl.style.transform = `translateX(${(progress * maxX).toFixed(1)}px)`;
        }

        function updateStallMonsterTabStyles() {
            if (currentStallMonsterTab === 'xian') {
                stallTabXianRectEl?.setAttribute('fill', '#F3EF84');

                stallTabYaoRectEl?.setAttribute('fill', '#F3EF84');

                if (mobileTabYaoBtnEl) mobileTabYaoBtnEl.style.backgroundColor = '#F3EF84';
            }
        }

        function isMonsterAlreadyPlaced(monsterId) {
            return placedMonstersState.some(m => m.id === monsterId);
        }

        function syncStallMonsterMenuPlacedState() {
            document.querySelectorAll('.monster-menu-card, .mobile-drawer-card').forEach((cardEl) => {
                const monsterId = cardEl.getAttribute('data-monster-id');
                if (isMonsterAlreadyPlaced(monsterId)) {
                    cardEl.classList.add('is-placed');
                } else {
                    cardEl.classList.remove('is-placed');
                }
            });
        }

        function renderStallMonsterList(tabKey) {
            currentStallMonsterTab = (tabKey === 'yao') ? 'yao' : 'xian';
            updateStallMonsterTabStyles();

            const categoryObj = MONSTER_CATALOG_BY_CATEGORY[currentMonsterCategory] || MONSTER_CATALOG_BY_CATEGORY.stall;
            const items = categoryObj[currentStallMonsterTab] || [];

            // 1. 電腦版直向選單渲染（直接使用預載好的 PNG 路徑，不顯示底層向量備援圖）
            if (stallMonsterListContentEl) {
                stallMonsterListContentEl.innerHTML = items.map((item) => {
                    const initialImgSrc = getImmediateMonsterImageUrl(item);
                    const placedClass = isMonsterAlreadyPlaced(item.id) ? ' is-placed' : '';
                    return `
                        <div class="monster-menu-card${placedClass}" data-monster-id="${escapeHtml(item.id)}" style="width:100%;">
                            <img id="menuMonsterImg_${escapeHtml(item.id)}"
                                 src="${initialImgSrc}"
                                 alt="${escapeHtml(item.name)}"
                                 style="width:136px; height:136px; object-fit:contain; pointer-events:none; display:block;" />
                            <div style="margin-top:6px; color:#2A348C; font-size:18px; font-weight:400; font-family:'Huninn', 'jf-openhuninn', sans-serif; letter-spacing:2.5px; text-align:center; pointer-events:none;">
                                ${escapeHtml(item.name)}
                            </div>
                        </div>
                    `;
                }).join('');

                if (stallMonsterScrollViewportEl) {
                    stallMonsterScrollViewportEl.scrollTop = 0;
                    setTimeout(syncCustomScrollbarThumb, 20);
                }
            }

            // 2. 手機版底部橫向抽屜選單渲染（直接使用預載好的 PNG 路徑）
            if (mobileMonsterListContentEl) {
                mobileMonsterListContentEl.innerHTML = items.map((item) => {
                    const initialImgSrc = getImmediateMonsterImageUrl(item);
                    const placedClass = isMonsterAlreadyPlaced(item.id) ? ' is-placed' : '';
                    return `
                        <div class="mobile-drawer-card${placedClass}" data-monster-id="${escapeHtml(item.id)}" style="padding: 5px 7px;">
                            <img id="mobileMenuMonsterImg_${escapeHtml(item.id)}"
                                 src="${initialImgSrc}"
                                 alt="${escapeHtml(item.name)}"
                                 style="width:94px; height:94px; object-fit:contain; pointer-events:none; display:block;" />
                            <div style="margin-top:6px; color:#2A348C; font-size:11.5px; font-weight:900; letter-spacing:1.4px; text-align:center; white-space:nowrap; pointer-events:none;">
                                ${escapeHtml(item.name)}
                            </div>
                        </div>
                    `;
                }).join('');

                if (mobileMonsterScrollViewportEl) {
                    mobileMonsterScrollViewportEl.scrollLeft = 0;
                    setTimeout(syncMobileDrawerScrollbarThumb, 25);
                }
            }

            items.forEach(async (item) => {
                const resolvedUrl = await resolveMonsterImageUrl(item);
                const imgEl = document.getElementById(`menuMonsterImg_${item.id}`);
                const mobileImgEl = document.getElementById(`mobileMenuMonsterImg_${item.id}`);
                if (imgEl && resolvedUrl && imgEl.getAttribute('src') !== resolvedUrl) imgEl.src = resolvedUrl;
                if (mobileImgEl && resolvedUrl && mobileImgEl.getAttribute('src') !== resolvedUrl) mobileImgEl.src = resolvedUrl;
            });

            const bindCardClick = (cardEl) => {
                cardEl.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (window._isDraggingMobileMonsterList) return;

                    const monsterId = cardEl.getAttribute('data-monster-id');
                    if (isMonsterAlreadyPlaced(monsterId)) return;

                    // 超過 8 隻上限時彈出「最多選擇8隻小怪」視窗
                    if (placedMonstersState.length >= MAX_PLACED_MONSTERS) {
                        openMonsterLimitModal();
                        return;
                    }

                    const itemObj = items.find(m => m.id === monsterId);
                    if (!itemObj) return;
                    const resolvedUrl = await resolveMonsterImageUrl(itemObj);
                    if (isMonsterAlreadyPlaced(monsterId)) return;
                    if (placedMonstersState.length >= MAX_PLACED_MONSTERS) {
                        openMonsterLimitModal();
                        return;

                    spawnPlacedMonsterOnCanvas(itemObj, resolvedUrl);
                    syncStallMonsterMenuPlacedState();

            };

            stallMonsterListContentEl?.querySelectorAll('.monster-menu-card').forEach(bindCardClick);
            mobileMonsterListContentEl?.querySelectorAll('.mobile-drawer-card').forEach(bindCardClick);

        const MONSTER_HALF_BOX = 82;

        const MONSTER_X_MAX_BOUND = 1152;

        function clientToCanvasPoint(clientX, clientY, targetGroupEl = null) {
            // 若在手機版畫面，直接轉換至 mobilePlacedMonstersLayer 的內部座標系 (與桌機版 720,0 空間完全一致)
            const isMobileView = window.innerWidth < 768;
            if (isMobileView && mobileRatingMainSvgEl && mobilePlacedMonstersLayerEl) {
                const pt = mobileRatingMainSvgEl.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const ctm = (targetGroupEl || mobilePlacedMonstersLayerEl).getScreenCTM();
                if (ctm) return pt.matrixTransform(ctm.inverse());
            }
            if (ratingMainSvgEl) {
                const pt = ratingMainSvgEl.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const ctm = (targetGroupEl || ratingMainSvgEl).getScreenCTM();
                if (ctm) return pt.matrixTransform(ctm.inverse());
            }
            return { x: clientX, y: clientY };
        }

        function clampMonsterX(x, scale = 1) {
            const halfSpan = Math.min(200, MONSTER_IMG_HALF * scale * 0.65);
            const minX = MONSTER_X_MIN_BOUND + halfSpan;
            const maxX = MONSTER_X_MAX_BOUND - halfSpan;
            return Math.min(maxX, Math.max(minX, x));
        }
        
        const MAX_PLACED_MONSTERS = 8;

        function closeMonsterLimitModal() {
            document.getElementById('monsterLimitModal')?.classList.add('hidden');
        }

        function openMonsterLimitModal() {
            const modalEl = document.getElementById('monsterLimitModal');
            if (!modalEl) return;
            if (!modalEl.dataset.boundClose) {
                modalEl.dataset.boundClose = '1';
                document.getElementById('closeMonsterLimitModalBtn')?.addEventListener('click', closeMonsterLimitModal);
                document.getElementById('confirmMonsterLimitBtn')?.addEventListener('click', closeMonsterLimitModal);
                modalEl.addEventListener('click', (e) => {
                    if (e.target === modalEl) closeMonsterLimitModal();
                });
            }
            modalEl.classList.remove('hidden');
        }

        function spawnPlacedMonsterOnCanvas(monsterItem, imgUrl) {
            if (placedMonstersState.length >= MAX_PLACED_MONSTERS) {
                openMonsterLimitModal();
                return;
            }
            hasCanvasUnsavedChanges = true;

            const offsetSeed = (placedMonstersState.length % 5) * 18 - 36;

            const uid = `pm_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;

            const defaultScale = window.innerWidth < 768 ? 2.0 : 1.0;

            const newMonster = {

                uid,

                id: monsterItem.id,

                folder: monsterItem.folder || findMonsterCatalogInfo(monsterItem.id)?.folder || 'stall',

                name: monsterItem.name,

                url: imgUrl || getMonsterFallbackDataUri(monsterItem.id),

                x: clampMonsterX(720 + offsetSeed, defaultScale),

                y: 376 + offsetSeed,

                scale: defaultScale,

                rotation: 0

            };

            placedMonstersState.push(newMonster);

            selectedPlacedMonsterUid = uid;

            renderPlacedMonstersLayer();

        }

        function renderMonstersIntoLayer(layerEl) {
            if (!layerEl) return;
            const svgNs = 'http://www.w3.org/2000/svg';
            const isMobileLayer = (layerEl.id === 'mobilePlacedMonstersLayer');
            layerEl.innerHTML = '';

            placedMonstersState.forEach((m) => {
                const isSelected = (m.uid === selectedPlacedMonsterUid);
                const rootG = document.createElementNS(svgNs, 'g');
                rootG.setAttribute('transform', `translate(${m.x.toFixed(1)}, ${m.y.toFixed(1)}) rotate(${m.rotation.toFixed(1)})`);
                rootG.style.cursor = 'grab';
                rootG.style.touchAction = 'none';

                const halfBox = MONSTER_HALF_BOX * m.scale;
                // 手機版移動小怪時，點擊與拖曳感應範圍放大 1/3 倍 (乘以 4/3)，視覺框線維持原尺寸
                const hitHalfBox = isMobileLayer ? (halfBox * (4 / 3)) : halfBox;
                const imgHalf = MONSTER_IMG_HALF * m.scale;

                const monsterImg = document.createElementNS(svgNs, 'image');
                monsterImg.setAttribute('href', m.url);
                monsterImg.setAttribute('x', (-imgHalf).toFixed(1));
                monsterImg.setAttribute('y', (-imgHalf).toFixed(1));
                monsterImg.setAttribute('width', (imgHalf * 2).toFixed(1));
                monsterImg.setAttribute('height', (imgHalf * 2).toFixed(1));
                monsterImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                monsterImg.style.pointerEvents = 'none';
                rootG.appendChild(monsterImg);

                const dragHitRect = document.createElementNS(svgNs, 'rect');
                dragHitRect.setAttribute('x', (-hitHalfBox).toFixed(1));
                dragHitRect.setAttribute('y', (-hitHalfBox).toFixed(1));
                dragHitRect.setAttribute('width', (hitHalfBox * 2).toFixed(1));
                dragHitRect.setAttribute('height', (hitHalfBox * 2).toFixed(1));
                dragHitRect.setAttribute('fill', 'transparent');
                dragHitRect.style.touchAction = 'none';
                rootG.appendChild(dragHitRect);

                dragHitRect.addEventListener('pointerdown', (e) => {
                    if (isRatingCompletedState) return;
                    e.stopPropagation();
                    e.preventDefault();
                    selectedPlacedMonsterUid = m.uid;
                    const startPt = clientToCanvasPoint(e.clientX, e.clientY, layerEl);
                    activeTransformSession = {
                        mode: 'move',
                        monster: m,
                        layerEl,
                        startSvgX: startPt.x,
                        startSvgY: startPt.y,
                        initialX: m.x,
                        initialY: m.y
                    };
                    renderPlacedMonstersLayer();
                });

                dragHitRect.addEventListener('wheel', (e) => {
                    if (isRatingCompletedState || selectedPlacedMonsterUid !== m.uid) return;
                    e.stopPropagation();
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.08 : -0.08;
                    m.scale = Math.min(3.5, Math.max(0.5, Number((m.scale + delta).toFixed(2))));                    m.x = clampMonsterX(m.x, m.scale);
                    renderPlacedMonstersLayer();
                }, { passive: false });

                if (isSelected) {
                    const frameRect = document.createElementNS(svgNs, 'rect');
                    frameRect.setAttribute('x', (-halfBox).toFixed(1));
                    frameRect.setAttribute('y', (-halfBox).toFixed(1));
                    frameRect.setAttribute('width', (halfBox * 2).toFixed(1));
                    frameRect.setAttribute('height', (halfBox * 2).toFixed(1));
                    frameRect.setAttribute('fill', 'none');
                    frameRect.setAttribute('stroke', '#2A348C');
                    frameRect.setAttribute('stroke-width', '2.5');
                    frameRect.style.pointerEvents = 'none';
                    rootG.appendChild(frameRect);

                    // 右上角刪除按鈕 (✕) (整體放大 1/3 倍：scale(1.3333))

                    const deleteBtnG = document.createElementNS(svgNs, 'g');

                    deleteBtnG.setAttribute('transform', `translate(${halfBox.toFixed(1)}, ${(-halfBox).toFixed(1)}) scale(1.3333)`);

                    deleteBtnG.style.cursor = 'pointer';

                    deleteBtnG.innerHTML = `

                        <circle cx="0" cy="0" r="22" fill="transparent" />

                        <circle cx="0" cy="0" r="16.5" fill="#FFF9EC" stroke="#2A348C" stroke-width="2.4" />

                        <line x1="-5.8" y1="-5.8" x2="5.8" y2="5.8" stroke="#2A348C" stroke-width="2.6" stroke-linecap="round" />

                        <line x1="5.8" y1="-5.8" x2="-5.8" y2="5.8" stroke="#2A348C" stroke-width="2.6" stroke-linecap="round" />

                    `;

                    deleteBtnG.addEventListener('pointerdown', (e) => {

                        e.stopPropagation();

                        e.preventDefault();

                        hasCanvasUnsavedChanges = true;

                        const idx = placedMonstersState.findIndex(item => item.uid === m.uid);

                        if (idx >= 0) placedMonstersState.splice(idx, 1);

                        if (selectedPlacedMonsterUid === m.uid) {

                            selectedPlacedMonsterUid = placedMonstersState.length > 0

                                ? placedMonstersState[placedMonstersState.length - 1].uid

                                : null;

                        }

                        renderPlacedMonstersLayer();

                        syncStallMonsterMenuPlacedState();

                    });

                    rootG.appendChild(deleteBtnG);



                    // 左下角旋轉與縮放控制點 (⤵) (整體放大 1/3 倍：scale(1.3333))

                    const rotateScaleBtnG = document.createElementNS(svgNs, 'g');

                    rotateScaleBtnG.setAttribute('transform', `translate(${(-halfBox).toFixed(1)}, ${halfBox.toFixed(1)}) scale(1.3333)`);

                    rotateScaleBtnG.style.cursor = 'nwse-resize';

                    rotateScaleBtnG.innerHTML = `

                        <circle cx="0" cy="0" r="22" fill="transparent" />

                        <circle cx="0" cy="0" r="16.5" fill="#FFF9EC" stroke="#2A348C" stroke-width="2.4" />

                        <path d="M -5,-5 C -5,2 0,6 6,6" fill="none" stroke="#2A348C" stroke-width="2.4" stroke-linecap="round" />

                        <polyline points="2,2 6.5,6 2,9.5" fill="none" stroke="#2A348C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

                    `;
                    rotateScaleBtnG.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        const pt = clientToCanvasPoint(e.clientX, e.clientY, layerEl);
                        const dx = pt.x - m.x;
                        const dy = pt.y - m.y;
                        const startDist = Math.max(10, Math.hypot(dx, dy));
                        const startAngleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
                        activeTransformSession = {
                            mode: 'rotate-scale',
                            monster: m,
                            layerEl,
                            startDist,
                            startAngleDeg,
                            initialScale: m.scale,
                            initialRotation: m.rotation
                        };
                    });
                    rootG.appendChild(rotateScaleBtnG);
                }

                layerEl.appendChild(rootG);
            });
        }

        function renderPlacedMonstersLayer() {
            renderMonstersIntoLayer(placedMonstersLayerEl);
            renderMonstersIntoLayer(mobilePlacedMonstersLayerEl);
        }

        window.addEventListener('pointermove', (e) => {
            if (!activeTransformSession) return;
            const pt = clientToCanvasPoint(e.clientX, e.clientY, activeTransformSession.layerEl);
            const m = activeTransformSession.monster;
            if (!m) return;

            if (activeTransformSession.mode === 'move') {
                hasCanvasUnsavedChanges = true;
                const dx = pt.x - activeTransformSession.startSvgX;
                const dy = pt.y - activeTransformSession.startSvgY;
                m.x = clampMonsterX(activeTransformSession.initialX + dx, m.scale);
                m.y = Math.min(720, Math.max(40, activeTransformSession.initialY + dy));
                renderPlacedMonstersLayer();
            } else if (activeTransformSession.mode === 'rotate-scale') {
                hasCanvasUnsavedChanges = true;
                const dx = pt.x - m.x;
                const dy = pt.y - m.y;
                const curDist = Math.max(10, Math.hypot(dx, dy));
                const curAngleDeg = Math.atan2(dy, dx) * (180 / Math.PI);

                const scaleRatio = curDist / activeTransformSession.startDist;
                m.scale = Math.min(3.5, Math.max(0.5, activeTransformSession.initialScale * scaleRatio));                m.x = clampMonsterX(m.x, m.scale);

                const deltaAngle = curAngleDeg - activeTransformSession.startAngleDeg;
                m.rotation = activeTransformSession.initialRotation + deltaAngle;
                renderPlacedMonstersLayer();
            }
        });

        window.addEventListener('pointerup', () => {
            activeTransformSession = null;
        });

        function getFormattedTodayDate() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

                const chars = Array.from(displayToiletName);

                if (len > 12) {
                    const splitIdx = Math.ceil(len / 2);

                    cardNameLine2El.textContent = line2Str;

                    cardNameLine2El.setAttribute('y', '6');

                    cardNameLine1El.textContent = displayToiletName;
                    cardNameLine1El.setAttribute('font-size', singleLineFontSize);

            const cardMonstersLayer = document.getElementById('cardPlacedMonstersLayer');

                placedMonstersState.forEach((m) => {
                    const g = document.createElementNS(svgNs, 'g');
                    g.setAttribute('transform', `translate(${m.x.toFixed(1)}, ${m.y.toFixed(1)}) rotate(${m.rotation.toFixed(1)})`);
                    const imgHalf = MONSTER_IMG_HALF * m.scale;
                    const img = document.createElementNS(svgNs, 'image');
                    img.setAttribute('href', m.url);
                    img.setAttribute('x', (-imgHalf).toFixed(1));
                    img.setAttribute('y', (-imgHalf).toFixed(1));
                    img.setAttribute('width', (imgHalf * 2).toFixed(1));
