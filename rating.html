        async function applyEvaluationRecordToCanvas(record) {
            if (!record) {
                currentEditingEvalRecord = null;
                // 👇 新增：第一次評鑑公廁時，固定將廁間與小便斗預設鞋子設為夾腳拖鞋
                setStallShoeType('stall_flippers', false);
                setUrinalShoeType('urinal_flippers', false);

                starRatingsState.cleanliness = 3;
                starRatingsState.lighting = 3;
                starRatingsState.equipment = 3;
                starRatingsState.space = 3;
                renderAllInteractiveStars();
                savedUserCommentText = '';
                try {
                    sessionStorage.removeItem('poogle_draft_comment');
                } catch (e) {}
                updateCommentBtnLabels('我要留言');

                placedMonstersState.length = 0;
                selectedPlacedMonsterUid = null;
                renderPlacedMonstersLayer();
                syncStallMonsterMenuPlacedState();
                updateEditModeUiIndicators(false);
                return;
            }

            currentEditingEvalRecord = record;
            if (record.sceneType === 'urinal' || record.sceneType === 'stall') {
                setSceneType(record.sceneType, false);
            }
            if (record.stallShoeType) {
                setStallShoeType(normalizeStallShoeType(record.stallShoeType), false);
            }
            if (record.urinalShoeType) {
                setUrinalShoeType(normalizeUrinalShoeType(record.urinalShoeType), false);
            }
            if (record.shoeType) {
                if (String(record.shoeType).startsWith('urinal_')) {
                    setUrinalShoeType(normalizeUrinalShoeType(record.shoeType), false);
                } else {
                    setStallShoeType(normalizeStallShoeType(record.shoeType), false);
                }
            }

            const rt = record.ratings || {};
            starRatingsState.cleanliness = Math.min(5, Math.max(1, Math.round(Number(rt.cleanliness ?? record.stars ?? 3))));
            starRatingsState.lighting = Math.min(5, Math.max(1, Math.round(Number(rt.lighting ?? record.stars ?? 3))));
            starRatingsState.equipment = Math.min(5, Math.max(1, Math.round(Number(rt.equipment ?? rt.smell ?? record.stars ?? 3))));
            starRatingsState.space = Math.min(5, Math.max(1, Math.round(Number(rt.space ?? record.stars ?? 3))));
            renderAllInteractiveStars();

            savedUserCommentText = String(record.comment || '').trim();
            const commentLabel = savedUserCommentText ? '已留話 ✓' : '我要留言';
            updateCommentBtnLabels(commentLabel);

            placedMonstersState.length = 0;
            selectedPlacedMonsterUid = null;

            const rawMonsters = Array.isArray(record.monsters) && record.monsters.length > 0
                ? record.monsters
                : (Array.isArray(record.monsterIds) ? record.monsterIds.map(id => ({ id })) : []);

            const seenMonsterIds = new Set();
            for (let i = 0; i < rawMonsters.length; i++) {
                const rawM = rawMonsters[i];
                const mId = typeof rawM === 'string' ? rawM : rawM?.id;
                if (!mId || seenMonsterIds.has(mId)) continue;
                const catalogInfo = findMonsterCatalogInfo(mId);
                if (!catalogInfo && (!rawM || typeof rawM !== 'object' || !rawM.name)) continue;
                seenMonsterIds.add(mId);

                const folder = rawM?.folder || catalogInfo?.folder || 'stall';
                const name = rawM?.name || catalogInfo?.name || mId;
                const scaleVal = Number.isFinite(Number(rawM?.scale))
                    ? Math.min(2.0, Math.max(0.5, Number(rawM.scale)))
                    : 1.0;
                const rotVal = Number.isFinite(Number(rawM?.rotation)) ? Number(rawM.rotation) : 0;
                const fallbackOffset = (i % 5) * 18 - 36;
                const xVal = Number.isFinite(Number(rawM?.x))
                    ? clampMonsterX(Number(rawM.x), scaleVal)
                    : clampMonsterX(720 + fallbackOffset, scaleVal);
                const yVal = Number.isFinite(Number(rawM?.y))
                    ? Number(rawM.y)
                    : (376 + fallbackOffset);

                const itemForResolve = { id: mId, name, folder };
                const resolvedUrl = await resolveMonsterImageUrl(itemForResolve);
                placedMonstersState.push({
                    uid: `pm_restored_${i}_${Date.now()}`,
                    id: mId,
                    folder,
                    name,
                    url: resolvedUrl || getMonsterFallbackDataUri(mId),
                    x: xVal,
                    y: yVal,
                    scale: scaleVal,
                    rotation: rotVal
                });
            }

            renderPlacedMonstersLayer();
            syncStallMonsterMenuPlacedState();
            updateEditModeUiIndicators(true);
        }

        function watchCurrentToiletEvaluationInCloud(toiletName) {
            if (currentToiletEvalUnsubscribe) {
                try { currentToiletEvalUnsubscribe(); } catch (e) {}
                currentToiletEvalUnsubscribe = null;
            }
            const cleanName = String(toiletName || '').trim();
            const activeUid = getActiveAuthUser()?.uid || null;
            if (!db || !activeUid || !cleanName || cleanName === '公廁名') return;

            try {
                currentToiletEvalUnsubscribe = db.collection('evaluations')
                    .where('name', '==', cleanName)
                    .onSnapshot(async (snap) => {
                        try {
                            if (isPersistingEvaluation) return;
                            const currentUid = getActiveAuthUser()?.uid || null;
                            if (!currentUid) return;
                            const cloudMatches = [];
                            snap.forEach((doc) => {
                                const d = { id: doc.id, evalId: doc.data()?.evalId || doc.id, ...doc.data() };
                                if (isSameReporterRecord(d, currentUid)) {
                                    cloudMatches.push(d);
                                }
                            });
                            if (cloudMatches.length === 0 && currentEditingEvalRecord && currentEditingEvalRecord.cloudSynced !== false) {
                                purgeLocalEvaluationForToilet(cleanName);
                                hasCanvasUnsavedChanges = false;
                                await applyEvaluationRecordToCanvas(null);
                            }
                        } catch (err) {}
                    }, () => {});
            } catch (e) {}
        }

        async function checkAdminDeletionOnFocus(toiletName) {
            const cleanName = String(toiletName || '').trim();
            const activeUid = getActiveAuthUser()?.uid || null;
            if (!activeUid || !cleanName || cleanName === '公廁名') return;
            if (!currentEditingEvalRecord || isPersistingEvaluation) return;
            if (currentEditingEvalRecord.cloudSynced === false || !db) return;

            try {
                const snap = await db.collection('evaluations').where('name', '==', cleanName).get();
                let stillExistsInCloud = false;
                snap.forEach((doc) => {
                    const d = { id: doc.id, evalId: doc.data()?.evalId || doc.id, ...doc.data() };
                    if (isSameReporterRecord(d, activeUid)) {
                        stillExistsInCloud = true;
                    }
                });

                if (!stillExistsInCloud) {
                    purgeLocalEvaluationForToilet(cleanName);
                    hasCanvasUnsavedChanges = false;
                    await applyEvaluationRecordToCanvas(null);
                }
            } catch (e) {}
        }

        async function syncToiletEvaluationState(toiletName) {
            clearLegacyDeviceReporterId();
            const cleanName = String(toiletName || '').trim();
            const activeUid = getActiveAuthUser()?.uid || null;
            lastSyncedReporterUid = activeUid;

            if (currentToiletEvalUnsubscribe) {
                try { currentToiletEvalUnsubscribe(); } catch (e) {}
                currentToiletEvalUnsubscribe = null;
            }

        function traceExportRoundedRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function drawFittedImageOnCanvas(ctx, img, boxX, boxY, boxW, boxH, alignY = 'mid') {
            if (!img) return;
            const natW = img.naturalWidth || img.width || boxW;
            const natH = img.naturalHeight || img.height || boxH;
            if (natW <= 0 || natH <= 0) return;

            const scale = Math.min(boxW / natW, boxH / natH);
            const drawW = natW * scale;
            const drawH = natH * scale;
            const drawX = boxX + (boxW - drawW) / 2;
            const drawY = alignY === 'min' ? boxY : (boxY + (boxH - drawH) / 2);
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
        }

        async function loadHtmlImageDecoded(src) {
            return new Promise((resolve, reject) => {
                if (!src) {
                    reject(new Error('Empty image src'));
                    return;
                }
                const img = new Image();
                if (/^https?:\/\//i.test(src) && !src.startsWith(window.location.origin)) {
                    img.crossOrigin = 'anonymous';
                }
                img.onload = async () => {
                    try {
                        if (typeof img.decode === 'function') {
                            await img.decode();
                        }
                    } catch (e) {}
                    resolve(img);
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        async function loadRenderableCardImage(url, fallbackDataUri = '') {
            const isCanvasSafe = (img) => {
                try {
                    const testCvs = document.createElement('canvas');
                    testCvs.width = 1;
                    testCvs.height = 1;
                    const testCtx = testCvs.getContext('2d');
                    testCtx.drawImage(img, 0, 0, 1, 1);
                    testCvs.toDataURL('image/png');
                    return true;
                } catch (e) {
                    return false;
                }
            };

            if (url && url.startsWith('data:')) {
                try {
                    return await loadHtmlImageDecoded(url);
                } catch (e) {}
            }

            if (url && !url.startsWith('data:')) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const buf = await res.arrayBuffer();
                        let mime = (res.headers.get('content-type') || '').split(';')[0].trim();
                        if (!mime || mime === 'application/octet-stream' || mime.startsWith('text/')) {
                            if (/\.svg(\?|$)/i.test(url)) mime = 'image/svg+xml';
                            else if (/\.jpe?g(\?|$)/i.test(url)) mime = 'image/jpeg';
                            else if (/\.webp(\?|$)/i.test(url)) mime = 'image/webp';
                            else mime = 'image/png';
                        }
                        const fixedBlob = new Blob([buf], { type: mime });
                        const dataUri = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(fixedBlob);
                        });
                        if (typeof dataUri === 'string' && dataUri.startsWith('data:image/')) {
                            return await loadHtmlImageDecoded(dataUri);
                        }
                    }
                } catch (e) {}

                try {
                    const directImg = await loadHtmlImageDecoded(url);
                    if (isCanvasSafe(directImg)) {
                        return directImg;
                    }
                } catch (e) {}
            }

            if (fallbackDataUri) {
                try {
                    return await loadHtmlImageDecoded(fallbackDataUri);
                } catch (e) {}
            }
            return null;
        }

        async function renderPureVectorSvgLayerToImage(innerMarkup, exportW, exportH, exportScale, withOuterBg = false) {
            const svgStr = `
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                     width="${exportW * exportScale}" height="${exportH * exportScale}" viewBox="0 0 ${exportW} ${exportH}">
                    <defs>
                        <style>
                            text { font-family: 'jf-openhuninn', 'Huninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif; }
                            .hidden { display: none !important; }
                            .chick-face-active { display: none !important; }
                        </style>
                        <clipPath id="cardSceneRoundedClip">
                            <rect x="288" y="28" width="864" height="724" rx="34" />
                        </clipPath>
                    </defs>
                    ${withOuterBg ? `<rect x="0" y="0" width="${exportW}" height="${exportH}" rx="40" fill="#FFF9EC" />` : ''}
                    ${innerMarkup}
                </svg>
            `;
            const svgDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
            return loadHtmlImageDecoded(svgDataUri);
        }

                Array.from(fgClone.children).find((el) => el.tagName.toLowerCase() === 'rect')?.remove();

                // 3. 預先載入並完整解碼所有圖層
                const isUrinal = (currentSceneType === 'urinal');
                const shoeUrl = isUrinal

                    ? getUrinalShoeFallbackDataUri(currentUrinalShoeType)
                    : getStallShoeFallbackDataUri(currentStallShoeType);

                const [bgLayerImg, shoeImg, fgLayerImg, monsterImgs] = await Promise.all([
                    renderPureVectorSvgLayerToImage(bgClone.outerHTML, exportW, exportH, exportScale, true),
                    loadRenderableCardImage(shoeUrl, shoeFallbackUri),
                    renderPureVectorSvgLayerToImage(fgClone.outerHTML, exportW, exportH, exportScale, false),
                    Promise.all(placedMonstersState.map(async (m) => {
                        const folder = m.folder || findMonsterCatalogInfo(m.id)?.folder || 'stall';
                        const primaryUrl = m.url || await resolveMonsterImageUrl({ id: m.id, name: m.name, folder });
                        const fallbackUri = getMonsterFallbackDataUri(m.id);
                        return loadRenderableCardImage(primaryUrl, fallbackUri);
                    }))
                ]);

                // 4. 依正確圖層順序直接合成至 Canvas
                const canvas = document.createElement('canvas');
                canvas.width = exportW * exportScale;
                canvas.height = exportH * exportScale;
                const ctx = canvas.getContext('2d');
                ctx.scale(exportScale, exportScale);

                // (A) 繪製底層場景背景
                ctx.drawImage(bgLayerImg, 0, 0, exportW, exportH);

                // (B) 在圓角裁切範圍內依序繪製：腳／鞋子 → 前景褲子／印章／便利貼 → 擺放的小怪
                ctx.save();
                traceExportRoundedRect(ctx, 288 + offsetX, 28 + offsetY, 864, 724, 34);
                ctx.clip();

                if (shoeImg) {
                    if (isUrinal) {
                        drawFittedImageOnCanvas(ctx, shoeImg, 614 + offsetX, 492 + offsetY, 212, 165, 'min');
                    } else {
                        drawFittedImageOnCanvas(ctx, shoeImg, 544 + offsetX, 492 + offsetY, 352, 242, 'mid');
                    }
                }

                ctx.drawImage(fgLayerImg, 0, 0, exportW, exportH);

                placedMonstersState.forEach((m, idx) => {
                    const mImg = monsterImgs[idx];
                    if (!mImg) return;
                    const imgHalf = MONSTER_IMG_HALF * m.scale;
                    ctx.save();
                    ctx.translate(m.x + offsetX, m.y + offsetY);
                    ctx.rotate((m.rotation * Math.PI) / 180);
                    drawFittedImageOnCanvas(ctx, mImg, -imgHalf, -imgHalf, imgHalf * 2, imgHalf * 2, 'mid');
                    ctx.restore();
                });

                ctx.restore();

                // (C) 繪製最上層深藍圓角外框線
                traceExportRoundedRect(ctx, 288 + offsetX, 28 + offsetY, 864, 724, 34);
                ctx.strokeStyle = '#2A348C';
                ctx.lineWidth = 3.2;
                ctx.stroke();

                // 5. 輸出 PNG 並觸發下載

                    .replace(/[\\/:*?"<>|]/g, '_');
                const fileName = `有所味_${safeToiletName}_${getFormattedTodayDate()}.png`;

                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
                if (blob) {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                } else {
                    const dataUrl = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            } catch (err) {
                console.warn('Export card error:', err);
            } finally {
                isDownloadingToiletCard = false;
                if (btnTextEl) btnTextEl.textContent = '下載圖卡';
                if (inlineBtnTextEl) inlineBtnTextEl.textContent = '下載圖卡';
                if (mobileInlineBtnTextEl) mobileInlineBtnTextEl.textContent = '下載圖卡';
            }
        }


        // ===================================================================

        let loadingWalkAnimId = null;

        function initLoadingHalftoneDots() {
            const svgEl = document.getElementById('loadingHalftoneSvg');
            const layer = document.getElementById('loadingHalftoneDotsLayer');
            if (!svgEl || !layer) return;

            const vw = Math.max(window.innerWidth || 1440, 320);
            const vh = Math.max(window.innerHeight || 780, 480);
            svgEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

            const isMobile = vw < 768;
            const rows = isMobile ? 21 : 22;
            const topY = isMobile ? Math.max(80, vh * 0.12) : Math.max(76, vh * 0.112);
            const bottomY = vh - 14;
            const dy = (bottomY - topY) / (rows - 1);
            const spacingX = isMobile ? Math.max(25, vw / 15.2) : Math.max(36, dy * 1.38);
            const cols = Math.ceil(vw / spacingX) + 2;
            const startX = (vw - (cols - 1) * spacingX) / 2;
            const topR = isMobile ? 1.15 : 1.65;
            const bottomR = isMobile ? 4.4 : 6.75;

            const frag = document.createDocumentFragment();
            const svgNs = 'http://www.w3.org/2000/svg';
            for (let r = 0; r < rows; r++) {
                const t = r / (rows - 1);
                const cy = (topY + r * dy).toFixed(1);
                const radius = (topR + t * (bottomR - topR)).toFixed(2);
                for (let c = 0; c < cols; c++) {
                    const circle = document.createElementNS(svgNs, 'circle');
                    circle.setAttribute('cx', (startX + c * spacingX).toFixed(1));
                    circle.setAttribute('cy', cy);
                    circle.setAttribute('r', radius);
                    frag.appendChild(circle);
                }
            }
            layer.innerHTML = '';
            layer.appendChild(frag);
        }

// 計算單隻雨鞋 SVG Path（邁步傾斜時整體稍微抬高，變平時貼回地面）
        function buildBootSvgPath(offsetX, tiltDeg, liftY = 0) {
            const groundY = 478 - liftY;
            const topCutY = 292 - liftY;
            const pivotX = 720 + offsetX + 26;
            const pivotY = groundY;
            const rad = (tiltDeg * Math.PI) / 180;
            const cosA = Math.cos(rad);
            const sinA = Math.sin(rad);

            const rotPt = (lx, ly) => {
                const dx = lx - 26;
                const dy = ly;
                return [
                    pivotX + dx * cosA - dy * sinA,
                    pivotY + dx * sinA + dy * cosA
                ];
            };

            // 腳筒前後邊線與 y = topCutY 水平線求交點，確保鞋口保持水平切齊並隨抬腳同步升高
            const intersectTopY = (localX) => {
                const [bx, by] = rotPt(localX, 0);
                const [tx, ty] = rotPt(localX, -220);
                const t = (topCutY - by) / (ty - by);
                return [bx + (tx - bx) * t, topCutY];
            };

            const [topBackX, topBackY] = intersectTopY(-54);
            const [topFrontX, topFrontY] = intersectTopY(52);
            const [heelStartX, heelStartY] = rotPt(-54, -48);
            const [heelCtrl1X, heelCtrl1Y] = rotPt(-54, -14);
            const [heelCtrl2X, heelCtrl2Y] = rotPt(-28, 0);
            const [soleBackX, soleBackY] = rotPt(-4, 0);
            const [soleFrontX, soleFrontY] = rotPt(52, 0);
            const [toeCtrl1X, toeCtrl1Y] = rotPt(86, 0);
            const [toeTipX, toeTipY] = rotPt(104, -22);
            const [toeTopX, toeTopY] = rotPt(104, -44);
            const [instepCtrl1X, instepCtrl1Y] = rotPt(104, -70);
            const [instepCtrl2X, instepCtrl2Y] = rotPt(80, -86);
            const [shinJoinX, shinJoinY] = rotPt(52, -90);

            const f = (n) => n.toFixed(1);
            return [
                `M ${f(topBackX)},${f(topBackY)}`,
                `L ${f(heelStartX)},${f(heelStartY)}`,
                `C ${f(heelCtrl1X)},${f(heelCtrl1Y)} ${f(heelCtrl2X)},${f(heelCtrl2Y)} ${f(soleBackX)},${f(soleBackY)}`,
                `L ${f(soleFrontX)},${f(soleFrontY)}`,
                `C ${f(toeCtrl1X)},${f(toeCtrl1Y)} ${f(toeTipX)},${f(toeTipY)} ${f(toeTopX)},${f(toeTopY)}`,
                `C ${f(instepCtrl1X)},${f(instepCtrl1Y)} ${f(instepCtrl2X)},${f(instepCtrl2Y)} ${f(shinJoinX)},${f(shinJoinY)}`,
                `L ${f(topFrontX)},${f(topFrontY)}`,
                `Z`
            ].join(' ');
        }

        function startLoadingBootsAnimation() {
            initLoadingHalftoneDots();
            const backBootEl = document.getElementById('loadingBootBack');
            const frontBootEl = document.getElementById('loadingBootFront');
            const shadowEl = document.getElementById('loadingBootsShadow');
            if (!backBootEl || !frontBootEl) return;

            const cycleDuration = 1100; // 完整左右邁步週期 (毫秒)
            const strideHalfSpan = 38;  // 前後跨步幅度
            const maxTiltDeg = 14.5;    // 邁步時雨鞋前傾角度
            const maxLiftY = 26;        // 邁步傾斜時雨鞋抬高的高度 (數值越大抬越高)

            const computeLegPose = (phase) => {
                // phase: 0 ~ 0.5 為抬腳向前邁步，0.5 ~ 1.0 為平踩向後支撐
                if (phase < 0.5) {
                    const p = phase / 0.5;
                    const easeP = 0.5 - 0.5 * Math.cos(p * Math.PI);
                    const offsetX = -strideHalfSpan + easeP * (strideHalfSpan * 2);

                    // 傾斜與抬高比例：起步時平滑抬起(0->1)，邁步至前方變平時同步放下(1->0)
                    let liftRatio = 1;
                    if (p < 0.18) {
                        liftRatio = 0.5 - 0.5 * Math.cos((p / 0.18) * Math.PI);
                    } else if (p > 0.82) {
                        liftRatio = 0.5 - 0.5 * Math.cos(((1 - p) / 0.18) * Math.PI);
                    }

                    const tilt = liftRatio * maxTiltDeg;
                    const liftY = liftRatio * maxLiftY;
                    return { offsetX, tilt, liftY };
                } else {
                    const p = (phase - 0.5) / 0.5;
                    const easeP = 0.5 - 0.5 * Math.cos(p * Math.PI);
                    const offsetX = strideHalfSpan - easeP * (strideHalfSpan * 2);
                    return { offsetX, tilt: 0, liftY: 0 };
                }
            };

            const tick = (now) => {
                const t = ((now - loadingStartTime) % cycleDuration) / cycleDuration;
                const backPose = computeLegPose(t);
                const frontPose = computeLegPose((t + 0.5) % 1.0);

                backBootEl.setAttribute('d', buildBootSvgPath(backPose.offsetX, backPose.tilt, backPose.liftY));
                frontBootEl.setAttribute('d', buildBootSvgPath(frontPose.offsetX, frontPose.tilt, frontPose.liftY));

                if (shadowEl) {
                    const spread = Math.abs(backPose.offsetX - frontPose.offsetX);
                    shadowEl.setAttribute('rx', (118 + spread * 0.45).toFixed(1));
                }
                loadingWalkAnimId = requestAnimationFrame(tick);
            };
            loadingWalkAnimId = requestAnimationFrame(tick);
        }
