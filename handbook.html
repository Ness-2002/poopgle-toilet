<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no, address=no, email=no">
    <title>有所味 Poopgle｜小怪圖鑑</title>
    <script>
        // 攔截預覽沙盒中本機圖檔或跨網域腳本限制產生的空白錯誤事件
        window.addEventListener('error', function(e) {
            if (e && e.target && e.target !== window) {
                if (typeof e.target.onerror === 'function') {
                    try { e.target.onerror.call(e.target, e); } catch (err) {}
                }
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            if (e && (!e.error || e.message === 'Script error.' || (e.message && e.message.indexOf('ResizeObserver') !== -1))) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            var isSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').indexOf('usercontent.goog') !== -1 ||
                (window.location.hostname || '').indexOf('googleusercontent.com') !== -1
            );
            if (e && (!e.reason || !e.reason.message || isSandbox)) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts 圓體備援 + jf open 粉圓體 (與 index.html 完全統一) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">
    <!-- Firebase SDK (用於個人空間登入狀態檢查與同步) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        /* ========================================================= */
        /* 與 index.html 100% 統一的色彩計畫與粉圓體設定               */
        /* ========================================================= */
        :root {
            --poogle-mint-bg: #45E5AC;
            --poogle-cream: #FFF9EC;
            --poogle-yellow: #F3EF84;
            --poogle-blue: #80E4FF;
            --poogle-pink: #FF99D3;
            --poogle-pink-stage: #FF85D0;
            --poogle-red: #F26559;
            --poogle-ink: #2A348C;
            --cursor-default: url('./img/mouse.png') 0 0, auto;
            --cursor-hover: url('./img/hover.png') 0 0, pointer;
        }

        @font-face {
            font-family: 'jf-openhuninn';
            src: local('jf-openhuninn-2.1'),
                 local('jf-openhuninn-2.0'),
                 local('jf-openhuninn-1.1'),
                 local('jf-openhuninn'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-web-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }

        body, svg text, button, a {
            font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
        }

        button, a, input, select, textarea, svg, g, rect, path, circle, ellipse, polygon, use, image,
        [role="button"], [tabindex] {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, svg {
            cursor: var(--cursor-default) !important;
        }

        a, button, [role="button"], .cursor-pointer,
        .tp-menu-item, .tp-menu-item *,
        .dex-pill-btn, .dex-pill-btn *,
        .dex-arch-slot image,
        .mobile-arch-card image,
        .mobile-cat-pill, .mobile-cat-pill * {
            cursor: var(--cursor-hover) !important;
        }

        body {
            background-color: var(--poogle-pink-stage);
            color: var(--poogle-ink);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0;
            padding: 0;
        }
        @media (min-width: 768px) {
            body {
                overflow: hidden;
            }
        }

        /* 隱藏導覽列小螢幕捲軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }


        /* ========================================================= */
        /* 手機版右上角衛生紙捲筒下拉選單動畫 (與 index.html 一致)     */
        /* ========================================================= */
        @keyframes tpDropdownUnroll {
            0%   { opacity: 0; transform: scaleY(0.18); }
            70%  { opacity: 1; transform: scaleY(1.03); }
            100% { opacity: 1; transform: scaleY(1); }
        }
        @keyframes tpDropdownRollUp {
            0%   { opacity: 1; transform: scaleY(1); }
            30%  { opacity: 1; transform: scaleY(1.02); }
            100% { opacity: 0; transform: scaleY(0.12); }
        }
        #tpRollDropdownMenu {
            transform-origin: top center;
        }
        #tpRollDropdownMenu.is-open {
            display: block;
            animation: tpDropdownUnroll 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #tpRollDropdownMenu.is-closing {
            display: block;
            pointer-events: none;
            animation: tpDropdownRollUp 0.26s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @media (min-width: 768px) {
            #tpRollDropdownMenu,
            #tpRollDropdownMenu.is-open,
            #tpRollDropdownMenu.is-closing {
                display: none !important;
            }
        }
        .tp-menu-item {
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .tp-menu-item:hover {
            transform: translateX(3px);
        }
        .tp-menu-item:hover text {
            fill: #F26559;
        }

        .poogle-pill-btn {
            border: 1.5px solid #2A348C;
            transition: all 0.16s ease;
        }

        .report-logo-sticker {
            filter: url(#logoStickerOutline);
            -webkit-filter: url(#logoStickerOutline);
        }

        /* ========================================================= */
        /* 小怪圖鑑拱門窗格、探頭動畫、分類膠囊與中央貼紙互動特效       */
        /* ========================================================= */
        @keyframes archEntrancePop {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.92);
            }
            70% {
                opacity: 1;
                transform: translateY(-4px) scale(1.015);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes monsterPeekIdle {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-7px);
            }
        }
        @keyframes titleStickerFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        @keyframes titleStickerPop {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.92) rotate(-1.5deg); }
            70%  { transform: scale(1.07) rotate(1.5deg); }
            100% { transform: scale(1); }
        }

        .dex-arch-entrance {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: archEntrancePop 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .dex-monster-idle-float {
            animation: monsterPeekIdle 3.4s ease-in-out infinite;
            will-change: transform;
        }

        /* 小怪切換與 Hover 探頭動畫層 */
        .dex-monster-swap-group {
            transform-box: fill-box;
            transform-origin: center bottom;
            will-change: transform, opacity;
            transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease-out;
        }
        .dex-monster-swap-group.is-swapping {
            transform: translateY(48px) scale(0.56);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.16s ease-in;
        }
        .dex-arch-slot:hover .dex-monster-swap-group:not(.is-swapping) {
            transform: translateY(-12px) scale(1.06);
        }

        /* 拱門維持純 2D 平面（移除外發光陰影） */
        .dex-arch-slot,
        .dex-arch-slot:hover {
            filter: none !important;
        }

        /* 深藍分類膠囊按鈕：順順向上位移＋顏色變淡（無任何立體影子） */
        .dex-pill-btn {
            transform-box: fill-box;
            transform-origin: center;
            filter: none !important;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .dex-pill-btn:hover {
            transform: translateY(-4px);
            filter: none !important;
        }
        .dex-pill-btn:active {
            transform: translateY(-2px);
            filter: none !important;
        }
        .dex-pill-btn rect {
            transition: fill 0.2s ease, stroke 0.2s ease;
        }
        .dex-pill-btn:not(.is-active):hover rect {
            fill: #4552B8;
        }
        .dex-pill-btn text {
            transition: fill 0.2s ease;
        }
        .dex-pill-btn.is-active rect {
            fill: #F3EF84;
            stroke: #2A348C;
            stroke-width: 2.8;
        }
        .dex-pill-btn.is-active:hover rect {
            fill: #F8F5A6;
        }
        .dex-pill-btn.is-active text {
            fill: #2A348C;
        }

        /* 中央「小怪圖鑑」貼紙字 */
        #dexMainTitleGroup {
            transform-box: fill-box;
            transform-origin: center;
        }

        /* 手機版分類膠囊：順順向上位移＋顏色變淡（無立體影子） */
        .mobile-cat-pill {
            box-shadow: none !important;
            filter: none !important;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease;
        }
        .mobile-cat-pill:not(.is-active):hover {
            transform: translateY(-3px);
            background-color: #4552B8;
        }
        .mobile-cat-pill:active {
            transform: translateY(-1px);
        }
        .mobile-cat-pill.is-active {
            background-color: #F3EF84 !important;
            color: #2A348C !important;
            border: 2.5px solid #2A348C;
        }
        /* ========================================================= */
        /* 小怪分類內頁（小仙 & 小妖）純 2D 卡片互動樣式               */
        /* ========================================================= */
        .cat-header-back-btn {
            cursor: var(--cursor-hover) !important;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cat-header-back-btn:hover {
            transform: translateY(-3px);
        }
        .cat-header-back-btn rect.cat-pill-main {
            transition: fill 0.2s ease;
        }
        .cat-header-back-btn:hover rect.cat-pill-main {
            fill: #4552B8;
        }

        .cat-arch-card {
            cursor: var(--cursor-hover) !important;
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: archEntrancePop 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .cat-arch-card * {
            cursor: var(--cursor-hover) !important;
        }
        /* 分類內頁與開頭頁小怪：Hover 原地微微放大 + 點擊快速輕跳一下 */
        @keyframes monsterQuickHop {
            0%   { transform: translateY(0px) scale(1.06); }
            42%  { transform: translateY(-11px) scale(1.09); }
            76%  { transform: translateY(1.5px) scale(1.08, 1.04); }
            100% { transform: translateY(0px) scale(1.08); }
        }
        .cat-arch-card .cat-monster-img,
        .dex-arch-slot image,
        .mobile-arch-card image {
            transform-box: fill-box;
            transform-origin: 50% 60%;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cat-arch-card:hover .cat-monster-img,
        .dex-arch-slot image:hover,
        .mobile-arch-card image:hover {
            transform: scale(1.08);
        }
        .is-hopping {
            animation: monsterQuickHop 0.24s cubic-bezier(0.22, 1, 0.36, 1) !important;
        }
        /* 「小妖」萬聖節抖抖字微顫動畫 */
        @keyframes impSpookyShiver {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            25%      { transform: translate(-0.8px, 0.6px) rotate(-1.2deg); }
            50%      { transform: translate(0.9px, -0.7px) rotate(1deg); }
            75%      { transform: translate(-0.6px, -0.5px) rotate(1.4deg); }
        }
        .spooky-imp-filter {
            filter: url(#impHalloweenWiggle);
            -webkit-filter: url(#impHalloweenWiggle);
        }
        .spooky-imp-shiver {
            transform-box: fill-box;
            transform-origin: center;
            animation: impSpookyShiver 0.32s steps(2, end) infinite;
        }
        /* 「小仙」優雅輕盈飄浮動畫 */
        @keyframes fairyGracefulFloat {
            0%, 100% {
                transform: translateY(0px) rotate(-1.2deg);
            }
            50% {
                transform: translateY(-7px) rotate(1.2deg);
            }
        }
        .fairy-graceful-float {
            transform-box: fill-box;
            transform-origin: center;
            animation: fairyGracefulFloat 3.2s ease-in-out infinite;
            will-change: transform;
        }
    </style>
</head>

<body class="min-h-screen md:h-screen w-screen overflow-x-hidden overflow-y-auto md:overflow-hidden select-none relative flex flex-col">

    <!-- 全域共用 SVG 濾鏡：Logo 貼紙框 & 中央「小怪圖鑑」雲朵白邊深藍細線貼紙濾鏡 -->
    <svg class="fixed top-0 left-0 w-0 h-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <defs>
            <!-- 「小妖」專屬：萬聖節波浪扭曲筆畫濾鏡 -->
            <filter id="impHalloweenWiggle" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.075 0.11" numOctaves="2" seed="8" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <!-- 左上角 Logo 貼紙濾鏡 (與 index.html 一致) -->
            <filter id="logoStickerOutline" x="-20%" y="-25%" width="140%" height="150%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="whiteBlur" />
                <feComponentTransfer in="whiteBlur" result="whiteMask">
                    <feFuncA type="linear" slope="20" intercept="-1" />
                </feComponentTransfer>
                <feFlood flood-color="#FFFFFF" flood-opacity="1" result="whiteColor" />
                <feComposite in="whiteColor" in2="whiteMask" operator="in" result="whiteOutline" />

                <feGaussianBlur in="whiteMask" stdDeviation="1.05" result="navyBlur" />
                <feComponentTransfer in="navyBlur" result="navyMask">
                    <feFuncA type="linear" slope="9" intercept="-0.35" />
                </feComponentTransfer>
                <feFlood flood-color="#2A348C" flood-opacity="1" result="navyColor" />
                <feComposite in="navyColor" in2="navyMask" operator="in" result="navyOutline" />

                <feMerge>
                    <feMergeNode in="navyOutline" />
                    <feMergeNode in="whiteOutline" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- 「小怪圖鑑」大標題專屬：圓潤厚白貼紙底 + 外圈 #2A348C 深藍描邊濾鏡 -->
            <!-- 「小怪圖鑑」大標題專屬：乾淨無雜點雲朵白貼紙底 + 平滑深藍細線濾鏡 -->
            <filter id="dexTitleCloudSticker" x="-35%" y="-55%" width="170%" height="210%" color-interpolation-filters="sRGB">
                <!-- 1. 先擴張融合字與字之間的縫隙，徹底消除白框內的深藍碎點 -->
                <feGaussianBlur in="SourceAlpha" stdDeviation="8.0 6.8" result="fusedBlur" />
                <feComponentTransfer in="fusedBlur" result="fusedCore">
                    <feFuncA type="linear" slope="24" intercept="-1.8" />
                </feComponentTransfer>

                <!-- 2. 微幅平滑收邊並做抗鋸齒，形成乾淨圓潤的純白貼紙底 -->
                <feGaussianBlur in="fusedCore" stdDeviation="3.2" result="smoothWhiteBlur" />
                <feComponentTransfer in="smoothWhiteBlur" result="stickerWhiteMask">
                    <feFuncA type="linear" slope="9" intercept="-6.2" />
                </feComponentTransfer>
                <feFlood flood-color="#FFFFFF" flood-opacity="1" result="pureWhite" />
                <feComposite in="pureWhite" in2="stickerWhiteMask" operator="in" result="whiteStickerBody" />

                <!-- 3. 沿著無雜點的白貼紙外緣，包覆一圈均勻平滑的 #2A348C 深藍框線 -->
                <feGaussianBlur in="stickerWhiteMask" stdDeviation="2.5" result="borderBlur" />
                <feComponentTransfer in="borderBlur" result="borderNavyMask">
                    <feFuncA type="linear" slope="8.5" intercept="-1.1" />
                </feComponentTransfer>
                <feFlood flood-color="#2A348C" flood-opacity="1" result="inkNavy" />
                <feComposite in="inkNavy" in2="borderNavyMask" operator="in" result="navyStickerBorder" />

                <!-- 4. 依序疊合：深藍外框 ➔ 純白貼紙底 ➔ 深藍文字 -->
                <feMerge>
                    <feMergeNode in="navyStickerBorder" />
                    <feMergeNode in="whiteStickerBody" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- 「有所味」1:1 向量備援 Logo 元件 -->
            <g id="youSuoWeiLogoVector">
                <g>
                    <path d="M 38,32 C 25,33 17,41 18,52 C 19,62 27,68 41,67 L 53,66 C 46,85 35,108 24,125 C 18,135 20,148 30,152 C 40,156 50,149 56,136 C 67,114 76,88 83,64 L 138,59 C 151,58 159,49 158,38 C 157,28 148,22 134,23 L 90,27 C 92,22 92,18 90,14 C 87,7 77,5 70,9 C 64,13 60,21 57,29 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />

                          fill="#F3EF84" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <line x1="74" y1="79" x2="126" y2="101" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <line x1="125" y1="76" x2="75" y2="103" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <path d="M 122,148 C 110,148 94,138 96,125 C 97,120 101,117 105,119 C 102,114 106,109 111,112 C 109,107 115,103 120,107 C 119,102 127,100 131,106 C 136,113 139,124 147,132"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <g transform="translate(182, 0)">
                    <path d="M 73,6 C 83,3 93,10 94,20 C 95,29 88,37 76,41 L 44,50 L 38,125 C 37,139 27,148 15,147 C 4,146 -3,136 -1,122 L 9,38 C 11,26 19,19 32,16 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <rect x="29" y="40" width="46" height="71" rx="8"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3.2" />
                    <circle cx="40" cy="76" r="3.5" fill="#80E4FF" stroke="#2A348C" stroke-width="2.6" />
                    <path d="M 128,8 C 138,5 148,12 149,22 C 150,31 143,39 131,43 L 106,50 L 105,54 L 138,52 C 149,51 157,59 157,69 C 157,79 149,86 138,87 L 132,87 L 132,144 C 132,156 123,164 112,164 C 101,164 93,156 93,144 L 93,89 L 91,89 C 89,112 84,132 76,146 C 70,156 59,159 50,154 C 41,149 39,138 44,127 C 53,110 57,84 59,48 C 60,36 67,28 79,24 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                </g>
                <g transform="translate(345, 0)">
                    <path d="M 18,48 L 48,50 C 58,51 64,58 63,69 L 57,140 C 56,151 48,157 37,156 L 11,154 C 1,153 -5,145 -4,134 L 2,63 C 3,53 9,47 18,48 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <line x1="29" y1="74" x2="25" y2="128" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <path d="M 80,115 L 55,152 C 49,161 52,172 61,177 C 70,182 81,179 87,169 L 104,142 L 104,162 C 104,173 112,181 122,181 C 132,181 140,173 140,162 L 140,142 L 155,169 C 161,179 172,182 181,177 C 190,172 193,161 187,152 L 164,115 Z"

                    <path d="M 118,22 C 138,18 152,35 138,49 C 162,51 172,76 150,86 C 178,90 182,126 152,130 L 86,125 C 56,121 62,85 88,83 C 68,72 78,46 102,47 C 112,47 122,36 118,22 Z"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />

        // ===================================================================
        // 🖼️ 圖片預載解碼與候選路徑解析引擎 (優先抓取真實 img/.../*.png)
        // ===================================================================
        const preloadedMonsterCache = new Map();

        function createMonsterEntry(folder, fileName, indexSeed) {
            const baseName = fileName.replace(/\.(png|PNG|svg|SVG|webp|WEBP|jpg|JPG)$/i, '');
            const encodedFile = encodeURIComponent(fileName);
            const encodedBase = encodeURIComponent(baseName);
            const candidates = Array.from(new Set([
                `./img/${folder}/${encodedFile}`,
                `./img/${folder}/${fileName}`,
                `./img/${folder}/${encodedBase}.png`,
                `./img/${folder}/${encodedBase}.PNG`,
                `img/${folder}/${encodedFile}`,
                `img/${folder}/${encodedBase}.png`
            ]));
            return {
                id: `${folder}_${baseName}`,
                folder,
                fileName,
                baseName,
                indexSeed,
                candidates,
                resolvedUrl: null,
                isRealPng: false
            };
        }

        function resolveMonsterPngUrl(item) {
            if (item.resolvedUrl && preloadedMonsterCache.has(item.resolvedUrl)) {
                return Promise.resolve(item.resolvedUrl);
            }

            const isSandboxEnv = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').includes('usercontent.goog') ||
                (window.location.hostname || '').includes('googleusercontent.com')
            );

            if (isSandboxEnv) {
                const fallbackUri = buildSandboxFallbackMonsterSvg(item.folder, item.indexSeed);
                item.resolvedUrl = fallbackUri;
                item.isRealPng = false;
                preloadedMonsterCache.set(fallbackUri, true);
                return Promise.resolve(fallbackUri);
            }

            return new Promise((resolve) => {
                let idx = 0;
                let settled = false;
                const finish = (url, isReal, imgObj) => {
                    if (settled) return;
                    settled = true;
                    item.resolvedUrl = url;
                    item.isRealPng = isReal;
                    if (url) preloadedMonsterCache.set(url, imgObj || true);
                    resolve(url);
                };

                const tryNextCandidate = () => {
                    if (settled) return;
                    if (idx >= item.candidates.length) {
                        // 若本機所有候選路徑皆找不到該檔案，才使用備援圖示避免空白破圖
                        const fallbackUri = buildSandboxFallbackMonsterSvg(item.folder, item.indexSeed);
                        finish(fallbackUri, false, null);
                        return;
                    }
                    const testUrl = item.candidates[idx++];
                    const probe = new Image();
                    probe.decoding = 'async';
                    probe.onload = () => {
                        if (typeof probe.decode === 'function') {
                            probe.decode()
                                .catch(() => {})
                                .finally(() => finish(testUrl, true, probe));
                        } else {
                            finish(testUrl, true, probe);
                        }
                    };
                    probe.onerror = () => tryNextCandidate();
                    probe.src = testUrl;
                };
                tryNextCandidate();
            });
        }

        // ===================================================================
        // 🎲 四資料夾均衡隨機洗牌、篩選與自動輪播控制器
        // ===================================================================
        function shuffleList(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function buildBalancedPoolIndices(pool, filterCategory = null) {
            if (filterCategory) {
                const filtered = [];
                pool.forEach((m, idx) => {
                    if (m.folder === filterCategory) filtered.push(idx);
                });
                return shuffleList(filtered);
            }

            // 從 stall / urinal / consumable / hardware 四處均衡交錯隨機抽取
            const byFolder = { stall: [], urinal: [], consumable: [], hardware: [] };
            pool.forEach((m, idx) => {
                if (!byFolder[m.folder]) byFolder[m.folder] = [];
                byFolder[m.folder].push(idx);
            });
            const folderKeys = shuffleList(Object.keys(byFolder).filter(k => byFolder[k].length > 0));
            folderKeys.forEach(k => { byFolder[k] = shuffleList(byFolder[k]); });

            const interleaved = [];
            const maxLen = Math.max(0, ...folderKeys.map(k => byFolder[k].length));
            for (let r = 0; r < maxLen; r++) {
                folderKeys.forEach(k => {
                    if (r < byFolder[k].length) interleaved.push(byFolder[k][r]);
                });
            }
            return interleaved;
        }

        // ===================================================================
        // 🔵 滿版互動漸變圓點網格 (與 index.html 相同的游標靠近擴散效果)
        // ===================================================================
        let halftoneDotStates = [];
        let halftoneCursorX = null;
        let halftoneCursorY = null;
        let halftoneLoopStarted = false;

        function renderIllustratorHalftoneGrid() {
            const svgEl = document.getElementById('fullScreenHalftoneSvg');
            const group = document.getElementById('halftoneDotsBgLayer');
            if (!svgEl || !group) return;

            const vw = Math.max(window.innerWidth || 1440, 320);
            const vh = Math.max(window.innerHeight || 780, 480);
            svgEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

            const isMobile = vw < 768;
            const rows = isMobile ? 21 : 22;
            const topY = isMobile ? Math.max(150, vh * 0.2) : Math.max(82, vh * 0.125);
            const bottomY = vh - 14;
            const dy = (bottomY - topY) / (rows - 1);

            const spacingX = isMobile ? Math.max(25, vw / 15.2) : Math.max(36, dy * 1.38);
            const cols = Math.ceil(vw / spacingX) + 2;
            const totalGridWidth = (cols - 1) * spacingX;
            const startX = (vw - totalGridWidth) / 2;

            const topR = isMobile ? 1.15 : 1.65;
            const bottomR = isMobile ? 4.4 : 6.75;

            const frag = document.createDocumentFragment();
            const nextStates = [];
            const svgNs = 'http://www.w3.org/2000/svg';

            for (let r = 0; r < rows; r++) {
                const t = r / (rows - 1);
                const baseY = topY + r * dy;
                const baseR = topR + t * (bottomR - topR);
                for (let c = 0; c < cols; c++) {
                    const baseX = startX + c * spacingX;
                    const circleEl = document.createElementNS(svgNs, 'circle');
                    circleEl.setAttribute('cx', baseX.toFixed(2));
                    circleEl.setAttribute('cy', baseY.toFixed(2));
                    circleEl.setAttribute('r', baseR.toFixed(2));
                    frag.appendChild(circleEl);

                    nextStates.push({
                        el: circleEl,
                        baseX,
                        baseY,
                        baseR,
                        curX: baseX,
                        curY: baseY,
                        curR: baseR,
                        isDirty: false
                    });
                }
            }

            group.innerHTML = '';
            group.appendChild(frag);
            halftoneDotStates = nextStates;

            if (!halftoneLoopStarted) {
                halftoneLoopStarted = true;
                let lastTouchTime = 0;
                const clearCursor = () => { halftoneCursorX = null; halftoneCursorY = null; };

                window.addEventListener('mousemove', (e) => {
                    if (Date.now() - lastTouchTime < 800) return;
                    halftoneCursorX = e.clientX;
                    halftoneCursorY = e.clientY;
                }, { passive: true });
                window.addEventListener('mouseleave', clearCursor);
                window.addEventListener('blur', clearCursor);
                window.addEventListener('touchstart', (e) => {
                    lastTouchTime = Date.now();
                    if (e.touches && e.touches[0]) {
                        halftoneCursorX = e.touches[0].clientX;
                        halftoneCursorY = e.touches[0].clientY;
                    }
                }, { passive: true });
                window.addEventListener('touchend', clearCursor, { passive: true });

                requestAnimationFrame(animateHalftoneHoverEffect);
            }
        }

        function animateHalftoneHoverEffect() {
            const influenceRadius = 185;
            const maxOutwardShift = 9.5;
            const lerpSpeed = 0.2;
            const hasCursor = (halftoneCursorX !== null && halftoneCursorY !== null);

            for (let i = 0; i < halftoneDotStates.length; i++) {
                const d = halftoneDotStates[i];
                let targetX = d.baseX;
                let targetY = d.baseY;
                let targetR = d.baseR;

                if (hasCursor) {
                    const dx = d.baseX - halftoneCursorX;
                    const dy = d.baseY - halftoneCursorY;
                    if (Math.abs(dx) < influenceRadius && Math.abs(dy) < influenceRadius) {
                        const dist = Math.hypot(dx, dy);
                        if (dist < influenceRadius) {
                            const proximity = 1 - (dist / influenceRadius);
                            const ease = Math.pow(proximity, 1.45);
                            targetR = d.baseR * (1 + ease * 1.45) + (ease * 2.8);
                            if (dist > 0.1) {
                                const push = Math.sin(proximity * Math.PI) * maxOutwardShift;
                                targetX = d.baseX + (dx / dist) * push;
                                targetY = d.baseY + (dy / dist) * push;
                            }
                            d.isDirty = true;
                        }
                    }
                }

                if (d.isDirty) {
                    d.curX += (targetX - d.curX) * lerpSpeed;
                    d.curY += (targetY - d.curY) * lerpSpeed;
                    d.curR += (targetR - d.curR) * lerpSpeed;

                    const settled =
                        Math.abs(d.curR - d.baseR) < 0.03 &&
                        Math.abs(d.curX - d.baseX) < 0.05 &&
                        Math.abs(d.curY - d.baseY) < 0.05 &&
                        targetR === d.baseR;

                    if (settled) {
                        d.curX = d.baseX;
                        d.curY = d.baseY;
                        d.curR = d.baseR;
                        d.isDirty = false;
                    }
                    d.el.setAttribute('cx', d.curX.toFixed(2));
                    d.el.setAttribute('cy', d.curY.toFixed(2));
                    d.el.setAttribute('r', d.curR.toFixed(2));
                }
            }
            requestAnimationFrame(animateHalftoneHoverEffect);
        }

        // Logo 載入與向量備援
        function initLogoImagesWithFallback() {
            const symbolEl = document.getElementById('youSuoWeiLogoVector');
            const applyUrl = (url) => {
                document.querySelectorAll('.poogle-logo-img').forEach((el) => {
                    if (el.tagName && el.tagName.toLowerCase() === 'img') el.src = url;
                    else el.setAttribute('href', url);
                });
            };
            if (symbolEl) {
                const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 560 190">${symbolEl.innerHTML}</svg>`;
                applyUrl(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgStr)}`);
            }
            const isSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').includes('usercontent.goog') ||
                (window.location.hostname || '').includes('googleusercontent.com')
            );
            if (isSandbox) return;
            const candidates = ['./img/logo.png', './img/logo.PNG', 'img/logo.png'];
            let idx = 0;
            const tryNext = () => {
                if (idx >= candidates.length) return;
                const url = candidates[idx++];
                const probe = new Image();
                probe.onload = () => applyUrl(url);
                probe.onerror = () => tryNext();
                probe.src = url;
            };
            tryNext();
        }

        // ===================================================================
        // 🚀 主程式初始化
        // ===================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            renderIllustratorHalftoneGrid();
            initLogoImagesWithFallback();
            buildArchStageDOM();
            window.addEventListener('resize', renderIllustratorHalftoneGrid);

            // 輕巧點擊音效支援
            let clickAudioCtx = null;
            function playPopSfx() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!clickAudioCtx) clickAudioCtx = new AudioCtx();
                    if (clickAudioCtx.state === 'suspended') clickAudioCtx.resume();
                    const now = clickAudioCtx.currentTime;
                    const osc = clickAudioCtx.createOscillator();
                    const gain = clickAudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain);
                    gain.connect(clickAudioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.095);
                } catch (e) {}
            }

            // 建立全資料夾小怪清單 (stall, urinal, consumable, hardware)
            const allMonsters = [];
            let seedCounter = 0;
            ['stall', 'urinal', 'consumable', 'hardware'].forEach((folder) => {
                (MONSTER_FOLDER_CONFIG[folder] || []).forEach((fileName) => {
                    allMonsters.push(createMonsterEntry(folder, fileName, seedCounter++));
                });
            });

            const TOTAL_SLOTS = DESKTOP_ARCH_LAYOUT.length;
            const ACTION_TYPES = ['walk_ltr', 'walk_rtl', 'peek_left', 'peek_right'];

            let activeCategory = null; // null = 四個資料夾全部隨機抓取
            let deck = buildBalancedPoolIndices(allMonsters, null);
            let deckCursor = 0;
            let recentExitedQueue = []; // 記錄最近剛離開窗戶的小怪，避免短時間重複出現
            let generationToken = 0;

            // 每扇窗戶各自獨立的動畫狀態機
            const slotStates = Array.from({ length: TOTAL_SLOTS }, (_, idx) => ({
                slotIdx: idx,
                monsterIdx: -1,
                lastMonsterIdx: -1,
                phase: 'waiting', // 'waiting' | 'loading' | 'moving' | 'scurry'
                waitRemaining: 0,
                elapsed: 0,
                duration: 3600,
                action: 'walk_ltr',
                hasMidPause: false,
                pauseX: 0,
                steps: 6,
                peekX: -52,
                peekY: 0,
                peekRot: 20,
                curX: -205,
                curY: 0,
                curRot: 0,
                scurryStartX: 0,
                scurryStartY: 0,
                scurryStartRot: 0,
                scurryTargetX: 205
            }));

            function setActorTransform(slotIdx, tx, ty, rot) {
                const st = slotStates[slotIdx];
                st.curX = tx;
                st.curY = ty;
                st.curRot = rot;
                const tf = `translate(${tx.toFixed(1)}, ${ty.toFixed(1)}) rotate(${rot.toFixed(1)}, 0, -28)`;
                document.getElementById(`desktopArchActor_${slotIdx}`)?.setAttribute('transform', tf);
                if (slotIdx < MOBILE_ARCH_COUNT) {
                    document.getElementById(`mobileArchActor_${slotIdx}`)?.setAttribute('transform', tf);
                }
            }

            // 指定四顆分類按鈕正上方的窗戶固定對應資料夾，其餘窗戶 (2, 5~9) 維持隨機
            const SLOT_FIXED_FOLDER = {
                0: 'stall',       // 廁間小怪上方窗戶 -> 只出現 img/stall
                1: 'urinal',      // 小便斗小怪上方窗戶 -> 只出現 img/urinal
                3: 'consumable',  // 消耗品小怪上方窗戶 -> 只出現 img/consumable
                4: 'hardware'     // 硬體小怪上方窗戶 -> 只出現 img/hardware
            };

            // 挑選下一隻不重複的小怪 (依窗戶位置決定專屬資料夾或全隨機，並排除畫面上已有的小怪)
            function pickUniqueNextMonster(targetSlotIdx) {
                const isMobileView = window.innerWidth < 768;
                const targetFolder = isMobileView
                    ? (activeCategory || null)
                    : (SLOT_FIXED_FOLDER[targetSlotIdx] || activeCategory || null);

                // 建立該窗戶專屬或全隨機洗牌後的候選名單
                const candidatePool = buildBalancedPoolIndices(allMonsters, targetFolder);
                if (candidatePool.length === 0) return 0;

                const visibleSlotCount = isMobileView ? MOBILE_ARCH_COUNT : TOTAL_SLOTS;
                const onScreenCounts = new Map();
                for (let s = 0; s < visibleSlotCount; s++) {
                    if (s === targetSlotIdx) continue;
                    const mIdx = slotStates[s].monsterIdx;
                    if (mIdx !== -1) {
                        onScreenCounts.set(mIdx, (onScreenCounts.get(mIdx) || 0) + 1);
                    }
                }

                const lastInThisSlot = slotStates[targetSlotIdx].lastMonsterIdx;

                // 第一優先：目前不在任何窗戶上、不是這扇窗剛走掉的那隻、也不在近期離開名單內
                for (let i = 0; i < candidatePool.length; i++) {
                    const cand = candidatePool[i];
                    if (!onScreenCounts.has(cand) && cand !== lastInThisSlot && !recentExitedQueue.includes(cand)) {
                        return cand;
                    }
                }

                // 第二優先：目前不在任何窗戶上、且不是這扇窗剛走掉的那隻
                for (let i = 0; i < candidatePool.length; i++) {
                    const cand = candidatePool[i];
                    if (!onScreenCounts.has(cand) && cand !== lastInThisSlot) {
                        return cand;
                    }
                }

                // 第三備援：挑畫面上出現次數最少、且與這扇窗上一隻不同的小怪
                let bestCand = candidatePool[0];
                let minCount = Infinity;
                for (let i = 0; i < candidatePool.length; i++) {
                    const cand = candidatePool[i];
                    const cnt = onScreenCounts.get(cand) || 0;
                    if (cand !== lastInThisSlot && cnt < minCount) {
                        minCount = cnt;
                        bestCand = cand;
                    }
                }
                return bestCand;
            }

            // 為窗戶隨機指派「經過窗戶」或「從窗邊偷看再躲起來」的動作參數
            function assignRandomAction(st, forcedAction = null) {
                let nextAction = forcedAction;
                if (!nextAction) {
                    const choices = ACTION_TYPES.filter(a => a !== st.action);
                    nextAction = choices[Math.floor(Math.random() * choices.length)];
                }
                st.action = nextAction;
                st.elapsed = 0;

                if (nextAction === 'walk_ltr' || nextAction === 'walk_rtl') {
                    st.hasMidPause = Math.random() < 0.42; // 42% 機率走到窗戶中間停下來張望一下再走出去
                    st.duration = st.hasMidPause ? (4600 + Math.random() * 1100) : (3600 + Math.random() * 1100);
                    st.pauseX = (Math.random() - 0.5) * 28;
                    st.steps = 6;
                } else if (nextAction === 'peek_left') {
                    st.duration = 2800 + Math.random() * 1100;
                    st.peekX = -60 + Math.random() * 18;
                    st.peekY = -8 + Math.random() * 14;
                    st.peekRot = 17 + Math.random() * 7;
                } else {
                    st.duration = 2800 + Math.random() * 1100;
                    st.peekX = 42 + Math.random() * 18;
                    st.peekY = -8 + Math.random() * 14;
                    st.peekRot = -(17 + Math.random() * 7);
                }
            }

            function easeOutPeek(x) {
                const c1 = 1.35;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
            }

            function easeInHide(x) {
                return x * x * x;
            }

            // 根據進度 t (0 ~ 1) 計算小怪當下的位置與歪頭角度
            function computeMonsterPose(st, t) {
                if (st.action === 'walk_ltr' || st.action === 'walk_rtl') {
                    const dir = st.action === 'walk_ltr' ? 1 : -1;
                    const startX = -205 * dir;
                    const endX = 205 * dir;

                    if (!st.hasMidPause) {
                        const tx = startX + (endX - startX) * t;
                        const wave = Math.sin(t * st.steps * Math.PI);
                        return { tx, ty: -Math.abs(wave) * 8.5, rot: wave * 4.2 };
                    }

                    if (t < 0.40) {
                        const p = t / 0.40;
                        const tx = startX + (st.pauseX - startX) * (1 - Math.pow(1 - p, 1.3));
                        const wave = Math.sin(p * 3 * Math.PI);
                        return { tx, ty: -Math.abs(wave) * 8, rot: wave * 4 };
                    } else if (t <= 0.62) {
                        const p = (t - 0.40) / 0.22;
                        return {
                            tx: st.pauseX,
                            ty: -Math.sin(p * Math.PI) * 3,
                            rot: Math.sin(p * Math.PI * 2) * 6.5
                        };
                    } else {
                        const p = (t - 0.62) / 0.38;
                        const tx = st.pauseX + (endX - st.pauseX) * Math.pow(p, 1.25);
                        const wave = Math.sin(p * 3 * Math.PI);
                        return { tx, ty: -Math.abs(wave) * 8, rot: wave * 4 };
                    }
                } else {
                    const hiddenX = st.action === 'peek_left' ? -205 : 205;
                    if (t < 0.27) {
                        const p = easeOutPeek(t / 0.27);
                        return {
                            tx: hiddenX + (st.peekX - hiddenX) * p,
                            ty: st.peekY * p,
                            rot: st.peekRot * p
                        };
                    } else if (t <= 0.74) {
                        const p = (t - 0.27) / 0.47;
                        return {
                            tx: st.peekX + Math.sin(p * Math.PI * 2) * 3.5,
                            ty: st.peekY - Math.sin(p * Math.PI) * 3.5,
                            rot: st.peekRot + Math.sin(p * Math.PI * 2) * 3.2
                        };
                    } else {
                        const p = easeInHide((t - 0.74) / 0.26);
                        return {
                            tx: st.peekX + (hiddenX - st.peekX) * p,
                            ty: st.peekY * (1 - p),
                            rot: st.peekRot * (1 - p)
                        };
                    }
                }
            }

            // 當小怪在窗外準備進場時，換上新小怪圖檔並啟動動作
            function spawnNextMonsterInSlot(slotIdx, token) {
                const st = slotStates[slotIdx];
                st.phase = 'loading';

                const nextMonsterIdx = pickUniqueNextMonster(slotIdx);
                st.monsterIdx = nextMonsterIdx; // 立即鎖定編號，防止其他窗戶同時間選到同一隻
                assignRandomAction(st);

                const startPose = computeMonsterPose(st, 0);
                setActorTransform(slotIdx, startPose.tx, startPose.ty, startPose.rot);

                const monster = allMonsters[nextMonsterIdx];
                resolveMonsterPngUrl(monster).then((url) => {
                    if (token !== generationToken || !url) return;
                    const dImg = document.getElementById(`desktopArchImg_${slotIdx}`);
                    const mImg = slotIdx < MOBILE_ARCH_COUNT ? document.getElementById(`mobileArchImg_${slotIdx}`) : null;
                    if (dImg) setSvgImageHref(dImg, url);
                    if (mImg) setSvgImageHref(mImg, url);

                    requestAnimationFrame(() => {
                        if (token !== generationToken) return;
                        st.phase = 'moving';
                    });
                });
            }

            // 初始化／切換分類時重新分配所有窗戶的小怪
            async function populateAllArchesRandomly(categoryFilter = null) {
                generationToken++;
                const myToken = generationToken;

                activeCategory = categoryFilter;
                deck = buildBalancedPoolIndices(allMonsters, activeCategory);
                deckCursor = 0;
                recentExitedQueue = [];

                document.querySelectorAll('.dex-pill-btn').forEach((btn) => {
                    btn.classList.toggle('is-active', btn.getAttribute('data-category') === activeCategory);
                });
                document.querySelectorAll('.mobile-cat-pill').forEach((btn) => {
                    btn.classList.toggle('is-active', btn.getAttribute('data-mobile-cat') === activeCategory);
                });

                slotStates.forEach((st, idx) => {
                    st.phase = 'loading';
                    st.monsterIdx = -1;
                    setActorTransform(idx, -205, 0, 0);
                });

                const chosenIndices = [];
                for (let i = 0; i < TOTAL_SLOTS; i++) {
                    const mIdx = pickUniqueNextMonster(i);
                    slotStates[i].monsterIdx = mIdx;
                    chosenIndices.push(mIdx);
                }

                await Promise.all(chosenIndices.map(idx => resolveMonsterPngUrl(allMonsters[idx])));
                if (myToken !== generationToken) return;

                // 打亂初始動作組合，讓畫面一打開同時有經過與偷看的小怪
                const initialActions = shuffleList([
                    'walk_ltr', 'peek_right', 'peek_left', 'walk_rtl', 'peek_left',
                    'peek_right', 'walk_ltr', 'walk_rtl', 'peek_left', 'peek_right'
                ]);

                slotStates.forEach((st, idx) => {
                    const url = allMonsters[st.monsterIdx]?.resolvedUrl;
                    const dImg = document.getElementById(`desktopArchImg_${idx}`);
                    const mImg = idx < MOBILE_ARCH_COUNT ? document.getElementById(`mobileArchImg_${idx}`) : null;
                    if (dImg && url) setSvgImageHref(dImg, url);
                    if (mImg && url) setSvgImageHref(mImg, url);

                    assignRandomAction(st, initialActions[idx % initialActions.length]);
                    // 錯開每扇窗戶的起始時間點，避免所有小怪齊步走
                    st.elapsed = st.duration * ((idx * 0.17 + Math.random() * 0.12) % 0.72);
                    const pose = computeMonsterPose(st, st.elapsed / st.duration);
                    setActorTransform(idx, pose.tx, pose.ty, pose.rot);
                    st.phase = 'moving';
                });
            }

            // 持續運行的動畫主迴圈
            let lastTickTime = performance.now();
            function tickWindowAnimations(now) {
                const dt = Math.min(50, Math.max(0, now - lastTickTime));
                lastTickTime = now;
                const curToken = generationToken;

                for (let i = 0; i < TOTAL_SLOTS; i++) {
                    const st = slotStates[i];

                    if (st.phase === 'moving') {
                        st.elapsed += dt;
                        if (st.elapsed >= st.duration) {
                            // 小怪已完全走出窗框或躲回牆後 -> 釋放編號並記錄至近期名單
                            if (st.monsterIdx !== -1) {
                                st.lastMonsterIdx = st.monsterIdx;
                                recentExitedQueue.push(st.monsterIdx);
                                const maxRecent = activeCategory ? 3 : 14;
                                while (recentExitedQueue.length > maxRecent) {
                                    recentExitedQueue.shift();
                                }
                                st.monsterIdx = -1;
                            }
                            setActorTransform(i, -205, 0, 0);
                            st.phase = 'waiting';
                            st.waitRemaining = 320 + Math.random() * 950;
                        } else {
                            const pose = computeMonsterPose(st, st.elapsed / st.duration);
                            setActorTransform(i, pose.tx, pose.ty, pose.rot);
                        }
                    } else if (st.phase === 'scurry') {
                        // 打地鼠效果：先嚇一跳微彈 (前 24%)，接著慌張擺動縮回窗台下或牆後躲起來
                        st.elapsed += dt;
                        const p = Math.min(1, st.elapsed / 340);

                        if (p < 0.24) {
                            const jolt = Math.sin((p / 0.24) * Math.PI);
                            const flinchRot = st.scurryStartRot + (st.scurryStartX <= 0 ? 8 : -8) * jolt;
                            setActorTransform(i, st.scurryStartX, st.scurryStartY - jolt * 12, flinchRot);
                        } else {
                            const hideP = (p - 0.24) / 0.76;
                            const easeIn = hideP * hideP;
                            const panicWiggle = Math.sin(hideP * Math.PI * 5) * 7 * (1 - hideP * 0.4);
                            const targetY = (typeof st.scurryTargetY === 'number') ? st.scurryTargetY : 195;
                            const tx = st.scurryStartX + (st.scurryTargetX - st.scurryStartX) * easeIn;
                            const ty = st.scurryStartY + (targetY - st.scurryStartY) * easeIn;
                            const rot = st.scurryStartRot * (1 - easeIn) + panicWiggle;
                            setActorTransform(i, tx, ty, rot);
                        }

                        if (p >= 1) {
                            if (st.monsterIdx !== -1) {
                                st.lastMonsterIdx = st.monsterIdx;
                                recentExitedQueue.push(st.monsterIdx);
                                const maxRecent = activeCategory ? 3 : 14;
                                while (recentExitedQueue.length > maxRecent) {
                                    recentExitedQueue.shift();
                                }
                                st.monsterIdx = -1;
                            }
                            setActorTransform(i, -210, 0, 0);
                            st.phase = 'waiting';
                            st.waitRemaining = 700 + Math.random() * 900; // 躲起來後空窗一下再換新小怪探頭
                        }
                    } else if (st.phase === 'waiting') {
                        st.waitRemaining -= dt;
                        if (st.waitRemaining <= 0) {
                            spawnNextMonsterInSlot(i, curToken);
                        }
                    }
                }

                requestAnimationFrame(tickWindowAnimations);
            }

            // 啟動初次載入與連續動畫，並在背景預載全部 32 張小怪 PNG
            await populateAllArchesRandomly(null);
            lastTickTime = performance.now();
            requestAnimationFrame(tickWindowAnimations);
            Promise.all(allMonsters.map(m => resolveMonsterPngUrl(m)));

            // ===================================================================
            // 🔊 小怪點擊音效系統 (隨機播放 ./sfx/squeak/*.mp3，最多連續 1~2 次，第 3 次絕不重複)
            // ===================================================================
            // 💡 若直接雙擊 HTML 開啟或上傳至 GitHub Pages，可將 sfx/squeak 資料夾內的 mp3 檔名填寫於下方
            //    例如：const SQUEAK_MP3_FILES = ['squeak1.mp3', 'squeak2.mp3', 'squeak3.mp3'];
            //    (若使用 VS Code Live Server 預覽，留空也會自動掃描 sfx/squeak 內所有 mp3！)
            const SQUEAK_MP3_FILES = [];

            const squeakAudioUrls = [];
            const squeakPreloadMap = new Map();
            let lastSqueakIdx = -1;
            let squeakStreakCount = 0;

            function registerSqueakUrl(url) {
                if (!url || squeakPreloadMap.has(url)) return;
                const audio = new Audio(url);
                audio.preload = 'auto';
                squeakPreloadMap.set(url, audio);
                squeakAudioUrls.push(url);
            }

            function probeAudioFile(url) {
                return new Promise((resolve) => {
                    let done = false;
                    const finish = (ok) => {
                        if (done) return;
                        done = true;
                        resolve(ok ? url : null);
                    };
                    const probe = new Audio();
                    probe.preload = 'metadata';
                    probe.onloadedmetadata = () => finish(true);
                    probe.oncanplaythrough = () => finish(true);
                    probe.onerror = () => finish(false);
                    setTimeout(() => finish(false), 1800);
                    probe.src = url;
                });
            }

            async function initSqueakSoundPool() {
                // 1. 優先讀取上方 SQUEAK_MP3_FILES 手動指定的檔名
                if (SQUEAK_MP3_FILES.length > 0) {
                    const manualResults = await Promise.all(
                        SQUEAK_MP3_FILES.map((name) => {
                            const clean = name.replace(/^\.?\/?(sfx\/squeak\/)?/i, '');
                            const encoded = clean.split('/').map(encodeURIComponent).join('/');
                            return probeAudioFile(`./sfx/squeak/${encoded}`);
                        })
                    );
                    manualResults.filter(Boolean).forEach(registerSqueakUrl);
                }

                // 2. 本地伺服器環境 (如 VS Code Live Server) 自動掃描 ./sfx/squeak/ 內所有 .mp3
                if (squeakAudioUrls.length === 0 && window.location.protocol.startsWith('http')) {
                    try {
                        const res = await fetch('./sfx/squeak/');
                        if (res.ok) {
                            const html = await res.text();
                            const dirBase = new URL('./sfx/squeak/', window.location.href).href;
                            const doc = new DOMParser().parseFromString(html, 'text/html');
                            doc.querySelectorAll('a[href]').forEach((a) => {
                                const rawHref = a.getAttribute('href') || '';
                                const cleanPath = rawHref.split('?')[0].split('#')[0];
                                if (!cleanPath.toLowerCase().endsWith('.mp3')) return;
                                const fullUrl = (!rawHref.startsWith('/') && !rawHref.startsWith('http') && rawHref.includes('sfx/squeak/'))
                                    ? new URL(rawHref, window.location.href).href
                                    : new URL(rawHref, dirBase).href;
                                registerSqueakUrl(fullUrl);
                            });
                        }
                    } catch (e) {}
                }

                // 3. 備援自動探測常見檔名 (1.mp3~10.mp3, 01.mp3~10.mp3, squeak1.mp3~10.mp3, squeak_1.mp3~10.mp3)
                if (squeakAudioUrls.length === 0) {
                    const commonNames = ['squeak.mp3'];
                    for (let i = 1; i <= 10; i++) {
                        const pad = String(i).padStart(2, '0');
                        commonNames.push(
                            `${i}.mp3`,
                            `${pad}.mp3`,
                            `squeak${i}.mp3`,
                            `squeak${pad}.mp3`,
                            `squeak_${i}.mp3`,
                            `squeak_${pad}.mp3`,
                            `squeak-${i}.mp3`
                        );
                    }
                    const probed = await Promise.all(
                        commonNames.map((n) => probeAudioFile(`./sfx/squeak/${n}`))
                    );
                    probed.filter(Boolean).forEach(registerSqueakUrl);
                }
            }

            // 隨機播放一首小怪音效（同一種聲音最多連續 1~2 次，第 3 次強制換別首）
            function playRandomSqueakSfx() {
                if (squeakAudioUrls.length === 0) {
                    playPopSfx();
                    return;
                }

                let nextIdx = 0;
                if (squeakAudioUrls.length === 1) {
                    nextIdx = 0;
                } else {
                    const candidates = [];
                    for (let i = 0; i < squeakAudioUrls.length; i++) {
                        // 若同一個聲音已經連續播放滿 2 次，第 3 次一定排除它
                        if (squeakStreakCount >= 2 && i === lastSqueakIdx) continue;
                        candidates.push(i);
                    }
                    nextIdx = candidates[Math.floor(Math.random() * candidates.length)];
                }

                if (nextIdx === lastSqueakIdx) {
                    squeakStreakCount++;
                } else {
                    lastSqueakIdx = nextIdx;
                    squeakStreakCount = 1;
                }

                try {
                    const player = new Audio(squeakAudioUrls[nextIdx]);
                    player.volume = 0.85;
                    player.play().catch(() => {});
                } catch (e) {}
            }

            // 觸發小怪原地快速輕跳一下（支援連續點擊重複起跳）
            function triggerMonsterHop(imgEl) {
                if (!imgEl) return;
                imgEl.classList.remove('is-hopping');
                void imgEl.getBoundingClientRect();
                imgEl.classList.add('is-hopping');
                imgEl.addEventListener('animationend', () => {

            // 標題頁打地鼠互動：點到小怪時發出叫聲並匆匆躲回牆後／窗台下
            function whackMonsterToHide(slotIdx) {
                const st = slotStates[slotIdx];
                if (!st || st.phase !== 'moving') return;

                playRandomSqueakSfx();
                st.phase = 'scurry';
                st.elapsed = 0;
                st.scurryStartX = st.curX;
                st.scurryStartY = st.curY;
                st.scurryStartRot = st.curRot;

                // 依小怪當下位置決定躲藏方向：靠窗邊就縮回牆後，在窗戶中間就像地鼠往下縮進窗台
                if (st.action === 'peek_left' || st.curX < -32) {
                    st.scurryTargetX = -210;
                    st.scurryTargetY = 30;
                } else if (st.action === 'peek_right' || st.curX > 32) {
                    st.scurryTargetX = 210;
                    st.scurryTargetY = 30;
                } else {
                    st.scurryTargetX = st.curX;
                    st.scurryTargetY = 195;
                }
            }

            function buildCategoryCardInnerSvg(item, dotColor, imgDomId) {
                const isTwoLines = item.desc.length > 1;
                const nameY = isTwoLines ? -220 : -210;
                const descMarkup = isTwoLines
                    ? `<text x="0" y="-189" fill="#2A348C" font-size="15.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" dominant-baseline="central">${item.desc[0]}</text>
                       <text x="0" y="-168" fill="#2A348C" font-size="15.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" dominant-baseline="central">${item.desc[1]}</text>`
                    : `<text x="0" y="-177" fill="#2A348C" font-size="16" font-weight="700" letter-spacing="1.8" text-anchor="middle" dominant-baseline="central">${item.desc[0]}</text>`;

                const imgY = isTwoLines ? -152 : -158;
                const imgH = isTwoLines ? 156 : 162;

                return `
                    <path d="M -88,0 L -88,-188 A 88,88 0 0,1 88,-188 L 88,0 Z" fill="#FFF9EC" />
                    <path d="M -88,0 L -88,-188 A 88,88 0 0,1 88,-188 L 88,0"
                          fill="none" pathLength="500" stroke="${dotColor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.05 10" />
                    <line x1="-74.46" y1="0" x2="74.46" y2="0"
                          pathLength="110" stroke="${dotColor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.05 10" />
                    <text x="0" y="${nameY}" fill="#2A348C" font-size="25" font-weight="900" letter-spacing="2.5" text-anchor="middle" dominant-baseline="central">
                        ${item.name}
                    </text>
                    ${descMarkup}
                    <image id="${imgDomId}" class="cat-monster-img" x="-84" y="${imgY}" width="168" height="${imgH}" preserveAspectRatio="xMidYMax meet" />
                `;
            }

            // 計算桌面版每排拱門的水平置中 X 座標
            function getRowCentersX(count, maxColsInPage) {
                const step = maxColsInPage >= 5 ? 232 : 244;
                const startX = 720 - ((count - 1) * step) / 2;
                return Array.from({ length: count }, (_, i) => startX + i * step);
            }

                const TOP_ROW_BOTTOM_Y = 365;
                const BOTTOM_ROW_BOTTOM_Y = 679;

                const bottomCenters = getRowCentersX(cfg.imps.length, maxCols);

                const bottomLabelX = bottomCenters[0] - 138;

                        <g class="fairy-graceful-float">

                        </g>
                        <g class="fairy-graceful-float" style="animation-delay: -0.5s;">

                        <g class="spooky-imp-shiver">
                            <text x="0" y="-149" transform="rotate(-6, 0, -149)" fill="${GREEN_DOT}" font-size="29" font-weight="900" text-anchor="middle" dominant-baseline="central">小</text>
                        </g>
                        <g class="spooky-imp-shiver" style="animation-delay: -0.15s;">
                            <text x="0" y="-113" transform="rotate(5, 0, -113)" fill="${GREEN_DOT}" font-size="29" font-weight="900" text-anchor="middle" dominant-baseline="central">妖</text>
                        </g>
                    </g>
                `;

                let mobileFairiesMarkup = '';
                let mobileImpsMarkup = '';
                const bindTasks = [];

                cfg.fairies.forEach((item, idx) => {
                    const dId = `catDesktopFairyImg_${idx}`;
                    const mId = `catMobileFairyImg_${idx}`;
                    const delay = (idx * 0.04).toFixed(2);
                    desktopSvgMarkup += `
                        <g transform="translate(${topCenters[idx]}, ${TOP_ROW_BOTTOM_Y})">
                            <g class="cat-arch-card" style="animation-delay: ${delay}s;">
                                ${buildCategoryCardInnerSvg(item, PINK_DOT, dId)}
                            </g>
                        </g>`;
                    mobileFairiesMarkup += `
                        <div class="w-[46%] flex justify-center">
                            <svg viewBox="-95 -284 190 294" class="w-full h-auto block overflow-visible">
                                <g class="cat-arch-card" style="animation-delay: ${delay}s;">
                                    ${buildCategoryCardInnerSvg(item, PINK_DOT, mId)}
                                </g>
                            </svg>
                        </div>`;
                    bindTasks.push({ entry: findMonsterEntry(catKey, item.file), dId, mId });
                });

                cfg.imps.forEach((item, idx) => {
                    const dId = `catDesktopImpImg_${idx}`;
                    const mId = `catMobileImpImg_${idx}`;
                    const delay = ((cfg.fairies.length + idx) * 0.04).toFixed(2);
                    desktopSvgMarkup += `
                        <g transform="translate(${bottomCenters[idx]}, ${BOTTOM_ROW_BOTTOM_Y})">
                            <g class="cat-arch-card" style="animation-delay: ${delay}s;">
                                ${buildCategoryCardInnerSvg(item, GREEN_DOT, dId)}
                            </g>
                        </g>`;
                    mobileImpsMarkup += `
                        <div class="w-[46%] flex justify-center">
                            <svg viewBox="-95 -284 190 294" class="w-full h-auto block overflow-visible">
                                <g class="cat-arch-card" style="animation-delay: ${delay}s;">
                                    ${buildCategoryCardInnerSvg(item, GREEN_DOT, mId)}
                                </g>
                            </svg>
                        </div>`;
                    bindTasks.push({ entry: findMonsterEntry(catKey, item.file), dId, mId });
                });

                if (desktopCategoryCardsLayerEl) desktopCategoryCardsLayerEl.innerHTML = desktopSvgMarkup;
                if (mobileFairiesGridEl) mobileFairiesGridEl.innerHTML = mobileFairiesMarkup;
                if (mobileImpsGridEl) mobileImpsGridEl.innerHTML = mobileImpsMarkup;
                // 4. 載入並填入對應的小怪 PNG 圖檔
                bindTasks.forEach(({ entry, dId, mId }) => {
                    resolveMonsterPngUrl(entry).then((url) => {

                closeTpMenu();
                openUnderConstruction(e);
            });
            document.getElementById('tpMenuMonsterDexBtn')?.addEventListener('click', () => {
                closeTpMenu();
                triggerAllRandomShuffle();
            });
            document.getElementById('tpMenuPersonalSpaceBtn')?.addEventListener('click', (e) => {
                closeTpMenu();
                handleGoProfile(e);
            });

            document.addEventListener('pointerdown', (e) => {
                if (!tpRollDropdownMenu || !tpRollDropdownMenu.classList.contains('is-open')) return;
                if (tpRollDropdownMenu.contains(e.target) || topHamburgerBtn?.contains(e.target)) return;
                closeTpMenu();
            }, true);
        });
    </script>
</body>
