<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no, address=no, email=no">
    <title>有所味 Poopgle｜小怪圖鑑</title>
    <script>
        // 攔截預覽沙盒中本機圖檔或跨網域腳本限制產生的空白錯誤事件
        window.addEventListener('error', function(e) {
            if (e && e.target && e.target !== window) {
                if (typeof e.target.onerror === 'function') {
                    try { e.target.onerror.call(e.target, e); } catch (err) {}
                }
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            if (e && (!e.error || e.message === 'Script error.' || (e.message && e.message.indexOf('ResizeObserver') !== -1))) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            var isSandbox = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').indexOf('usercontent.goog') !== -1 ||
                (window.location.hostname || '').indexOf('googleusercontent.com') !== -1
            );
            if (e && (!e.reason || !e.reason.message || isSandbox)) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts 圓體備援 + jf open 粉圓體 (與 index.html 完全統一) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">
    <!-- 預先載入本機 Logo，避免畫面閃爍 -->
    <link rel="preload" as="image" href="./img/logo.png">
    <!-- Firebase SDK (用於個人空間登入狀態檢查與同步) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        /* ========================================================= */
        /* 與 index.html 100% 統一的色彩計畫與粉圓體設定               */
        /* ========================================================= */
        :root {
            --poogle-mint-bg: #45E5AC;
            --poogle-cream: #FFF9EC;
            --poogle-yellow: #F3EF84;
            --poogle-blue: #80E4FF;
            --poogle-pink: #FF99D3;
            --poogle-pink-stage: #FF99D3;
            --poogle-red: #F26559;
            --poogle-ink: #2A348C;
            --cursor-default: url('./img/mouse.png') 0 0, auto;
            --cursor-hover: url('./img/hover.png') 0 0, pointer;
        }

        @font-face {
            font-family: 'jf-openhuninn';
            src: local('jf-openhuninn-2.1'),
                 local('jf-openhuninn-2.0'),
                 local('jf-openhuninn-1.1'),
                 local('jf-openhuninn'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-web-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');
            font-display: swap;
        }

        body, svg text, button, a {
            font-family: 'jf-openhuninn', 'Varela Round', 'Kosugi Maru', 'Noto Sans TC', sans-serif;
        }

        button, a, input, select, textarea, svg, g, rect, path, circle, ellipse, polygon, use, image,
        [role="button"], [tabindex] {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, svg {
            cursor: var(--cursor-default) !important;
        }

        a, button, [role="button"], .cursor-pointer,
        .tp-menu-item, .tp-menu-item *,
        .dex-pill-btn, .dex-pill-btn *,
        .dex-arch-slot image,
        .mobile-arch-card image,
        .mobile-cat-pill, .mobile-cat-pill * {
            cursor: var(--cursor-hover) !important;
        }

        body {
            background-color: var(--poogle-pink-stage);
            color: var(--poogle-ink);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0;
            padding: 0;
        }
        @media (min-width: 768px) {
            body {
                overflow: hidden;
            }
        }

        /* 隱藏導覽列小螢幕捲軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }


        /* ========================================================= */
        /* 手機版右上角衛生紙捲筒下拉選單動畫 (與 index.html 一致)     */
        /* ========================================================= */
        @keyframes tpDropdownUnroll {
            0%   { opacity: 0; transform: scaleY(0.18); }
            70%  { opacity: 1; transform: scaleY(1.03); }
            100% { opacity: 1; transform: scaleY(1); }
        }
        @keyframes tpDropdownRollUp {
            0%   { opacity: 1; transform: scaleY(1); }
            30%  { opacity: 1; transform: scaleY(1.02); }
            100% { opacity: 0; transform: scaleY(0.12); }
        }
        #tpRollDropdownMenu {
            transform-origin: top center;
        }
        #tpRollDropdownMenu.is-open {
            display: block;
            animation: tpDropdownUnroll 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #tpRollDropdownMenu.is-closing {
            display: block;
            pointer-events: none;
            animation: tpDropdownRollUp 0.26s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @media (min-width: 768px) {
            #tpRollDropdownMenu,
            #tpRollDropdownMenu.is-open,
            #tpRollDropdownMenu.is-closing {
                display: none !important;
            }
        }
        .tp-menu-item {
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        .tp-menu-item:hover {
            transform: translateX(3px);
        }
        .tp-menu-item:hover text {
            fill: #F26559;
        }

        .poogle-pill-btn {
            border: 1.5px solid #2A348C;
            transition: all 0.16s ease;
        }

        .report-logo-sticker {
            filter: url(#logoStickerOutline);
            -webkit-filter: url(#logoStickerOutline);
        }

        /* ========================================================= */
        /* 小怪圖鑑拱門窗格、探頭動畫、分類膠囊與中央貼紙互動特效       */
        /* ========================================================= */
        @keyframes archEntrancePop {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.92);
            }
            70% {
                opacity: 1;
                transform: translateY(-4px) scale(1.015);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes monsterPeekIdle {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-7px);
            }
        }
        @keyframes titleStickerFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        @keyframes titleStickerPop {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.92) rotate(-1.5deg); }
            70%  { transform: scale(1.07) rotate(1.5deg); }
            100% { transform: scale(1); }
        }

        .dex-arch-entrance {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: archEntrancePop 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .dex-monster-idle-float {
            animation: monsterPeekIdle 3.4s ease-in-out infinite;
            will-change: transform;
        }

        /* 小怪切換與 Hover 探頭動畫層 */
        .dex-monster-swap-group {
            transform-box: fill-box;
            transform-origin: center bottom;
            will-change: transform, opacity;
            transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease-out;
        }
        .dex-monster-swap-group.is-swapping {
            transform: translateY(48px) scale(0.56);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.16s ease-in;
        }
        .dex-arch-slot:hover .dex-monster-swap-group:not(.is-swapping) {
            transform: translateY(-12px) scale(1.06);
        }

        /* 拱門維持純 2D 平面（移除外發光陰影） */
        .dex-arch-slot,
        .dex-arch-slot:hover {
            filter: none !important;
        }

        /* 深藍分類膠囊按鈕：順順向上位移＋顏色變淡（無任何立體影子） */
        .dex-pill-btn {
            transform-box: fill-box;
            transform-origin: center;
            filter: none !important;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .dex-pill-btn:hover {
            transform: translateY(-4px);
            filter: none !important;
        }
        .dex-pill-btn:active {
            transform: translateY(-2px);
            filter: none !important;
        }
        .dex-pill-btn rect {
            transition: fill 0.2s ease, stroke 0.2s ease;
        }
        .dex-pill-btn:not(.is-active):hover rect {
            fill: #4552B8;
        }
        .dex-pill-btn text {
            transition: fill 0.2s ease;
        }
        .dex-pill-btn.is-active rect {
            fill: #F3EF84;
            stroke: #2A348C;
            stroke-width: 2.8;
        }
        .dex-pill-btn.is-active:hover rect {
            fill: #F8F5A6;
        }
        .dex-pill-btn.is-active text {
            fill: #2A348C;
        }

        /* 中央「小怪圖鑑」貼紙字 */
        #dexMainTitleGroup {
            transform-box: fill-box;
            transform-origin: center;
        }

        /* 手機版分類膠囊：順順向上位移＋顏色變淡（無立體影子） */
        .mobile-cat-pill {
            box-shadow: none !important;
            filter: none !important;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease;
        }
        .mobile-cat-pill:not(.is-active):hover {
            transform: translateY(-3px);
            background-color: #4552B8;
        }
        .mobile-cat-pill:active {
            transform: translateY(-1px);
        }
        .mobile-cat-pill.is-active {
            background-color: #F3EF84 !important;
            color: #2A348C !important;
            border: 2.5px solid #2A348C;
        }
        /* ========================================================= */
        /* 小怪分類內頁（小仙 & 小妖）純 2D 卡片互動樣式               */
        /* ========================================================= */
        .cat-header-back-btn {
            cursor: var(--cursor-hover) !important;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cat-header-back-btn:hover {
            transform: translateY(-3px);
        }
        .cat-header-back-btn rect.cat-pill-main {
            transition: fill 0.2s ease;
        }
        .cat-header-back-btn:hover rect.cat-pill-main {
            fill: #4552B8;
        }

        .cat-arch-card {
            cursor: var(--cursor-hover) !important;
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: archEntrancePop 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .cat-arch-card * {
            cursor: var(--cursor-hover) !important;
        }
        /* 分類內頁與開頭頁小怪：Hover 原地微微放大 + 點擊快速輕跳一下 */
        @keyframes monsterQuickHop {
            0%   { transform: translateY(0px) scale(1.06); }
            42%  { transform: translateY(-11px) scale(1.09); }
            76%  { transform: translateY(1.5px) scale(1.08, 1.04); }
            100% { transform: translateY(0px) scale(1.08); }
        }
        .cat-arch-card .cat-monster-img,
        .dex-arch-slot image,
        .mobile-arch-card image {
            transform-box: fill-box;
            transform-origin: 50% 60%;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cat-arch-card:hover .cat-monster-img,
        .dex-arch-slot image:hover,
        .mobile-arch-card image:hover {
            transform: scale(1.08);
        }
        .is-hopping {
            animation: monsterQuickHop 0.24s cubic-bezier(0.22, 1, 0.36, 1) !important;
        }
        /* 「小妖」萬聖節抖抖字微顫動畫 */
        @keyframes impSpookyShiver {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            25%      { transform: translate(-0.8px, 0.6px) rotate(-1.2deg); }
            50%      { transform: translate(0.9px, -0.7px) rotate(1deg); }
            75%      { transform: translate(-0.6px, -0.5px) rotate(1.4deg); }
        }
        .spooky-imp-filter {
            filter: url(#impHalloweenWiggle);
            -webkit-filter: url(#impHalloweenWiggle);
        }
        .spooky-imp-shiver {
            transform-box: fill-box;
            transform-origin: center;
            animation: impSpookyShiver 0.32s steps(2, end) infinite;
        }
        /* 「小仙」優雅輕盈飄浮動畫 */
        @keyframes fairyGracefulFloat {
            0%, 100% {
                transform: translateY(0px) rotate(-1.2deg);
            }
            50% {
                transform: translateY(-7px) rotate(1.2deg);
            }
        }
        .fairy-graceful-float {
            transform-box: fill-box;
            transform-origin: center;
            animation: fairyGracefulFloat 3.2s ease-in-out infinite;
            will-change: transform;
        }
    </style>
</head>

<body class="min-h-screen md:h-screen w-full overflow-x-hidden overflow-y-auto md:overflow-hidden select-none relative flex flex-col">
    <!-- 全域共用 SVG 濾鏡：Logo 貼紙框 & 中央「小怪圖鑑」雲朵白邊深藍細線貼紙濾鏡 -->
    <svg class="fixed top-0 left-0 w-0 h-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <defs>
            <!-- 「小妖」專屬：萬聖節波浪扭曲筆畫濾鏡 -->
            <filter id="impHalloweenWiggle" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.075 0.11" numOctaves="2" seed="8" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <!-- 左上角 Logo 貼紙濾鏡 (與 index.html 一致) -->
            <filter id="logoStickerOutline" x="-20%" y="-25%" width="140%" height="150%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="whiteBlur" />
                <feComponentTransfer in="whiteBlur" result="whiteMask">
                    <feFuncA type="linear" slope="20" intercept="-1" />
                </feComponentTransfer>
                <feFlood flood-color="#FFFFFF" flood-opacity="1" result="whiteColor" />
                <feComposite in="whiteColor" in2="whiteMask" operator="in" result="whiteOutline" />

                <feGaussianBlur in="whiteMask" stdDeviation="1.05" result="navyBlur" />
                <feComponentTransfer in="navyBlur" result="navyMask">
                    <feFuncA type="linear" slope="9" intercept="-0.35" />
                </feComponentTransfer>
                <feFlood flood-color="#2A348C" flood-opacity="1" result="navyColor" />
                <feComposite in="navyColor" in2="navyMask" operator="in" result="navyOutline" />

                <feMerge>
                    <feMergeNode in="navyOutline" />
                    <feMergeNode in="whiteOutline" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- 「小怪圖鑑」大標題專屬：圓潤厚白貼紙底 + 外圈 #2A348C 深藍描邊濾鏡 -->
            <!-- 「小怪圖鑑」大標題專屬：乾淨無雜點雲朵白貼紙底 + 平滑深藍細線濾鏡 -->
            <filter id="dexTitleCloudSticker" x="-35%" y="-55%" width="170%" height="210%" color-interpolation-filters="sRGB">
                <!-- 1. 先擴張融合字與字之間的縫隙，徹底消除白框內的深藍碎點 -->
                <feGaussianBlur in="SourceAlpha" stdDeviation="8.0 6.8" result="fusedBlur" />
                <feComponentTransfer in="fusedBlur" result="fusedCore">
                    <feFuncA type="linear" slope="24" intercept="-1.8" />
                </feComponentTransfer>

                <!-- 2. 微幅平滑收邊並做抗鋸齒，形成乾淨圓潤的純白貼紙底 -->
                <feGaussianBlur in="fusedCore" stdDeviation="3.2" result="smoothWhiteBlur" />
                <feComponentTransfer in="smoothWhiteBlur" result="stickerWhiteMask">
                    <feFuncA type="linear" slope="9" intercept="-6.2" />
                </feComponentTransfer>
                <feFlood flood-color="#FFFFFF" flood-opacity="1" result="pureWhite" />
                <feComposite in="pureWhite" in2="stickerWhiteMask" operator="in" result="whiteStickerBody" />

                <!-- 3. 沿著無雜點的白貼紙外緣，包覆一圈均勻平滑的 #2A348C 深藍框線 -->
                <feGaussianBlur in="stickerWhiteMask" stdDeviation="2.5" result="borderBlur" />
                <feComponentTransfer in="borderBlur" result="borderNavyMask">
                    <feFuncA type="linear" slope="8.5" intercept="-1.1" />
                </feComponentTransfer>
                <feFlood flood-color="#2A348C" flood-opacity="1" result="inkNavy" />
                <feComposite in="inkNavy" in2="borderNavyMask" operator="in" result="navyStickerBorder" />

                <!-- 4. 依序疊合：深藍外框 ➔ 純白貼紙底 ➔ 深藍文字 -->
                <feMerge>
                    <feMergeNode in="navyStickerBorder" />
                    <feMergeNode in="whiteStickerBody" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- 「有所味」1:1 向量備援 Logo 元件 -->
            <g id="youSuoWeiLogoVector">
                <g>
                    <path d="M 38,32 C 25,33 17,41 18,52 C 19,62 27,68 41,67 L 53,66 C 46,85 35,108 24,125 C 18,135 20,148 30,152 C 40,156 50,149 56,136 C 67,114 76,88 83,64 L 138,59 C 151,58 159,49 158,38 C 157,28 148,22 134,23 L 90,27 C 92,22 92,18 90,14 C 87,7 77,5 70,9 C 64,13 60,21 57,29 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <path d="M 65,58 L 137,51 C 149,50 156,57 157,69 L 164,142 C 165,155 155,164 142,165 C 131,166 123,159 120,149 C 113,152 103,149 97,140 C 92,132 94,122 100,117 L 89,118 L 93,153 C 94,165 85,174 73,175 C 61,176 52,167 51,155 L 44,81 C 43,68 52,59 65,58 Z"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <line x1="74" y1="79" x2="126" y2="101" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <line x1="125" y1="76" x2="75" y2="103" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <path d="M 122,148 C 110,148 94,138 96,125 C 97,120 101,117 105,119 C 102,114 106,109 111,112 C 109,107 115,103 120,107 C 119,102 127,100 131,106 C 136,113 139,124 147,132"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <g transform="translate(182, 0)">
                    <path d="M 73,6 C 83,3 93,10 94,20 C 95,29 88,37 76,41 L 44,50 L 38,125 C 37,139 27,148 15,147 C 4,146 -3,136 -1,122 L 9,38 C 11,26 19,19 32,16 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <rect x="29" y="40" width="46" height="71" rx="8"
                          fill="#F3EF84" stroke="#2A348C" stroke-width="3.2" />
                    <circle cx="40" cy="76" r="3.5" fill="#80E4FF" stroke="#2A348C" stroke-width="2.6" />
                    <path d="M 128,8 C 138,5 148,12 149,22 C 150,31 143,39 131,43 L 106,50 L 105,54 L 138,52 C 149,51 157,59 157,69 C 157,79 149,86 138,87 L 132,87 L 132,144 C 132,156 123,164 112,164 C 101,164 93,156 93,144 L 93,89 L 91,89 C 89,112 84,132 76,146 C 70,156 59,159 50,154 C 41,149 39,138 44,127 C 53,110 57,84 59,48 C 60,36 67,28 79,24 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                </g>
                <g transform="translate(345, 0)">
                    <path d="M 18,48 L 48,50 C 58,51 64,58 63,69 L 57,140 C 56,151 48,157 37,156 L 11,154 C 1,153 -5,145 -4,134 L 2,63 C 3,53 9,47 18,48 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />
                    <line x1="29" y1="74" x2="25" y2="128" stroke="#2A348C" stroke-width="3.2" stroke-linecap="round" />
                    <path d="M 80,115 L 55,152 C 49,161 52,172 61,177 C 70,182 81,179 87,169 L 104,142 L 104,162 C 104,173 112,181 122,181 C 132,181 140,173 140,162 L 140,142 L 155,169 C 161,179 172,182 181,177 C 190,172 193,161 187,152 L 164,115 Z"
                          fill="#80E4FF" stroke="#2A348C" stroke-width="3.2" stroke-linejoin="round" />

        // ===================================================================
        // 🖼️ 圖片預載解碼與候選路徑解析引擎 (優先抓取真實 img/.../*.png)
        // ===================================================================
        const preloadedMonsterCache = new Map();

        function createMonsterEntry(folder, fileName, indexSeed) {
            const baseName = fileName.replace(/\.(png|PNG|svg|SVG|webp|WEBP|jpg|JPG)$/i, '');
            const encodedFile = encodeURIComponent(fileName);
            const encodedBase = encodeURIComponent(baseName);
            const candidates = Array.from(new Set([
                `./img/${folder}/${encodedFile}`,
                `./img/${folder}/${fileName}`,
                `./img/${folder}/${encodedBase}.png`,
                `./img/${folder}/${encodedBase}.PNG`,
                `img/${folder}/${encodedFile}`,
                `img/${folder}/${encodedBase}.png`
            ]));
            return {
                id: `${folder}_${baseName}`,
                folder,
                fileName,
                baseName,
                indexSeed,
                candidates,
                resolvedUrl: null,
                isRealPng: false
            };
        }

        function resolveMonsterPngUrl(item) {
            if (item.resolvedUrl && preloadedMonsterCache.has(item.resolvedUrl)) {
                return Promise.resolve(item.resolvedUrl);
            }

            const isSandboxEnv = (
                window.location.protocol === 'about:' ||
                window.location.protocol === 'blob:' ||
                window.location.protocol === 'data:' ||
                (window.location.hostname || '').includes('usercontent.goog') ||
                (window.location.hostname || '').includes('googleusercontent.com')
            );

            if (isSandboxEnv) {
                const fallbackUri = buildSandboxFallbackMonsterSvg(item.folder, item.indexSeed);
                item.resolvedUrl = fallbackUri;
                item.isRealPng = false;
                preloadedMonsterCache.set(fallbackUri, true);
                return Promise.resolve(fallbackUri);
            }

            return new Promise((resolve) => {
                let idx = 0;
                let settled = false;
                const finish = (url, isReal, imgObj) => {
                    if (settled) return;
                    settled = true;
                    item.resolvedUrl = url;
                    item.isRealPng = isReal;
                    if (url) preloadedMonsterCache.set(url, imgObj || true);
                    resolve(url);
                };

                const tryNextCandidate = () => {
                    if (settled) return;
                    if (idx >= item.candidates.length) {
                        // 若本機所有候選路徑皆找不到該檔案，才使用備援圖示避免空白破圖
                        const fallbackUri = buildSandboxFallbackMonsterSvg(item.folder, item.indexSeed);
                        finish(fallbackUri, false, null);
                        return;
                    }
                    const testUrl = item.candidates[idx++];
                    const probe = new Image();
                    probe.decoding = 'async';
                    probe.onload = () => {
                        if (typeof probe.decode === 'function') {
                            probe.decode()
                                .catch(() => {})
                                .finally(() => finish(testUrl, true, probe));
                        } else {
                            finish(testUrl, true, probe);
                        }
                    };
                    probe.onerror = () => tryNextCandidate();
                    probe.src = testUrl;
                };
                tryNextCandidate();
            });
        }

        function setSvgImageHref(svgImgEl, url) {

        // ===================================================================
        // 🎲 四資料夾均衡隨機洗牌、篩選與自動輪播控制器
        // ===================================================================
        function shuffleList(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function buildBalancedPoolIndices(pool, filterCategory = null) {
            if (filterCategory) {
                const filtered = [];
                pool.forEach((m, idx) => {
                    if (m.folder === filterCategory) filtered.push(idx);
                });
                return shuffleList(filtered);
            }

            // 從 stall / urinal / consumable / hardware 四處均衡交錯隨機抽取
            const byFolder = { stall: [], urinal: [], consumable: [], hardware: [] };
            pool.forEach((m, idx) => {
                if (!byFolder[m.folder]) byFolder[m.folder] = [];
                byFolder[m.folder].push(idx);
            });
            const folderKeys = shuffleList(Object.keys(byFolder).filter(k => byFolder[k].length > 0));
            folderKeys.forEach(k => { byFolder[k] = shuffleList(byFolder[k]); });

            const interleaved = [];
            const maxLen = Math.max(0, ...folderKeys.map(k => byFolder[k].length));
            for (let r = 0; r < maxLen; r++) {
                folderKeys.forEach(k => {
                    if (r < byFolder[k].length) interleaved.push(byFolder[k][r]);
                });
            }
            return interleaved;
        }

        // ===================================================================

            const svgEl = document.getElementById('fullScreenHalftoneSvg');

            if (!svgEl || !group) return;

            const vw = Math.max(window.innerWidth || 1440, 320);
            const vh = Math.max(window.innerHeight || 780, 480);
            svgEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

            const isMobile = vw < 768;
            const rows = isMobile ? 21 : 22;
            const topY = isMobile ? Math.max(150, vh * 0.2) : Math.max(82, vh * 0.125);
            const bottomY = vh - 14;
            const dy = (bottomY - topY) / (rows - 1);

            const spacingX = isMobile ? Math.max(25, vw / 15.2) : Math.max(36, dy * 1.38);
            const cols = Math.ceil(vw / spacingX) + 2;
            const totalGridWidth = (cols - 1) * spacingX;
            const startX = (vw - totalGridWidth) / 2;

            const topR = isMobile ? 1.15 : 1.65;
            const bottomR = isMobile ? 4.4 : 6.75;

            const frag = document.createDocumentFragment();
            const nextStates = [];
            const svgNs = 'http://www.w3.org/2000/svg';

            for (let r = 0; r < rows; r++) {
                const t = r / (rows - 1);
                const baseY = topY + r * dy;
                const baseR = topR + t * (bottomR - topR);
                for (let c = 0; c < cols; c++) {
                    const baseX = startX + c * spacingX;
                    const circleEl = document.createElementNS(svgNs, 'circle');
                    circleEl.setAttribute('cx', baseX.toFixed(2));
                    circleEl.setAttribute('cy', baseY.toFixed(2));
                    circleEl.setAttribute('r', baseR.toFixed(2));
                    frag.appendChild(circleEl);

                    nextStates.push({
                        el: circleEl,
                        baseX,
                        baseY,
                        baseR,
                        curX: baseX,
                        curY: baseY,
                        curR: baseR,
                        isDirty: false
                    });
                }
            }

            group.innerHTML = '';
            group.appendChild(frag);
            halftoneDotStates = nextStates;

            if (!halftoneLoopStarted) {
                halftoneLoopStarted = true;
                let lastTouchTime = 0;
                const clearCursor = () => { halftoneCursorX = null; halftoneCursorY = null; };

                window.addEventListener('mousemove', (e) => {
                    if (Date.now() - lastTouchTime < 800) return;
                    halftoneCursorX = e.clientX;
                    halftoneCursorY = e.clientY;
                }, { passive: true });
                window.addEventListener('mouseleave', clearCursor);
                window.addEventListener('blur', clearCursor);
                window.addEventListener('touchstart', (e) => {
                    lastTouchTime = Date.now();
                    if (e.touches && e.touches[0]) {
                        halftoneCursorX = e.touches[0].clientX;
                        halftoneCursorY = e.touches[0].clientY;
                    }
                }, { passive: true });
                window.addEventListener('touchend', clearCursor, { passive: true });

                requestAnimationFrame(animateHalftoneHoverEffect);
            }
        }

        function animateHalftoneHoverEffect() {
            const influenceRadius = 185;
            const maxOutwardShift = 9.5;
            const lerpSpeed = 0.2;
            const hasCursor = (halftoneCursorX !== null && halftoneCursorY !== null);

            for (let i = 0; i < halftoneDotStates.length; i++) {
                const d = halftoneDotStates[i];
                let targetX = d.baseX;
                let targetY = d.baseY;
                let targetR = d.baseR;

                if (hasCursor) {
                    const dx = d.baseX - halftoneCursorX;
                    const dy = d.baseY - halftoneCursorY;
                    if (Math.abs(dx) < influenceRadius && Math.abs(dy) < influenceRadius) {
                        const dist = Math.hypot(dx, dy);
                        if (dist < influenceRadius) {
                            const proximity = 1 - (dist / influenceRadius);
                            const ease = Math.pow(proximity, 1.45);
                            targetR = d.baseR * (1 + ease * 1.45) + (ease * 2.8);
                            if (dist > 0.1) {
                                const push = Math.sin(proximity * Math.PI) * maxOutwardShift;
                                targetX = d.baseX + (dx / dist) * push;
                                targetY = d.baseY + (dy / dist) * push;
                            }
                            d.isDirty = true;
                        }
                    }
                }

                if (d.isDirty) {
                    d.curX += (targetX - d.curX) * lerpSpeed;
                    d.curY += (targetY - d.curY) * lerpSpeed;
                    d.curR += (targetR - d.curR) * lerpSpeed;

                    const settled =
                        Math.abs(d.curR - d.baseR) < 0.03 &&
                        Math.abs(d.curX - d.baseX) < 0.05 &&
                        Math.abs(d.curY - d.baseY) < 0.05 &&
                        targetR === d.baseR;

                    if (settled) {
                        d.curX = d.baseX;
                        d.curY = d.baseY;
                        d.curR = d.baseR;
                        d.isDirty = false;
                    }
                    d.el.setAttribute('cx', d.curX.toFixed(2));
                    d.el.setAttribute('cy', d.curY.toFixed(2));
                    d.el.setAttribute('r', d.curR.toFixed(2));
                }
            }
            requestAnimationFrame(animateHalftoneHoverEffect);
        }

        // Logo 載入與向量備援

        // ===================================================================
        // 🚀 主程式初始化
        // ===================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            renderIllustratorHalftoneGrid();
            initLogoImagesWithFallback();
            buildArchStageDOM();

            // ===================================================================
            // ⚡ 零延遲 Web Audio 音效預解碼引擎（預載進記憶體 + 自動跳過開頭空白靜音）
            // ===================================================================
            const poogleAudioEngine = (() => {
                // 💡 若有特殊自訂檔名也可填在這裡（留空即可自動偵測 GitHub Pages 與 Live Server）
                const CUSTOM_BOOM_FILES = [];
                const CUSTOM_SQUEAK_FILES = [];

                let sharedCtx = null;
                let hwUnlocked = false;
                const boomPool = [];
                const squeakPool = [];
                const seenUrls = new Set();
                let lastSqueakUrl = '';
                let squeakStreakCount = 0;

                const isSandboxEnv = (
                    window.location.protocol === 'about:' ||
                    window.location.protocol === 'blob:' ||
                    window.location.protocol === 'data:' ||
                    (window.location.hostname || '').includes('usercontent.goog') ||
                    (window.location.hostname || '').includes('googleusercontent.com')
                );

                function getCtx() {
                    if (!sharedCtx) {
                        const Ctx = window.AudioContext || window.webkitAudioContext;
                        if (Ctx) sharedCtx = new Ctx();
                    }
                    return sharedCtx;
                }

                // 偵測音檔開頭是否有空白靜音，若有超過 0.035 秒無聲區段則自動跳過
                function computeTrimOffset(audioBuffer) {
                    if (!audioBuffer || !audioBuffer.length || !audioBuffer.sampleRate) return 0;
                    const sr = audioBuffer.sampleRate;
                    const chCount = audioBuffer.numberOfChannels;
                    const len = audioBuffer.length;
                    const threshold = 0.012;
                    const win = 64;

                    for (let w = 0; w < len; w += win) {
                        const end = Math.min(len, w + win);
                        for (let ch = 0; ch < chCount; ch++) {
                            const data = audioBuffer.getChannelData(ch);
                            let hits = 0;
                            for (let i = w; i < end; i++) {
                                if (Math.abs(data[i]) >= threshold && ++hits >= 6) {
                                    const firstSec = w / sr;
                                    if (firstSec <= 0.035) return 0;
                                    const offset = Math.max(0, firstSec - 0.008);
                                    return offset < (audioBuffer.duration - 0.04) ? offset : 0;
                                }
                            }
                        }
                    }
                    return 0;
                }

                async function decodeEntryBuffer(entry) {
                    if (entry.buffer || !entry.rawBuf) return;
                    const ctx = getCtx();
                    if (!ctx) return;
                    try {
                        const decoded = await ctx.decodeAudioData(entry.rawBuf.slice(0));
                        entry.buffer = decoded;
                        entry.trimOffset = computeTrimOffset(decoded);
                        entry.rawBuf = null;
                    } catch (e) {}
                }

                // 手指／滑鼠按下的瞬間提前喚醒音訊硬體，不等 click 放開才啟動
                function unlockHardware() {
                    const ctx = getCtx();
                    if (!ctx) return;
                    if (ctx.state === 'suspended') {
                        ctx.resume().catch(() => {});
                    }
                    if (!hwUnlocked) {
                        hwUnlocked = true;
                        try {
                            const silent = ctx.createBuffer(1, 1, 22050);
                            const src = ctx.createBufferSource();
                            src.buffer = silent;
                            src.connect(ctx.destination);
                            src.start(0);
                        } catch (e) {}
                        [...boomPool, ...squeakPool].forEach((entry) => {
                            if (!entry.buffer && entry.rawBuf) decodeEntryBuffer(entry);
                        });
                    }
                }
                window.addEventListener('pointerdown', unlockHardware, { capture: true, passive: true });
                window.addEventListener('touchstart', unlockHardware, { capture: true, passive: true });
                window.addEventListener('keydown', unlockHardware, { capture: true, passive: true });

                async function fetchAndDecodeIntoPool(url, pool) {
                    if (!url || seenUrls.has(url)) return false;
                    seenUrls.add(url);
                    try {
                        const res = await fetch(url);
                        if (!res.ok) return false;
                        const cType = (res.headers.get('content-type') || '').toLowerCase();
                        if (cType.includes('text/html')) return false;
                        const rawBuf = await res.arrayBuffer();
                        if (!rawBuf || rawBuf.byteLength < 128) return false;

                        const entry = { url, rawBuf, buffer: null, trimOffset: 0 };
                        pool.push(entry);
                        await decodeEntryBuffer(entry);
                        return true;
                    } catch (e) {
                        return false;
                    }
                }

                function fireBufferSource(ctx, buffer, offset, volume) {
                    const src = ctx.createBufferSource();
                    src.buffer = buffer;
                    const gain = ctx.createGain();
                    gain.gain.value = volume;
                    src.connect(gain);
                    gain.connect(ctx.destination);
                    src.start(0, offset || 0);
                }

                function playEntryNow(entry, volume = 0.85) {
                    if (!entry) return false;
                    const ctx = getCtx();
                    if (!ctx) return false;

                    if (entry.buffer) {
                        if (ctx.state === 'running') {
                            fireBufferSource(ctx, entry.buffer, entry.trimOffset, volume);
                        } else {
                            ctx.resume().then(() => {
                                fireBufferSource(ctx, entry.buffer, entry.trimOffset, volume);
                            }).catch(() => {});
                        }
                        return true;
                    }
                    if (entry.rawBuf) {
                        ctx.resume().catch(() => {});
                        decodeEntryBuffer(entry).then(() => {
                            if (entry.buffer) fireBufferSource(ctx, entry.buffer, entry.trimOffset, volume);
                        });
                        return true;
                    }
                    return false;
                }

                function playPop() {
                    try {
                        const ctx = getCtx();
                        if (!ctx) return;
                        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                        const now = ctx.currentTime;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(380, now);
                        osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
                        gain.gain.setValueAtTime(0.14, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.095);
                    } catch (e) {}
                }

                function playFallbackRetroBoom() {
                    try {
                        const ctx = getCtx();
                        if (!ctx) return;
                        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                        const now = ctx.currentTime;
                        const dur = 0.55;
                        const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
                        const ch = buf.getChannelData(0);
                        let hold = 0;
                        for (let i = 0; i < ch.length; i++) {
                            if (i % 4 === 0) hold = Math.random() * 2 - 1;
                            ch[i] = hold * Math.pow(1 - i / ch.length, 1.5);
                        }
                        const noise = ctx.createBufferSource();
                        noise.buffer = buf;
                        const filter = ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(920, now);
                        filter.frequency.exponentialRampToValueAtTime(95, now + dur);
                        const gain = ctx.createGain();
                        gain.gain.setValueAtTime(0.45, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(ctx.destination);
                        noise.start(now);
                    } catch (e) {}
                }

                async function scanLiveServerDir(dirPath) {
                    try {
                        const res = await fetch(dirPath);
                        if (!res.ok) return [];
                        const cType = (res.headers.get('content-type') || '').toLowerCase();
                        if (!cType.includes('text/html')) return [];
                        const html = await res.text();
                        const dirBase = new URL(dirPath, window.location.href).href;
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const urls = [];
                        doc.querySelectorAll('a[href]').forEach((a) => {
                            const rawHref = a.getAttribute('href') || '';
                            const clean = rawHref.split('?')[0].split('#')[0];
                            if (!/\.(mp3|wav|ogg|m4a)$/i.test(clean)) return;
                            const cleanDir = dirPath.replace(/^\.\//, '');
                            const fullUrl = (!rawHref.startsWith('/') && !rawHref.startsWith('http') && rawHref.includes(cleanDir))
                                ? new URL(rawHref, window.location.href).href
                                : new URL(rawHref, dirBase).href;
                            urls.push(fullUrl);
                        });
                        return urls;
                    } catch (e) {
                        return [];
                    }
                }

                async function preloadAllAudio() {
                    if (isSandboxEnv || !window.location.protocol.startsWith('http')) return;

                    // 1. 手動指定清單（若有填寫）
                    CUSTOM_BOOM_FILES.forEach((n) => fetchAndDecodeIntoPool('./sfx/' + n.replace(/^\.?\/?(sfx\/)?/i, ''), boomPool));
                    CUSTOM_SQUEAK_FILES.forEach((n) => fetchAndDecodeIntoPool('./sfx/squeak/' + n.replace(/^\.?\/?(sfx\/squeak\/)?/i, ''), squeakPool));

                    // 2. GitHub Pages 環境：透過 GitHub API 一次取得真實音檔清單（零 404 盲測）
                    const host = window.location.hostname || '';
                    if (host.endsWith('.github.io')) {
                        const owner = host.replace(/\.github\.io$/i, '');
                        const parts = window.location.pathname.split('/').filter(Boolean);
                        if (owner && parts.length >= 1) {
                            const repo = parts[0];
                            const subDir = parts.slice(1, -1).join('/');
                            const sfxApiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${subDir ? subDir + '/' : ''}sfx`;
                            try {
                                const res = await fetch(sfxApiBase);
                                if (res.ok) {
                                    const items = await res.json();
                                    if (Array.isArray(items)) {
                                        const subTasks = [];
                                        items.forEach((it) => {
                                            if (!it || !it.name) return;
                                            if (it.type === 'file' && /\.(mp3|wav|ogg|m4a)$/i.test(it.name)) {
                                                if (/^boom/i.test(it.name)) {
                                                    subTasks.push(fetchAndDecodeIntoPool(`./sfx/${encodeURIComponent(it.name)}`, boomPool));
                                                } else if (/^squeak/i.test(it.name)) {
                                                    subTasks.push(fetchAndDecodeIntoPool(`./sfx/${encodeURIComponent(it.name)}`, squeakPool));
                                                }
                                            } else if (it.type === 'dir' && (it.name === 'boom' || it.name === 'squeak')) {
                                                const targetPool = it.name === 'boom' ? boomPool : squeakPool;
                                                const folderName = it.name;
                                                subTasks.push(
                                                    fetch(`${sfxApiBase}/${encodeURIComponent(folderName)}`)
                                                        .then(r => r.ok ? r.json() : [])
                                                        .then(subItems => {
                                                            if (!Array.isArray(subItems)) return;
                                                            return Promise.all(subItems.map((sub) => {
                                                                if (sub && sub.type === 'file' && /\.(mp3|wav|ogg|m4a)$/i.test(sub.name)) {
                                                                    return fetchAndDecodeIntoPool(`./sfx/${folderName}/${encodeURIComponent(sub.name)}`, targetPool);
                                                                }
                                                            }));
                                                        }).catch(() => {})
                                                );
                                            }
                                        });
                                        await Promise.all(subTasks);
                                        if (boomPool.length > 0 && squeakPool.length > 0) return;
                                    }
                                }
                            } catch (e) {}
                        }
                    } else {
                        // 3. 本機 VS Code Live Server 環境：直接掃描資料夾目錄
                        const [, boomDirUrls, squeakDirUrls] = await Promise.all([
                            fetchAndDecodeIntoPool('./sfx/boom.mp3', boomPool),
                            scanLiveServerDir('./sfx/boom/'),
                            scanLiveServerDir('./sfx/squeak/')
                        ]);
                        await Promise.all([
                            ...boomDirUrls.map(u => fetchAndDecodeIntoPool(u, boomPool)),
                            ...squeakDirUrls.map(u => fetchAndDecodeIntoPool(u, squeakPool))
                        ]);
                        if (boomPool.length > 0 && squeakPool.length > 0) return;
                    }

                    // 4. 輕量備援探測（僅在上述方法皆未找到時執行，不建立 Audio 物件）
                    if (boomPool.length === 0) {
                        const boomGuesses = ['./sfx/boom.mp3', './sfx/boom/boom.mp3', './sfx/boom/1.mp3', './sfx/boom/boom1.mp3'];
                        for (const u of boomGuesses) {
                            if (await fetchAndDecodeIntoPool(u, boomPool)) break;
                        }
                    }
                    if (squeakPool.length === 0) {
                        const squeakGuesses = ['./sfx/squeak.mp3', './sfx/squeak/squeak.mp3'];
                        for (let i = 1; i <= 10; i++) {
                            const pad = String(i).padStart(2, '0');
                            squeakGuesses.push(
                                `./sfx/squeak/${i}.mp3`,
                                `./sfx/squeak/${pad}.mp3`,
                                `./sfx/squeak/squeak${i}.mp3`,
                                `./sfx/squeak/squeak_${i}.mp3`
                            );
                        }
                        const BATCH = 6;
                        for (let i = 0; i < squeakGuesses.length; i += BATCH) {
                            await Promise.all(squeakGuesses.slice(i, i + BATCH).map(u => fetchAndDecodeIntoPool(u, squeakPool)));
                        }
                    }
                }

                // 一進頁面立即在背景預載並解碼所有音效
                preloadAllAudio();

                return {
                    playPop,
                    playBoom() {
                        const ready = boomPool.filter(e => e.buffer || e.rawBuf);
                        if (ready.length > 0) {
                            const chosen = ready[Math.floor(Math.random() * ready.length)];
                            if (playEntryNow(chosen, 0.4)) return;
                        }
                        playFallbackRetroBoom();
                    },
                    playRandomSqueak() {
                        const ready = squeakPool.filter(e => e.buffer || e.rawBuf);
                        if (ready.length === 0) {
                            playPop();
                            return;
                        }
                        let chosen = ready[0];
                        if (ready.length > 1) {
                            const candidates = squeakStreakCount >= 2
                                ? ready.filter(e => e.url !== lastSqueakUrl)
                                : ready;
                            const list = candidates.length > 0 ? candidates : ready;
                            chosen = list[Math.floor(Math.random() * list.length)];
                        }
                        if (chosen.url === lastSqueakUrl) {
                            squeakStreakCount++;
                        } else {
                            lastSqueakUrl = chosen.url;
                            squeakStreakCount = 1;
                        }
                        if (!playEntryNow(chosen, 0.85)) {
                            playPop();
                        }
                    }
                };
            })();
            // ===================================================================
            // 🚽 上排正中央窗戶：Windows XP 3D 旋轉馬桶 + 點擊同風格 3D 爆炸與 sfx/boom 音效
            // ===================================================================
            (function initRetro3dSpinningToilet() {

                    .map(id => document.getElementById(id))
                    .filter(Boolean);

                const EXPLODE_FRAMES = 16;   // 3D 爆炸動畫總格數
                const SPIN_FPS = 14;         // 馬桶旋轉每秒格數
                const EXPLODE_FPS = 18;      // 爆炸播放每秒格數
                const BOOM_MP3_FILES = [];

                    stageEl.innerHTML = '';

                    const shakeWrap = document.createElementNS(svgNs, 'g');

                    spriteImg.setAttribute('x', String(-TOILET_SIZE / 2));
                    spriteImg.setAttribute('y', String(TOILET_Y));
                    spriteImg.setAttribute('width', String(TOILET_SIZE));
                    spriteImg.setAttribute('height', String(TOILET_SIZE));
                    spriteImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    spriteImg.style.imageRendering = 'pixelated';
                    spriteImg.style.pointerEvents = 'none';

                    hitboxEl.setAttribute('cx', '0');

                    hitboxEl.setAttribute('rx', '50');

                    hitboxEl.setAttribute('aria-label', '點擊引爆馬桶');
                    stageEl.appendChild(hitboxEl);

                    return { stageEl, shakeWrap, spriteImg, hitboxEl };
                });

                const setAllToiletHref = (url) => toiletInstances.forEach(inst => setSvgImageHref(inst.spriteImg, url));

                        const RES = ${SPRITE_RES};

                        const UP = 2;

                        const CAM_DIST = 3.8, FOV = 1.06, R_BOUND2 = 1.12 * 1.12;
                        const BAYER4 = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

                        function smin(a, b, k) {
                            const h = Math.max(k - Math.abs(a - b), 0) / k;
                            return Math.min(a, b) - h * h * k * 0.25;
                        }
                        function smax(a, b, k) { return -smin(-a, -b, k); }

                        function sdEllipsoid(x, y, z, rx, ry, rz) {
                            const x0 = x / rx, y0 = y / ry, z0 = z / rz;
                            const k0 = Math.sqrt(x0 * x0 + y0 * y0 + z0 * z0);

                            return k0 * (k0 - 1.0) / Math.sqrt(x1 * x1 + y1 * y1 + z1 * z1);
                        }
                        function sdRoundBox(x, y, z, bx, by, bz, r) {
                            const qx = Math.abs(x) - bx, qy = Math.abs(y) - by, qz = Math.abs(z) - bz;
                            const mx = qx > 0 ? qx : 0, my = qy > 0 ? qy : 0, mz = qz > 0 ? qz : 0;
                            return Math.sqrt(mx * mx + my * my + mz * mz) + Math.min(Math.max(qx, qy, qz), 0) - r;
                        }
                        function sdOval2D(x, z, rx, rz) {
                            const x0 = x / rx, z0 = z / rz;
                            const k0 = Math.sqrt(x0 * x0 + z0 * z0);
                            if (k0 < 1e-6) return -Math.min(rx, rz);
                            const x1 = x / (rx * rx), z1 = z / (rz * rz);
                            return k0 * (k0 - 1.0) / Math.sqrt(x1 * x1 + z1 * z1);
                        }
                        function sdVertOvalCyl(x, y, z, rx, rz, h, r) {
                            const dXZ = sdOval2D(x, z, rx, rz), dY = Math.abs(y) - h;
                            const m1 = dXZ > 0 ? dXZ : 0, m2 = dY > 0 ? dY : 0;

                            const dBridge = sdRoundBox(x, y + 0.09, z + 0.22, 0.33, 0.06, 0.16, 0.045);

                            let dBody = smin(smin(smin(dFoot, dNeck, 0.11), dBowl, 0.11), dBridge, 0.08);
                            const dCavity = sdEllipsoid(x, y - 0.02, z - 0.20, 0.29, 0.34, 0.33);
                            dBody = smax(dBody, -dCavity, 0.032);

                            const taper = 1.0 + (y - 0.34) * 0.06;

                            dBody = Math.min(smin(dBody, dTank, 0.04), dTankLid);

                            const dRing2D = Math.abs(sdOval2D(x, z - 0.20, 0.345, 0.375)) - 0.054;

                            const mr1 = dRing2D > 0 ? dRing2D : 0, mr2 = dRingY > 0 ? dRingY : 0;
                            const dSeat = Math.sqrt(mr1 * mr1 + mr2 * mr2) + Math.min(Math.max(dRing2D, dRingY), 0) - 0.032;
                            if (dSeat < bestD) { bestD = dSeat; bestMat = 2; }

                            const dWater = Math.max(sdEllipsoid(x, y + 0.02, z - 0.20, 0.28, 0.30, 0.32), y + 0.13);

                                    const rdy = rdyP;

                                    if (disc >= 0) {

                                            t += d;
                                            if (t > tMax) break;
                                        }
                                    }

                                    if (hit) {
                                        const hx = roX + rdx * t, hy = roY + rdy * t, hz = roZ + rdz * t;
                                        const e = 0.0035;
                                        const d0 = sdToilet(hx + e, hy - e, hz - e);
                                        const d1 = sdToilet(hx - e, hy - e, hz + e);
                                        const d2 = sdToilet(hx - e, hy + e, hz - e);
                                        const d3 = sdToilet(hx + e, hy + e, hz + e);
                                        let nx = d0 - d1 - d2 + d3;
                                        let ny = -d0 - d1 + d2 + d3;
                                        let nz = -d0 + d1 - d2 + d3;
                                        const nInv = 1.0 / (Math.sqrt(nx * nx + ny * ny + nz * nz) || 1);

                                        const aoD = sdToilet(hx + nx * 0.09, hy + ny * 0.09, hz + nz * 0.09);

                                        const ndotv = Math.max(0, -(nx * rdx + ny * rdy + nz * rdz));
                                        const shade = Math.min(1, (0.16 + ndotl * 0.86) * ao * (0.58 + 0.42 * Math.sqrt(ndotv)));

                                        const ndoth = Math.max(0, (nx * hvx + ny * hvy + nz * hvz) * hvInv);

                                g  = shade < 0.5 ? 92 + 106 * k : 198 + 46 * k;

                                const sp = Math.min(1, spec * 0.92);
                                r += (255 - r) * sp; g += (255 - g) * sp; bl += (255 - bl) * sp;
                            } else if (mat === 4) {
                                const k = shade < 0.5 ? shade * 2 : (shade - 0.5) * 2;
                                r  = shade < 0.5 ? 118 + 120 * k : 238 + 17 * k;
                                g  = shade < 0.5 ? 68 + 108 * k : 176 + 60 * k;
                                bl = shade < 0.5 ? 12 + 16 * k : 28 + 100 * k;
                                const sp = Math.min(1, spec * 0.88);
                                r += (255 - r) * sp; g += (255 - g) * sp; bl += (255 - bl) * sp;
                            } else {
                                if (shade < 0.42) {
                                    const k = shade / 0.42;
                                    r = 52 + 96 * k; g = 64 + 102 * k; bl = 134 + 86 * k;
                                } else {
                                    const k = (shade - 0.42) / 0.58;
                                    const tr = mat === 2 ? 255 : 250, tg = mat === 2 ? 255 : 246, tb = mat === 2 ? 252 : 238;
                                    r = 148 + (tr - 148) * k; g = 166 + (tg - 166) * k; bl = 220 + (tb - 220) * k;
                                }
                                const sp = Math.min(1, spec * 0.78);
                                r += (255 - r) * sp; g += (255 - g) * sp; bl += (255 - bl) * sp;
                            }
                            return [r, g, bl];
                        }

                        function renderBoomPixels(fIdx) {
                            src32.fill(0);
                            zBuf.fill(1e9);

                            const p = fIdx / (BOOM_TOTAL - 1);
                            const burstMove = 1.0 - Math.pow(1.0 - p, 2.35);
                            const lxC = -0.52, lyC = 0.66, lzC = 0.54;

                            // 1. 繪製翻騰的 3D 火球與濃煙團（含 Bayer 點陣消散）
                            for (let i = 0; i < PUFFS.length; i++) {
                                const pf = PUFFS[i];
                                let alpha = 1.0;
                                if (p > pf.f0) {
                                    alpha = 1.0 - (p - pf.f0) / Math.max(0.01, pf.f1 - pf.f0);
                                }
                                if (alpha <= 0.02) continue;

                                const wx = pf.x0 + pf.vx * burstMove;
                                const wy = pf.y0 + pf.vy * burstMove + 0.34 * p * p;
                                const wz = pf.z0 + pf.vz * burstMove;
                                const rad = pf.r0 + (pf.r1 - pf.r0) * Math.pow(p, 0.62);

                                const proj = projectPoint(wx, wy, wz, rad * 1.18);
                                if (!proj) continue;
                                const baseR = proj.rPx / 1.18;
                                const x0 = Math.max(0, Math.floor(proj.sx - proj.rPx));
                                const x1 = Math.min(RES - 1, Math.ceil(proj.sx + proj.rPx));
                                const y0 = Math.max(0, Math.floor(proj.sy - proj.rPx));
                                const y1 = Math.min(RES - 1, Math.ceil(proj.sy + proj.rPx));
                                const distCenter = Math.sqrt(wx * wx + wy * wy + wz * wz);

                                for (let py = y0; py <= y1; py++) {
                                    const dy = (proj.sy - (py + 0.5)) / baseR;
                                    for (let px = x0; px <= x1; px++) {
                                        const bayerVal = (BAYER4[(py & 3) * 4 + (px & 3)] + 0.5) / 16;
                                        if (alpha < bayerVal) continue;

                                        const dx = (px + 0.5 - proj.sx) / baseR;
                                        const ang = Math.atan2(dy, dx);
                                        const wobble = 1.0 + 0.11 * Math.sin(ang * 3 + pf.ph + p * 3.2) + 0.06 * Math.cos(ang * 5 - pf.ph);
                                        const r2 = (dx * dx + dy * dy) / (wobble * wobble);
                                        if (r2 > 1.0) continue;

                                        const nz = Math.sqrt(1.0 - r2);
                                        const zVal = proj.depth - nz * rad;
                                        const zIdx = py * RES + px;
                                        if (zVal >= zBuf[zIdx]) continue;
                                        zBuf[zIdx] = zVal;

                                        // 微凹凸法向量 + 光照與溫度計算
                                        let nx = dx / wobble + 0.14 * Math.sin(dx * 4.2 + pf.ph);
                                        let ny = dy / wobble + 0.14 * Math.cos(dy * 4.2 - pf.ph);
                                        const nInv = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
                                        nx *= nInv; ny *= nInv; const nzz = nz * nInv;

                                        if (smokeShade < 0.48) {

                                        if (temp > 0.06) {
                                            const fireMix = Math.min(1, (temp - 0.06) / 0.26);
                                            let fr, fg, fb;
                                            if (temp > 0.78) {
                                                const k = Math.min(1, (temp - 0.78) / 0.30);
                                                fr = 255; fg = 224 + 31 * k; fb = 92 + 150 * k;
                                            } else if (temp > 0.44) {
                                                const k = (temp - 0.44) / 0.34;
                                                fr = 244 + 11 * k; fg = 104 + 120 * k; fb = 68 + 24 * k;
                                            } else {
                                                const k = Math.max(0, (temp - 0.06) / 0.38);

                                            }

                                            sg = sg + (fg - sg) * fireMix;

                                    }
                                }
                            }

                            // 2. 繪製飛散旋轉的 3D 陶瓷馬桶碎片與金色把手
                            if (p < 0.88) {
                                const shardAlpha = p < 0.66 ? 1.0 : (0.88 - p) / 0.22;
                                for (let i = 0; i < SHARDS.length; i++) {
                                    const sh = SHARDS[i];
                                    const tFly = p * 1.08;
                                    const wx = sh.x0 + sh.vx * tFly;
                                    const wy = sh.y0 + sh.vy * tFly - 1.85 * tFly * tFly;
                                    const wz = sh.z0 + sh.vz * tFly;
                                    const proj = projectPoint(wx, wy, wz, sh.r * 1.35);
                                    if (!proj) continue;

                                    const baseR = proj.rPx / 1.35;
                                    const rot = sh.rot0 + sh.rv * p;
                                    const cR = Math.cos(rot), sR = Math.sin(rot);
                                    const tiltX = Math.sin(rot * 1.3) * 0.45;
                                    const tiltY = Math.cos(rot * 1.1) * 0.45;

                                    const x0 = Math.max(0, Math.floor(proj.sx - proj.rPx));
                                    const x1 = Math.min(RES - 1, Math.ceil(proj.sx + proj.rPx));
                                    const y0 = Math.max(0, Math.floor(proj.sy - proj.rPx));
                                    const y1 = Math.min(RES - 1, Math.ceil(proj.sy + proj.rPx));

                                    for (let py = y0; py <= y1; py++) {
                                        const dy = (proj.sy - (py + 0.5)) / baseR;
                                        for (let px = x0; px <= x1; px++) {
                                            if (shardAlpha < (BAYER4[(py & 3) * 4 + (px & 3)] + 0.5) / 16) continue;
                                            const dx = (px + 0.5 - proj.sx) / baseR;
                                            const rx = (dx * cR - dy * sR) * sh.ax;
                                            const ry = (dx * sR + dy * cR) * sh.ay;
                                            const boxMetric = Math.max(Math.abs(rx), Math.abs(ry)) * 0.58 + Math.sqrt(rx * rx + ry * ry) * 0.42;
                                            if (boxMetric > 1.0) continue;

                                            const nz = Math.sqrt(Math.max(0.05, 1.0 - boxMetric * boxMetric));
                                            const zVal = proj.depth - nz * sh.r;
                                            const zIdx = py * RES + px;
                                            if (zVal >= zBuf[zIdx]) continue;
                                            zBuf[zIdx] = zVal;

                                            const nInv = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);

                                }
                            }

                            // 3. 繪製噴濺的 3D 馬桶水珠
                            if (p < 0.80) {
                                const dropAlpha = p < 0.56 ? 1.0 : (0.80 - p) / 0.24;
                                for (let i = 0; i < DROPS.length; i++) {
                                    const dr = DROPS[i];
                                    const tFly = p * 1.12;
                                    const wx = dr.vx * tFly;
                                    const wy = 0.04 + dr.vy * tFly - 2.35 * tFly * tFly;
                                    const wz = 0.18 + dr.vz * tFly;
                                    const proj = projectPoint(wx, wy, wz, dr.r);
                                    if (!proj || proj.rPx < 0.8) continue;

                                    const x0 = Math.max(0, Math.floor(proj.sx - proj.rPx));
                                    const x1 = Math.min(RES - 1, Math.ceil(proj.sx + proj.rPx));
                                    const y0 = Math.max(0, Math.floor(proj.sy - proj.rPx));
                                    const y1 = Math.min(RES - 1, Math.ceil(proj.sy + proj.rPx));

                                    for (let py = y0; py <= y1; py++) {
                                        const dy = (proj.sy - (py + 0.5)) / proj.rPx;
                                        for (let px = x0; px <= x1; px++) {
                                            if (dropAlpha < (BAYER4[(py & 3) * 4 + (px & 3)] + 0.5) / 16) continue;
                                            const dx = (px + 0.5 - proj.sx) / proj.rPx;
                                            const r2 = dx * dx + dy * dy;
                                            if (r2 > 1.0) continue;
                                            const nz = Math.sqrt(1.0 - r2);
                                            const zVal = proj.depth - nz * dr.r;
                                            const zIdx = py * RES + px;
                                            if (zVal >= zBuf[zIdx]) continue;
                                            zBuf[zIdx] = zVal;

                                            const rgb = shadeSolidMat(dx, dy, nz, 3);
                                            quantizeWritePixel(px, py, rgb[0], rgb[1], rgb[2]);
                                        }
                                    }
                                }
                            }

                            // 4. 繪製 3D 透視震波環 (前後真實深度遮擋) 與地面漸散暗影
                            const roY = CAM_DIST * sinP, roZ = CAM_DIST * cosP;
                            const showWave = p < 0.38;
                            const waveR = 0.24 + (p / 0.38) * 0.92;
                            const waveThick = 0.11 * (1.0 - p / 0.42);
                            const waveAlpha = showWave ? (1.0 - p / 0.38) : 0;
                            const shadowScale = 1.0 + Math.sin(Math.min(1, p * 1.4) * Math.PI) * 0.45;
                            const shadowFade = Math.max(0, 1.0 - p * 1.18);

                            for (let py = 0; py < RES; py++) {
                                const v = 1.0 - ((py + 0.5) / RES) * 2.0;
                                for (let px = 0; px < RES; px++) {
                                    const u = ((px + 0.5) / RES) * 2.0 - 1.0;
                                    let rdxC = u * FOV, rdyC = v * FOV, rdzC = -CAM_DIST;
                                    const invL = 1.0 / Math.sqrt(rdxC * rdxC + rdyC * rdyC + rdzC * rdzC);
                                    rdxC *= invL; rdyC *= invL; rdzC *= invL;

                                    const rdx = rdxC;
                                    const rdy = rdyC * cosP + rdzC * sinP;
                                    const rdz = -rdyC * sinP + rdzC * cosP;
                                    if (rdy >= -0.03) continue;

                                    const zIdx = py * RES + px;
                                    const bayerT = (BAYER4[(py & 3) * 4 + (px & 3)] + 0.5) / 16;

                                    // 3D 水平震波環 (y = -0.04)
                                    if (showWave) {
                                        const tWave = (-0.04 - roY) / rdy;
                                        if (tWave > 0 && tWave < zBuf[zIdx]) {
                                            const wx = rdx * tWave;
                                            const wz = roZ + rdz * tWave - 0.06;
                                            const dist = Math.sqrt(wx * wx + wz * wz);
                                            const diff = Math.abs(dist - waveR);
                                            if (diff < waveThick) {
                                                const ringStr = (1.0 - diff / waveThick) * waveAlpha;
                                                if (ringStr > bayerT * 0.85) {
                                                    zBuf[zIdx] = tWave;
                                                    quantizeWritePixel(px, py, 255, 245, 158);
                                                    continue;
                                                }
                                            }
                                        }
                                    }

                                    // 地面點陣陰影 (當該像素尚未被火球或碎片遮擋時繪製)
                                    if (shadowFade > 0.05 && zBuf[zIdx] > 1e8) {
                                        const tFloor = (-0.86 - roY) / rdy;
                                        if (tFloor > 0) {
                                            const fx = (rdx * tFloor) / (0.48 * shadowScale);
                                            const fz = (roZ + rdz * tFloor - 0.04) / (0.60 * shadowScale);
                                            const ellip = Math.sqrt(fx * fx + fz * fz);
                                            if (ellip < 1.0 && (1.0 - ellip) * 0.72 * shadowFade > bayerT) {
                                                const idx = zIdx * 4;
                                                srcBuf[idx] = 176; srcBuf[idx + 1] = 180; srcBuf[idx + 2] = 214; srcBuf[idx + 3] = 255;
                                            }
                                        }
                                    }
                                }
                            }
                            upscale2xToDst();
                        }

                        async function emitFrame(kind, idx, offCanvas, offCtx, reader) {
                            if (offCtx && reader) {
                                offCtx.putImageData(new ImageData(new Uint8ClampedArray(dst32.buffer.slice(0)), OUT_RES, OUT_RES), 0, 0);
                                const blob = await offCanvas.convertToBlob({ type: 'image/png' });
                                self.postMessage({ kind, idx, dataUrl: reader.readAsDataURL(blob) });
                            } else {
                                const copy = new Uint8ClampedArray(dst32.buffer.slice(0));
                                self.postMessage({ kind, idx, rawBuffer: copy.buffer, size: OUT_RES }, [copy.buffer]);
                            }
                        }

                        async function runAll() {
                            const hasOff = typeof OffscreenCanvas !== 'undefined' && typeof FileReaderSync !== 'undefined';
                            const offCanvas = hasOff ? new OffscreenCanvas(OUT_RES, OUT_RES) : null;
                            const offCtx = offCanvas ? offCanvas.getContext('2d') : null;

                            renderRawPixels(0);

                            for (let b = 0; b < BOOM_TOTAL; b++) {
                                renderBoomPixels(b);
                                await emitFrame('boom', b, offCanvas, offCtx, reader);
                            }

                            // 3. 完成剩餘旋轉馬桶格數
                            for (let i = 1; i < TOTAL; i++) {
                                renderRawPixels((i / TOTAL) * Math.PI * 2);
                                await emitFrame('spin', i, offCanvas, offCtx, reader);
                            }
                            self.postMessage({ done: true });
                        }
                        runAll();
                    `;

                    try {
                        const blobUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
                        const worker = new Worker(blobUrl);
                        let fallbackCanvas = null, fallbackCtx = null;

                        worker.onmessage = (e) => {
                            const msg = e.data;
                            if (msg.done) {
                                URL.revokeObjectURL(blobUrl);
                                worker.terminate();
                                try {
                                    if (spinFrames.every(Boolean) && boomFrames.every(Boolean)) {
                                        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ spin: spinFrames, boom: boomFrames }));
                                    }
                                } catch (err) {}
                                return;
                            }

                            let url = msg.dataUrl;
                            if (!url && msg.rawBuffer) {
                                if (!fallbackCanvas) {
                                    fallbackCanvas = document.createElement('canvas');
                                    fallbackCanvas.width = msg.size;
                                    fallbackCanvas.height = msg.size;
                                    fallbackCtx = fallbackCanvas.getContext('2d');
                                }
                                fallbackCtx.putImageData(new ImageData(new Uint8ClampedArray(msg.rawBuffer), msg.size, msg.size), 0, 0);
                                url = fallbackCanvas.toDataURL('image/png');
